# 说明：这是模板，请放到仓库根目录 .github/workflows/android-release.yml
# 作用：打 v* 标签时自动构建 release APK，并创建 GitHub Release 附加 APK。
#
# 需要配置的 Secrets（Settings → Secrets and variables → Actions）：
#   KEYSTORE_BASE64       : keytool 生成的 .jks 的 base64（base64 -w0 文件）
#   KEYSTORE_PASSWORD     : keystore 密码
#   KEY_ALIAS             : 别名
#   KEY_PASSWORD          : 别名密码
# 注意：构建目录是「移动端/前端」，脚本会自动 cd 过去。

name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/dayleaf-release.jks"
          echo "DAYLEAF_KEYSTORE=$GITHUB_WORKSPACE/dayleaf-release.jks" >> "$GITHUB_ENV"
          echo "DAYLEAF_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "DAYLEAF_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "DAYLEAF_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: 移动端/前端
        run: |
          if [ -n "$DAYLEAF_KEYSTORE" ]; then
            ./gradlew assembleRelease \
              -PDAYLEAF_KEYSTORE="$DAYLEAF_KEYSTORE" \
              -PDAYLEAF_STORE_PASSWORD="$DAYLEAF_STORE_PASSWORD" \
              -PDAYLEAF_KEY_ALIAS="$DAYLEAF_KEY_ALIAS" \
              -PDAYLEAF_KEY_PASSWORD="$DAYLEAF_KEY_PASSWORD"
          else
            ./gradlew assembleRelease
          fi

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: 移动端/前端/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
