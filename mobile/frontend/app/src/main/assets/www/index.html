          '<div class="rep-box">' +
            '<p class="rep-why">' +
              (groupMeta
                ? '这里是整组的重复规则。改规则会按新规则重建整组；只改标题、时间等字段则保留原日期。'
                : (ev
                  ? '把这条日程改成重复：保存后会按规则生成一整组。保持「不重复」就只改这一条。'
                  : '选了「每周」这类规则，保存时会一次铺出一串日程：' +
                    '比如「每周一」+ 铺到期末，就自动生成这一学期的每一次。' +
                    '它们属于同一个项目组，之后可以「删除整组」一次清掉。' +
                    '只用一次的事，保持「不重复」就行。')) +
            '</p>' +
            '<div class="rep-seg" id="repSeg">' + repSegHtml + '</div>' +
            '<div class="wd-pick" id="repWd" style="display:' +
              ((repRule === 'weekly' || repRule === 'biweekly') ? 'flex' : 'none') + '">' + wdHtml + '</div>' +
            '<div class="rep-row" id="repUntilRow" style="display:' +
              (repRule === 'none' ? 'none' : 'flex') + '">' +
              '<span>铺到哪天为止</span>' +
              '<button type="button" class="dt-until" id="fUntilLbl"></button>' +
              '<button type="button" class="dt-cal sm" id="fUntilCal" aria-label="展开日历选结束日">' +
                '<svg viewBox="0 0 24 24"><rect x="3.2" y="5" width="17.6" height="15.6" rx="3"/>' +
                  '<path d="M3.2 9.6h17.6M8 3.2v3.4M16 3.2v3.4"/></svg>' +
              '</button>' +
              '<input type="date" id="fUntil" class="dt-native" value="' + esc(repUntil) + '">' +
            '</div>' +
            '<div class="rep-preview hide" id="repPreview"></div>' +
          '</div></div>' +

        '<div class="field"><label>状态标记</label><div class="seg" id="fSeg">' + segHtml + '</div></div>' +

        '<div class="field"><div class="row-sw">' +
          '<span>重要项目</span>' +
          '<button class="sw' + (base.imp ? ' on' : '') + '" id="fImp" aria-label="标为重要项目"></button>' +
        '</div></div>' +
        '<p class="hint">开启后卡片上带 ★，且不会被「自动清理」删掉。</p>' +

        '<div class="field"><label>背景图片</label>' +
          '<div class="img-pick">' +
            '<span class="img-thumb" id="fImgThumb"></span>' +
            '<span class="img-acts">' +
              '<label class="mini-btn" style="position:relative;overflow:hidden;display:inline-grid;place-items:center">选择图片' +
                '<input type="file" id="fImgFile" accept="image/*" style="position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;cursor:pointer">' +
              '</label>' +
              '<button class="mini-btn" id="fImgClear">清除</button>' +
            '</span>' +
          '</div></div>' +

        '<div class="field"><label>附件（图片，可多张）</label>' +
          '<div class="att-row" id="fAttRow"></div>' +
          '<p class="hint">附件只存本机（IndexedDB），点缩略图可放大查看。</p></div>' +

        '<div class="field"><label>备注</label>' +
          '<textarea class="inp" id="fNote" rows="3" placeholder="补充说明…">' + esc(base.n) + '</textarea></div>' +

        '<p class="hint">提醒 = 提前弹系统通知' +
          (isMobileView() ? '；闹钟 = 到点响铃并震动（手机端）' : '（电脑端只发通知，不响铃）') +
          '。要让手机真正响铃，去设置里导出 .ics 到系统日历。</p>' +
          '</div>' +
        '</details>' +

        '<div class="mb-foot">' +
          (ev ? '<button class="btn danger" id="fDel">删除</button>' : '') +
          '<button class="btn primary" id="fSave">保存</button>' +
        '</div>' +
      '</div>';

    openLayer(root);
    pushModal(closeModal);

    /* ---- 重复规则状态与联动 ---- */
    let wdTouched = !!groupMeta;

    function syncWd() {
      $$('#repWd button').forEach(function (b) {
        b.classList.toggle('on', repWds.indexOf(Number(b.dataset.w)) > -1);
      });
    }

    /** 实时预览：这次会生成多少项、前几个日期是什么 */
    function updatePreview() {
      const box = $('#repPreview');
      if (!box) return;
      if (repRule === 'none') { box.classList.add('hide'); box.textContent = ''; return; }

      const startVal = $('#fDate').value || base.d;
      const untilVal = $('#fUntil').value || startVal;
      const dates = expandRepeat(startVal, untilVal, repRule, repWds);

      box.classList.remove('hide');
      if (dates.length <= 1) {
        box.textContent = '这段时间里只排得出 1 次，把「铺到哪天为止」往后延会更多';
        return;
      }
      const head = dates.slice(0, 3).map(function (x) {
        const dd = fromYMD(x);
        return (dd.getMonth() + 1) + '/' + dd.getDate();
      }).join('、');
      box.textContent = '会一次生成 ' + dates.length + ' 项：' + head +
        (dates.length > 3 ? ' …' : '') +
        (dates.length >= REPEAT_LIMIT ? '（已达上限）' : '') + '，之后可整组删除';
    }

    $$('#repSeg button').forEach(function (b) {
      b.addEventListener('click', function () {
        repRule = b.dataset.rule;
        repTouched = true;
        $$('#repSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
        const needWd = repRule === 'weekly' || repRule === 'biweekly';
        $('#repWd').style.display = needWd ? 'flex' : 'none';
        $('#repUntilRow').style.display = repRule === 'none' ? 'none' : 'flex';
        updatePreview();
      });
    });

    $$('#repWd button').forEach(function (b) {
      b.addEventListener('click', function () {
        const w = Number(b.dataset.w);
        const i = repWds.indexOf(w);
        if (i > -1) { if (repWds.length > 1) repWds.splice(i, 1); }
        else repWds.push(w);
        wdTouched = true;
        repTouched = true;
        syncWd();
        updatePreview();
      });
    });

    $('#fUntil').addEventListener('change', function () {
      repTouched = true;
      updatePreview();
    });

    $('#fDate').addEventListener('change', function () {
      if (!wdTouched) {
        repWds = [fromYMD(this.value || base.d).getDay()];
        syncWd();
      }
      updatePreview();
    });

    /* 编辑整组时，日期默认锁在整组起始日；想只改一条就打开「仅改此条」 */
    const setFormDate = function (ymd) {
      const input = $('#fDate');
      if (input) { input.value = ymd; input.dispatchEvent(new Event('change')); }
      if (typeof dtSync === 'function') dtSync();
    };
    const onlyOneBtn = $('#fOnlyOne');
    const setOnlyOne = function (on) {
      onlyOne = !!on;
      if (onlyOneBtn) {
        onlyOneBtn.classList.toggle('on', onlyOne);
        onlyOneBtn.setAttribute('aria-pressed', onlyOne ? 'true' : 'false');
        onlyOneBtn.textContent = onlyOne ? '只改这一条' : '仅改此条';
      }
      const dateBtn = $('#fDateLbl');
      const dateCal = $('#fDateCal');
      const dateInput = $('#fDate');
      [dateBtn, dateCal, dateInput].forEach(function (el) {
        if (el) el.disabled = !!groupMeta && !onlyOne;
      });
      const repField = $('#repField');
      if (repField) repField.style.display = onlyOne ? 'none' : '';
      if (groupMeta) setFormDate(onlyOne ? base.d : groupMeta.anchor);
      const hint = $('#dtHint');
      if (hint && groupMeta) {
        hint.textContent = onlyOne
          ? '只修改当前这一条；不会影响同组其他日程。'
          : '这是整组修改：日期锁定在 ' + groupMeta.anchor + '，改重复规则会重建整组。';
      }
    };
    if (onlyOneBtn) {
      onlyOneBtn.addEventListener('click', function () { setOnlyOne(!onlyOne); });
    }

    syncWd();
    updatePreview();

    /* ---- 日期 / 时间快选：手机上原生 date/time 是转轮，换成更好点的 ---- */
    const WD_CN = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const p2 = function (n) { return (n < 10 ? '0' : '') + n; };
    const dtMin = function (s) {
      const p = String(s || '00:00').split(':');
      return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0);
    };
    const dtHHMM = function (m) {
      m = ((m % 1440) + 1440) % 1440;
      return p2(Math.floor(m / 60)) + ':' + p2(m % 60);
    };
    /** 日期的人话：几月几日 + 周几 + 今天/明天/后天 */
    const dtDateLabel = function (ymd) {
      const d = fromYMD(ymd);
      const diff = Math.round((d - fromYMD(toYMD(new Date()))) / 86400000);
      const tag = diff === 0 ? '今天' : diff === 1 ? '明天' : diff === 2 ? '后天' : diff === -1 ? '昨天' : '';
      return { main: (d.getMonth() + 1) + '月' + d.getDate() + '日', wd: WD_CN[d.getDay()], tag: tag };
    };
    /** 当前时长（分钟），跨夜按 (e-s+1440)%1440 算；00:00–23:59 视作一整天 */
    const dtDur = function () {
      const s = dtMin($('#fStart').value), e = dtMin($('#fEnd').value);
      if (s === 0 && e === 1439) return 1440;
      const d = ((e - s) + 1440) % 1440;
      return d === 0 ? 1440 : d;
    };

    /** 把三个原生 input 的值翻成界面上的样子 */
    function dtSync() {
      const dEl = $('#fDate'), sEl = $('#fStart'), eEl = $('#fEnd');
      if (!dEl || !sEl || !eEl) return;
      const s = dtMin(sEl.value), e = dtMin(eEl.value), dur = dtDur();
      const overnight = dur < 1440 && e <= s;

      const dl = dtDateLabel(dEl.value || base.d);
      const lbl = $('#fDateLbl');
      if (lbl) {
        lbl.innerHTML = '<span>' + dl.main + '</span><em>' + dl.wd + '</em>' +
          (dl.tag ? '<i>' + dl.tag + '</i>' : '');
      }
      const sl = $('#fStartLbl'), elb = $('#fEndLbl');
      if (sl) sl.textContent = dtHHMM(s);
      if (elb) elb.innerHTML = dtHHMM(e) + (overnight ? '<small>次日</small>' : '');

      const ul = $('#fUntilLbl'), uEl = $('#fUntil');
      if (ul && uEl && uEl.value) {
        const u = dtDateLabel(uEl.value);
        ul.textContent = u.main + ' ' + u.wd;
      }

      const hint = $('#dtHint');
      if (hint) {
        const h = dur >= 1440 ? '一整天'
          : (dur >= 60 ? Math.floor(dur / 60) + ' 小时' + (dur % 60 ? ' ' + (dur % 60) + ' 分' : '')
            : dur + ' 分钟');
        hint.textContent = overnight
          ? '结束早于开始，算到次日 ' + dtHHMM(e) + '，共 ' + h
          : '共 ' + h;
        hint.classList.toggle('overnight', overnight);
      }
      const adBtn = $('#fAllDay');
      if (adBtn) {
        const allDay = sEl.value === '00:00' && eEl.value === '23:59';
        adBtn.classList.toggle('on', allDay);
        $$('.dt-time').forEach(function (x) { x.classList.toggle('is-off', allDay); });
      }
    }

    /**
     * 改日期/时间。o: { d?, dur?, at?, start?, end? }，时间都是分钟数。
     * 开始与结束互相独立：动一头绝不牵动另一头（除非显式选了「时长」）。
     */
    function dtSet(o) {
      const dEl = $('#fDate'), sEl = $('#fStart'), eEl = $('#fEnd');
      if (!sEl || !eEl) return;
      if (o.d && dEl) { dEl.value = o.d; dEl.dispatchEvent(new Event('change')); }

      let s = dtMin(sEl.value), e = dtMin(eEl.value);

      if (o.dur != null) {
        /* 只有「选时长」才会同时动两头，这是用户明确点了时长 */
        const v = Number(o.dur);
        if (v === 0) { s = 0; e = 1439; }          /* 全天 */
        else e = (s + v) % 1440;
      } else if (o.at != null || o.start != null) {
        s = ((Number(o.at != null ? o.at : o.start) % 1440) + 1440) % 1440;
      } else if (o.end != null) {
        e = ((Number(o.end) % 1440) + 1440) % 1440;
      }
      sEl.value = dtHHMM(s);
      eEl.value = dtHHMM(e);
      sEl.dispatchEvent(new Event('change'));
      eEl.dispatchEvent(new Event('change'));
      dtSync();
    }

    /* 全天：收在「更多选项」里，开就铺满 00:00–23:59，关就回到 09:00–10:00 */
    const alldayBtn = $('#fAllDay');
    const syncAllDay = function () {
      if (!alldayBtn) return;
      const on = $('#fStart').value === '00:00' && $('#fEnd').value === '23:59';
      alldayBtn.classList.toggle('on', on);
      $$('.dt-time').forEach(function (el) { el.classList.toggle('is-off', on); });
    };
    if (alldayBtn) {
      alldayBtn.addEventListener('click', function () {
        const on = alldayBtn.classList.contains('on');
        if (on) {
          const sEl = $('#fStart'), eEl = $('#fEnd');
          sEl.value = '09:00'; eEl.value = '10:00';
          sEl.dispatchEvent(new Event('change'));
          eEl.dispatchEvent(new Event('change'));
          dtSync();
        } else dtSet({ dur: 0 });
      });
    }

    $$('.dt-time .dt-step').forEach(function (b) {
      b.addEventListener('click', function () {
        const delta = Number(b.dataset.dir) * dtStep();
        if (b.dataset.t === 's') dtSet({ start: dtMin($('#fStart').value) + delta });
        else dtSet({ end: dtMin($('#fEnd').value) + delta });
      });
    });
    /* 手机上点时间数字直接滚轮选，比 ± 快 */
    $$('.dt-tval').forEach(function (el) {
      el.addEventListener('click', function () {
        const which = el.dataset.t;
        openTimeWheel(dtMin($('#' + (which === 's' ? 'fStart' : 'fEnd')).value), function (m) {
          dtSet(which === 's' ? { start: m } : { end: m });
        });
      });
    });
    /* 标签本身也点得开日历 —— 手指最容易戳到的就是那一大片 */
    const dLbl = $('#fDateLbl'), dCal = $('#fDateCal');
    [dLbl, dCal].forEach(function (el) {
      if (!el) return;
      el.addEventListener('click', function () {
        if (isMobileView()) {
          openDateWheel($('#fDate').value, function (ymd) { dtSet({ d: ymd }); });
        } else {
          openMiniCal(el, $('#fDate').value, function (ymd) { dtSet({ d: ymd }); });
        }
      });
    });
    const uLbl = $('#fUntilLbl'), uCal = $('#fUntilCal');
    [uLbl, uCal].forEach(function (el) {
      if (!el) return;
      el.addEventListener('click', function () {
        openMiniCal(el, $('#fUntil').value, function (ymd) {
          const u = $('#fUntil');
          u.value = ymd;
          u.dispatchEvent(new Event('change'));
          dtSync();
        });
      });
    });
    /* 原生 input 被藏起来了，但键盘用户仍可能改到它 —— 跟着刷一遍界面 */
    [['#fStart', 'change'], ['#fEnd', 'change'], ['#fDate', 'change']].forEach(function (p) {
      const el = $(p[0]);
      if (el) el.addEventListener(p[1], dtSync);
    });
    dtSync();
    if (onlyOneBtn) setOnlyOne(false);

    /* ---- 草稿：恢复上次没写完的内容 ---- */
    if (!ev && opts && opts.draft) {
      const d = opts.draft;
      if (d.repRule) {
        repRule = d.repRule;
        $$('#repSeg button').forEach(function (x) { x.classList.toggle('on', x.dataset.rule === repRule); });
        $('#repWd').style.display = (repRule === 'weekly' || repRule === 'biweekly') ? 'flex' : 'none';
        $('#repUntilRow').style.display = repRule === 'none' ? 'none' : 'flex';
      }
      if (d.repWds && d.repWds.length) {
        repWds = d.repWds.slice();
        wdTouched = true;
      }
      if (d.repUntil) $('#fUntil').value = d.repUntil;
      if (d.imp && impBtn) { impOn = true; impBtn.classList.add('on'); }
      if (d.rmOn === true || Number(d.rm) > 0) {
        rmOn = true;
        rmMin = Number(d.rm) || 0;
        alarmOn = !!d.al;
        if (rmBtn) rmBtn.classList.add('on');
        syncRemind();
      }
      syncWd();
      updatePreview();
    }

    /* 状态切换 */
    let st = curSt;
    $$('#fSeg button').forEach(function (b) {
      b.addEventListener('click', function () {
        st = b.dataset.st;
        $$('#fSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
      });
    });

    /* 重要项目开关（自动清理豁免） */
    let impOn = !!base.imp;
    const impBtn = $('#fImp');
    if (impBtn) {
      impBtn.addEventListener('click', function () {
        impOn = !impOn;
        impBtn.classList.toggle('on', impOn);
      });
    }

    /**
     * 提醒三态：关 / 到点（提前 0 分钟）/ 提前 N 分钟。
     * 所以「开没开」和「提前多久」必须分开记：rmOn 是开关，rm 是分钟数。
     */
    let rmOn = remindOn(base);
    let rmMin = Number(base.rm) || 0;
    let alarmOn = !!base.al;

    const syncRemind = function () {
      const row = $('#rmMinRow');
      if (row) row.style.display = rmOn ? 'flex' : 'none';
      const alRow = $('#rmAlarmRow');
      if (alRow) alRow.style.display = rmOn ? 'flex' : 'none';
      $$('#rmSeg button').forEach(function (b) {
        b.classList.toggle('on', rmOn && Number(b.dataset.min) === rmMin);
      });
      const alBtn = $('#rmAlarm');
      if (alBtn) alBtn.classList.toggle('on', alarmOn);
      const sysRow = $('#sysAlarmRow');
      const nat = nativeBridge();
      const sysOk = !!(nat && nat.setSystemAlarm);
      if (sysRow) sysRow.style.display = (rmOn && alarmOn && sysOk) ? 'flex' : 'none';
    };

    const rmBtn = $('#rmOn');
    if (rmBtn) {
      rmBtn.addEventListener('click', function () {
        if (rmOn) { rmOn = false; alarmOn = false; }
        else {
          rmOn = true;
          rmMin = (Number(state.notify && state.notify.defMin) || 10);
          if (!canNotify() && !notifiedPermWarn) {
            notifiedPermWarn = true;
            toast('还没开启系统通知权限，去「个性化 → 通知与闹钟」里点一下授权');
          }
        }
        rmBtn.classList.toggle('on', rmOn);
        syncRemind();
      });
    }

    $$('#rmSeg button').forEach(function (b) {
      b.addEventListener('click', function () {
        rmMin = Number(b.dataset.min) || 0;   // 0 = 到点提醒
        rmOn = true;
        if (rmBtn) rmBtn.classList.add('on');
        syncRemind();
      });
    });

    const rmAlarmBtn = $('#rmAlarm');
    if (rmAlarmBtn) {
      rmAlarmBtn.addEventListener('click', function () {
        alarmOn = !alarmOn;
        rmAlarmBtn.classList.toggle('on', alarmOn);
        syncRemind();
      });
    }
    const sysAlarmBtn = $('#fSysAlarm');
    if (sysAlarmBtn) {
      sysAlarmBtn.addEventListener('click', function () {
        const title = ($('#fTitle') || {}).value || '日程';
        const start = ($('#fStart') || {}).value || '09:00';
        const date = ($('#fDate') || {}).value || toYMD(new Date());
        const wds = (repRule === 'weekly' || repRule === 'biweekly') ? repWds.slice() : [];
        writeSystemAlarmData(title, start, wds, date);
      });
    }
    syncRemind();

    /* 背景图：选中后压到 480px，只影响这一条日程 */
    function paintImgThumb() {
      const el = $('#fImgThumb');
      if (!el) return;
      if (imgData) {
        el.classList.remove('empty');
        el.style.backgroundImage = 'url(\'' + imgData + '\')';
        el.textContent = '';
      } else {
        el.classList.add('empty');
        el.style.backgroundImage = '';
        el.textContent = '无';
      }
    }
    paintImgThumb();

    /* 附件：编辑时挂在原日程上；新建时先挂在临时对象，保存时一起写入 */
    const attOwner = ev || { id: uid('ev'), att: [] };
    if (!attOwner.att) attOwner.att = [];
    bindAttachmentRow(attOwner, $('#fAttRow'), function () { /* 缩略图即时更新 */ });

    $('#fImgFile').addEventListener('change', function () {
      const file = this.files && this.files[0];
      if (!file) return;
      readImageAsData(file, 480, 0.72, function (data) {
        imgData = data;
        paintImgThumb();
      });
    });

    $('#fImgClear').addEventListener('click', function () {
      imgData = '';
      paintImgThumb();
    });

    /* ---- 通知识别：粘贴/OCR 共用同一套填表逻辑 ---- */
    const applyNotice = function (r, raw) {
      $('#fTitle').value = r.t || '';
      if (r.d) $('#fDate').value = r.d;
      if (r.s) {
        $('#fStart').value = r.s;
        $('#fEnd').value = r.e;
      }
      $('#fPlace').value = r.p || '';
      if (r.n) $('#fNote').value = r.n;

      /* 什么都没认出来：把原文放进备注，至少不丢内容 */
      const hits = r.hits || [];
      if (!hits.length && raw) {
        if (!$('#fTitle').value.trim()) $('#fTitle').value = 'OCR 识别结果';
        $('#fNote').value = raw;
        const mb = $('#moreBox');
        if (mb) mb.open = true;
      }

      if (r.d && $('#fUntil')) {
        $('#fUntil').value = toYMD(addDays(fromYMD(r.d), 60));
      }
      updatePreview();
      dtSync();
      scheduleDraftSave();
      return hits;
    };

    /* ---- 通知识别：粘贴后自动填，也可以点按钮重试 ---- */
    const pasteRun = $('#fPasteRun');
    if (pasteRun) {
      const runParse = function () {
        const raw = ($('#fPaste').value || '').trim();
        if (!raw) { toast('先把通知粘进来'); return; }

        const r = parseNotice(raw);
        /* 识别是「整段重填」：标题、日期、地点直接覆盖，
           没认出地点就清空，免得留下上一段的旧值；
           时间没认出来则保留默认的 09:00，只提示用户补 */
        applyNotice(r, raw);

        const bits = [];
        if (r.d) {
          const dt = fromYMD(r.d);
          bits.push((dt.getMonth() + 1) + '月' + dt.getDate() + '日 ' + WEEKDAY[dt.getDay()]);
        }
        if (r.s) bits.push(r.s + '–' + r.e);
        if (r.p) bits.push(r.p);
        toast(bits.length ? '已识别：' + bits.join(' · ') : '只认出文字，时间请手动补');
      };

      pasteRun.addEventListener('click', runParse);

      /* 直接粘贴就自动识别，不用再点一次 */
      $('#fPaste').addEventListener('paste', function () {
        setTimeout(runParse, 60);
      });
    }

    /* ---- 课表图片识别（OCR）：读图 → 识别 → 预览逐项确认 ---- */
    const ocrFile = $('#fOcrFile');
    if (ocrFile) {
      ocrFile.addEventListener('change', function () {
        const files = Array.prototype.slice.call(this.files || []);
        this.value = '';
        if (!files.length) return;
        const prog = $('#ocrProg');
        const showProg = function (txt) {
          if (!prog) return;
          prog.classList.remove('hide');
          prog.textContent = txt;
        };
        let oi = 0;
        const acc = [];
        const step = function () {
          if (oi >= files.length) { handleText(acc.join('\n').trim()); return; }
          const file = files[oi++];
          showProg('正在优化图片 ' + oi + '/' + files.length + '…');
          readImageForOcr(file, function (data) {
            if (oi === 1) showProg('正在加载识别引擎…首次约 10–15MB，请稍等');
            ocrImage(data, function (p) {
              showProg('正在识别 ' + oi + '/' + files.length + '… ' + Math.round(p * 100) + '%');
            }).then(function (text) {
              acc.push(String(text || '').trim());
              step();
            }).catch(function (err) {
              console.warn('[DayLeaf] OCR 失败', err);
              step();
            });
          });
        };
        const handleText = function (text) {
            if (prog) prog.classList.add('hide');
            const clean = String(text || '').trim();
            if (!clean) {
              showProg('没有识别到文字。换一张更清晰、正着的截图，或把文字复制到上面用「识别并填入」。');
              return;
            }

            const schedRows = parseScheduleText(clean);
            const scheduleHits = schedRows.filter(function (r) {
              return r.wd != null && (r.s || r.t);
            }).length;
            const looksSchedule = scheduleHits >= 2 ||
              (/(课程表|课表|节次|作息表)/.test(clean) && scheduleHits >= 1);

            if (looksSchedule) {
              openOcrPreview(schedRows, clean, function (n) {
                /* 课表已经批量录入，关闭新建表单；单条通知不要走这里 */
                draftCtx = null;
                clearDraft();
                if ($('#modalRoot').classList.contains('open')) {
          if (typeof window.__dlBeforeModalClose === 'function' && window.__dlBeforeModalClose()) return;
          closeModal();
        }
                renderAll();
                toast('已添加 ' + n + ' 项课程日程');
              });
              return;
            }

            /* 普通通知：直接填当前表单，用户核对后自己保存，不再强制添加 */
            const r = parseNotice(clean);
            const hits = applyNotice(r, clean);
            const panel = $('.mb-panel', $('#modalRoot'));
            if (panel) panel.scrollTop = 0;
            toast(hits.length
              ? '已按通知填入，请核对后保存'
              : '没认出明确字段，原文已放进备注，可手动整理');
        };
        step();
      });
    }

    /* ---- 草稿：注册读取器 + 输入时自动保存（仅新建） ---- */
    if (!ev) {
      draftCtx = {
        read: function () {
          const tEl = $('#fTitle');
          if (!tEl) return {};
          return {
            t: tEl.value.trim(),
            d: ($('#fDate') || {}).value || '',
            s: ($('#fStart') || {}).value || '',
            e: ($('#fEnd') || {}).value || '',
            p: ($('#fPlace') || {}).value ? $('#fPlace').value.trim() : '',
            n: ($('#fNote') || {}).value ? $('#fNote').value.trim() : '',
            st: st,
            img: imgData || '',
            imp: !!impOn,
            rm: rmOn ? rmMin : 0,
            rmOn: !!rmOn,
            al: !!(rmOn && alarmOn),
            repRule: repRule,
            repWds: repWds.slice(),
            repUntil: $('#fUntil') ? $('#fUntil').value : ''
          };
        }
      };

      const panel = $('.mb-panel', root);
      if (panel) {
        panel.addEventListener('input', scheduleDraftSave);
        panel.addEventListener('change', scheduleDraftSave);
        /* 状态切换、重复规则、拆分按钮这些不是 input 事件，补一个 click */
        panel.addEventListener('click', function (e) {
          if (e.target.closest('[data-close]')) return;
          scheduleDraftSave();
        });
      }
    }

    /* 关闭 */
    $$('[data-close]', root).forEach(function (el) {
      el.addEventListener('click', closeModal);
    });

    /* 保存 */
    $('#fSave').addEventListener('click', function () {
      const title = $('#fTitle').value.trim() || '未命名日程';
      const date = $('#fDate').value || toYMD(new Date());
      const start = $('#fStart').value || '09:00';
      let end = $('#fEnd').value;

      /* 结束时间缺失或早于开始 → 默认 +1 小时（上限 23:59） */
      if (!end || toMin(end) <= toMin(start)) {
        end = toHM(Math.min(23 * 60 + 59, toMin(start) + 60));
      }

      const payload = {
        d: date,
        s: start,
        e: end,
        t: title,
        p: $('#fPlace').value.trim(),
        n: $('#fNote').value.trim(),
        st: st,
        img: imgData || '',
        imp: !!impOn,
        /* 提醒提前分钟（0=关）/ 闹钟（到点响铃） */
        rm: rmOn ? rmMin : 0,
        rmOn: !!rmOn,
        al: !!(rmOn && alarmOn),
        att: (attOwner.att || []).slice()
      };

      /* 时间冲突：先提示，确认后再保存 */
      const conflictEx = editingId ? [editingId].concat((groupMeta ? groupMembers.map(function (m) { return m.id; }) : [])) : [];
      const conflictsNow = findConflicts(date, start, end, conflictEx);
      if (conflictsNow.length && !window.__dlConflictOk) {
        const info = conflictsNow.slice(0, 3).map(function (x) { return x.s + ' – ' + x.e + '  ' + x.t; }).join('\n');
        const slot = suggestFreeSlot(date, start, Math.max(10, toMin(end) - toMin(start)), conflictEx);
        dlAsk('时间有冲突',
          '和下面这些日程重叠：\n' + info + (conflictsNow.length > 3 ? '\n…等 ' + conflictsNow.length + ' 条' : '') +
          (slot ? '\n\n最近的空档：' + slot.s + ' – ' + slot.e : ''),
          '仍然保存',
          function () { window.__dlConflictOk = true; $('#fSave').click(); window.__dlConflictOk = false; },
          '取消',
          slot ? { label: '改到 ' + slot.s, fn: function () { $('#fStart').value = slot.s; $('#fEnd').value = slot.e; dtSync(); toast('已改到 ' + slot.s + ' – ' + slot.e + '，再点一次保存'); } } : null);
        return;
      }

      /* 可选：闹钟同时写入手机系统时钟（重复日程按星期几设每周） */
      if (payload.al && state.notify.sysAlarm && isMobileView()) {
        const wds = (repRule === 'weekly' || repRule === 'biweekly') ? repWds.slice() : [];
        writeSystemAlarmData(title, start, wds, date);
      }

      /* --- 编辑既有 --- */
      if (editingId) {
        const cur = state.events.filter(function (x) { return x.id === editingId; })[0];

        /* 1) 整组修改（默认）：修改标题/时间等字段同步整组；
              改重复规则则按整组起始日重建日期。 */
        if (cur && cur.gid && !onlyOne) {
          const anchor = groupMeta ? groupMeta.anchor : cur.d;
          const common = Object.assign({}, payload, { d: anchor, gt: title });
          const ruleWds = (repRule === 'weekly' || repRule === 'biweekly')
            ? repWds.slice()
            : [];

          if (repTouched) {
            const until = $('#fUntil').value || repUntil || anchor;
            const exDates = {};
            groupMembers.forEach(function (m) { (m.xs || []).forEach(function (ds) { exDates[ds] = 1; }); });
            let dates = repRule === 'none' ? [anchor] : expandRepeat(anchor, until, repRule, repWds);
            dates = dates.filter(function (ds) { return !exDates[ds]; });
            if (!dates.length) dates = [anchor];
            const oldIds = {};
            groupMembers.forEach(function (x) { oldIds[x.id] = 1; });
            state.events = state.events.filter(function (x) { return !oldIds[x.id]; });

            if (dates.length > 1 && repRule !== 'none') {
              const gid = cur.gid || uid('grp');
              const keepXs = Object.keys(exDates);
              dates.forEach(function (ds) {
                state.events.push(Object.assign({}, common, {
                  id: uid('ev'),
                  gid: gid,
                  gt: title,
                  d: ds,
                  rr: repRule,
                  rw: ruleWds,
                  ru: until,
                  ga: anchor,
                  xs: keepXs
                }));
              });
            } else {
              state.events.push(Object.assign({}, common, {
                id: uid('ev'),
                d: dates[0] || anchor
              }));
            }

            saveState();
            weekStart = startOfWeek(fromYMD(anchor));
            draftCtx = null;
            clearDraft();
            closeModal();
            renderAll();
            toast('已按新规则更新整组');
            return;
          }

          /* 没改重复规则：保留每条原日期，只同步共同字段 */
          groupMembers.forEach(function (x) {
            const i = state.events.findIndex(function (y) { return y.id === x.id; });
            if (i < 0) return;
            state.events[i] = Object.assign({}, state.events[i], common, { d: x.d, gt: title });
          });
          saveState();
          draftCtx = null;
          clearDraft();
          closeModal();
          renderAll();
          toast('已修改整组 ' + groupMembers.length + ' 项');
          return;
        }

        /* 2) 只改这一条（或本来就不是重复日程） */
        const i = state.events.findIndex(function (x) { return x.id === editingId; });
        if (i > -1) {
          const old = state.events[i];

          /* 原来是单条，这次选了重复规则：转成一整组 */
          if (!old.gid && repRule !== 'none') {
            const until = $('#fUntil').value || repUntil || date;
            const dates = expandRepeat(date, until, repRule, repWds);
            if (dates.length > 1) {
              const gid = uid('grp');
              const ruleWds = (repRule === 'weekly' || repRule === 'biweekly') ? repWds.slice() : [];
              state.events.splice(i, 1);
              dates.forEach(function (ds) {
                state.events.push(Object.assign({}, payload, {
                  id: uid('ev'),
                  gid: gid,
                  gt: title,
                  d: ds,
                  rr: repRule,
                  rw: ruleWds,
                  ru: until,
                  ga: dates[0]
                }));
              });
              saveState();
              weekStart = startOfWeek(fromYMD(dates[0]));
              draftCtx = null;
              clearDraft();
              closeModal();
              renderAll();
              toast('已改为重复日程，共 ' + dates.length + ' 项');
              return;
            }
          }

          state.events[i] = Object.assign({}, old, payload);
        }
        saveState();
        draftCtx = null;
        clearDraft();
        closeModal();
        renderAll();
        toast('已保存修改');
        return;
      }

      /* --- 新建：按重复规则展开成一批 --- */
      const dates = repRule === 'none'
        ? [date]
        : expandRepeat(date, $('#fUntil').value || date, repRule, repWds);
      const anchor = dates[0] || date;

      if (dates.length > 1) {
        /* 整组共用同一个 gid；规则和起始日一并存下来，方便之后整组修改 */
        const gid = uid('grp');
        const ruleWds = (repRule === 'weekly' || repRule === 'biweekly') ? repWds.slice() : [];
        const until = $('#fUntil').value || date;
        dates.forEach(function (ds) {
          state.events.push(Object.assign({}, payload, {
            id: uid('ev'),
            gid: gid,
            gt: title,
            d: ds,
            rr: repRule,
            rw: ruleWds,
            ru: until,
            ga: anchor
          }));
        });
      } else {
        state.events.push(Object.assign({}, payload, { id: uid('ev'), d: anchor }));
      }

      saveState();
      /* 跳到起始日所在周，方便立刻看到结果 */
      weekStart = startOfWeek(fromYMD(anchor));

      /* 已经提交，草稿作废；先置空读取器，关闭时就不会再回写 */
      draftCtx = null;
      clearDraft();

      closeModal();
      renderAll();
      toast(dates.length > 1 ? ('已生成 ' + dates.length + ' 项重复日程') : '已添加日程');
    });

    /**
     * 删除并给一次「撤销」机会。
     * 用户已经确认过一次，这里不再弹窗打扰；但只要还在当前页面，
     * 提示条上的「撤销」就能把数据原样塞回去。
     * @param {Array} victims 被删掉的日程对象（原引用，恢复时直接 concat）
     * @param {string} msg    提示文案
     */
    function deleteWithUndo(victims, msg) {
      if (!victims.length) { closeModal(); return; }

      const ids = {};
      victims.forEach(function (x) { ids[x.id] = 1; });
      state.events = state.events.filter(function (x) { return !ids[x.id]; });
      saveState();
      closeModal();
      renderAll();

      toast(msg, {
        label: '撤销',
        fn: function () {
          state.events = state.events.concat(victims);
          saveState();
          renderAll();
          toast('已恢复 ' + victims.length + ' 项');
        }
      });
    }

    /* 删除单条：点第一下变「再点一次」，3 秒没动作自动复位，避免误删 */
    const del = $('#fDel');
    if (del) {
      let armed = false;
      let armTimer = null;
      const disarm = function () {
        armed = false;
        clearTimeout(armTimer);
        del.classList.remove('armed');
        del.textContent = '删除';
      };
      del.addEventListener('click', function () {
        if (!armed) {
          armed = true;
          del.classList.add('armed');
          del.textContent = '再点一次确认删除';
          armTimer = setTimeout(disarm, 3000);
          return;
        }
        clearTimeout(armTimer);
        const victim = state.events.filter(function (x) { return x.id === editingId; });
        deleteWithUndo(victim, '已删除「' + (victim[0] ? victim[0].t : '日程') + '」');
      });
    }

    /* 删除整组（按 gid 一次性清理）：同样是二次点击确认 */
    const delGrp = $('#fDelGrp');
    if (delGrp && ev && ev.gid) {
      delGrp.addEventListener('click', function () {
        if (!delGrp.classList.contains('armed')) {
          delGrp.classList.add('armed');
          delGrp.textContent = '确认删除 ' + groupMembers.length + ' 项？';
          return;
        }
        deleteWithUndo(groupMembers.slice(), '已删除整组 ' + groupMembers.length + ' 项');
      });
    }

    /* 自动聚焦标题 */
    setTimeout(function () { const t = $('#fTitle'); if (t) t.focus(); }, 120);
  }

  /* --------------------------------------------------------------------------
   * 7.8.1 新建日程草稿
   * 关掉弹窗时把已填内容留下来，可以先去翻日历、再回来接着写。
   * 只有一份草稿；提交成功后立刻清空。
   * ------------------------------------------------------------------------ */

  /** 当前打开着的新建弹窗会注册一个读取器，用来抓表单当前值 */
  let draftCtx = null;
  let draftTimer = null;

  /** 这份内容值不值得留成草稿（什么都不填就不打扰） */
  function draftIsMeaningful(d) {
    if (!d) return false;
    return !!((d.t || '').trim() ||
      (d.n || '').trim() ||
      (d.p || '').trim() ||
      d.img ||
      (d.repRule && d.repRule !== 'none'));
  }

  /** 立刻把表单写进草稿：关闭弹窗时调用，或输入停顿 350ms 后自动调用 */
  function flushDraft() {
    clearTimeout(draftTimer);
    draftTimer = null;
    if (!draftCtx) return;

    let d = null;
    try { d = draftCtx.read(); } catch (e) { d = null; }
    if (d && draftIsMeaningful(d)) {
      d.savedAt = Date.now();
      state.draft = d;
    } else {
      state.draft = null;
    }
    saveState();
    syncDraftBar();
  }

  /** 输入时延迟保存，避免一个字一次写盘 */
  function scheduleDraftSave() {
    if (!draftCtx) return;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(flushDraft, 350);
  }

  /** 清掉草稿 */
  function clearDraft() {
    clearTimeout(draftTimer);
    draftTimer = null;
    if (!state.draft) return;
    state.draft = null;
    saveState();
    syncDraftBar();
  }

  /** 草稿条上的摘要文案 */
  function draftMetaText(d) {
    const parts = [];
    if (d.d) {
      const dt = fromYMD(d.d);
      parts.push((dt.getMonth() + 1) + '月' + dt.getDate() + '日');
    }
    if (d.s) parts.push(d.s + (d.e ? '–' + d.e : ''));
    if (d.repRule && d.repRule !== 'none') {
      const r = REPEAT_RULES.filter(function (x) { return x.key === d.repRule; })[0];
      if (r) parts.push(r.label);
    }
    return parts.join(' · ') + ' · 未提交';
  }

  /** 有草稿就显示草稿条，没有就收起 */
  function syncDraftBar() {
    const bar = $('#draftBar');
    if (!bar) return;
    const d = state.draft;
    const show = !!d;

    bar.classList.toggle('show', show);
    document.body.classList.toggle('has-draft', show);
    if (!show) return;

    $('#dbTitle').textContent = (d.t || '').trim() || '未命名日程';
    $('#dbMeta').textContent = draftMetaText(d);

    const x = $('#dbX');
    if (x) { x.classList.remove('armed'); x.textContent = '✕'; }
  }

  /** 点「继续编辑」：带着草稿内容重新打开弹窗 */
  function resumeDraft() {
    const d = state.draft;
    if (!d) return;
    openEventDialog(null, {
      d: d.d, s: d.s, e: d.e, t: d.t, p: d.p, n: d.n, st: d.st, img: d.img
    }, { draft: d });
  }

  function closeModal() {
    /* 真正关闭时才回写草稿；提交路径会先把 draftCtx 置空 */
    if (draftCtx) {
      try { flushDraft(); } catch (e) { /* 表单已被其它弹窗替换时不再阻塞关闭 */ }
      draftCtx = null;
    }
    clearTimeout(draftTimer);

    window.__dlBeforeModalClose = null;
    window.__dlSettingsBack = null;
    const root = $('#modalRoot');
    popModal(closeModal);
    root.classList.remove('open');
    root.innerHTML = '';
    editingId = null;
  }

  /** 删除并给一次撤销机会（详情弹窗、编辑弹窗共用） */
  function deleteEventsWithUndo(victims, msg) {
    if (!victims || !victims.length) return;
    const ids = {};
    victims.forEach(function (x) { ids[x.id] = 1; });
    state.events = state.events.filter(function (x) { return !ids[x.id]; });
    markDeleted(ids);
    saveState();
    closeModal();
    renderAll();
    toast(msg, {
      label: '撤销',
      fn: function () {
        state.events = state.events.concat(victims);
        saveState();
        renderAll();
        toast('已恢复 ' + victims.length + ' 项');
      }
    });
  }

  /**
   * 表格里点一下日程：先看详情，再决定改不改。
   * 居中卡片，手机上也是中间弹窗；长按拖动不受影响。
   */
  function openEventDetail(id) {
    const ev = state.events.filter(function (x) { return x.id === id; })[0];
    if (!ev) return;

    const d = fromYMD(ev.d);
    const st = STATUS[ev.st || 'todo'] || STATUS.todo;
    const meta = repeatMetaOf(ev);
    const groupMembers = meta ? meta.members : [];
    const dur = evDuration(ev);
    const durText = (function (m) {
      const h = Math.floor(m / 60), mm = Math.round(m % 60);
      return h ? (mm ? h + ' 小时 ' + mm + ' 分' : h + ' 小时') : mm + ' 分钟';
    })(dur);
    const dateText = (d.getMonth() + 1) + '月' + d.getDate() + '日 · ' + WEEKDAY[d.getDay()] +
      (d.getFullYear() !== new Date().getFullYear() ? ' · ' + d.getFullYear() : '');
    const timeText = ev.s + ' – ' + ev.e + (toMin(ev.e) <= toMin(ev.s) ? '（次日）' : '') + ' · ' + durText;

    let chips = '<span class="evd-chip time">' + esc(timeText) + '</span>' +
      '<span class="evd-chip">' + st.sym + ' ' + st.label + '</span>';
    if (ev.imp) chips += '<span class="evd-chip imp">★ 重要</span>';
    if (ev.gid) chips += '<span class="evd-chip">↻ ' + esc(repeatRuleLabel(meta ? meta.rule : 'weekly')) + '</span>';

    let rows = '';
    rows += '<div class="evd-row"><div class="k">时间</div><div class="v">' + esc(timeText) + '</div></div>';
    if (ev.p) rows += '<div class="evd-row"><div class="k">地点</div><div class="v">' + esc(ev.p) + '</div></div>';
    if (ev.gid && meta) {
      rows += '<div class="evd-row"><div class="k">重复</div><div class="v">' +
        esc(repeatSummaryOf(ev)) +
        '<br><span style="font-size:11px;color:var(--muted)">修改默认作用于整组</span></div></div>';
    }
    if (remindOn(ev)) {
      rows += '<div class="evd-row"><div class="k">提醒</div><div class="v soft">' +
        esc(remindText(ev) + (ev.al ? ' · 闹钟' : '')) + '</div></div>';
    }
    if (ev.img) {
      rows += '<div class="evd-row"><div class="k">配图</div><div class="v">' +
        '<img src="' + ev.img + '" alt="" style="max-width:100%;max-height:150px;border-radius:10px;display:block">' +
        '</div></div>';
    }

    const root = $('#modalRoot');
    root.innerHTML =
      '<div class="mb-back" data-close></div>' +
      '<div class="mb-panel ev-detail" style="--h:' + hueOf(ev.t) + '">' +
        '<div class="evd-top">' +
          '<div class="evd-date">' + esc(dateText) + '</div>' +
          '<button class="icon-btn sm evd-close" data-close aria-label="关闭">✕</button>' +
          '<h3 class="evd-title">' + esc(ev.t || '未命名日程') + '</h3>' +
          '<div class="evd-chips">' + chips + '</div>' +
        '</div>' +
        '<div class="evd-body">' +
          rows +
          (ev.n ? '<div class="evd-note"><b style="font-size:10.5px;color:var(--muted);display:block;margin-bottom:4px">备注</b>' +
            esc(ev.n) + '</div>' : '') +
        '</div>' +
        '<div class="evd-foot">' +
          (ev.al && isMobileView() ? '<button class="evd-sysalarm" id="evdSysAlarm">写入系统闹钟</button>' : '') +
          (ev.gid
            ? '<button class="evd-del" data-del="one">删除此条</button>' +
              '<button class="evd-del evd-del-group" data-del="group">删除整组</button>'
            : '<button class="evd-del" data-del="one">删除</button>') +
          '<span class="spacer"></span>' +
          '<button class="btn ghost" data-close>关闭</button>' +
          '<button class="btn primary" id="evdEdit">修改</button>' +
        '</div>' +
      '</div>';

    openLayer(root);
    pushModal(closeModal);

    $$('[data-close]', root).forEach(function (el) {
      el.addEventListener('click', closeModal);
    });

    const evdSys = $('#evdSysAlarm', root);
    if (evdSys) {
      evdSys.addEventListener('click', function () {
        writeSystemAlarmData(ev.t, ev.s, (ev.rw || []), ev.d);
      });
    }
    const editBtn = $('#evdEdit');
    if (editBtn) {
      editBtn.addEventListener('click', function () {
        closeModal();
        setTimeout(function () { openEventDialog(id); }, 0);
      });
    }

    /* 删除：第一下变确认，第二下才真删；整组和单条分开 */
    let armed = '';
    let armTimer = null;
    const disarm = function () {
      armed = '';
      clearTimeout(armTimer);
      $$('.evd-del', root).forEach(function (b) {
        b.classList.remove('armed');
        b.textContent = b.dataset.del === 'group' ? '删除整组' : (ev.gid ? '删除此条' : '删除');
      });
    };
    $$('.evd-del', root).forEach(function (btn) {
      btn.addEventListener('click', function () {
        const kind = btn.dataset.del;
        if (armed !== kind) {
          disarm();
          armed = kind;
          btn.classList.add('armed');
          btn.textContent = kind === 'group' ? '确认删除整组？' : '确认删除？';
          armTimer = setTimeout(disarm, 3000);
          return;
        }
        clearTimeout(armTimer);
        if (kind === 'group') {
          deleteEventsWithUndo(groupMembers.slice(), '已删除整组 ' + groupMembers.length + ' 项');
        } else {
          /* 跳过本次：把日期记为例外，之后整组改规则时不会把它复活 */
          if (ev.gid) {
            groupMembers.forEach(function (m) {
              if (m.id === ev.id) return;
              m.xs = (m.xs || []).concat(ev.d).filter(function (v, i, arr) { return arr.indexOf(v) === i; });
            });
            saveState();
          }
          deleteEventsWithUndo([ev], (ev.gid ? '已跳过这一次' : '') + '「' + ev.t + '」');
        }
      });
    });
  }

  /**
   * 轻量提示条（批量生成 / 删除后的反馈）
   * @param {string} msg 提示文字
   * @param {{label:string, fn:Function}|null} [act]
   *   可选的动作按钮，用于「撤销」这类需要补救的操作。
   *   带按钮时停留时间更长，给用户留出反应余地。
   */
  let toastTimer = null;
  function toast(msg, act) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = '';

    const span = document.createElement('span');
    span.textContent = msg;
    el.appendChild(span);

    if (act && typeof act.fn === 'function') {
      const btn = document.createElement('button');
      btn.className = 't-act';
      btn.textContent = act.label || '撤销';
      btn.addEventListener('click', function () {
        hideToast();
        try { act.fn(); } catch (err) { console.warn('[DayLeaf] 提示条动作执行失败', err); }
      });
      el.appendChild(btn);
    }

    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, act ? 5000 : 2200);
  }

  /** 收起提示条（换一条提示前也会先收，避免闪一下旧文案） */
  function hideToast() {
    const el = document.getElementById('toast');
    if (el) el.classList.remove('show');
  }

  /* --------------------------------------------------------------------------
   * 7.8.5 过期日程自动清理
   * 规则很简单：早于「今天 - 保留天数」的日程会被清掉，但标了「重要项目」
   * （imp）的永远保留。默认关闭，由用户在设置里自己决定要不要开。
   * ------------------------------------------------------------------------ */

  /** 当前保留天数是否落在三个预设上（否则由自定义输入框接管） */
  function cleanIsPreset() {
    const days = Number(state.clean.days) || 30;
    return CLEAN_SPANS.some(function (c) { return c.days === days; });
  }

  /**
   * 设置面板里是否处于「自定义」态。
   * 光看天数不够：从「一个月」切到自定义时天数还是 30，
   * 会被误判成预设，输入框就不出来了。
   */
  let cleanCustomUI = false;

  /** 当前会被清理掉的日程（重要项目不在其中） */
  function cleanableEvents() {
    const days = Number(state.clean.days) || 30;
    const cutoff = toYMD(addDays(new Date(), -days));
    return state.events.filter(function (x) {
      return !x.imp && typeof x.d === 'string' && x.d < cutoff;
    });
  }

  /**
   * 执行一次清理。
   * @param {boolean} [manual] 用户手动触发时给明确反馈（没东西可清也要说一声）
   * @returns {number} 实际清掉的条数
   */
  function runClean(manual) {
    const today = toYMD(new Date());
    const list = cleanableEvents();

    state.clean.lastRun = today;

    if (!list.length) {
      saveState();
      if (manual) toast('没有需要清理的日程');
      return 0;
    }

    const ids = {};
    list.forEach(function (x) { ids[x.id] = 1; });
    state.events = state.events.filter(function (x) { return !ids[x.id]; });
    saveState();
    renderAll();

    /* 清理是后台做的，用户可能压根没注意；留一个撤销口子 */
    toast('已清理 ' + list.length + ' 条过期日程', {
      label: '撤销',
      fn: function () {
        state.events = state.events.concat(list);
        saveState();
        renderAll();
        toast('已恢复 ' + list.length + ' 条');
      }
    });
    return list.length;
  }

  /** 启动时跑一次自动清理：只在开启时生效，且一天最多一次 */
  function autoCleanOnBoot() {
    if (!state.clean.on) return;
    if (state.clean.lastRun === toYMD(new Date())) return;
    runClean(false);
  }

  /* --------------------------------------------------------------------------
   * 7.8.6 提醒与闹钟
   * 两条线：
   * · 提醒 = 提前 N 分钟弹系统通知（Notification API），没权限就退成页面提示条；
   * · 闹钟 = 事件开始时弹全屏面板 + 响铃 + 震动。
   * Web 端写不了系统闹钟，想要真正系统级的，用「导出 .ics」导进手机日历。
   * ------------------------------------------------------------------------ */

  /** 权限提示只提醒一次，别每次开提醒都烦人 */
  let notifiedPermWarn = false;

  /** 原生壳桥接：打包成 App 后 window.DayLeafNative 才存在；网页原型里为 null */
  function nativeBridge() {
    try {
      return (window.DayLeafNative && window.DayLeafNative.checkUpdate) ? window.DayLeafNative : null;
    } catch (e) { return null; }
  }
  /** 保存文本文件：App 里走原生「另存为」，网页里退回 blob 下载（WebView 不认 <a download>） */
  function saveTextFile(filename, content, mime) {
    const nat = nativeBridge();
    if (nat && nat.saveTextFile) {
      try { nat.saveTextFile(filename, content); return; } catch (e) { /* 退回下载 */ }
    }
    const blob = new Blob([content], { type: mime || 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }
  function notifySupported() {
    return typeof window.Notification !== 'undefined' || !!(nativeBridge() && nativeBridge().notify);
  }

  /**
   * 是否「手机端」。闹钟是手机端专属功能：电脑上不显示、不响，
   * 免得在办公场景里突然响铃。断点跟 UI 一致（<960px 视为手机）。
   */
  function isMobileView() {
    return !!(window.matchMedia && window.matchMedia('(max-width:959px)').matches);
  }

  /**
   * 这条日程有没有开提醒。
   * 0 分钟是「到点提醒」而不是「关」，所以开关和分钟数得分开存：
   * 新数据看 rmOn；老数据（只有 rm>0 才叫开）也能正确还原。
   * @param {Object} ev
   */
  function remindOn(ev) {
    if (!ev) return false;
    if (typeof ev.rmOn === 'boolean') return ev.rmOn;
    return Number(ev.rm) > 0;
  }

  /** 提醒文案：到点 / 提前 N 分钟 */
  function remindText(ev) {
    return Number(ev.rm) > 0 ? '提前 ' + ev.rm + ' 分钟' : '到点';
  }

  /** 设置里那颗按钮的文案：把权限状态翻译成人话 */
  function notifyPermText() {
    if (nativeBridge() && nativeBridge().notify) return '已授权（App 内原生通知）';
    if (!notifySupported()) return '此浏览器不支持通知';
    const p = Notification.permission;
    if (p === 'granted') return '已授权 ✓（点此复查）';
    if (p === 'denied') return '已被拒绝（浏览器设置里改）';
    return '点击授权';
  }
  function canNotify() {
    if (nativeBridge() && nativeBridge().notify) return true;   // App 内由原生处理权限
    return notifySupported() && Notification.permission === 'granted';
  }

  /** 请求系统通知权限；cb(granted) */
  function askNotifyPermission(cb) {
    const _nb = nativeBridge();
    if (_nb && _nb.ensureNotifyPermission) {
      try { _nb.ensureNotifyPermission(); } catch (e) { /* ignore */ }
      cb && cb(true);
      return;
    }
    if (!notifySupported()) { cb && cb(false); return; }
    if (Notification.permission === 'granted') { cb && cb(true); return; }
    try {
      const r = Notification.requestPermission(function (p) { cb && cb(p === 'granted'); });
      if (r && r.then) r.then(function (p) { cb && cb(p === 'granted'); });
    } catch (err) { cb && cb(false); }
  }

  /** 日程开始的绝对时间戳（本地时区） */
  function evStartTs(ev) {
    return fromYMD(ev.d).getTime() + toMin(ev.s) * 60000;
  }

  let remindTimer = null;

  /* ---- 后台提醒：把未来的提醒/闹钟交给原生系统调度 ---- */
  let nativeRemLast = '';
  let nativeRemTimer = null;

  function buildNativeReminders() {
    const enabled = !!(state.notify && state.notify.background && state.notify.on);
    const items = [];
    if (enabled) {
      const now = Date.now();
      state.events.forEach(function (ev) {
        if (!remindOn(ev)) return;
        if (state.notify.skipHoliday && isHolidayDate(ev.d)) return;
        const start = evStartTs(ev);
        const base = ev.t + ' · ' + ev.s + (ev.p ? ' · ' + ev.p : '');
        const rmAt = start - (Number(ev.rm) || 0) * 60000;
        if (rmAt > now && items.length < 500) {
          items.push({
            id: ev.id + ':rm',
            at: rmAt,
            title: ev.t,
            body: (Number(ev.rm) > 0 ? '还有 ' + ev.rm + ' 分钟开始' : '到点了') + ' · ' + base,
            kind: 'rm'
          });
        }
        if (ev.al && start > now && items.length < 500) {
          items.push({
            id: ev.id + ':al',
            at: start,
            title: ev.t,
            body: '现在开始 · ' + base,
            kind: 'al'
          });
        }
      });
    }
    const nextItem = items.filter(function (x) { return x.kind === 'rm'; })[0] || items[0] || null;
    const nextDate = nextItem ? new Date(nextItem.at) : null;
    return {
      enabled: enabled,
      items: items,
      nextOn: !!(state.notify && state.notify.nextOn),
      next: nextItem ? {
        title: nextItem.title,
        time: pad2(nextDate.getHours()) + ':' + pad2(nextDate.getMinutes()),
        body: nextItem.body
      } : null
    };
  }

  function syncNativeReminders(force) {
    const nb = nativeBridge();
    if (!nb || !nb.syncReminders) return;
    const payload = JSON.stringify(buildNativeReminders());
    if (!force && payload === nativeRemLast) return;
    nativeRemLast = payload;
    try { nb.syncReminders(payload); } catch (e) { /* ignore */ }
  }

  function scheduleNativeReminderSync(force) {
    clearTimeout(nativeRemTimer);
    nativeRemTimer = setTimeout(function () { syncNativeReminders(!!force); }, force ? 0 : 700);
  }

  /** 启动轮询（20 秒一次，够准又不费电；关掉总开关时直接不扫） */
  function startReminders() {
    if (remindTimer) return;
    remindTimer = setInterval(tickReminders, 20000);
    tickReminders();
    scheduleNativeReminderSync(true);
  }

  function firedKey(ev, kind) { return ev.id + '|' + ev.d + '|' + kind; }

  /** 触发记录只留 3 天，别让它无限长 */
  function pruneFired() {
    const f = state.notify.fired || {};
    const cut = Date.now() - 3 * 24 * 3600 * 1000;
    Object.keys(f).forEach(function (k) { if (!f[k] || f[k] < cut) delete f[k]; });
  }

  function tickReminders() {
    if (!state.notify || !state.notify.on) return;
    /* 后台提醒开启且原生支持时，全部交给系统调度，避免前台重复 */
    if (state.notify.background) {
      const nb = nativeBridge();
      if (nb && nb.syncReminders) return;
    }
    const now = Date.now();

    state.events.forEach(function (ev) {
      if (!remindOn(ev)) return;                // 没开提醒
      const st = evStartTs(ev);

      /* 提醒：提前 rm 分钟；迟到半小时内仍补一次（比如刚打开软件） */
      const rt = st - ev.rm * 60000;
      if (now >= rt && now <= rt + 30 * 60 * 1000) tryFire(ev, 'rm');

      /* 闹钟：到点响；迟到 15 分钟内也认（手机端专属，电脑端不响） */
      if (ev.al && isMobileView() && now >= st && now <= st + 15 * 60 * 1000) tryFire(ev, 'al');
    });
  }

  function tryFire(ev, kind) {
    const f = state.notify.fired || (state.notify.fired = {});
    const key = firedKey(ev, kind);
    if (f[key]) return;
    f[key] = Date.now();
    pruneFired();
    saveState();
    if (kind === 'al') openAlarm(ev);
    else pushRemind(ev);
  }

  /** 系统通知；拿不到权限就退回页面内提示条 */
  function pushRemind(ev) {
    const body = (Number(ev.rm) > 0 ? '还有 ' + ev.rm + ' 分钟开始' : '到点了') +
      ' · ' + ev.s + (ev.p ? ' · ' + ev.p : '');
    const _nb = nativeBridge();
    if (_nb && _nb.notify) {
      try { _nb.notify(ev.t, body, 'dayleaf-' + ev.id); } catch (e) { /* ignore */ }
      return;
    }
    if (canNotify()) {
      try {
        const n = new Notification(ev.t, { body: body, tag: 'dayleaf-' + ev.id, icon: '' });
        n.onclick = function () {
          try { window.focus(); } catch (e) { /* ignore */ }
          switchView('grid');
          weekStart = startOfWeek(fromYMD(ev.d));
          renderGrid();
          openEventDialog(ev.id);
        };
        return;
      } catch (err) { /* 部分平台要用 ServiceWorker，落回页面提示 */ }
    }
    toast('🔔 ' + ev.t + ' · ' + body);
  }

  /* ---- 闹钟：全屏面板 + 响铃 + 震动 ---- */
  let alarmAudio = null;

  function startAlarmSound() {
    if (!state.notify.sound) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      alarmAudio = new AC();
      const beep = function () {
        if (!alarmAudio) return;
        const t0 = alarmAudio.currentTime;
        [0, 0.24].forEach(function (off) {
          const o = alarmAudio.createOscillator();
          const g = alarmAudio.createGain();
          o.type = 'sine';
          o.frequency.value = 880;
          g.gain.setValueAtTime(0.0001, t0 + off);
          g.gain.exponentialRampToValueAtTime(0.3, t0 + off + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.18);
          o.connect(g); g.connect(alarmAudio.destination);
          o.start(t0 + off); o.stop(t0 + off + 0.2);
        });
      };
      beep();
      alarmAudio._timer = setInterval(beep, 1500);
    } catch (err) { /* 没有音频设备就算了 */ }
  }

  function stopAlarmSound() {
    if (!alarmAudio) return;
    clearInterval(alarmAudio._timer);
    try { alarmAudio.close(); } catch (e) { /* ignore */ }
    alarmAudio = null;
  }

  function ringAlarm() {
    startAlarmSound();
    let left = 30;                    // 最多响 30 秒，没人理就自动收
    const box = $('#alarmRoot');
    if (!box) return;
    box._timer = setInterval(function () {
      left--;
      if (left <= 0) { stopAlarm(); return; }
      if (box._cd) box._cd.textContent = left;
      try { navigator.vibrate && navigator.vibrate([500, 300, 500]); } catch (e) { /* ignore */ }
    }, 1000);
    try { navigator.vibrate && navigator.vibrate([700, 400, 700]); } catch (e) { /* ignore */ }
  }

  function openAlarm(ev) {
    const box = $('#alarmRoot');
    if (!box) return;
    box.hidden = false;
    if (!box._inStack) { box._inStack = true; pushModal(stopAlarm); }
    box.innerHTML =
      '<div class="alarm-card" role="alertdialog" aria-modal="true">' +
        '<span class="al-ico">⏰</span>' +
        '<div class="al-t">' + esc(ev.t) + '</div>' +
        '<div class="al-m">' + esc(ev.s) + '–' + esc(ev.e) +
          (ev.p ? ' · ' + esc(ev.p) : '') + '</div>' +
        '<div class="al-acts">' +
          '<button class="btn ghost" id="alSnooze">稍后 5 分钟</button>' +
          '<button class="btn primary" id="alStop">停止</button>' +
        '</div>' +
        '<div class="al-cd"><span id="alCd">30</span> 秒后自动停止</div>' +
      '</div>';
    box._cd = $('#alCd', box) || document.getElementById('alCd');

    const stop = function () { stopAlarm(); };
    const stopBtn = document.getElementById('alStop');
    const snzBtn = document.getElementById('alSnooze');
    if (stopBtn) stopBtn.addEventListener('click', stop);
    if (snzBtn) snzBtn.addEventListener('click', function () {
      /* 5 分钟后再响一次：把这一条的触发记录推迟 */
      const f = state.notify.fired || (state.notify.fired = {});
      f[firedKey(ev, 'al')] = Date.now() - 14 * 60 * 1000; // 让它落在窗口内、稍后重新命中
      saveState();
      stopAlarm();
      toast('5 分钟后再响一次');
    });
    ringAlarm();
  }

  function stopAlarm() {
    stopAlarmSound();
    try { navigator.vibrate && navigator.vibrate(0); } catch (e) { /* ignore */ }
    const box = $('#alarmRoot');
    if (!box) return;
    clearInterval(box._timer);
    if (box._inStack) { box._inStack = false; popModal(stopAlarm); }
    box.hidden = true;
    box.innerHTML = '';
    box._cd = null;
  }

  /**
   * 导出 .ics：只导出开了提醒 / 闹钟的日程。
   * 手机日历导入后，VALARM 会变成系统级提醒 —— 这是 Web 端唯一能
   * 真正落到「系统闹钟」的办法。
   */
  function exportIcs() {
    const items = state.events.filter(function (e) { return remindOn(e); });
    if (!items.length) { toast('还没有开启提醒的日程'); return; }
    const p2 = function (v) { return String(v).padStart(2, '0'); };
    const stamp = function (d) {
      return d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + 'T' +
        p2(d.getHours()) + p2(d.getMinutes()) + '00';
    };
    const escTxt = function (s) {
      return String(s || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
    };
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//DayLeaf//叶历//ZH', 'CALSCALE:GREGORIAN'];
    items.forEach(function (ev) {
      const st = new Date(evStartTs(ev));
      const en = new Date(fromYMD(ev.d).getTime() + toMin(ev.e) * 60000);
      L.push('BEGIN:VEVENT',
        'UID:' + ev.id + '@dayleaf',
        'DTSTAMP:' + stamp(new Date()),
        'DTSTART:' + stamp(st),
        'DTEND:' + stamp(en),
        'SUMMARY:' + escTxt(ev.t),
        'DESCRIPTION:' + escTxt(ev.p || ''),
        'BEGIN:VALARM',
        'TRIGGER:' + (Number(ev.rm) > 0 ? '-PT' + ev.rm + 'M' : 'PT0M'),
        'ACTION:DISPLAY',
        'DESCRIPTION:' + escTxt(ev.t + (Number(ev.rm) > 0 ? ' 还有 ' + ev.rm + ' 分钟开始' : ' 时间到了')),
        'END:VALARM');
      if (ev.al) {
        /* 闹钟：到点的响铃提醒 */
        L.push('BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:AUDIO',
          'DESCRIPTION:' + escTxt(ev.t + ' 时间到了'), 'END:VALARM');
      }
      L.push('END:VEVENT');
    });
    L.push('END:VCALENDAR');

    saveTextFile('dayleaf-reminders-' + toYMD(new Date()) + '.ics', L.join('\r\n'), 'text/calendar;charset=utf-8');
    toast('已导出 ' + items.length + ' 条带提醒的日程（.ics）');
  }

  /** 把每个分类子页按 sec-line 聚成卡片，提升层级感 */
  function groupSettingsSections(root) {
    $$('.set-pane', root).forEach(function (pane) {
      const nodes = Array.prototype.slice.call(pane.childNodes);
      let group = null;
      nodes.forEach(function (node) {
        if (node.nodeType !== 1) return;
        if (node.classList.contains('sec-line')) {
          group = document.createElement('div');
          group.className = 'set-group';
          pane.insertBefore(group, node);
          group.appendChild(node);
        } else {
          if (!group) {
            group = document.createElement('div');
            group.className = 'set-group';
            pane.insertBefore(group, node);
          }
          group.appendChild(node);
        }
      });
    });
  }

        if (panel) {
          panel.classList.add('pane-open');
          panel.style.setProperty('--cat', cat.color || '#4C6FFF');

          const k = Math.min(1, MAX / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * k);
          cv.height = Math.round(img.height * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          state.home.img = cv.toDataURL('image/jpeg', 0.85);
          AssetDB.put('hero', state.home.img);
          const frBtn = document.getElementById('fHeroFrame');
          if (frBtn) frBtn.disabled = false;
          applyHomeLook();

    root.addEventListener('input', function (e) {
