}
/* 选中行紧贴标题下方（底部弹层，不再按全屏的 1/3 处定位） */
.wp-cols{display:flex;gap:6px;position:relative;margin:8px 0 auto}
.wp-cols::before{
  content:'';position:absolute;left:0;right:0;top:0;height:44px;border-radius:12px;
  background:rgba(255,255,255,.09);pointer-events:none;
}
.wp-col{flex:1;min-width:0}
.wp-list{
  height:min(38vh,400px);overflow-y:auto;overflow-x:hidden;
  scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;overscroll-behavior:contain;
}
.wp-list::-webkit-scrollbar{display:none}
.wp-item{
  height:44px;display:flex;align-items:center;justify-content:center;
  scroll-snap-align:start;font-size:23px;font-weight:600;color:#fff;
  white-space:nowrap;letter-spacing:.5px;
  transition:opacity .14s ease,font-size .14s ease,color .14s ease;
  font-variant-numeric:tabular-nums;
}
/* 底部占位：高度 = 可视区 - 一行，这样最后一项也能滚到顶行 */
.wp-pad{height:calc(100% - 44px)}
.wp-acts{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px}
.wp-ok{
  width:100%;max-width:300px;height:50px;border-radius:26px;
  border:1.5px solid rgba(255,255,255,.5);background:transparent;
  color:#fff;font-size:16px;font-weight:650;letter-spacing:2px;transition:.15s;
}
.wp-ok:active{background:rgba(255,255,255,.16);transform:scale(.985)}
.wp-cancel{
  font-size:13.5px;color:rgba(255,255,255,.55);background:none;
  padding:3px 12px;letter-spacing:.5px;
}
.wp-cancel:active{color:rgba(255,255,255,.9)}

/* 内嵌月历浮层 */
.dt-pop{
  position:fixed;z-index:1200;width:min(304px,calc(100vw - 24px));
  border-radius:16px;padding:11px;
  background:var(--surface);border:1px solid var(--line2);
  box-shadow:0 18px 46px -14px rgba(16,20,30,.42);
  animation:dtPop .16s ease;
}
@keyframes dtPop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.dt-pop-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dt-pop-h b{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.dt-pop-h button{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:15px;color:var(--ink2);background:var(--surface-2);transition:.14s;
}
.dt-pop-h button:active{transform:scale(.92)}
.dt-pop-w{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.dt-pop-w span{text-align:center;font-size:10px;color:var(--muted);padding:3px 0}
.dt-pop-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dt-pop-g button{
  height:36px;border-radius:9px;font-size:12.5px;color:var(--ink2);
  font-variant-numeric:tabular-nums;transition:.13s;position:relative;
}
.dt-pop-g button:active{transform:scale(.93)}
.dt-pop-g button.out{color:var(--ink-soft);opacity:.45}
.dt-pop-g button.today{color:var(--accent);font-weight:700}
.dt-pop-g button.today::after{
  content:'';position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--accent);
}
.dt-pop-g button.sel{background:var(--accent);color:#fff;font-weight:700}
.dt-pop-g button.sel.today::after{background:#fff}

.seg{display:flex;gap:5px;background:rgba(17,20,28,.05);padding:4px;border-radius:13px}
.seg button{
  flex:1;padding:7px 0;border-radius:9px;font-size:11.5px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:.16s;
}
.seg button span{font-size:15px;line-height:1}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(16,20,30,.14)}
.seg button.on[data-st=done]{color:var(--done)}
.seg button.on[data-st=absent]{color:var(--absent)}

.mb-foot{display:flex;gap:10px;margin-top:16px}
.btn{
  flex:1;height:46px;border-radius:14px;font-size:14.5px;font-weight:650;
  display:grid;place-items:center;transition:.16s;cursor:pointer;
  border:1px solid transparent;
}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 10px 24px -12px rgba(76,111,255,.9)}
.btn.primary:active{transform:scale(.985)}
.btn.ghost{background:var(--surface-2);color:var(--ink2);border-color:var(--line2)}
.btn.ghost:hover{background:var(--surface)}
.btn.danger{color:var(--absent);background:rgba(244,63,94,.08);border-color:rgba(244,63,94,.28);flex:0 0 96px}
.btn.danger:hover{background:rgba(244,63,94,.16)}
/* 删除按钮的「待确认」态：点第一下变成红色实心，再点一次才真删 */
.btn.danger.armed{
  background:var(--absent); color:#fff; font-weight:650;
  flex:0 0 auto; padding:0 14px;
  box-shadow:0 6px 16px -6px rgba(244,63,94,.6);
}
.btn.file{position:relative;overflow:hidden;cursor:pointer}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.btn:disabled{opacity:.4;pointer-events:none}
.bg-pick{display:flex;gap:10px}
.bg-pick .btn{height:42px;font-size:13px;padding:0 8px}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
.about{
  margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--ink-soft);text-align:center;line-height:1.6;
}
.about b{color:var(--muted);font-weight:600}
/* 关于里的邮箱链接：保持低调，但点一下就能写信 */
.about a{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--line);}
.about a:hover{border-bottom-style:solid}

@media (min-width:960px){
  .mb-panel{
    left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);
    width:520px;border-radius:20px;max-height:86vh;animation:pop .2s ease;
    box-shadow:0 30px 80px -24px rgba(16,20,30,.55);
  }
  @keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}
}

/* ==========================================================================
   8. v0.2 增量样式
   —— 8.1 更宽松的标题区  8.2 重复日程标识  8.3 纪念日
   —— 8.4 重复规则表单      8.5 数据导入导出
   ========================================================================== */

/* ---- 8.1 表格卡片：抬高每小时行高 + 加大标题区上下留白 ---- */
:root{ --hourH:52px; }
@media (max-width:959px){ :root{ --hourH:56px; } }

.ev{padding:8px 9px 9px 10px;border-radius:10px}
.ev-t{font-size:13px;line-height:1.36;letter-spacing:-.15px;-webkit-line-clamp:3}
.ev-hm{margin-top:4px;font-size:10.5px}

@media (max-width:959px){
  .ev{padding:7px 5px 7px 6px;border-radius:8px}
  .ev-t{font-size:10.5px;line-height:1.32;letter-spacing:0}
  .ev-hm{margin-top:2px}
}

/* 30~45 分钟这类很矮的卡片：收紧内边距、只留标题，尽量让中文标题完整显示 */
.ev.is-mini{padding:2px 3px 3px 5px}
.ev.is-mini .ev-t{
  -webkit-line-clamp:1;font-size:9px;line-height:1.32;letter-spacing:-.2px;padding-right:0;
}
.ev.is-mini .ev-hm{display:none}
/* 矮卡片把角标挪到右下角，标题独占第一行，互不遮挡 */
.ev.is-mini .ev-badge{
  top:auto; bottom:0; right:0;
  width:10px;height:10px;font-size:6.5px;
  border-radius:8px 0 8px 0;
}

@media (max-width:959px){
  .ev-t{padding-right:8px}
  .ev.is-mini .ev-t{font-size:9px;letter-spacing:-.3px}
}

/* ---- 8.2 重复日程的 ↻ 标识 ---- */
.ev-rep{
  position:absolute;right:4px;bottom:3px;
  font-size:9.5px;line-height:1;opacity:.42;letter-spacing:0;pointer-events:none;
}
/* ---- 拖动已有日程：原位半透明占位 + 跟随手指的浮起卡片 ---- */
.ev-source{
  opacity:.3; filter:grayscale(.4); box-shadow:none;
  transition:opacity .18s ease;
}
.move-ghost{
  position:fixed; z-index:150; pointer-events:none;
  padding:4px 6px; border-radius:8px; overflow:hidden;
  background:hsl(var(--h) 62% 92%);
  border-left:3px solid hsl(var(--h) 58% 55%);
  box-shadow:0 16px 32px -14px rgba(16,20,30,.55);
  transition:transform .2s cubic-bezier(.22,.9,.3,1), opacity .2s ease;
  will-change:transform;
}
.move-ghost b{
  display:block;font-size:10px;font-weight:650;line-height:1.25;
  color:hsl(var(--h) 32% 30%);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.move-ghost span{
  display:block;font-size:8px;color:hsl(var(--h) 22% 45%);
  font-variant-numeric:tabular-nums;
}
.move-ghost.snap-back{opacity:0;transform:translate(0,0) scale(1)}
.move-tip{
  position:fixed;left:0;top:0;z-index:151;pointer-events:none;
  padding:4px 9px;border-radius:8px;
  font-size:11px;font-weight:650;color:#fff;white-space:nowrap;
  background:rgba(20,24,34,.9);
  box-shadow:0 8px 20px -10px rgba(0,0,0,.6);
}
.move-tip.is-bad{background:rgba(244,63,94,.92)}
/* 落点预览：拖到哪儿会落下，翻页后也看得到自己还捏着东西 */
.move-slot{
  position:absolute;left:2px;right:2px;z-index:2;pointer-events:none;
  border-radius:8px;display:grid;place-items:center;
  border:1.5px dashed var(--accent);
  background:rgba(76,111,255,.10);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
}
.move-slot span{
  font-size:9px;font-weight:700;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:.2px;
}
body.is-moving{cursor:grabbing;-webkit-user-select:none;user-select:none}
body.is-moving .ev{transition:none}

/* 提醒标记：状态角标（左上）右边一颗小铃铛 / 闹钟 */
.ev-rm{
  position:absolute;left:16px;top:2px;
  font-size:8.5px;line-height:1;opacity:.8;pointer-events:none;
}
.ev.is-mini .ev-rm{left:13px;top:1px;font-size:7px}
@media (max-width:959px){ .ev-rm{left:14px;top:1px;font-size:7px} }

/* 跨夜日程（结束早于开始，如 23:30–01:30）：卡片画到表底，底部标「次日」 */
.ev.is-cross{border-bottom-left-radius:0;border-bottom-right-radius:0}
.ev.is-cross::after{
  content:"↓ 次日";
  position:absolute;left:4px;bottom:1px;
  font-size:7.5px;letter-spacing:.2px;opacity:.62;pointer-events:none;
}
@media (max-width:959px){ .ev.is-cross::after{font-size:6.5px;left:2px} }

/* 重要项目标记：右上角一颗小星，跟状态角标（左上）不打架 */
.ev-imp{
  position:absolute;right:4px;top:3px;
  font-size:10px;line-height:1;pointer-events:none;
  color:hsl(var(--h) 62% 42%);
}
.ev.is-mini .ev-imp{right:3px;top:2px;font-size:8px}
html.dark .ev-imp{color:hsl(var(--h) 70% 72%)}
.ev.has-img .ev-imp{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
@media (max-width:959px){ .ev-rep{right:2px;bottom:1px;font-size:7.5px} }
/* 矮卡片的角标在右下角，重复标识改放左下角避让 */
.ev.is-mini .ev-rep{right:auto;left:5px;bottom:0;font-size:8px}

/* ---- 8.3 纪念日 ---- */
#annivBar{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
#annivBar:empty{display:none;margin-bottom:0}
.anniv-bar{
  display:flex;align-items:center;gap:11px;
  padding:13px 15px;border-radius:16px;
  background:linear-gradient(115deg,rgba(255,122,89,.17),rgba(255,154,89,.10) 45%,rgba(124,92,255,.12));
  border:1px solid rgba(255,110,80,.26);
  animation:fadeIn .3s ease;
}
/* 明天的预告：换成偏冷的蓝紫，和「就是今天」区分开 */
.anniv-bar.is-next{
  background:linear-gradient(115deg,rgba(124,92,255,.15),rgba(96,120,255,.09) 55%,rgba(76,111,255,.07));
  border-color:rgba(124,92,255,.24);
}
.anniv-bar.is-next .tx b{color:#463A85}
.anniv-bar.is-next .tx span{color:#6E64A8}
.anniv-bar.is-next .tag{background:#7C5CFF}
.anniv-bar .ico{
  width:36px;height:36px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;
  font-size:19px;background:var(--surface);box-shadow:0 2px 8px -3px rgba(200,90,50,.4);
}
.anniv-bar .tx{flex:1;min-width:0}
.anniv-bar .tx b{display:block;font-size:13.5px;font-weight:750;color:#8A3A1E;letter-spacing:-.1px}
.anniv-bar .tx span{font-size:11.5px;color:#A4664C}
.anniv-bar .tag{
  font-size:10px;font-weight:700;color:#fff;background:#FF7A59;
  padding:4px 8px;border-radius:99px;letter-spacing:.3px;flex:0 0 auto;
}

.anniv-list{display:flex;flex-direction:column;gap:8px}
/* 主页最底部的署名：字号小、颜色淡，不抢内容，但信息一直在 */
.home-foot{
  -webkit-appearance:none;appearance:none;
  display:block;width:100%;margin:18px 0 2px;padding:6px 0;
  border:0;background:none;cursor:pointer;
  font:inherit;font-size:10.5px;line-height:1.5;text-align:center;
  color:var(--muted);opacity:.58;
}
.home-foot:hover{opacity:.9}
html.dark .home-foot{opacity:.5}

/* ---- 8.3.4 首次启动引导：遮罩挖洞 + 一句话说明 ---- */
.guide-root{position:fixed;inset:0;z-index:210}
.guide-root[hidden]{display:none}
.guide-hole{
  position:fixed;border-radius:16px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(6,8,14,.66);
  outline:1.5px solid rgba(255,255,255,.55);outline-offset:2px;
  transition:top .26s cubic-bezier(.22,.9,.3,1),left .26s cubic-bezier(.22,.9,.3,1),
             width .26s cubic-bezier(.22,.9,.3,1),height .26s cubic-bezier(.22,.9,.3,1);
}
.guide-tip{
  position:fixed;left:14px;right:14px;max-width:420px;margin:0 auto;z-index:2;
  padding:14px 16px 12px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:0 22px 54px -20px rgba(0,0,0,.7);
  transition:top .26s cubic-bezier(.22,.9,.3,1);
}
.guide-tip b{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.guide-tip p{margin:6px 0 11px;font-size:12.5px;line-height:1.6;color:var(--ink2)}
.gt-acts{display:flex;align-items:center;gap:9px}
.gt-acts button{
  height:34px;padding:0 14px;border-radius:11px;font-size:12.5px;font-weight:650;
}
.gt-skip{color:var(--muted);border:1px solid var(--line2);background:transparent}
.gt-next{
  margin-left:auto;color:#fff;border:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 20px -10px rgba(76,111,255,.9);
}
.gt-dots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.gt-dots i{width:5px;height:5px;border-radius:99px;background:var(--line2)}
.gt-dots i.on{background:var(--accent);width:14px}

/* ==========================================================================
   8.3.6 开场层：加载时的一句话（逐字浮现 + 极光 + 微粒）
   ========================================================================== */
.boot-splash{
  position:fixed;inset:0;z-index:9998;overflow:hidden;
  display:grid;place-items:center;
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(76,111,255,.16), transparent 62%),
    radial-gradient(100% 80% at 50% 100%, rgba(124,92,255,.14), transparent 60%),
    linear-gradient(168deg,#F3F5FC 0%,#F8F9FD 46%,#EDF1FA 100%);
  transition:opacity .58s cubic-bezier(.4,0,.2,1),
             transform .58s cubic-bezier(.4,0,.2,1),
             filter .58s ease;
}
html.dark .boot-splash{
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(76,111,255,.26), transparent 62%),
    radial-gradient(100% 80% at 50% 100%, rgba(124,92,255,.22), transparent 60%),
    linear-gradient(168deg,#0B0E15 0%,#10141D 46%,#0A0D14 100%);
}
.boot-splash[hidden]{display:none}

/* 收场：整层轻微放大 + 虚化淡出，像镜头推走 */
.boot-splash.is-out{
  opacity:0;transform:scale(1.06);filter:blur(8px);pointer-events:none;
}

/* 极光：三团色斑缓慢漂移，纯 CSS，不占主线程 */
.bs-aurora{position:absolute;inset:-18%;pointer-events:none;filter:blur(48px);opacity:.85}
.bs-aurora i{
  position:absolute;display:block;border-radius:50%;mix-blend-mode:screen;
  will-change:transform;
}
.bs-aurora i:nth-child(1){
  width:52vmax;height:52vmax;left:-8%;top:-14%;
  background:radial-gradient(circle at 50% 50%,rgba(76,111,255,.55),transparent 66%);
  animation:bsDrift1 17s ease-in-out infinite alternate;
}
.bs-aurora i:nth-child(2){
  width:46vmax;height:46vmax;right:-12%;top:6%;
  background:radial-gradient(circle at 50% 50%,rgba(124,92,255,.45),transparent 66%);
  animation:bsDrift2 21s ease-in-out infinite alternate;
}
.bs-aurora i:nth-child(3){
  width:40vmax;height:40vmax;left:24%;bottom:-22%;
  background:radial-gradient(circle at 50% 50%,rgba(34,197,194,.34),transparent 68%);
  animation:bsDrift3 25s ease-in-out infinite alternate;
}
@keyframes bsDrift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(14%,10%,0) scale(1.16)}}
@keyframes bsDrift2{from{transform:translate3d(0,0,0) scale(1.08)}to{transform:translate3d(-16%,14%,0) scale(.92)}}
@keyframes bsDrift3{from{transform:translate3d(0,0,0) scale(.95)}to{transform:translate3d(10%,-12%,0) scale(1.2)}}

/* 微粒：canvas 画，收场时一起淡掉 */
.bs-canvas{
  position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
  transition:opacity .5s ease;
}
/* 一层极淡的噪点，避免大色块发平 */
.bs-grain{
  position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(17,20,28,.055) 1px,transparent 1px);
  background-size:3px 3px;
}
html.dark .bs-grain{background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px)}

.bs-stage{
  position:relative;z-index:2;
  width:min(760px,86vw);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:26px;
}

/* 品牌行 */
.bs-brand{display:flex;align-items:center;gap:9px;animation:bsFade .7s .05s both}
.bs-leaf{
  width:34px;height:34px;border-radius:10px;overflow:hidden;flex:0 0 auto;
  box-shadow:0 8px 20px -8px rgba(76,111,255,.6);
}
.bs-leaf img{width:100%;height:100%;object-fit:cover;display:block}
.bs-name{font-size:15px;font-weight:750;letter-spacing:2px;color:var(--ink)}
.bs-sub{font-size:11px;color:var(--muted);letter-spacing:1.6px}

/* 语录本体 */
.bs-quote-wrap{position:relative;display:flex;align-items:flex-start;justify-content:center;gap:6px}
.bs-quo{
  font-family:Georgia,"Times New Roman",serif;line-height:1;
  font-size:clamp(34px,7vw,64px);color:rgba(76,111,255,.22);
  animation:bsFade .8s .15s both;user-select:none;
}
.bs-quo-l{align-self:flex-start;margin-top:.1em}
.bs-quo-r{align-self:flex-end;margin-bottom:-.15em}
.bs-quote{
  margin:0;max-width:min(620px,74vw);
  font-size:clamp(21px,4.4vw,36px);line-height:1.62;font-weight:600;
  letter-spacing:1.2px;color:var(--ink);
  text-wrap:balance;
}
/* 逐字：每个字一个 span，错峰浮现 + 上移 + 去虚化 */
.bs-quote .ch{
  display:inline-block;white-space:pre;
  animation:bsChar .62s cubic-bezier(.22,.9,.28,1) both;
}
@keyframes bsChar{
  from{opacity:0;transform:translate3d(0,.42em,0) scale(.94);filter:blur(6px)}
  to{opacity:1;transform:none;filter:blur(0)}
}
/* 末尾光标，打字机感 */
.bs-caret{
  display:inline-block;width:.055em;height:1.02em;vertical-align:-.16em;
  margin-left:.12em;background:var(--accent);border-radius:1px;
  animation:bsBlink .9s steps(1,end) 1.1s infinite;
}
@keyframes bsBlink{0%,49%{opacity:1}50%,100%{opacity:0}}

.bs-meta{
  display:flex;align-items:center;gap:9px;
  font-size:11.5px;color:var(--muted);letter-spacing:1px;
  animation:bsFade .7s .5s both;
}
.bs-dot{width:3px;height:3px;border-radius:50%;background:var(--ink-soft)}

/* 进度条：CSS 动画先跑到 88%，JS 收场时补满 */
.bs-bar{
  width:min(220px,52vw);height:3px;border-radius:99px;overflow:hidden;
  background:rgba(17,20,28,.09);animation:bsFade .7s .6s both;
}
html.dark .bs-bar{background:rgba(255,255,255,.12)}
.bs-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  animation:bsBar 1.5s cubic-bezier(.3,.7,.4,1) forwards;
}
@keyframes bsBar{from{width:0}to{width:88%}}
.boot-splash.is-out .bs-bar i{transition:width .3s ease;width:100%}

@keyframes bsFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 开场结束的接力：主页语录卡轻轻亮一下，视线自然接过去 */
@keyframes bsHandoff{
  0%{box-shadow:var(--shadow)}
  35%{box-shadow:0 0 0 3px rgba(76,111,255,.35),0 18px 40px -18px rgba(76,111,255,.7)}
  100%{box-shadow:var(--shadow)}
}
.quote-card.bs-handoff{animation:bsHandoff 1.1s ease}

/* 系统开了「减弱动效」：不逐字、不漂移，直接给一句 */
@media (prefers-reduced-motion:reduce){
  .bs-aurora,.bs-canvas{display:none}
  .bs-quote .ch{animation:none;opacity:1;transform:none;filter:none}
  .bs-caret{animation:none}
  .bs-bar i{animation:none;width:88%}
  .boot-splash.is-out{transition:opacity .2s ease;transform:none;filter:none}
}

/* ---- 8.3.5 闹钟响铃层 ---- */
.alarm-root{
  position:fixed; inset:0; z-index:200;
  display:grid; place-items:center;
  background:rgba(8,10,16,.62);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  animation:fade .18s ease;
}
.alarm-root[hidden]{display:none}
.alarm-card{
  width:min(340px,86vw); padding:26px 22px 18px; border-radius:24px;
  background:var(--surface); border:1px solid var(--line);
  box-shadow:0 30px 80px -24px rgba(0,0,0,.7);
  text-align:center; animation:pop .22s ease;
}
.alarm-card .al-ico{font-size:38px;line-height:1;display:block;margin-bottom:10px}
.alarm-card .al-t{font-size:18px;font-weight:750;color:var(--ink);letter-spacing:-.2px}
.alarm-card .al-m{margin-top:6px;font-size:12.5px;color:var(--muted)}
.alarm-card .al-acts{display:flex;gap:9px;margin-top:18px}
.alarm-card .al-acts .btn{height:42px;font-size:13.5px}
.alarm-card .al-cd{margin-top:10px;font-size:10.5px;color:var(--ink-soft)}
/* 设置里「本功能不适用当前平台」的角标 */
.plat-note{
  font-size:10.5px;font-weight:600;color:var(--muted);
  padding:3px 8px;border-radius:7px;background:var(--surface-soft);border:1px solid var(--line);
}

/* ---- 8.4 数据概览：完成率 + 时间分配 ---- */
.stat-card{
  border-radius:16px;padding:14px 14px 12px;
  background:rgba(var(--card-rgb),var(--card-a,.78));border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:var(--shadow);
}
.st-sec + .st-sec{margin-top:13px;padding-top:13px;border-top:1px dashed var(--line)}
.st-sec[data-toggle]{cursor:pointer}
.st-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.st-row span{font-size:12px;color:var(--ink2);font-weight:600}
.st-row b{font-size:15px;color:var(--ink)}
.st-row .st-sub{font-size:11px;font-weight:400;color:var(--muted)}
.st-bar{
  height:8px;border-radius:5px;background:var(--track);
  overflow:hidden;display:flex;
}
.st-bar i{display:block;height:100%;border-radius:5px;background:var(--done);transition:width .3s ease}
.st-bar.stack i{border-radius:0}
.st-bar.stack i:first-child{border-radius:5px 0 0 5px}
.st-bar.stack i:last-child{border-radius:0 5px 5px 0}
.st-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.st-legend button{
  -webkit-appearance:none;appearance:none;
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--line);background:var(--surface-soft);color:var(--ink2);
  font:inherit;font-size:11px;padding:4px 9px;border-radius:20px;cursor:pointer;
}
.st-legend button i{width:8px;height:8px;border-radius:3px;background:hsl(var(--th) 62% 58%)}
.st-legend button:hover{border-color:hsl(var(--th) 50% 60%)}
.st-note{margin-top:8px;font-size:11px;line-height:1.5;color:var(--muted)}
.st-note.warn{color:#B4720F}
html.dark .st-note.warn{color:#F0B95A}
/* 明细列表 */
.st-detail{margin-top:4px}
.st-detail:not(.has){display:none}
.st-d-head{font-size:11px;font-weight:650;color:var(--ink2);margin:10px 0 7px}
.st-d-row{
  display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:5px;
  border-radius:10px;background:var(--surface-soft);border-left:3px solid hsl(var(--th) 55% 62%);
  font-size:11.5px;
}
.st-d-row .d{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums}
.st-d-row .t{flex:1;min-width:0;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.st-d-row .h{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums}
.st-d-row .ok{
  -webkit-appearance:none;appearance:none;flex:0 0 auto;
  width:24px;height:24px;border-radius:8px;border:0;cursor:pointer;
  background:rgba(22,163,74,.14);color:var(--done);font-size:13px;line-height:1;
}
.st-d-row .ok:active{transform:scale(.92)}
.st-empty{font-size:11px;color:var(--muted);padding:6px 2px}
.anniv-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:15px;
  background:rgba(var(--card-rgb),var(--card-a,.78));border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:var(--shadow);
}
.anniv-item .ico{
  width:34px;height:34px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;
  font-size:17px;background:rgba(255,122,89,.13);
}
.anniv-item .tt{flex:1;min-width:0}
.anniv-item .tt b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anniv-item .tt span{font-size:11px;color:var(--muted)}
.anniv-item .cd{font-size:12px;font-weight:750;color:#E8663F;font-variant-numeric:tabular-nums;flex:0 0 auto}
.anniv-item .cd.now{color:#fff;background:#FF7A59;padding:4px 9px;border-radius:99px;font-size:11px}

/* 日历格子里的纪念日小图标 */
.cc-anniv{position:absolute;right:5px;bottom:4px;font-size:13px;line-height:1;opacity:.92}
@media (max-width:959px){ .cc-anniv{right:3px;bottom:3px;font-size:10px} }

/* 桌面端编辑器是并排面板而非抽屉，不需要遮罩（否则整页会被压暗） */
@media (min-width:960px){ #noteScrim{display:none !important} }

/* ---- 8.4 重复规则表单 ---- */
.rep-box{
  display:flex;flex-direction:column;gap:10px;
  padding:12px;border-radius:14px;
  background:rgba(76,111,255,.05);border:1px solid rgba(76,111,255,.14);
}
.rep-seg{display:flex;gap:5px;flex-wrap:wrap;padding-bottom:1px}
.rep-seg button{
  flex:1 1 auto;height:31px;padding:0 8px;border-radius:9px;font-size:11.5px;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink2);
  white-space:nowrap;transition:.15s;
}
.rep-seg button.on{background:var(--accent);border-color:transparent;color:#fff;font-weight:650}
.wd-pick{display:flex;gap:5px;flex-wrap:wrap}
.wd-pick button{
  width:34px;height:32px;border-radius:9px;font-size:12px;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink2);transition:.15s;
}
.wd-pick button.on{background:var(--accent);border-color:transparent;color:#fff;font-weight:700}
.rep-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.rep-row input[type=date]{
  flex:1;height:32px;border-radius:9px;border:1px solid var(--line2);
  background:var(--surface);padding:0 9px;font-size:12px;color:var(--ink);outline:none;
}
/* 清理设置的自定义天数 */
.rep-row input[type=number]{
  width:88px;height:32px;border-radius:9px;border:1px solid var(--line2);
  background:var(--surface);padding:0 9px;font-size:12px;color:var(--ink);outline:none;
  font-variant-numeric:tabular-nums;
}
.rep-row input[type=number]:focus{border-color:rgba(76,111,255,.45)}
/* 重复区的一句话说明：说清「选了会怎样」，免得规则看着没头没尾 */
.rep-why{
  margin:0 0 8px;font-size:10.5px;line-height:1.6;color:var(--muted);
}
.rep-preview{font-size:11px;color:var(--accent);line-height:1.5}
.rep-preview.hide{display:none}

/* 编辑既有重复日程时的分组信息 */
.grp-row{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:13px;margin-bottom:12px;
  background:rgba(76,111,255,.07);border:1px solid rgba(76,111,255,.16);
  font-size:12px;color:var(--ink2);
}
.grp-row .ic{
  width:28px;height:28px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  background:var(--surface);color:var(--accent);font-size:14px;
}
.grp-row .tx{flex:1;min-width:0;line-height:1.45}
.grp-row .tx b{font-weight:700}
.grp-row button{
  flex:0 0 auto;height:30px;padding:0 11px;border-radius:9px;font-size:11.5px;
  color:var(--absent);background:rgba(244,63,94,.11);white-space:nowrap;
}
.grp-row button.armed{background:var(--absent);color:#fff;font-weight:650}

/* 长表单（含重复设置）滚动时，主操作按钮始终吸在底部 */
.mb-foot{
  position:sticky; bottom:-16px; z-index:3;
  margin:16px -16px -16px;
  padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(var(--card-rgb),.72),rgba(var(--card-rgb),.98) 30%);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
}

/* ---- 8.5 设置页数据区 ---- */
.data-pick{display:flex;gap:10px}
.data-pick .btn{height:42px;font-size:13px}
.about .ver{color:var(--accent);font-weight:700}

/* ---- 8.6 记事编辑器：更大的标题区 + 纪念日开关 ---- */
.ne-title{padding:11px 2px 13px;font-size:17px}
.ne-date{font-size:16px}
.ne-anniv{border-top:1px dashed var(--line2);padding-top:11px;display:flex;flex-direction:column;gap:9px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink2)}
.switch-row .lb{display:flex;align-items:center;gap:7px}
.switch-row .lb i{font-style:normal;font-size:13px;opacity:.85}
.sw{
  position:relative;width:42px;height:24px;flex:0 0 auto;border-radius:99px;
  background:rgba(17,20,28,.16);transition:background .2s;
}
.sw::after{
  content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(16,20,30,.28);transition:transform .22s cubic-bezier(.3,.9,.3,1);
}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(18px)}
.anniv-fields{display:none;flex-direction:column;gap:9px}
.anniv-fields.on{display:flex}
.anniv-fields input[type=text]{
  width:100%;height:34px;border-radius:10px;border:1px solid var(--line2);
  background:var(--surface);padding:0 10px;font-size:12.5px;outline:none;
}
.icon-pick{display:flex;gap:6px;flex-wrap:wrap}
.icon-pick button{
  width:34px;height:34px;border-radius:10px;font-size:16px;
  background:rgba(17,20,28,.045);border:1.5px solid transparent;transition:.15s;
}
.icon-pick button.on{border-color:var(--accent);background:var(--surface);transform:translateY(-1px)}

@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---- 8.7 背景裁剪器 ---- */
.cropper-root{position:fixed;inset:0;z-index:110;display:none}
.cropper-root.open{display:block}
.crop-back{
  position:absolute;inset:0;background:rgba(10,12,18,.6);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  animation:fade .2s ease;
}
.crop-panel{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(440px,92vw);max-height:94vh;overflow-y:auto;
  background:var(--surface);border-radius:22px;padding:16px;
  box-shadow:0 30px 80px -24px rgba(10,14,24,.6);
  animation:pop .2s ease;
}
.crop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.crop-head h3{font-size:16.5px;font-weight:750;letter-spacing:-.2px}

.crop-stage{
  position:relative;width:100%;height:min(46vh,380px);
  border-radius:14px;overflow:hidden;
  background:#0E1016;
  touch-action:none; user-select:none;
  cursor:crosshair;
}
.crop-stage img{
  position:absolute;left:0;top:0;width:100%;height:100%;
  object-fit:cover;pointer-events:none;
  -webkit-user-drag:none;user-select:none;
}
.crop-box{
  position:absolute;box-sizing:border-box;
  border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 9999px rgba(8,10,16,.56);
  cursor:move;touch-action:none;
}
.crop-box .grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(to right,rgba(255,255,255,.22) 0 1px,transparent 1px 33.333%),
    repeating-linear-gradient(to bottom,rgba(255,255,255,.22) 0 1px,transparent 1px 33.333%);
}
.crop-box .h{
  position:absolute;width:18px;height:18px;border-radius:50%;
  background:#fff;border:2px solid #4C6FFF;
  box-shadow:0 2px 6px rgba(8,10,16,.45);
  touch-action:none;
}
.crop-box .h[data-corner=nw]{left:-9px;top:-9px;cursor:nwse-resize}
.crop-box .h[data-corner=ne]{right:-9px;top:-9px;cursor:nesw-resize}
.crop-box .h[data-corner=sw]{left:-9px;bottom:-9px;cursor:nesw-resize}
.crop-box .h[data-corner=se]{right:-9px;bottom:-9px;cursor:nwse-resize}

.crop-ratios{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.crop-ratios button{
  flex:1 1 auto;height:31px;padding:0 10px;border-radius:9px;font-size:11.5px;
  background:rgba(17,20,28,.045);border:1px solid transparent;color:var(--ink2);
  white-space:nowrap;font-variant-numeric:tabular-nums;transition:.15s;
}
.crop-ratios button.on{background:var(--accent);color:#fff;font-weight:650}
.crop-tip{font-size:10.5px;color:var(--ink-soft);margin-top:10px;line-height:1.6}

/* ---- 8.7 轻提示 ---- */#toast{
  position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,14px);
  z-index:120; padding:11px 17px; border-radius:13px;
  display:inline-flex; align-items:center; gap:10px;
  font-size:12.5px; line-height:1; color:#fff; white-space:nowrap;
  background:rgba(20,24,34,.9);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  box-shadow:0 12px 30px -10px rgba(16,20,30,.55);
  opacity:0; pointer-events:none;
  transition:opacity .24s ease, transform .24s cubic-bezier(.22,.9,.3,1);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* 提示条里的动作按钮（撤销删除等），只在传了动作时才出现 */
#toast .t-act{
  -webkit-appearance:none; appearance:none;
  border:0; margin:0; padding:5px 11px; border-radius:9px;
  font:inherit; font-size:12px; font-weight:600; color:#fff;
  background:rgba(255,255,255,.18); cursor:pointer;
}
#toast .t-act:hover{background:rgba(255,255,255,.3)}
#toast .t-act:active{transform:scale(.96)}
#toast.show{pointer-events:auto}
@media (min-width:960px){ #toast{bottom:42px} }

/* ==========================================================================
   9. 增量样式：日程背景图 / 时间块拉伸 / 语录
   ========================================================================== */

/* 表体原本用 repeating-gradient 画等高横线；现在横线按时间块逐条画在列上 */
.grid-body{background-image:none}

/* ---- 9.1 日程项背景图（未设置时完全沿用原样式） ---- */
.ev.has-img{
  background-size:cover;
  background-position:center;
  border-left-color:rgba(255,255,255,.72);
  color:#fff;
}
.ev.has-img::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,10,16,.22) 0%,rgba(8,10,16,.42) 55%,rgba(8,10,16,.66) 100%);
}
.ev.has-img .ev-t,
.ev.has-img .ev-hm,
.ev.has-img .ev-rep{position:relative;z-index:1;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.ev.has-img .ev-hm{opacity:.92}
.ev.has-img .ev-badge{z-index:2}
.ev.has-img.st-absent .ev-t{text-decoration:line-through}

/* 详情弹窗里的图片选择 */
.img-pick{display:flex;align-items:center;gap:10px}
.img-thumb{
  width:58px;height:42px;border-radius:9px;flex:0 0 auto;
  background:rgba(17,20,28,.05) center/cover no-repeat;
  border:1px solid var(--line2);
  display:grid;place-items:center;font-size:10px;color:var(--ink-soft);
}
.img-thumb.empty{background-image:none}
.img-acts{display:flex;gap:7px;flex-wrap:wrap}
.img-acts .mini-btn{height:30px}

/* ---- 9.2 时间块拉伸 ---- */
.sp-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.sp-row{
  border:1px solid var(--line);border-radius:14px;padding:11px 12px 9px;
  background:var(--surface-soft);
}
.sp-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.sp-range{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px;display:flex;align-items:center;gap:3px}
.sp-range i{font-style:normal}
.sp-range em{font-style:normal;color:var(--muted);font-weight:500;margin-left:5px;font-size:11px}
.sp-fixed{font-weight:700}

/* 可点的切点：虚线下划线 + 小铅笔，暗示「这里能改」 */
.sp-edge{
  font:inherit;font-weight:700;color:var(--accent);
  padding:0 2px;border-bottom:1px dashed rgba(76,111,255,.5);
  transition:.15s;white-space:nowrap;
}
.sp-edge::after{
  content:"";display:inline-block;width:0;height:0;
  border-left:3.5px solid transparent;border-right:3.5px solid transparent;
  border-top:4px solid currentColor;
  margin-left:4px;vertical-align:2px;opacity:.7;
}
.sp-edge:hover{background:rgba(76,111,255,.1);border-bottom-style:solid}
.sp-edge.is-open{background:rgba(76,111,255,.14);border-bottom-style:solid;border-radius:5px 5px 0 0}

/* 展开后的切点调节行 */
.sp-adj{
  display:none;align-items:center;gap:7px;margin-top:9px;
  padding:7px 9px;border-radius:10px;
  background:rgba(76,111,255,.07);
}
.sp-adj.open{display:flex}
.sp-adj-lab{font-size:10.5px;color:var(--muted);flex:0 0 auto}
.sp-adj input{flex:1;min-width:0}
.sp-adj>b{
  font-size:11.5px;font-weight:700;color:var(--accent);
  flex:0 0 auto;width:42px;text-align:right;font-variant-numeric:tabular-nums;
}
.sp-nudge{
  width:24px;height:24px;flex:0 0 auto;border-radius:7px;
  display:grid;place-items:center;font-size:13px;line-height:1;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink2);
  transition:.14s;
}
.sp-nudge:hover{background:rgba(76,111,255,.1);color:var(--accent);border-color:rgba(76,111,255,.3)}
.sp-nudge:active{transform:scale(.92)}
.sp-ops{display:flex;gap:6px}
.sp-ops button{
  height:26px;padding:0 9px;border-radius:8px;font-size:11px;
  background:rgba(17,20,28,.05);color:var(--ink2);white-space:nowrap;
}
.sp-ops button:hover{background:rgba(76,111,255,.1);color:var(--accent)}
.sp-ops button:disabled{opacity:.35;pointer-events:none}

.sp-slider{display:flex;align-items:center;gap:9px;margin-top:4px}
.sp-slider>span{font-size:11px;color:var(--muted);width:26px;flex:0 0 auto}
.sp-slider input[type=range]{flex:1;height:22px;accent-color:var(--accent)}
.sp-slider b{
  font-size:11.5px;font-weight:700;color:var(--accent);
  width:46px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums;
}
.sp-note{font-size:10.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 10px}
.sp-panel .qb-tabs{margin-bottom:12px}
.sp-panel .qb-pane>*:last-child{margin-bottom:0}
.sp-resets{display:flex;gap:8px;margin-bottom:10px}
.sp-resets .btn{flex:1;height:38px;font-size:12px;border-radius:12px;padding:0 6px}

/* 拉伸面板要能边拖边看表格，所以背景只做轻微压暗、不加模糊 */
.sp-back{background:rgba(12,15,22,.16) !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
.sp-panel{max-height:70vh !important}

/* 设置面板的章节分隔 */
.sec-line{display:flex;align-items:center;gap:10px;margin:18px 0 11px;font-size:11px;color:var(--muted);letter-spacing:.6px}
.sec-line::after{content:"";flex:1;height:1px;background:var(--line2)}
.sec-line:first-child{margin-top:0}

/* ---- 9.3 语录 ---- */
.quote-card{
  position:relative;margin-top:18px;
  /* --q-pad  倍率模式的内边距倍数（px 模式下为 0）
     --q-padpx px 模式的单边内边距（倍率模式下为 0px）
     两者相加，一套 CSS 同时支持「1000%」和「260px」两种写法 */
  --q-fs:1; --q-pad:1; --q-padpx:0px;
  padding-top:calc(15px * var(--q-pad) + var(--q-padpx));
  padding-right:16px;
  padding-bottom:calc(12px * var(--q-pad) + var(--q-padpx) * .8);
  padding-left:16px;
  border-radius:18px;overflow:hidden;
  background:rgba(var(--card-rgb),var(--card-a,.78));border:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
  box-shadow:var(--shadow);
  transition:padding-top .18s ease,padding-bottom .18s ease;
  /* 极端高度下也别被内容撑破：长串英文/链接强制换行 */
  min-width:0;
}
/* 语录背景单独一层，缩放 / 位置只作用于这一层，不影响文字布局 */
.quote-card .qbg{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background-size:cover;background-position:50% 50%;background-repeat:no-repeat;
  opacity:0;transition:opacity .25s ease;
  transform-origin:center center;
}
.quote-card.has-bg .qbg{opacity:1}
.quote-card .q-mark{
  position:absolute;left:9px;top:-4px;
  font-family:Georgia,"Times New Roman",serif;font-size:50px;line-height:1;
  color:rgba(76,111,255,.12);pointer-events:none;z-index:1;
}
.quote-card .q-text{
  position:relative;z-index:1;
  font-size:calc(13.5px * var(--q-fs));line-height:1.7;color:var(--ink2);
  letter-spacing:.2px;padding-left:16px;min-height:22px;
  overflow-wrap:anywhere;word-break:break-word;
}
.quote-card .q-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.quote-card .q-src{font-size:10.5px;color:var(--muted);letter-spacing:.4px}
.quote-card .q-act{
  font-size:11px;color:var(--accent);padding:4px 9px;border-radius:8px;
  background:rgba(76,111,255,.08);transition:.15s;
}
.quote-card .q-act:hover{background:rgba(76,111,255,.14)}
/* 宽屏改成横向一条：语录在左，来源和换一条贴在右侧，避免大片空白 */
@media (min-width:960px){
  .quote-card{
    display:flex;align-items:center;gap:18px;
    padding-top:calc(16px * var(--q-pad) + var(--q-padpx));
    padding-right:22px;
    padding-bottom:calc(13px * var(--q-pad) + var(--q-padpx) * .82);
    padding-left:22px;
  }
  .quote-card .q-text{flex:1;margin:0;font-size:calc(14.5px * var(--q-fs));padding-left:18px}
  .quote-card .q-foot{margin:0;flex:0 0 auto;gap:14px}
  .quote-card .q-mark{left:14px;top:50%;transform:translateY(-52%);font-size:56px}
}

/* ---- 高卡片（单边内边距 ≥ 120px，约 800% 以上）----
   高度拉大后内容会贴在上边缘，这里改成垂直居中 + 引号放大，
   空出来的地方留给背景图，看起来是「一张海报」而不是「一条被拉长的横线」。 */
.quote-card.is-tall{display:flex;flex-direction:column;justify-content:center}
.quote-card.is-tall .q-text{flex:0 0 auto;font-size:calc(14.5px * var(--q-fs));line-height:1.85}
.quote-card.is-tall .q-mark{font-size:clamp(64px,13vw,128px);left:4px;top:-14px}
.quote-card.is-tall .q-foot{margin-top:14px}
@media (min-width:960px){
  .quote-card.is-tall{flex-direction:row;align-items:center}
  .quote-card.is-tall .q-mark{left:10px;top:50%;transform:translateY(-52%)}
}
/* 窄屏兜底：再怎么调也只动上下内边距，横向留白不变，不会溢出屏幕 */
@media (max-width:559px){
  .quote-card{overflow-wrap:anywhere}
  .quote-card.is-tall .q-text{font-size:calc(14px * var(--q-fs))}
}

/* 设置里的语录配置 */
.q-set{display:flex;flex-direction:column;gap:9px}
.q-line{display:flex;align-items:center;gap:8px}
.q-line>span.q-lab{font-size:11px;color:var(--muted);width:32px;flex:0 0 auto}
.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.chips button{
  height:28px;padding:0 10px;border-radius:8px;font-size:11px;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink2);
  white-space:nowrap;transition:.15s;
}
.chips button.on{background:var(--accent);border-color:transparent;color:#fff;font-weight:650}

.q-manage{display:none;flex-direction:column;gap:9px;margin-top:2px}
.q-manage.on{display:flex}
.q-tabs{display:flex;gap:5px;background:rgba(17,20,28,.05);padding:3px;border-radius:10px}
.q-tabs button{flex:1;height:26px;border-radius:8px;font-size:11.5px;color:var(--muted)}
.q-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,20,30,.12);font-weight:650}
.q-list{
  max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;
  padding-right:2px;
}
.q-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--surface-soft)}
.q-txt{flex:1;min-width:0;font-size:11.5px;line-height:1.5;color:var(--ink2)}
.q-item.off .q-txt{color:#B4BAC8;text-decoration:line-through}
.q-del{width:22px;height:22px;border-radius:7px;color:var(--muted);font-size:14px;line-height:1;flex:0 0 auto}
.q-del:hover{background:rgba(244,63,94,.12);color:var(--absent)}
.q-empty{font-size:11.5px;color:var(--muted);padding:14px 0;text-align:center}
.q-add{display:flex;gap:7px}
.q-add input{
  flex:1;height:32px;border-radius:9px;border:1px solid var(--line2);
  background:var(--surface);padding:0 10px;font-size:12px;outline:none;
}
.q-add button{
  height:32px;padding:0 12px;border-radius:9px;font-size:12px;
  background:var(--accent);color:#fff;white-space:nowrap;
}
/* 小号开关，用在语录列表里 */
.sw.sm{width:34px;height:20px}
.sw.sm::after{width:14px;height:14px;top:3px;left:3px}
.sw.sm.on::after{transform:translateX(14px)}

/* ==========================================================================
   10. 增量：悬浮按钮避让 / 语录背景图 / 语录字体
   ========================================================================== */

/* ---- 10.1 让最后一块内容能滚出悬浮按钮 ---- */
/* 底部留白 = 按钮下边距 + 按钮高度 + 一点呼吸空间，滚到底时不会被压住 */
:root{ --fab-bottom:84px; --fab-size:52px; --fab-space:150px; }
@media (min-width:960px){ :root{ --fab-bottom:30px; --fab-size:56px; --fab-space:118px; } }

#view-home.active,
#view-notes.active{ padding-bottom:var(--fab-space); }
#gridWrap::after{ height:var(--fab-space); }

/* ---- 10.2 语录卡片：随机背景图 ---- */
.quote-card.has-bg{
  border-color:rgba(255,255,255,.16);
  background:rgba(255,255,255,.10);
}
.quote-card.has-bg::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(8,10,16,.34) 0%,rgba(8,10,16,.52) 100%);
}
.quote-card.has-bg .q-text{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);z-index:1}
.quote-card.has-bg .q-src{color:rgba(255,255,255,.8);z-index:1}
.quote-card.has-bg .q-act{color:#fff;background:rgba(255,255,255,.18);z-index:1}
.quote-card.has-bg .q-act:hover{background:rgba(255,255,255,.3)}
.quote-card.has-bg .q-mark{color:rgba(255,255,255,.22);z-index:1}
.quote-card.has-bg .q-foot{position:relative;z-index:1}

/* ---- 10.3 设置：语录库 / 图片库 / 字体 三个页签 ---- */
.qb-tabs{display:flex;gap:5px;background:rgba(17,20,28,.05);padding:3px;border-radius:10px}
.qb-tabs button{flex:1;height:28px;border-radius:8px;font-size:11.5px;color:var(--muted);transition:.15s}
.qb-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,20,30,.12);font-weight:650}
.qb-pane{display:none;flex-direction:column;gap:9px}
.qb-pane.on{display:flex}

/* 图片库 */
.qb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.qb-cell{
  position:relative;padding-top:62%;border-radius:10px;overflow:hidden;
  background:rgba(17,20,28,.05) center/cover no-repeat;
  border:1.5px solid transparent;cursor:pointer;
}
.qb-cell.on{border-color:var(--accent)}
.qb-cell .mask{
  position:absolute;inset:0;display:none;place-items:center;
  background:rgba(8,10,16,.5);color:#fff;font-size:10px;letter-spacing:.5px;
}
.qb-cell:not(.on) .mask{display:grid}
.qb-cell .del{
  position:absolute;right:2px;top:2px;width:20px;height:20px;border-radius:7px;
  background:rgba(8,10,16,.55);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center;
}
.qb-cell .del:hover{background:rgba(244,63,94,.9)}
.qb-add{
  height:64px;border-radius:10px;border:1px dashed var(--line2);
  display:grid;place-items:center;font-size:11.5px;color:var(--muted);
  background:var(--surface-soft);cursor:pointer;transition:.15s;
}
.qb-add:hover{border-color:var(--accent);color:var(--accent)}
.qb-empty{
  padding:18px 10px;text-align:center;font-size:11.5px;color:var(--muted);
  border:1px dashed var(--line2);border-radius:10px;line-height:1.7;
}

/* 背景效果实时预览 */
.bg-preview{
  position:relative;height:116px;border-radius:12px;overflow:hidden;
  max-width:100%;
  border:1px solid var(--line2);
  background:linear-gradient(160deg,#EAEEF8,#F6F7FB 45%,#EDF0F7);
}
.bg-prev-img{
  position:absolute;inset:-12%;
  background-size:cover;background-position:50% 50%;background-repeat:no-repeat;
  opacity:0;
}
.bg-prev-veil{
  position:absolute;inset:0;opacity:0;transition:opacity .18s;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.58) 45%,rgba(255,255,255,.80));
}
.bg-prev-ui{
  position:absolute;left:12px;right:12px;bottom:11px;
  display:flex;gap:7px;opacity:0;transition:opacity .18s;
}
.bg-prev-ui i{
  flex:1;height:24px;border-radius:7px;
  background:rgba(var(--card-rgb),.85);box-shadow:0 1px 3px rgba(16,20,30,.05);
}
.bg-prev-tag{
  position:absolute;right:9px;top:9px;
  font-size:9.5px;letter-spacing:.4px;color:var(--muted);
  padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;transition:opacity .18s;
}
.bg-prev-empty{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:11.5px;color:var(--ink-soft);letter-spacing:.3px;
}
.bg-preview.has-img .bg-prev-veil,
.bg-preview.has-img .bg-prev-tag{opacity:1}
.bg-preview.has-img .bg-prev-ui{opacity:.9}
.bg-preview.has-img .bg-prev-empty{display:none}
/* 宽屏面板更宽，预览给高一点，纵向信息多露一些 */
@media (min-width:960px){ .bg-preview{height:142px} }

/* 字体 */
.fn-group{font-size:10.5px;color:var(--muted);margin:2px 0 -2px;letter-spacing:.4px}
.fn-list{display:flex;flex-direction:column;gap:6px}
.fn-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;
  background:var(--surface-soft);border:1px solid transparent;cursor:pointer;transition:.15s;
}
.fn-item:hover{background:var(--surface-2)}
.fn-item.on{border-color:var(--accent);background:var(--surface)}
.fn-name{flex:1;min-width:0;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn-tag{font-size:9.5px;color:var(--muted);flex:0 0 auto;padding:1px 5px;border-radius:5px;background:rgba(17,20,28,.06)}
.fn-del{width:20px;height:20px;border-radius:6px;color:var(--muted);font-size:13px;flex:0 0 auto}
.fn-del:hover{background:rgba(244,63,94,.12);color:var(--absent)}

/* ==========================================================================
   14. 表格页：按住拖拽划出时间范围
   ========================================================================== */
.drag-ghost{
  position:absolute; left:2px; right:2px; z-index:6;
  border-radius:8px;
  border:1.5px dashed rgba(76,111,255,.55);
  background:rgba(76,111,255,.13);
  color:var(--accent);
  font-size:11px; font-weight:700; line-height:1;
  display:flex; align-items:flex-start; justify-content:center;
  padding-top:5px;
  pointer-events:none;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.2px;
}
body.is-dragging, body.is-dragging .gcol, body.is-dragging .ev{cursor:ns-resize}

/* ==========================================================================
   13. 新建日程：粘贴通知自动识别
   ========================================================================== */
.paste-box{
  margin:2px 0 14px;border-radius:13px;overflow:hidden;
  background:rgba(76,111,255,.05);
  border:1px solid rgba(76,111,255,.16);
}
.paste-box>summary{
  display:flex;align-items:center;gap:7px;
  padding:10px 12px;font-size:12px;font-weight:650;color:var(--accent);
  cursor:pointer;list-style:none;user-select:none;
}
.paste-box>summary::-webkit-details-marker{display:none}
.paste-box>summary::before{
  content:"";width:0;height:0;flex:0 0 auto;
  border-left:4px solid currentColor;
  border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
  transition:transform .18s ease;
}
.paste-box[open]>summary::before{transform:rotate(90deg)}
.paste-box>summary i{
  font-style:normal;font-size:9.5px;font-weight:500;
  color:var(--muted);margin-left:auto;letter-spacing:.2px;
}
.paste-inner{padding:0 12px 12px}
.paste-inner textarea{
  width:100%;min-height:86px;resize:vertical;
  padding:9px 10px;border-radius:10px;
  border:1px solid var(--line2);background:var(--surface);
  font-size:12.5px;line-height:1.55;color:var(--ink);
  font-family:inherit;
}
.paste-inner textarea::placeholder{color:var(--ink-soft)}
.paste-inner textarea:focus{
  outline:none;border-color:rgba(76,111,255,.45);
  box-shadow:0 0 0 3px rgba(76,111,255,.1);
}
/* 课表图片识别入口 / 进度 */
.ocr-pick{display:flex;gap:9px;align-items:flex-start;margin-top:9px}
.ocr-pick .mini-btn{flex:0 0 auto}
.ocr-pick>span{flex:1;font-size:10.5px;line-height:1.5;color:var(--muted)}
.ocr-prog{
  margin-top:8px;padding:7px 10px;border-radius:9px;
  background:rgba(76,111,255,.08);font-size:11px;color:var(--accent);
}
.ocr-prog.hide{display:none}
/* 识别结果预览（弹窗内的可编辑列表） */
.ocr-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ocr-item{border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--surface-soft)}
.ocr-item .oi-head{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.ocr-item .oi-head label{font-size:11.5px;font-weight:650;color:var(--ink2);display:flex;gap:6px;align-items:center;cursor:pointer}
.ocr-item .oi-head .miss-tag{margin-left:auto;font-size:9.5px;color:#B4720F}
html.dark .ocr-item .oi-head .miss-tag{color:#F0B95A}
.ocr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ocr-grid .f{display:flex;flex-direction:column;gap:3px}
.ocr-grid .f.wide{grid-column:1/-1}
.ocr-grid .f span{font-size:10px;color:var(--muted)}
.ocr-grid .inp{height:30px;font-size:12px;padding:0 8px}
.ocr-grid .f.miss .inp{border-color:rgba(244,63,94,.55)}
.ocr-grid .f.miss span::after{content:"（未识别，请手动补）";color:var(--absent)}
.ocr-foot{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.ocr-foot .until{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2)}
.ocr-foot .until input{flex:1;height:32px;border-radius:9px;border:1px solid var(--line2);padding:0 8px;font:inherit;font-size:12px;background:var(--surface);color:var(--ink)}

/* ==========================================================================
   12. 主页外观：主卡预览 / 卡片透明度 / 语录尺寸
   ========================================================================== */
/* 主卡与内容卡的描边分开控制 */
body.no-bd-hero .hero{border-color:transparent}
body.no-bd-card .trow,
body.no-bd-card .wk-day,
body.no-bd-card .anniv-item,
body.no-bd-card .quote-card{border-color:transparent}

/* 设置里的一行开关 */
.row-sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-sw>span{font-size:11.5px;color:var(--muted);letter-spacing:.2px}


.hero-prev{
  position:relative;height:104px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line2);
  --hp-a:1;
}
.hp-bg{
  position:absolute;inset:0;
  background-image:linear-gradient(140deg,#4C6FFF 0%,#5B5BE8 48%,#7C5CFF 100%);
  background-size:cover;background-position:50% 50%;background-repeat:no-repeat;
  opacity:var(--hp-a);transition:opacity .18s;
}
.hp-txt{position:absolute;left:13px;right:13px;bottom:12px;color:#fff;line-height:1.3;z-index:1}
.hp-txt b{display:block;font-size:17px;font-weight:800;letter-spacing:-.5px}
.hp-txt span{font-size:10.5px;opacity:.85}
.hero-prev.is-faint .hp-txt{color:var(--ink)}
.hero-prev .hp-tag{
  position:absolute;right:8px;top:8px;z-index:1;
  font-size:9px;letter-spacing:.4px;padding:3px 7px;border-radius:6px;
  color:#fff;background:rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.hero-prev.is-faint .hp-tag{color:var(--ink2);background:var(--surface-soft)}

.q-slide{display:flex;align-items:center;gap:9px}
.q-slide>span{font-size:11px;color:var(--muted);flex:0 0 auto;width:54px}
.q-slide>input{flex:1;min-width:0}
.q-slide>b{
  font-size:11px;font-weight:650;color:var(--ink2);
  flex:0 0 auto;min-width:46px;text-align:right;font-variant-numeric:tabular-nums;
}
/* 卡片高度：滑块跨度 60–1000，光拖不好精调 → 补一排常用档位 + 一个手输框 */
.q-pad-row{display:flex;flex-direction:column;gap:7px;padding-left:63px}
.q-pad-preset button{
  font-size:10.5px;padding:3px 9px;border-radius:8px;
  background:rgba(17,20,28,.05);color:var(--muted);transition:.15s;
}
html.dark .q-pad-preset button{background:rgba(255,255,255,.07)}
.q-pad-preset button:hover{color:var(--accent)}
.q-pad-preset button.on{background:var(--accent);color:#fff}
.q-pad-cust{display:flex;gap:7px;align-items:center}
.q-pad-cust input{
  flex:1;min-width:0;height:34px;border-radius:10px;padding:0 10px;
  font-size:12px;color:var(--ink2);
  background:var(--surface-2);border:1px solid var(--line);
}
.q-pad-cust input:focus{outline:none;border-color:var(--accent)}
.q-pad-cust input.bad{border-color:var(--absent);background:rgba(244,63,94,.07)}
.q-pad-cust .btn{
  flex:0 0 auto;height:34px;padding:0 13px;font-size:12px;border-radius:10px;font-weight:650;
}
@media (max-width:559px){ .q-pad-row{padding-left:0} }

/* ==========================================================================
   11. 日程草稿条：未提交的输入随时可回到
   ========================================================================== */
.draft-bar{
  position:fixed; left:10px; right:10px; z-index:53;
  bottom:calc(76px + env(safe-area-inset-bottom,0px));
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:16px;
  background:var(--surface);
  -webkit-backdrop-filter:blur(20px) saturate(1.7);
  backdrop-filter:blur(20px) saturate(1.7);
  border:1px solid var(--line);
  box-shadow:0 14px 34px -14px rgba(16,20,30,.4);
  transform:translateY(calc(100% + 20px));
  opacity:0; pointer-events:none;
  transition:transform .3s cubic-bezier(.22,.9,.3,1), opacity .2s ease;
}
.draft-bar.show{transform:none;opacity:1;pointer-events:auto}
.db-ico{
  width:30px;height:30px;flex:0 0 auto;border-radius:10px;
  display:grid;place-items:center;font-size:14px;
  background:rgba(76,111,255,.1);color:var(--accent);
}
.db-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.db-main b{
  font-size:13px;font-weight:650;letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.db-main span{
  font-size:10.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.db-go{
  flex:0 0 auto;height:30px;padding:0 12px;border-radius:9px;
  font-size:12px;font-weight:650;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.db-go:active{transform:scale(.96)}
.db-x{
  flex:0 0 auto;width:26px;height:26px;border-radius:8px;
  font-size:13px;line-height:1;color:var(--muted);transition:.15s;
}
.db-x:hover{background:rgba(244,63,94,.1);color:var(--absent)}
.db-x.armed{
  width:auto;padding:0 9px;font-size:11px;
  background:var(--absent);color:#fff;
}

/* 有草稿时，按钮和内容都要让位，避免叠在一起 */
body.has-draft #fab{ bottom:calc(150px + env(safe-area-inset-bottom,0px)); }
body.has-draft #view-home.active,
body.has-draft #view-notes.active{ padding-bottom:calc(var(--fab-space) + 68px); }

@media (min-width:960px){
  .draft-bar{
    left:calc(var(--rail) + 24px); right:104px; bottom:22px;
    border-radius:14px; padding:10px 14px;
  }
  body.has-draft #fab{bottom:30px}
  body.has-draft #view-home.active,
  body.has-draft #view-notes.active{padding-bottom:calc(var(--fab-space) + 62px)}
}
/* ==========================================================================
   移动端优先：一切都按「单手 + 拇指」来量，桌面端再各退一步
   —— 触控目标 ≥48px、输入字号 ≥16px（16 以下 iOS 会自动放大整页）、
      一屏只留一个主操作（底部常驻的「保存」）
   放在样式表最后：确保能盖住前面的桌面端基础尺寸
   ========================================================================== */
@media (max-width:959px){
  .field{margin-bottom:18px}
  .field>label{font-size:12.5px;margin-bottom:8px}
  .field-row.two{gap:14px}
  .mb-head{margin-bottom:16px}
  .mb-head h3{font-size:18px}
  .icon-btn.sm{width:38px;height:38px}

  /* 16px 起步，避免 iOS 聚焦时把整页放大 */
  .inp,.mb-panel .inp{font-size:16px;padding:13px 14px;min-height:50px;border-radius:14px}
  textarea.inp{min-height:88px;line-height:1.6}
  .mb-panel .inp::placeholder{font-size:14px}

  .mb-panel .btn,.mb-foot .btn{height:52px;font-size:15.5px;border-radius:16px}
  /* 内容不满一屏时也把主操作顶到底部，别让它吊在半空 */
  .mb-panel{display:flex;flex-direction:column}
  .mb-foot{
    flex:0 0 auto;position:sticky;bottom:0;z-index:3;
    margin:auto -18px 0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--surface);box-shadow:0 -12px 26px -16px rgba(16,20,30,.45);
  }
  .mb-foot .btn.danger{flex:0 0 auto;min-width:88px}

  .dt-dlabel{height:54px;font-size:16.5px;border-radius:15px;padding:0 15px}
  .dt-cal{width:54px;height:54px;border-radius:15px}
  .dt-time .dt-step{flex:0 0 30px;height:50px;font-size:19px}
  .dt-time{gap:4px;padding:0 5px}
  .dt-tval{font-size:16px;letter-spacing:.2px}
  .dt-time.is-off{opacity:.45;pointer-events:none}

  .row-sw{min-height:50px;font-size:14.5px}
  .sw{width:50px;height:29px}
  .sw::after{width:23px;height:23px;top:3px;left:3px}
  .sw.on::after{transform:translateX(21px)}
  .chips button{min-height:42px;padding:0 15px;font-size:13.5px}
  .seg button{min-height:48px;font-size:13px}
  .more-box>summary{padding:15px 14px;font-size:13.5px}
  .more-inner{padding:2px 14px 16px}
  .mb-panel .hint{font-size:11.5px;line-height:1.6}
}

/* ==========================================================================
   99. 移动端统一设计语言（≤959px）：卡片化 · 留白 · 触控尺寸 · 三页一致
   —— 仅作用于移动端，桌面端（≥960px）保持原样，避免任何回归。
   ========================================================================== */
@media (max-width:959px){
  /* ---- 底部弹层：抓手 + 头部 + 卡片分组（脚栏/输入框字号由下方既有规则处理，勿重复覆盖） ---- */
  .mb-panel{ background:var(--bg) }
  .mb-grip{ width:40px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 14px;flex:0 0 auto }
  .mb-head{ gap:12px;margin-bottom:16px }
  .mb-head h3{ font-size:18px;font-weight:780;letter-spacing:-.3px }
  .mb-head-ph{ width:40px;flex:0 0 40px }
  .icon-btn.round{ width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink2) }
  .icon-btn.round svg{ width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round }
  .icon-btn.round:active{ transform:scale(.92);background:var(--line2) }

  /* 卡片分组：白卡浮在浅灰弹层上，告别“老旧表单”观感 */
  .fcard{ background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 15px 3px;margin-bottom:13px;
          box-shadow:0 1px 2px rgba(16,20,30,.03),0 10px 26px -18px rgba(16,20,30,.22) }
  .fcard .field:last-child{ margin-bottom:15px }
  .fcard-accent{ background:linear-gradient(180deg,rgba(76,111,255,.08),rgba(124,92,255,.05));border-color:rgba(76,111,255,.22) }

  /* 字段间距微调（输入框字号沿用下方既有的 16px，避免 iOS 聚焦时整页放大） */
  .field{ margin-bottom:14px }
  .field>label{ font-size:12px;font-weight:600;letter-spacing:.1px;margin-bottom:8px }
  .field-row.two{ gap:12px }

  /* 更多选项：改成与上方卡片一致的白色抽屉卡，消除“割裂” */
  .more-box{ background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0 0 13px }
  .more-box>summary{ background:transparent;border:0;padding:15px 15px;font-size:13.5px;font-weight:650;color:var(--ink2) }
  .more-box[open]>summary{ border-bottom:1px solid var(--line);border-radius:0 }
  .more-inner{ background:transparent;border:0;padding:4px 15px 16px }
  .more-inner .field:first-child{ margin-top:8px }

  /* 智能识别卡内的粘贴框顺手规整 */
  .fcard-accent .paste-box{ background:transparent;border:0 }
  .fcard-accent .paste-box>summary{ background:rgba(76,111,255,.10);border:1px solid rgba(76,111,255,.22);border-radius:13px;color:var(--accent);padding:13px 14px }

  /* ---- 表格页：轻提示 + 表头“+” + 事件卡现代化 ---- */
  .grid-hint{ display:flex;align-items:center;gap:8px;margin:2px 2px 12px;padding:10px 13px;border-radius:13px;
              background:rgba(76,111,255,.09);color:var(--accent);font-size:12.5px;font-weight:600;line-height:1.4 }
  .grid-hint svg{ width:16px;height:16px;flex:0 0 auto;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round }
  .gh-day{ position:relative;gap:3px }
  .gh-add{ position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:7px;display:grid;place-items:center;
           font-size:15px;line-height:1;font-weight:700;color:var(--accent);background:rgba(76,111,255,.12) }
  .gh-day:active .gh-add{ background:rgba(76,111,255,.28) }
  /* 事件卡样式沿用既有移动端微调，避免窄列下标题被挤得更厉害 */

  /* ---- 记事页：日历卡 + 编辑器抽屉 ---- */
  .cal-card{ border-radius:20px;padding:14px 12px 16px }
  .cal-cell{ border-radius:13px;border:1px solid var(--line);background:var(--surface) }
  .cal-cell.is-sel{ border-color:transparent;box-shadow:0 0 0 2px var(--accent);background:rgba(76,111,255,.08) }
  .cal-cell.is-marked{ border-color:transparent;box-shadow:inset 0 0 0 2px rgba(76,111,255,.35) }
  .cal-cell.is-today .cc-num{ color:var(--accent);font-weight:800 }
  .cal-wd{ font-size:11px;color:var(--muted);margin-bottom:6px }
  .ne-grip{ width:40px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 12px;flex:0 0 auto }
  .ne-head{ margin-bottom:14px;gap:10px }
  .ne-done{ height:40px;padding:0 20px;border-radius:13px;font-size:14px;font-weight:700 }
  .ne-title{ font-size:18px;padding:10px 2px 12px }
  .ne-body{ min-height:150px;font-size:15px;line-height:1.7 }
  .ne-tagbox{ padding-top:14px;gap:11px }
  .ne-swatches{ display:flex;gap:10px;flex-wrap:wrap;margin-top:2px }
  .ne-swatches button{ width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(16,20,30,.2) }
  .ne-swatches button:active{ transform:scale(.9) }
  .ne-empty{ padding:56px 16px;font-size:13.5px }

  /* 搜索框关闭按钮：手机上显示「取消」，字号/热区更大更易点 */
  .search-esc{ font-size:12px;padding:5px 11px }

  /* ---- 性能：移动端禁用毛玻璃。backdrop-filter 在 WebView 上很耗性能，
       滚动时背后内容每帧变化都要重算 blur，是卡顿主因 ---- */
  .tabbar{ -webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface) }
  .grid-head{ -webkit-backdrop-filter:none;backdrop-filter:none }
  .icon-btn{ -webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface) }
}

/* 桌面端不显示移动端专属的提示条与表头“+” */
@media (min-width:960px){
  .grid-hint{ display:none }
  .gh-add{ display:none }
  .mb-grip,.ne-grip{ display:none }
}
</style>

  /* --------------------------------------------------------------------------

  /**

   * @property {string} s     开始 HH:MM
   * @property {string} e     结束 HH:MM

   * @property {string} [gt]  项目组名称（取生成时的标题）

   * @property {string} icon  图标 emoji

  let state = {
    /** @type {EventItem[]} */
    events: [],
    /** @type {Object<string,{title:string,body:string}>} 日期 → 日记 */
    notes: {},
    /** @type {Object<string,string>} 日期 → #RRGGBB 颜色标记 */

     *   img       主卡背景图（dataURL，空表示用默认渐变）

  function loadState() {
    try {

      state.cols = ensureCols(obj.cols);
