<!--
  DayLeaf · 叶历 —— 表格化日程 / 记事应用（v1.0.0）

  作者名：StarLeaf·Roxy

  ============================================================================
  @file      index.html
  @brief     单文件、零依赖、可离线运行的日程 / 记事应用。包含三大视图：
             1) 主页面 Home   —— 倒计时主卡 + 今日清单 + 本周概览 + 纪念日提醒
                                （纪念日会在前一天就出现在顶部，方便提前准备）
             2) 表格页 Grid   —— 课表式时间轴（日期为列 / 时间为行），
                                纵向按「时间段」调行高、横向按「星期」调列宽
             3) 记事页 Notes  —— 月历 + 每日标题正文 + 颜色标记串联日期 + 每年纪念日
             另含个性化背景（取图 / 裁剪取景 / 缩放 / 模糊 / 透明度）、
             新建日程草稿（关闭弹窗后可随时回来接着写）、粘贴通知自动识别
             （本地规则解析，不联网）、全局搜索（Ctrl+K）、表格页按住拖拽
             划出时间范围、深色模式（浅色 / 深色 / 跟随系统）、
             数据导入导出与本地持久化。另含日程自动清理（可设保留一周 / 一个月 /
             一年 / 自定义，重要项目豁免）、重要项目标记、删除二次确认与误删撤销、
             提醒与闹钟、首次启动引导、表格事件拖拽调整、短时事务逐秒倒计时、
             加载开场（随机语录逐字浮现）与语录卡高度自定义（60%–1000% 或 px）。
  ----------------------------------------------------------------------------
  交互约定（定稿参数，实现时照此）
  · 表格事件拖拽：长按 300ms 进入拖动（位移 >8px 视为滚动并取消）；
    拖动中原位留半透明占位（.ev-source），手指上浮起 1.04× 的卡片（.move-ghost）
    并显示目标「周几 起止时间」气泡；时间吸附 15 分钟，跨列即改日期、保持时长；
    指针进入左右 52px 热区并停留 600ms 后翻页，之后每 900ms 再翻一页，翻页不打断拖动；
    松手在无效区（不在任何列上）→ 浮起卡片回弹消失、数据不变；
    短按（未达阈值）视为点击打开详情，刚拖完 400ms 内的 click 不再触发详情。
  · 闹钟：手机端专属（<960px），电脑端不显示入口也不响铃；提醒（通知）两端都有。
  · 首次启动引导：遮罩分步 5 步，每步聚焦一个区域 + 一句话说明，支持跳过，
    走完/跳过后写入 dayleaf.guide.v1，不再自动弹出；设置里可重看。
  · 短时倒计时：剩余 <2 分钟时切逐秒（「1 分 59 秒」），数字等宽；
    归零（结束）后主卡进入 is-over 收尾态（灰化 +「时间到」+「标记完成」按钮），
    5 分钟后自动恢复；跨过零点瞬间只提示一次。
  · 语录卡高度：倍率 0.6–10（60%–1000%）或 px 12–600（单边内边距），两种模式并存；
    CSS 用 --q-pad + --q-padpx 相加，读时统一 normPad() 夹区间；手输越界 → toast 提示
    并回退 100%，输入框标红；单边 ≥120px 时加 .is-tall 改居中「海报式」排版。
  · 日期时间选择（新建/编辑弹窗）：按设备切换 —— 手机端（<960px）用滚轮 sheet
    （日期三列 年/月/日，时间两列 时/分；深色底，选中项固定在顶行、字号最大最亮，
     往下逐级变小变暗；底部「确定」胶囊描边按钮 +「取消」文字）；电脑端保留原生
    date/time 输入框不动。开始与结束互相独立：± 只动自己那一端，只有显式选「时长」
    才同时改两头。微调步长（1/4/15/30 分）放在「个性化 → 时间微调」，弹窗里不摆。
  · 手机端（<960px）所有底部 sheet 一律铺满整屏：顶到屏幕最上沿、去圆角，
    上方不再留那一条点不到也没内容的空白；电脑端仍是原来的样子。
  · 表单精简（移动端优先）：新建/编辑弹窗首屏只留「标题 / 日期 / 开始–结束 / 提醒」。
    快捷日期（昨天今天明天）、时长 chips、预设时刻 chips 全部删除 —— 与滚轮、± 重复；
    其余（重复、状态、重要项目、全天、地点、备注、图片、粘贴识别）收进「更多选项」折叠。
    主操作「保存」在移动端常驻底部（sticky + margin-top:auto，内容不足一屏也贴底）。
  · 导航：FAB 在三个页面都显示，加日程不必先切回主页；主页「数据概览 / 纪念日」
    在手机上默认折叠（#homeFold），电脑端自动展开。
  · 表单主区 = 标题 / 日期 / 开始–结束 / 提醒 / 地点 / 备注；其余（全天 · 重复 · 状态 ·
    重要项目 · 图片 · 粘贴识别）收进「更多选项」。
  · 表格页不放悬浮加号：它挡格子，拖日程时还会被误判成无效区。新建走「按住空白
    拖出一条」或点表头某一天的日期。
  · 拖动日程的命中判定改成几何算（不再用 elementFromPoint）：手指底下的加号、浮起
    卡片、气泡都不再挡路 —— 以前滑过加号就被判「松手取消」。目标列实时画「落点
    预览」虚线框（翻页后也跟着走，不会看着像手上空了）；左右边缘停 600ms 翻上一周/
    下一周、之后每 900ms 再翻，翻页不中断拖拽；上下边缘自动滚表格（想放到很早或很晚
    的时刻）；只有真甩出表格（表头以上 / 底部导航栏）才回弹取消。
  · 开场层：加载时随机抽一条语录，居中逐字浮现（每字 .ch，错峰 32–46ms）+ 极光渐变
    + canvas 上浮微粒 + 进度条；只做遮罩不参与布局，内容照常渲染；点击 / Esc 可跳过；
    读完自动淡出并让主页语录卡接一次高亮（.bs-handoff），随后才排队放首次引导；
    prefers-reduced-motion 下退化为直接显示。开关：quotes.bootAnim。

  设计目标（为后续 Android / Desktop 实体实现定调）
  · 体积：单文件 ~100KB 级，无框架、无图标字体，图标全部内联 SVG。
  · 触控：最小可点区域 40px，表格单元格以 30 分钟为吸附粒度。
  · 响应式：<960px 移动端（底部 Tab + 悬浮按钮 + 底部抽屉）；
            ≥960px 桌面端（左侧导轨 + 双栏 + 居中弹窗）。
  ----------------------------------------------------------------------------
  数据模型（对应原生端的四张表，键名 dayleaf.prototype.v2）
  · events[]  { id, d, s, e, t, p, n, st, gid?, gt?, img?, imp?, rm?, al? }
             img = 该日程的背景图 dataURL（480px 内，可选）
             imp = true 表示「重要项目」，自动清理时不会被删除
             rmOn = 是否开提醒；rm = 提前分钟（0 = 到点提醒）；al = 是否同时作为闹钟
             gid = 项目组标识：一次重复插入生成的所有事件共享同一 gid，
                   用于「删除整组」；gt 为分组名称（取生成时的标题）。
  · notes{}   { 'YYYY-MM-DD': { title, body } }        每日日记
  · tags{}    { 'YYYY-MM-DD': '#RRGGBB' }              同色即同一组关联日期
  · annual{}  { 'MM-DD': { title, icon, note } }       每年重复的纪念日
  · blocks    { bounds:number[], h:number[] }
             bounds 为整点边界（相邻块共享边界），h 为每段的高度权重
  · cols      number[7]  周一到周日的列宽权重（0.6–2.0），fr 按比例分配
  · draft     null | { t,d,s,e,p,n,st,img,repRule,repWds,repUntil,savedAt }
             未提交的日程草稿，只有一个槽位；关闭新建弹窗时有内容就写入，提交后清空
  · quotes    { custom[], off{}, scope, freq, picked, bootAnim }  每日一句（bootAnim 控制开场层）
  · quoteBg   { items:[{id,name,on,s,x,y}] }           语录背景图（元数据 + 每张图的缩放/位置）
  · ui        { dtStep }                              界面偏好：时间微调步长（分钟，1–120）
  · quoteStyle { fs, pad, padMode, padPx, bgScale, bgX, bgY }  语录卡外观（padMode: mul|px）
  · quoteFont { key, custom:[{id,name}] }              语录字体（key 为内置键或字体 id）
  ── 体积较大的二进制/图片不放 localStorage，统一进 IndexedDB（库名 dayleaf-assets，
     键前缀 qb_ / font_）；IndexedDB 不可用时降级到 localStorage，再不行只留内存。
  · bg        { data, opacity, blur, scale, x, y }      个性化背景（data 由裁剪器回写）
  · clean     { on, days, lastRun }                     过期日程自动清理（重要项目豁免）
  · notify    { on, defMin, sound, fired{} }            提醒与闹钟（fired 防重复触发）

<script>
/* 首帧就把主题定下来。
   原来 dark 类是在 DOMContentLoaded 里才加的，页面会先按浅色画一帧，
   选深色的人就会看到「先浅一下、再变深」。这段同步执行，在首次绘制之前生效。 */
(function () {
  var dark = false;
  try {
    var raw = localStorage.getItem('dayleaf.prototype.v2');
    var t = raw ? (JSON.parse(raw).theme || 'light') : 'light';
    dark = t === 'dark' || (t === 'system' && window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches);
  } catch (e) { dark = false; }
  var el = document.documentElement;
  if (dark) el.classList.add('dark');
  el.style.colorScheme = dark ? 'dark' : 'light';
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', dark ? '#0E1118' : '#4C6FFF');
})();
</script>

<style>
/* ==========================================================================
   1. 设计令牌与基础样式
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}

:root{ color-scheme:light; }
html.dark{ color-scheme:dark; }

:root{
  /* 色板 */
  --bg:#ECEFF6;
  --bg-grad:linear-gradient(165deg,#EAEEF8 0%,#F6F7FB 42%,#EDF0F7 100%);
  --ink:#11141C;
  --ink2:#3A4050;
  --muted:#767E90;
  --ink-soft:#A9B0BF;
  --line:rgba(17,20,28,.08);
  --line2:rgba(17,20,28,.14);
  --card:rgba(255,255,255,.78);
  /* 内容卡底色 RGB（深色模式换成深底），透明度仍由 --card-a 控制 */
  --card-rgb:255,255,255;
  /* 主页内容卡的白色底透明度，设置里可调（见「主页外观」） */
  --card-a:.78;
  --surface:#FFFFFF;
  --surface-2:#F5F6FA;
  --surface-soft:rgba(255,255,255,.6);
  --track:rgba(17,20,28,.16);
  --overlay:rgba(12,15,22,.44);
  --accent:#4C6FFF;
  --accent2:#7C5CFF;
  --done:#16A34A;
  --absent:#F43F5E;
  --todo:#94A3B8;

  /* 阴影 / 圆角 */
  --shadow:0 1px 2px rgba(16,20,30,.04),0 12px 28px -18px rgba(16,20,30,.34);
  --shadow-lift:0 2px 6px rgba(16,20,30,.06),0 20px 44px -20px rgba(16,20,30,.34);
  --r-lg:20px; --r-md:14px; --r-sm:10px;

  /* 表格几何（JS 会读取 --hourH 做像素换算） */
  --hourH:48px;
  --gutter:44px;
  --rail:86px;
  /* 侧边栏/底栏文字与图标：大小由设置滑杆控制，颜色为空时跟随主题 */
  --nav-icon-size:21px;
  --nav-text-size:10px;
  --nav-icon-size-m:20px;
  --nav-text-size-m:10px;
}
@media (max-width:959px){
  :root{ --hourH:52px; --gutter:40px; }
}

/* ---- 深色模式（html.dark 下整体换肤） ---- */
html.dark{
  --bg:#0E1118;
  --bg-grad:linear-gradient(165deg,#0C0F15 0%,#11141C 42%,#0E1219 100%);
  --ink:#E8EBF3;
  --ink2:#B9C0D0;
  --muted:#8B93A7;
  --ink-soft:#5C6478;
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.16);
  --card:rgba(30,35,48,.72);
  --card-rgb:30,35,48;
  --surface:#1A1E2A;
  --surface-2:#232836;
  --surface-soft:rgba(26,30,42,.62);
  --track:rgba(255,255,255,.18);
  --overlay:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 28px -18px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55),0 20px 44px -20px rgba(0,0,0,.75);
  --done:#34C568;
  --absent:#FB5577;
  --todo:#64748B;
}

html,body{height:100%;margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background-color:var(--bg);
  background-image:var(--bg-grad);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* 滚动条 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(17,20,28,.16);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(17,20,28,.28)}
::-webkit-scrollbar-track{background:transparent}

/* 个性化背景层（模糊铺底 + 清晰主图 + 白色柔光罩）
   以前只有一层 cover，铺满屏幕的同时会把图片四周裁掉约一成，
   用户裁好的画面放上去就变样了。现在清晰层用 contain 完整显示，
   空出来的四周由同图放大模糊的底衬住，既不裁画面也不留空边。 */
#bgBlur{
  position:fixed; top:-6%;right:-6%;bottom:-6%;left:-6%; z-index:0; pointer-events:none;
  background-position:50% 50%; background-size:cover; background-repeat:no-repeat;
  opacity:0; filter:blur(22px) saturate(1.08);
  transition:opacity .35s ease;
  will-change:opacity;
}
#bgImage{
  position:fixed; top:0;right:0;bottom:0;left:0; z-index:0; pointer-events:none;
  background-position:50% 50%; background-size:contain; background-repeat:no-repeat;
  opacity:0; transform-origin:50% 50%;
  transition:opacity .35s ease;
  will-change:opacity,transform;
}
#bgVeil{
  position:fixed; top:0;right:0;bottom:0;left:0; z-index:0; pointer-events:none; opacity:0;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.58) 45%,rgba(255,255,255,.80));
  transition:opacity .4s ease;
}
body.has-bg #bgVeil{opacity:1}

/* ==========================================================================
   2. 布局骨架
   ========================================================================== */
#app{
  /* 注意：这里不能设置 z-index。一旦 #app 形成层叠上下文，
     内部固定定位的抽屉（z-60）就无法盖过根层级的遮罩（z-58），
     会导致打开记事时整个界面（含抽屉）被遮罩压暗。 */
  position:relative;
  height:100vh; height:100dvh;
  display:flex; flex-direction:column;
}
main{flex:1;min-height:0;position:relative}

/* ---- 视图容器 ---- */
.view{display:none}
#view-home.active,#view-notes.active{
  display:block; height:100%; overflow-y:auto; overflow-x:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 104px;
}
#view-grid.active{display:flex;flex-direction:column;height:100%;padding-top:calc(env(safe-area-inset-top,0px) + 8px)}

/* ---- 移动端底部 Tab ---- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  display:flex; gap:4px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:rgba(var(--card-rgb),var(--nav-alpha,1));
  border-top:1px solid var(--line);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:7px 0; border-radius:13px; color:var(--muted);
  font-size:var(--nav-text-size-m,10px); letter-spacing:.2px; transition:.16s;
}
.tab svg{width:var(--nav-icon-size-m,20px);height:var(--nav-icon-size-m,20px);color:var(--nav-icon,currentColor);stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);background:rgba(76,111,255,.09)}
html.nav-text-custom .tab,html.nav-text-custom .tab.on{color:var(--nav-text)}
.tab:active{transform:scale(.96)}

/* ---- 悬浮新增按钮 ---- */
#fab{
  position:fixed; right:16px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:55;
  width:52px; height:52px; border-radius:18px;
  display:none; align-items:center; justify-content:center;
  color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 12px 26px -8px rgba(76,111,255,.62),0 2px 6px rgba(16,20,30,.12);
  transition:transform .16s ease, box-shadow .16s ease;
}
#fab.show{display:flex}
#fab:active{transform:scale(.94)}
#fab svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}

/* ---- 桌面端左侧导轨 ---- */
.rail{display:none}
@media (min-width:960px){
  #app{flex-direction:row}
  .rail{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    width:var(--rail); flex:0 0 var(--rail);
    padding:22px 10px 20px;
    border-right:1px solid var(--line);
    background:rgba(var(--card-rgb),var(--nav-alpha,1));
  }
  .tabbar{display:none}
  #view-home.active,#view-notes.active{padding:30px 30px 44px}
  #view-grid.active{padding-top:18px}
  #fab{right:30px;bottom:30px;width:56px;height:56px;border-radius:20px}
}
.brand{
  width:40px;height:40px;border-radius:13px;margin-bottom:20px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 18px -8px rgba(76,111,255,.7);
  flex:0 0 auto;
}
.brand svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail-btn{
  width:100%; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:10px 0; border-radius:14px; color:var(--muted);
  font-size:var(--nav-text-size,10px); transition:.16s;
}
.rail-btn svg{width:var(--nav-icon-size,21px);height:var(--nav-icon-size,21px);color:var(--nav-icon,currentColor);stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail-btn.on{color:var(--accent);background:rgba(76,111,255,.10)}
html.nav-text-custom .rail-btn,html.nav-text-custom .rail-btn.on{color:var(--nav-text)}
.rail-btn:hover{background:rgba(17,20,28,.04)}
.rail-sp{flex:1}

/* ==========================================================================
   3. 主页面
   ========================================================================== */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.ph-sub{font-size:13px;color:var(--muted);letter-spacing:.3px;margin-bottom:3px}
.ph-title{font-size:24px;font-weight:750;letter-spacing:-.5px}
.icon-btn{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  color:var(--ink2); background:var(--card); border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  transition:.16s; flex:0 0 auto;
}
.icon-btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.sm{width:32px;height:32px;border-radius:10px}

@media (min-width:960px){
  .home-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:stretch}
  .ph-title{font-size:28px}
}

/* ---- 倒计时主卡 ---- */
.hero{
  position:relative; overflow:hidden;
  border-radius:24px; padding:22px 22px 20px; color:#fff;
  border:1px solid rgba(255,255,255,.16);
  background:transparent;
  box-shadow:0 18px 40px -20px rgba(76,88,220,.85),0 2px 8px rgba(16,20,30,.08);
  margin-bottom:20px;
  cursor:pointer;transition:transform .16s ease, box-shadow .16s ease;
}
.hero.is-empty{cursor:default}
.hero:not(.is-empty):active{transform:scale(.994)}
/* 底色单独一层：这样调不透明度时只有底色变淡，文字依然清晰 */
.hero-bg{
  position:absolute; top:0;right:0;bottom:0;left:0; z-index:0;
  background-image:linear-gradient(140deg,#4C6FFF 0%,#5B5BE8 48%,#7C5CFF 100%);
  background-size:cover; background-position:50% 50%; background-repeat:no-repeat;
  opacity:1; transition:opacity .2s ease;
}
.hero.is-empty .hero-bg{background-image:linear-gradient(140deg,#5C6478,#767E92)}
/* 光斑压在底色之上、内容之下 */
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:1;opacity:var(--hero-a,1)}
.hero::before{width:230px;height:230px;right:-70px;top:-100px;background:radial-gradient(circle,rgba(255,255,255,.30),transparent 68%)}
.hero::after{width:180px;height:180px;left:-60px;bottom:-110px;background:radial-gradient(circle,rgba(160,140,255,.55),transparent 70%)}

/* 底色很淡时改成深色字：否则白字直接消失在浅色页面上 */
.hero.is-faint{
  color:var(--ink);
  border-color:var(--line);
  box-shadow:0 12px 30px -24px rgba(40,50,120,.32),0 1px 3px rgba(16,20,30,.05);
}
.hero.is-bare{box-shadow:none}

/* 最后 2 分钟：逐秒跳动，数字等宽避免左右抖，配色转强调色 */
.hero-count.is-sec b{
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  color:#FFD9A0;
}
.hero.is-sec .hero-eyebrow .pulse{background:#FFB454;animation:pulse .9s ease-in-out infinite}
/* 归零（刚结束）：整卡灰下来，给一个「标记完成」的出口 */
.hero.is-over{filter:saturate(.25);opacity:.92}
.hero.is-over .hero-count b{color:#FFE0B2}
.hero-over{
  display:flex;align-items:center;gap:10px;margin-bottom:9px;
  font-size:11.5px;color:rgba(255,255,255,.82);
}
.hero-over span{flex:1;min-width:0;line-height:1.45}
.hero-over .ov-done{
  flex:0 0 auto;height:28px;padding:0 12px;border-radius:9px;
  font-size:11.5px;font-weight:650;color:#11141C;background:#fff;
  box-shadow:0 4px 12px -4px rgba(0,0,0,.4);
}
.hero-over .ov-done:active{transform:scale(.96)}
.hero.is-faint .hero-eyebrow{background:var(--surface-soft);border-color:var(--line2)}
.hero.is-faint .hero-count b{text-shadow:none}
.hero.is-faint .hero-ev-meta{opacity:.78}
.hero.is-faint .hero-prog .bar{background:var(--track)}
.hero.is-faint .hero-prog .bar i{background:linear-gradient(90deg,#4C6FFF,#7C5CFF)}
.hero.is-faint .hero-mark{stroke:currentColor;opacity:calc(.11 * var(--hero-a,1))}
@media (min-width:960px){ .hero{margin-bottom:0;padding:28px 28px 24px;min-height:330px;display:flex;flex-direction:column} }

.hero-eyebrow{
  position:relative;z-index:2;
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:600;letter-spacing:.4px;
  padding:5px 11px 5px 9px;border-radius:99px;
  background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.hero-eyebrow .pulse{width:6px;height:6px;border-radius:50%;background:#8CFFC0;box-shadow:0 0 0 0 rgba(140,255,192,.8);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(140,255,192,.7)}70%{box-shadow:0 0 0 8px rgba(140,255,192,0)}100%{box-shadow:0 0 0 0 rgba(140,255,192,0)}}

.hero-count{
  display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 4px;
  margin:18px 0 6px;position:relative;z-index:2;
}
.hero-count b{
  font-size:clamp(42px,11vw,60px);line-height:.92;font-weight:800;letter-spacing:-2px;
  font-variant-numeric:tabular-nums;
  text-shadow:0 6px 26px rgba(20,26,80,.28);
}
.hero-count i{font-style:normal;font-size:14px;font-weight:600;opacity:.88;margin-right:6px;transform:translateY(-6px)}
.hero-after{font-size:14px;font-weight:600;opacity:.82;transform:translateY(-6px);margin-left:2px}

.hero-ev{position:relative;z-index:2;margin-top:14px}
.hero-ev-title{font-size:19px;font-weight:700;letter-spacing:-.2px;margin-bottom:4px}
.hero-ev-meta{font-size:13px;opacity:.86;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-ev-meta .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}

.hero-foot{position:relative;z-index:2;margin-top:auto;padding-top:20px}
.hero-prog{display:flex;align-items:center;gap:10px;font-size:11.5px;opacity:.9}
.hero-prog .bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.26);overflow:hidden}
.hero-prog .bar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .5s cubic-bezier(.22,.9,.3,1)}

/* 桌面端主卡：数字在上、信息与进度贴底，撑满行高后依然稳定 */
@media (min-width:960px){
  .hero{min-height:372px}
  .hero-count b{font-size:clamp(54px,5.4vw,74px)}
  .hero-foot{padding-top:18px}
}
/* 主卡水印：一枚大号叶片，填充留白同时强化品牌识别 */
.hero-mark{
  position:absolute; right:-34px; bottom:-46px; width:230px; height:230px;
  fill:none; stroke:#fff; stroke-width:1.05; stroke-linecap:round; stroke-linejoin:round;
  opacity:calc(.11 * var(--hero-a,1)); pointer-events:none; transform:rotate(-10deg); z-index:1;
}
/* 窄屏主卡较矮：水印移到右上角，避免压住底部进度条 */
@media (max-width:959px){
  .hero-mark{right:-30px; top:-26px; bottom:auto; width:168px; height:168px; opacity:.13}
}

/* ---- 今日日程 ---- */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.sec-head h2{font-size:14px;font-weight:700;letter-spacing:.2px;color:var(--ink2)}
.sec-stat{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 主页分区标题 / 任务行文字：设置里可单独取色（背景图太花时用得上） */
#view-home.home-sec-custom .sec-head h2,
#view-home.home-sec-custom .sec-stat,
#view-home.home-sec-custom .home-fold summary span,
#view-home.home-sec-custom .home-fold summary i{color:var(--home-sec)}
#view-home.home-task-custom .t-title,
#view-home.home-task-custom .t-time b{color:var(--home-task)}
#view-home.home-task-custom .t-sub,
#view-home.home-task-custom .t-time i{color:var(--home-task);opacity:.72}

.today-list{display:flex;flex-direction:column;gap:8px}
.trow{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:16px;text-align:left;width:100%;
  background:rgba(var(--card-rgb),var(--card-a,.78));border:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  box-shadow:var(--shadow);
  transition:transform .16s ease, box-shadow .16s ease;
}
.trow:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift)}
.trow:active{transform:scale(.994)}
.t-time{display:flex;flex-direction:column;align-items:flex-end;min-width:44px;line-height:1.15}
.t-time b{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.t-time i{font-style:normal;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;border-left:3px solid hsl(var(--h) 70% 60%);padding-left:10px}
.t-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 清单 / 主卡里的「重要项目」星标 */
.t-imp{
  font-style:normal; font-size:11px; margin-right:4px;
  color:#E8A33D; vertical-align:1px;
}
html.dark .t-imp{color:#F5C56B}
.t-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-st{
  position:relative;
  width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  font-size:12px;font-weight:800;flex:0 0 auto;
  cursor:pointer;transition:transform .14s ease, background .14s ease;
}
/* 24px 的方块手指不好点，用伪元素把热区扩到 38px */
.t-st::after{content:"";position:absolute;top:-7px;right:-7px;bottom:-7px;left:-7px;border-radius:12px}
.t-st:active{transform:scale(.9)}
.st-todo .t-st{background:rgba(148,163,184,.16);color:#64748B}
.st-done .t-st{background:rgba(22,163,74,.14);color:var(--done)}
.st-absent .t-st{background:rgba(244,63,94,.13);color:var(--absent)}
.st-absent .t-title{color:var(--muted);text-decoration:line-through}
.st-done .t-title{color:var(--ink2)}
.trow.past{opacity:.84}
.trow.past .t-title{color:var(--ink2)}
.trow.past .t-time b{color:var(--ink2)}

/* ---- 本周概览 ---- */
.week-block{margin-top:22px}
.wk-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk-day{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px 9px;border-radius:14px;
  background:rgba(var(--card-rgb),var(--card-a,.78));border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.wk-day:hover{transform:translateY(-2px);background:var(--surface-2);box-shadow:var(--shadow)}
.wk-day:active{transform:scale(.97)}
.wk-wd{font-size:9.5px;color:var(--muted);letter-spacing:.2px}
.wk-dn{font-size:15px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.wk-bar{width:100%;height:3px;border-radius:99px;background:rgba(17,20,28,.07);overflow:hidden;margin-top:3px}
.wk-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.wk-day.is-today{background:linear-gradient(160deg,rgba(76,111,255,.14),rgba(124,92,255,.10));border-color:rgba(76,111,255,.3)}
.wk-day.is-today .wk-dn,.wk-day.is-today .wk-wd{color:var(--accent)}

.empty-tip{
  text-align:center;padding:34px 16px;border-radius:18px;
  border:1px dashed var(--line2);color:var(--muted);font-size:13px;
}

/* ==========================================================================
   4. 表格页
   ========================================================================== */
.gv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px 10px}
.gv-title{font-size:15px;font-weight:750;letter-spacing:-.2px}
.gv-nav{display:flex;align-items:center;gap:6px}
.gv-nav button{
  height:32px;min-width:32px;padding:0 10px;border-radius:10px;
  background:var(--card);border:1px solid var(--line);color:var(--ink2);
  font-size:12.5px;display:grid;place-items:center;transition:.16s;
}
.gv-nav button:hover{background:var(--surface-2)}
.gv-nav button:active{transform:scale(.95)}
.gv-nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.grid-wrap{flex:1;min-height:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
/* 底部留白，避免最后几个时段被底部导航遮住 */
#gridWrap::after{content:"";display:block;height:88px}
@media (min-width:960px){ #gridWrap::after{height:40px} }

/* 表头：日期 / 星期 */
.grid-head{
  position:sticky; top:0; z-index:8;
  display:grid; grid-template-columns:var(--gutter) repeat(7,1fr);
  background:var(--surface);
  -webkit-backdrop-filter:blur(18px) saturate(1.6); backdrop-filter:blur(18px) saturate(1.6);
  border-bottom:1px solid var(--line);
  padding-top:2px;
}
.gh-gutter{min-width:0}
.gh-day{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 0 8px;color:var(--muted);transition:.16s;
}
.gh-wd{font-size:10px;letter-spacing:.2px}
.gh-dt{
  font-size:15px;font-weight:750;color:var(--ink);
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-variant-numeric:tabular-nums;transition:.16s;
}
.gh-day.is-today .gh-wd{color:var(--accent);font-weight:700}
.gh-day.is-today .gh-dt{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 12px -4px rgba(76,111,255,.75)}
.gh-day:hover .gh-dt{background:rgba(17,20,28,.05)}
.gh-day.is-today:hover .gh-dt{background:linear-gradient(135deg,var(--accent),var(--accent2))}

/* 表体：时间轴 */
.grid-body{
  display:grid; grid-template-columns:var(--gutter) repeat(7,1fr);
  align-items:start; position:relative;
  /* 时间线由 .gutter / .gcol 各自的精确背景绘制；这里不再重复铺一层渐变，省一次大范围重绘 */
}
.gutter{position:relative}
.hl{
  position:absolute;right:6px;transform:translateY(-50%);
  font-size:11px;font-weight:600;color:var(--ink2);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.1px;pointer-events:none;
  /* 整点线会从数字中间穿过，用底色描边把线「垫」下去；颜色跟随主题，避免深色下发白模糊 */
  text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 2px var(--surface);
}
@media (max-width:959px){
  .hl{font-size:11px;right:5px;letter-spacing:-.2px}
}
.gutter .hl:first-child{transform:none}
.gcol{
  position:relative; border-left:1px solid var(--line); cursor:cell;
  contain:paint;   /* 每列独立绘制层，滚动时避免整表重绘 */
}
.grid-body .gcol:last-child{border-right:1px solid var(--line)}
.gcol.is-today{background:rgba(76,111,255,.035)}
.gcol:hover{background:rgba(76,111,255,.02)}

/* 日程块 */
.ev{
  position:absolute; overflow:hidden; border-radius:9px;
  padding:6px 8px 7px 8px; text-align:left;
  background:hsl(var(--h) 88% 95.5%);
  border-left:3px solid hsl(var(--h) 72% 58%);
  color:hsl(var(--h) 52% 27%);
  box-shadow:0 1px 2px rgba(16,20,30,.05);
  transition:transform .13s ease, box-shadow .13s ease;
  cursor:pointer;
  touch-action:none;   /* 触屏上长按拖拽时，别让浏览器把手指动作当成滚动 */
}
.ev:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(16,20,30,.4);z-index:3}
.ev:active{transform:scale(.985)}
.ev-t{
  font-size:12.5px;font-weight:700;line-height:1.26;letter-spacing:-.1px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  padding-right:12px;
}
.ev-hm{margin-top:3px;font-size:10.5px;opacity:.72;font-variant-numeric:tabular-nums;letter-spacing:-.1px}
.hm-short{display:none}

/* 角标：完成 / 缺席 / 待办 */
.ev-badge{
  position:absolute; top:0; right:0;
  width:15px; height:15px; border-radius:0 9px 0 8px;
  display:grid; place-items:center;
  font-size:8.5px; font-weight:800; line-height:1; color:#fff;
  background:var(--todo);
}
.st-done .ev-badge{background:var(--done)}
.st-absent .ev-badge{background:var(--absent)}
/* 只作用于表格里的日程卡片：首页清单同样带 st-done / st-absent 类，
   不限定作用域会把清单卡片的白底整个盖掉 */
.ev.st-done{background:hsl(var(--h) 55% 97%);border-left-color:hsl(var(--h) 35% 72%);color:hsl(var(--h) 25% 40%)}
.ev.st-absent{background:rgba(244,63,94,.055);border-left-color:rgba(244,63,94,.55);color:#9F1239}
.st-absent .ev-t{text-decoration:line-through;opacity:.78}
.st-absent .ev-hm{opacity:.55}

/* 深色模式下日程卡片换成深底浅字，仍是同色相 */
html.dark .ev{background:hsl(var(--h) 40% 19%);border-left-color:hsl(var(--h) 62% 58%);color:hsl(var(--h) 72% 80%)}
html.dark .ev.st-done{background:hsl(var(--h) 28% 17%);border-left-color:hsl(var(--h) 34% 46%);color:hsl(var(--h) 28% 64%)}
html.dark .ev.st-absent{background:rgba(251,85,119,.14);border-left-color:rgba(251,85,119,.6);color:#FB5577}
html.dark .ev .ev-hm{opacity:.66}
html.dark .ev:hover{box-shadow:0 6px 16px -8px rgba(0,0,0,.7)}

/* ---- 深色下的零散适配：hover 高亮、小控件底色、玻璃条 ---- */
html.dark ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22)}
html.dark .icon-btn:hover{background:rgba(255,255,255,.08)}
html.dark .wk-day:hover{background:var(--surface-2)}
html.dark .gv-nav button:hover,
html.dark .rail-btn:hover,
html.dark .tab:hover{background:rgba(255,255,255,.08)}
html.dark .gh-day:hover .gh-dt{background:rgba(255,255,255,.1)}
html.dark .chip-btn{background:var(--surface-2)}
html.dark .chip-btn:hover{background:var(--surface)}
html.dark .same-chip{background:var(--surface-2)}
html.dark .same-chip:hover{background:var(--surface)}
html.dark .mini-btn:hover{background:rgba(255,255,255,.08)}
html.dark .seg{background:rgba(255,255,255,.06)}
html.dark .seg button.on{background:var(--surface-2)}
html.dark .sw{background:rgba(255,255,255,.14)}
html.dark .sw.on{background:linear-gradient(135deg,var(--accent),var(--accent2))}
html.dark .q-tabs{background:rgba(255,255,255,.06)}
html.dark .q-tabs button.on{background:var(--surface-2)}
html.dark .qb-tabs{background:rgba(255,255,255,.06)}
html.dark .qb-tabs button.on{background:var(--surface-2)}
html.dark .q-add input,
html.dark .q-add button{background:var(--surface-2)}
html.dark .q-add button{color:var(--ink)}
html.dark .rep-seg button{background:var(--surface-2)}
html.dark .rep-seg button.on{background:var(--accent);border-color:transparent;color:#fff}
html.dark .chips button{background:var(--surface-2)}
html.dark .chips button.on{background:var(--accent);border-color:transparent;color:#fff}
html.dark .search-esc{background:rgba(255,255,255,.05)}
html.dark .sp-nudge{background:var(--surface-2)}
html.dark .paste-inner textarea{background:var(--surface-2)}
html.dark .bg-preview,.hero-prev{cursor:grab;touch-action:none}
.bg-preview.dragging,.hero-prev.dragging{cursor:grabbing;transition:none!important}
.bg-preview{background:linear-gradient(160deg,#171B26,#232836 45%,#1B202C)}
html.dark .bg-prev-veil{
  background:linear-gradient(180deg,rgba(10,13,20,.22),rgba(10,13,20,.5) 45%,rgba(10,13,20,.74));
}
html.dark .bg-prev-tag{color:var(--muted);background:rgba(255,255,255,.08)}
html.dark .bg-prev-ui i{background:rgba(255,255,255,.1)}
html.dark .btn.ghost{background:var(--surface-2);color:var(--ink2);border-color:var(--line2)}
html.dark .btn.ghost:hover{background:var(--surface)}
html.dark .btn.danger{background:rgba(244,63,94,.14);border-color:rgba(244,63,94,.4)}
html.dark .hero-prev .hp-bg{background-image:linear-gradient(140deg,#3946A8 0%,#4340C9 48%,#5F41D6 100%)}
html.dark .anniv-bar{background:linear-gradient(115deg,rgba(255,122,89,.2),rgba(255,154,89,.12) 45%,rgba(124,92,255,.14))}
html.dark .quote-card .q-act{background:rgba(76,111,255,.16)}
html.dark .t-st.st-todo{background:rgba(148,163,184,.2)}
/* 深色的「完成」绿偏亮，白勾在上面看不清 → 换成深色字 */
html.dark .st-done .ev-badge{color:#07130C}
/* 日历 / 周历里选中态用的是 accent 底白字，深色下保持；周边未选中格子压暗一点 */
html.dark .cal-cell.other{opacity:.42}
html.dark .q-item.off .q-txt{color:#6B7284}
/* 输入框占位符在深底上统一调到可读区间 */
html.dark ::placeholder{color:#6E7689}

/* 当前时间指示线 */
.now-line{position:absolute;left:0;right:0;height:0;border-top:2px solid #F43F5E;z-index:4;pointer-events:none}
.now-line i{position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:#F43F5E;box-shadow:0 0 0 3px rgba(244,63,94,.18)}

@media (max-width:959px){
  .ev{padding:4px 4px 4px 5px;border-radius:7px;border-left-width:2.5px}
  .ev-t{font-size:10px;line-height:1.18;-webkit-line-clamp:4;padding-right:9px;letter-spacing:0}
  .ev-hm{font-size:8px;margin-top:2px;opacity:.66}
  .ev-badge{width:11px;height:11px;font-size:7px;border-radius:0 7px 0 6px}
  .gh-dt{font-size:14px;width:24px;height:24px}
  .gh-wd{font-size:9px}
  /* 窄列只显示开始时间，完整区间交给详情弹窗 */
  .hm-full{display:none}
  .hm-short{display:inline}
}

/* ==========================================================================
   5. 记事页
   ========================================================================== */
.notes-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:960px){ .notes-wrap{grid-template-columns:minmax(0,1fr) 350px;align-items:start} }

.cal-card{
  background:var(--card); border:1px solid var(--line); border-radius:22px;
  padding:14px; box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4);
}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.cal-title{font-size:16px;font-weight:750;letter-spacing:-.2px;white-space:nowrap}
.cal-tools{display:flex;align-items:center;gap:6px}
.chip-btn{
  height:30px;padding:0 10px;border-radius:10px;font-size:12px;
  border:1px solid var(--line);background:var(--surface-soft);color:var(--ink2);
  display:inline-flex;align-items:center;gap:5px;transition:.16s;
}
@media (max-width:959px){
  /* 移动端：月份独占一行，工具条折到第二行，避免标题被挤断行 */
  .cal-head{flex-wrap:wrap;gap:9px}
  .cal-tools{width:100%}
  .cal-tools #calMark{margin-left:auto}
  .chip-btn{white-space:nowrap;flex:0 0 auto;font-size:11.5px}
}
.chip-btn:hover{background:var(--surface-2)}
.chip-btn.on{background:var(--accent);border-color:transparent;color:#fff}
.chip-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.mark-bar{
  display:none; align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px 10px;margin-bottom:12px;border-radius:12px;
  background:rgba(76,111,255,.07);border:1px solid rgba(76,111,255,.16);
  font-size:11.5px;color:var(--ink2);
}
.mark-bar.on{display:flex}
.mark-bar input[type=text]{
  width:84px;height:28px;border-radius:8px;padding:0 8px;font-size:12px;
  border:1px solid var(--line2);background:var(--surface);outline:none;text-transform:uppercase;
  font-variant-numeric:tabular-nums;letter-spacing:.4px;
}
.mark-bar input[type=color]{
  width:28px;height:28px;padding:0;border:1px solid var(--line2);border-radius:8px;background:var(--surface);
}
.mark-bar .hint{color:var(--muted)}
.mark-bar .done{margin-left:auto;height:28px;padding:0 12px;border-radius:8px;background:var(--accent);color:#fff;font-size:12px}

.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px;padding:6px 4px;border-radius:10px;transition:background-color .18s ease}
.cal-wd span{text-align:center;font-size:10.5px;color:var(--muted);letter-spacing:.3px}
/* 星期栏「透明」时，表格头与记事日历顶条都不再自带底色 */
html.gh-none .grid-head{background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-bottom-color:transparent!important}
html.gh-none .cal-wd{background:transparent!important}
.gh-preview.is-none{background:repeating-conic-gradient(rgba(128,138,160,.16) 0% 25%,transparent 0% 50%) 50%/14px 14px!important}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}

.cal-cell{
  position:relative; min-height:62px; padding:5px 5px 6px;
  display:flex; flex-direction:column; gap:2px; text-align:left;
  border-radius:11px; border:1px solid transparent;
  background:rgba(17,20,28,.028);
  transition:.14s; overflow:hidden;
}
.cal-cell:hover{background:rgba(76,111,255,.07)}
.cal-cell.is-out{opacity:.38}
.cal-cell.is-sel{border-color:rgba(76,111,255,.55);box-shadow:0 0 0 3px rgba(76,111,255,.12)}
.cc-num{font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;line-height:1.2}
.cal-cell.is-today .cc-num{
  color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
  width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  box-shadow:0 3px 8px -3px rgba(76,111,255,.8);
}
.cc-note{
  font-size:9.5px;line-height:1.25;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.cc-tag{position:absolute;right:5px;top:6px;width:6px;height:6px;border-radius:50%}
.cal-grid.markable .cal-cell{cursor:crosshair}
.cal-grid.markable .cal-cell:hover{background:var(--surface-2)}
.cal-cell.is-marked{border-color:rgba(76,111,255,.45)}
@media (min-width:960px){
  .cal-cell{min-height:86px;padding:7px 7px 8px}
  .cc-note{font-size:10.5px;-webkit-line-clamp:3}
  .cc-num{font-size:12.5px}
}

/* ---- 单日编辑器 ---- */
.note-editor{
  background:var(--card); border:1px solid var(--line); border-radius:22px;
  padding:16px; box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4);
  display:flex; flex-direction:column; gap:10px;
}
@media (min-width:960px){ .note-editor{position:sticky;top:0} }
.ne-head{display:flex;align-items:center;justify-content:space-between}
.ne-date{font-size:15px;font-weight:750;letter-spacing:-.2px}
.ne-date small{font-size:11px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.ne-title{
  width:100%;border:0;border-bottom:1px solid var(--line);background:none;
  padding:6px 0 8px;font-size:15px;font-weight:650;outline:none;letter-spacing:-.2px;
}
.ne-title::placeholder{color:#AEB5C4;font-weight:500}
.ne-title:focus{border-bottom-color:rgba(76,111,255,.5)}
.ne-body{
  width:100%;min-height:130px;border:0;background:none;resize:vertical;
  font-size:13px;line-height:1.65;outline:none;color:var(--ink2);
}
.ne-body::placeholder{color:#B4BAC8}
.ne-tagbox{border-top:1px dashed var(--line2);padding-top:11px;display:flex;flex-direction:column;gap:9px}
.ne-tagrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ne-tagrow .lbl{font-size:11px;color:var(--muted);margin-right:2px;flex:0 0 52px;width:52px}
.ne-tagrow input[type=text]{
  width:82px;height:28px;border-radius:8px;padding:0 8px;font-size:11.5px;
  border:1px solid var(--line2);background:var(--surface);outline:none;
  text-transform:uppercase;font-variant-numeric:tabular-nums;letter-spacing:.4px;
}
.ne-tagrow input[type=color]{width:28px;height:28px;padding:0;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
.mini-btn{height:28px;padding:0 10px;border-radius:8px;font-size:11.5px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);transition:.15s}
.mini-btn:hover{background:var(--surface-2)}
.mini-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.same-list{display:flex;flex-wrap:wrap;gap:6px}
.same-chip{
  display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;
  border-radius:8px;font-size:11.5px;background:var(--surface-soft);
  border:1px solid var(--line2);color:var(--ink2);transition:.15s;
}
.same-chip:hover{background:var(--surface-2);transform:translateY(-1px)}
.same-chip i{width:7px;height:7px;border-radius:50%;display:block}
.ne-empty{padding:40px 10px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.7}
.ne-hint{font-size:10.5px;color:var(--ink-soft);text-align:right}

/* 快速选色：圆形色块，选中时留一圈底色 + 一枚对勾 */
.ne-swatches{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ne-swatches button{
  position:relative;width:26px;height:26px;padding:0;border-radius:50%;
  border:2px solid rgba(255,255,255,.92);background-clip:padding-box;
  box-shadow:0 1px 3px rgba(16,20,30,.2),inset 0 0 0 1px rgba(16,20,30,.06);
  transition:transform .14s ease,box-shadow .14s ease;
}
.ne-swatches button:hover{transform:translateY(-1px) scale(1.06)}
.ne-swatches button:active{transform:scale(.9)}
.ne-swatches button.on{
  box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c),0 2px 6px rgba(16,20,30,.22);
}
.ne-swatches button.on::after{
  content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#fff;font-size:12px;font-weight:800;line-height:1;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
}

/* 底部收尾：左边自动保存提示，右边「完成」 */
.ne-foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:2px;padding-top:12px;border-top:1px solid var(--line);
}
.ne-saved{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;color:var(--ink-soft);transition:color .2s;
}
.ne-saved::before{content:'';width:6px;height:6px;border-radius:50%;background:#16A34A}
.ne-saved.flash{color:var(--accent)}
.ne-saved.flash::before{background:var(--accent)}
.btn.ne-done{flex:0 0 auto;height:36px;padding:0 22px;border-radius:11px;font-size:13px;font-weight:700}

/* 移动端：编辑器变为底部抽屉 */
#noteScrim{position:fixed;top:0;right:0;bottom:0;left:0;z-index:58;background:rgba(12,15,22,.34);opacity:0;pointer-events:none;transition:opacity .26s}
#noteScrim.show{opacity:1;pointer-events:auto}
@media (max-width:959px){
  .note-editor{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    border-radius:22px 22px 0 0; max-height:76vh; overflow-y:auto;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -14px 44px -12px rgba(16,20,30,.34);
    transform:translateY(112%); transition:transform .3s cubic-bezier(.22,.9,.3,1);
    background:var(--surface);
  }
  .note-editor.open{transform:none}
}

/* ==========================================================================
   6. 弹窗与表单
   ========================================================================== */
/* ==========================================================================
   15. 全局搜索
   ========================================================================== */
.search-root{position:fixed;top:0;right:0;bottom:0;left:0;z-index:96;display:none;align-items:flex-start;justify-content:center}
.search-root.open{display:flex}
.search-root .search-scrim{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--overlay);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.search-panel{
  position:relative;z-index:1;width:min(600px,100%);
  margin-top:min(16vh,140px);margin-left:16px;margin-right:16px;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 30px 80px -28px rgba(16,20,30,.55);
  overflow:hidden;animation:dlFade .16s ease;
  max-height:min(68vh,640px);display:flex;flex-direction:column;
}
.search-bar{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line);
}
.search-bar svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;flex:0 0 auto}
.search-bar input{
  flex:1;min-width:0;border:none;background:transparent;outline:none;
  font-size:15px;color:var(--ink);height:30px;font-family:inherit;
}
.search-bar input::placeholder{color:var(--ink-soft)}
.search-esc{
  flex:0 0 auto;font-size:10px;color:var(--muted);
  padding:3px 8px;border-radius:7px;border:1px solid var(--line2);
  background:rgba(17,20,28,.03);
}
.search-list{overflow-y:auto;padding:6px}
.sr-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:12px;text-align:left;width:100%;
  cursor:pointer;transition:background .14s ease;
}
.sr-item:hover,.sr-item:focus-visible{background:rgba(76,111,255,.07)}
.sr-date{
  flex:0 0 auto;width:40px;height:42px;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(76,111,255,.08);color:var(--accent);
}
.sr-date b{font-size:15px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sr-date span{font-size:9px;opacity:.75;margin-top:2px}
.sr-date.is-past{background:rgba(17,20,28,.05);color:var(--muted)}
.sr-main{flex:1;min-width:0}
.sr-title{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-title mark{background:rgba(76,111,255,.18);color:inherit;border-radius:3px;padding:0 1px}
.sr-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-sub mark{background:rgba(76,111,255,.14);color:inherit;border-radius:3px;padding:0 1px}
.sr-time{flex:0 0 auto;font-size:12px;font-weight:650;color:var(--ink2);font-variant-numeric:tabular-nums}
.sr-empty{padding:30px 20px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.7}
.search-foot{padding:8px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}

.modal-root{position:fixed;top:0;right:0;bottom:0;left:0;z-index:90;display:none}
.modal-root.open{display:block}
.mb-back{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--overlay);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mb-panel{
  position:absolute;left:0;right:0;bottom:0;
  /* flex 布局下子项默认会被压扁 —— 那样「更多选项」展开后内容溢出、
     父容器 scrollHeight 却不增长，手机上就滑不动了。一律不许压缩。 */
  display:flex;flex-direction:column;
  background:var(--surface);border-radius:24px 24px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  max-height:90vh;overflow-y:auto;
  box-shadow:0 -16px 50px -12px rgba(16,20,30,.4);
  animation:sheetUp .28s cubic-bezier(.22,.9,.3,1);
}
.mb-panel>*{flex:0 0 auto}   /* 不许压缩：内容该多高就多高，超出再交给滚动 */
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
/* 手机上直接铺满整屏 —— 顶部不再留一条点不到、也没内容的空白 */
@media (max-width:959px){
  .mb-panel{
    top:0;height:100%;max-height:none;border-radius:0;box-shadow:none;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    padding-left:18px;padding-right:18px;padding-bottom:0;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
}

/* 移动端触控尺寸统一挪到样式表末尾，避免被前面的基础样式盖掉 */
.mb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mb-head h3{font-size:16.5px;font-weight:750;letter-spacing:-.2px}

/* 「更多选项」：把低频字段收进去，首屏只留标题 / 日期 / 时间 / 提醒 */
.more-box{
  margin:6px 0 4px;border-radius:14px;overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line2);
}
.more-box>summary{
  display:flex;align-items:center;gap:8px;padding:13px 14px;
  font-size:13px;font-weight:650;color:var(--ink2);
  cursor:pointer;list-style:none;user-select:none;
}
/* 主页底部的「数据概览 / 纪念日」折叠：手机上默认收起，电脑端自动展开 */
.home-fold{
  margin-top:22px;border-radius:16px;overflow:hidden;
  background:rgba(var(--card-rgb),var(--card-a,.78));border:1px solid var(--line);
}
.home-fold>summary{
  display:flex;align-items:center;gap:8px;padding:14px 16px;
  font-size:13px;font-weight:650;color:var(--ink2);
  cursor:pointer;list-style:none;user-select:none;
}
.home-fold>summary::-webkit-details-marker{display:none}
.home-fold>summary::before{
  content:"";width:0;height:0;flex:0 0 auto;
  border-left:4.5px solid currentColor;
  border-top:4px solid transparent;border-bottom:4px solid transparent;
  transition:transform .18s ease;
}
.home-fold[open]>summary::before{transform:rotate(90deg)}
.home-fold>summary i{
  font-style:normal;font-size:10.5px;font-weight:500;
  color:var(--muted);margin-left:auto;
}
.fold-inner{padding:0 12px 4px}
.home-fold .week-block{margin-top:12px}
.home-fold .week-block:first-child{margin-top:0}
.more-box>summary::-webkit-details-marker{display:none}
.more-box>summary::before{
  content:"";width:0;height:0;flex:0 0 auto;
  border-left:4.5px solid currentColor;
  border-top:4px solid transparent;border-bottom:4px solid transparent;
  transition:transform .18s ease;
}
.more-box[open]>summary::before{transform:rotate(90deg)}
.more-box>summary i{
  font-style:normal;font-size:10.5px;font-weight:500;
  color:var(--muted);margin-left:auto;letter-spacing:.2px;
}
.more-inner{padding:2px 14px 14px}
.more-inner>.field:first-child{margin-top:0}
.more-inner .hint{margin-bottom:10px}
.field{margin-bottom:12px}
.field>label{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.2px}
.field>label b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.inp{
  width:100%;border:1px solid var(--line2);background:var(--surface-2);
  border-radius:12px;padding:10px 12px;font-size:14px;outline:none;transition:.18s;
}
.inp:focus{border-color:rgba(76,111,255,.55);background:var(--surface);box-shadow:0 0 0 4px rgba(76,111,255,.10)}
textarea.inp{resize:vertical;line-height:1.6;font-size:13.5px}
input[type=date].inp,input[type=time].inp{font-variant-numeric:tabular-nums}
.field-row{display:grid;gap:10px;margin-bottom:12px}
.field-row.two{grid-template-columns:1fr 1fr}
.field-row .field{margin-bottom:0;min-width:0}
.hint{font-size:10.5px;color:var(--ink-soft);margin:-6px 0 12px 2px}

/* ==========================================================================
   11. 日期 / 时间快选：手机上原生 date/time 是转轮，很难点
   —— 这里改成「人话标签 + 快捷 chips + ±15 分钟大按钮 + 内嵌月历」
   ========================================================================== */
.dt-dlabel{
  flex:1;min-width:0;height:44px;padding:0 14px;border-radius:13px;
  display:flex;align-items:center;gap:7px;text-align:left;
  border:1px solid var(--line2);background:var(--surface-2);
  font-size:15px;font-weight:650;color:var(--ink);letter-spacing:.2px;
  transition:.16s;
}
.dt-dlabel:active{transform:scale(.99)}
.dt-dlabel i{font-style:normal;font-size:11.5px;font-weight:600;color:var(--accent)}
.dt-dlabel em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:500}
.dt-cal{
  flex:0 0 46px;height:44px;border-radius:13px;display:grid;place-items:center;
  border:1px solid var(--line2);background:var(--surface-2);transition:.16s;
}
.dt-cal:active{transform:scale(.96)}
.dt-cal svg{width:19px;height:19px;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round}
.dt-cal.sm{flex:0 0 auto;width:34px;height:32px;border-radius:9px}
.dt-cal.sm svg{width:15px;height:15px}
.dt-until{
  flex:1;min-width:0;height:32px;padding:0 11px;border-radius:9px;
  border:1px solid var(--line2);background:var(--surface-2);
  font-size:12.5px;color:var(--ink2);text-align:left;
  font-variant-numeric:tabular-nums;
}

/* 横滑 chips：不换行，手指一划就能挑，比下拉/转轮快 */
.dt-scroll{
  display:flex;gap:6px;margin-top:7px;
  overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding-bottom:2px;
}
.dt-scroll::-webkit-scrollbar{display:none}
.dt-scroll button{
  flex:0 0 auto;height:32px;padding:0 12px;border-radius:9px;
  font-size:12px;color:var(--ink2);white-space:nowrap;
  border:1px solid var(--line2);background:var(--surface);transition:.15s;
}
.dt-scroll button:active{transform:scale(.97)}
.dt-scroll button.on{background:var(--accent);border-color:transparent;color:#fff;font-weight:650}
html.dark .dt-scroll button{background:var(--surface-2)}

/* 时间：−  09:00  +  —— 手机端点按最省事 */
.dt-time{
  display:flex;align-items:center;gap:6px;height:44px;
  border:1px solid var(--line2);background:var(--surface-2);border-radius:13px;
  padding:0 6px;
}
.dt-step{
  flex:0 0 38px;height:34px;border-radius:10px;font-size:19px;line-height:1;
  display:grid;place-items:center;color:var(--accent);
  background:rgba(76,111,255,.09);transition:.14s;
}
.dt-step:active{transform:scale(.92);background:rgba(76,111,255,.2)}
.dt-tval{
  flex:1;min-width:0;text-align:center;font-size:16.5px;font-weight:700;
  color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.4px;
}
.dt-tval small{display:block;font-size:9.5px;font-weight:600;color:var(--accent);letter-spacing:0}
#dtHint.overnight{color:var(--accent)}

/* ---- 按设备切换：桌面端原生 date/time 照旧；移动端换成滚轮 + 快选 ---- */
.dt-date,.dt-time{display:none}
@media (max-width:959px){
  .dt-native{
    position:absolute;left:0;top:0;width:1px;height:1px;padding:0;border:0;
    opacity:0;pointer-events:none;clip:rect(0 0 0 0);
  }
  .dt-date{display:flex;gap:8px;align-items:stretch}
  .dt-time{display:flex}
}

/* ==========================================================================
   12. 滚轮选择器（移动端底部 sheet，深色，参考设计稿）
   ========================================================================== */
.wp-root{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1500}
.wp-scrim{
  position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.52);
  opacity:0;transition:opacity .24s ease;
}
.wp-root.in .wp-scrim{opacity:1}
/* 底部弹层（保持原来的底部弹层样式，不上全屏）：圆角顶 + 抓手 */
.wp-sheet{
  position:absolute;left:0;right:0;bottom:0;
  background:#1C1C1E;
  border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;
  padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));
  transform:translateY(101%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);
}
.wp-sheet::before{
  content:'';width:40px;height:5px;border-radius:99px;
  background:rgba(255,255,255,.24);margin:0 auto 12px;flex:0 0 auto;
}
.wp-root.in .wp-sheet{transform:none}
.wp-title{
  text-align:center;font-size:14px;font-weight:650;
  color:rgba(255,255,255,.66);flex:0 0 auto;letter-spacing:.5px;
  margin-bottom:0;
}
/* 选中行紧贴标题下方（底部弹层，不再按全屏的 1/3 处定位） */
.wp-cols{display:flex;gap:6px;position:relative;margin:8px 0 auto}
.wp-cols::before{
  content:'';position:absolute;left:0;right:0;top:0;height:44px;border-radius:12px;
  background:rgba(255,255,255,.09);pointer-events:none;
}
.wp-col{flex:1;min-width:0}
.wp-list{
  height:min(38vh,400px);overflow-y:auto;overflow-x:hidden;
  scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;overscroll-behavior:contain;
}
.wp-list::-webkit-scrollbar{display:none}
.wp-item{
  height:44px;display:flex;align-items:center;justify-content:center;
  scroll-snap-align:start;font-size:23px;font-weight:600;color:#fff;
  white-space:nowrap;letter-spacing:.5px;
  transition:opacity .14s ease,font-size .14s ease,color .14s ease;
  font-variant-numeric:tabular-nums;
}
/* 底部占位：高度 = 可视区 - 一行，这样最后一项也能滚到顶行 */
.wp-pad{height:calc(100% - 44px)}
.wp-acts{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px}
.wp-ok{
  width:100%;max-width:300px;height:50px;border-radius:26px;
  border:1.5px solid rgba(255,255,255,.5);background:transparent;
  color:#fff;font-size:16px;font-weight:650;letter-spacing:2px;transition:.15s;
}
.wp-ok:active{background:rgba(255,255,255,.16);transform:scale(.985)}
.wp-cancel{
  font-size:13.5px;color:rgba(255,255,255,.55);background:none;
  padding:3px 12px;letter-spacing:.5px;
}
.wp-cancel:active{color:rgba(255,255,255,.9)}

/* 内嵌月历浮层 */
.dt-pop{
  position:fixed;z-index:1200;width:min(304px,calc(100vw - 24px));
  border-radius:16px;padding:11px;
  background:var(--surface);border:1px solid var(--line2);
  box-shadow:0 18px 46px -14px rgba(16,20,30,.42);
  animation:dtPop .16s ease;
}
@keyframes dtPop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.dt-pop-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dt-pop-h b{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.dt-pop-h button{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:15px;color:var(--ink2);background:var(--surface-2);transition:.14s;
}
.dt-pop-h button:active{transform:scale(.92)}
.dt-pop-w{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.dt-pop-w span{text-align:center;font-size:10px;color:var(--muted);padding:3px 0}
.dt-pop-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dt-pop-g button{
  height:36px;border-radius:9px;font-size:12.5px;color:var(--ink2);
  font-variant-numeric:tabular-nums;transition:.13s;position:relative;
}
.dt-pop-g button:active{transform:scale(.93)}
.dt-pop-g button.out{color:var(--ink-soft);opacity:.45}
.dt-pop-g button.today{color:var(--accent);font-weight:700}
.dt-pop-g button.today::after{
  content:'';position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--accent);
}
.dt-pop-g button.sel{background:var(--accent);color:#fff;font-weight:700}
.dt-pop-g button.sel.today::after{background:#fff}

.seg{display:flex;gap:5px;background:rgba(17,20,28,.05);padding:4px;border-radius:13px}
.seg button{
  flex:1;padding:7px 0;border-radius:9px;font-size:11.5px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:.16s;
}
.seg button span{font-size:15px;line-height:1}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(16,20,30,.14)}
.seg button.on[data-st=done]{color:var(--done)}
.seg button.on[data-st=absent]{color:var(--absent)}

.mb-foot{display:flex;gap:10px;margin-top:16px}
.btn{
  flex:1;height:46px;border-radius:14px;font-size:14.5px;font-weight:650;
  display:grid;place-items:center;transition:.16s;cursor:pointer;
  border:1px solid transparent;
}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 10px 24px -12px rgba(76,111,255,.9)}
.btn.primary:active{transform:scale(.985)}
.btn.ghost{background:var(--surface-2);color:var(--ink2);border-color:var(--line2)}
.btn.ghost:hover{background:var(--surface)}
.btn.danger{color:var(--absent);background:rgba(244,63,94,.08);border-color:rgba(244,63,94,.28);flex:0 0 96px}
.btn.danger:hover{background:rgba(244,63,94,.16)}
/* 删除按钮的「待确认」态：点第一下变成红色实心，再点一次才真删 */
.btn.danger.armed{
  background:var(--absent); color:#fff; font-weight:650;
  flex:0 0 auto; padding:0 14px;
  box-shadow:0 6px 16px -6px rgba(244,63,94,.6);
}
.btn.file{position:relative;overflow:hidden;cursor:pointer}
.btn.file input{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;cursor:pointer}
.btn:disabled{opacity:.4;pointer-events:none}
.bg-pick{display:flex;gap:10px}
.bg-pick .btn{height:42px;font-size:13px;padding:0 8px}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
.about{
  margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--ink-soft);text-align:center;line-height:1.6;
}
.about b{color:var(--muted);font-weight:600}
/* 关于里的邮箱链接：保持低调，但点一下就能写信 */
.about a{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--line);}
.about a:hover{border-bottom-style:solid}

@media (min-width:960px){
  .mb-panel{
    left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);
    width:520px;border-radius:20px;max-height:86vh;animation:pop .2s ease;
    box-shadow:0 30px 80px -24px rgba(16,20,30,.55);
  }
  @keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}
  @keyframes dlIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
  @keyframes dlFade{from{opacity:0}to{opacity:1}}
}

/* ==========================================================================
   8. v0.2 增量样式
   —— 8.1 更宽松的标题区  8.2 重复日程标识  8.3 纪念日
   —— 8.4 重复规则表单      8.5 数据导入导出
   ========================================================================== */

/* ---- 8.1 表格卡片：抬高每小时行高 + 加大标题区上下留白 ---- */
:root{ --hourH:52px; }
@media (max-width:959px){ :root{ --hourH:56px; } }

.ev{padding:8px 9px 9px 10px;border-radius:10px}
.ev-t{font-size:13px;line-height:1.36;letter-spacing:-.15px;-webkit-line-clamp:3}
.ev-hm{margin-top:4px;font-size:10.5px}

@media (max-width:959px){
  .ev{padding:7px 5px 7px 6px;border-radius:8px}
  .ev-t{font-size:10.5px;line-height:1.32;letter-spacing:0}
  .ev-hm{margin-top:2px}
}

/* 30~45 分钟这类很矮的卡片：收紧内边距、只留标题，尽量让中文标题完整显示 */
.ev.is-mini{padding:2px 3px 3px 5px}
.ev.is-mini .ev-t{
  -webkit-line-clamp:1;font-size:9px;line-height:1.32;letter-spacing:-.2px;padding-right:0;
}
.ev.is-mini .ev-hm{display:none}
/* 矮卡片把角标挪到右下角，标题独占第一行，互不遮挡 */
.ev.is-mini .ev-badge{
  top:auto; bottom:0; right:0;
  width:10px;height:10px;font-size:6.5px;
  border-radius:8px 0 8px 0;
}

@media (max-width:959px){
  .ev-t{padding-right:8px}
  .ev.is-mini .ev-t{font-size:9px;letter-spacing:-.3px}
}

/* ---- 8.2 重复日程的 ↻ 标识 ---- */
.ev-rep{
  position:absolute;right:4px;bottom:3px;
  font-size:9.5px;line-height:1;opacity:.42;letter-spacing:0;pointer-events:none;
}
/* ---- 拖动已有日程：原位半透明占位 + 跟随手指的浮起卡片 ---- */
.ev-source{
  opacity:.3; filter:grayscale(.4); box-shadow:none;
  transition:opacity .18s ease;
}
.move-ghost{
  position:fixed; z-index:150; pointer-events:none;
  padding:4px 6px; border-radius:8px; overflow:hidden;
  background:hsl(var(--h) 62% 92%);
  border-left:3px solid hsl(var(--h) 58% 55%);
  box-shadow:0 16px 32px -14px rgba(16,20,30,.55);
  transition:transform .2s cubic-bezier(.22,.9,.3,1), opacity .2s ease;
  will-change:transform;
}
.move-ghost b{
  display:block;font-size:10px;font-weight:650;line-height:1.25;
  color:hsl(var(--h) 32% 30%);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.move-ghost span{
  display:block;font-size:8px;color:hsl(var(--h) 22% 45%);
  font-variant-numeric:tabular-nums;
}
.move-ghost.snap-back{opacity:0;transform:translate(0,0) scale(1)}
.move-tip{
  position:fixed;left:0;top:0;z-index:151;pointer-events:none;
  padding:4px 9px;border-radius:8px;
  font-size:11px;font-weight:650;color:#fff;white-space:nowrap;
  background:rgba(20,24,34,.9);
  box-shadow:0 8px 20px -10px rgba(0,0,0,.6);
}
.move-tip.is-bad{background:rgba(244,63,94,.92)}
/* 落点预览：拖到哪儿会落下，翻页后也看得到自己还捏着东西 */
.move-slot{
  position:absolute;left:2px;right:2px;z-index:2;pointer-events:none;
  border-radius:8px;display:grid;place-items:center;
  border:1.5px dashed var(--accent);
  background:rgba(76,111,255,.10);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
}
.move-slot span{
  font-size:9px;font-weight:700;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:.2px;
}
body.is-moving{cursor:grabbing;-webkit-user-select:none;user-select:none}
body.is-moving .ev{transition:none}

/* 提醒标记：状态角标（左上）右边一颗小铃铛 / 闹钟 */
.ev-rm{
  position:absolute;left:16px;top:2px;
  font-size:8.5px;line-height:1;opacity:.8;pointer-events:none;
}
.ev.is-mini .ev-rm{left:13px;top:1px;font-size:7px}
@media (max-width:959px){ .ev-rm{left:14px;top:1px;font-size:7px} }

/* 跨夜日程（结束早于开始，如 23:30–01:30）：卡片画到表底，底部标「次日」 */
.ev.is-cross{border-bottom-left-radius:0;border-bottom-right-radius:0}
.ev.is-cross::after{
  content:"↓ 次日";
  position:absolute;left:4px;bottom:1px;
  font-size:7.5px;letter-spacing:.2px;opacity:.62;pointer-events:none;
}
@media (max-width:959px){ .ev.is-cross::after{font-size:6.5px;left:2px} }

/* 重要项目标记：右上角一颗小星，跟状态角标（左上）不打架 */
.ev-imp{
  position:absolute;right:4px;top:3px;
  font-size:10px;line-height:1;pointer-events:none;
  color:hsl(var(--h) 62% 42%);
}
.ev.is-mini .ev-imp{right:3px;top:2px;font-size:8px}
html.dark .ev-imp{color:hsl(var(--h) 70% 72%)}
.ev.has-img .ev-imp{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
@media (max-width:959px){ .ev-rep{right:2px;bottom:1px;font-size:7.5px} }
/* 矮卡片的角标在右下角，重复标识改放左下角避让 */
.ev.is-mini .ev-rep{right:auto;left:5px;bottom:0;font-size:8px}

/* ---- 8.3 纪念日 ---- */
#annivBar{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
#annivBar:empty{display:none;margin-bottom:0}
.anniv-bar{
  display:flex;align-items:center;gap:11px;
  padding:13px 15px;border-radius:16px;
  background:linear-gradient(115deg,rgba(255,122,89,.17),rgba(255,154,89,.10) 45%,rgba(124,92,255,.12));
  border:1px solid rgba(255,110,80,.26);
  animation:fadeIn .3s ease;
}
/* 明天的预告：换成偏冷的蓝紫，和「就是今天」区分开 */
.anniv-bar.is-next{
  background:linear-gradient(115deg,rgba(124,92,255,.15),rgba(96,120,255,.09) 55%,rgba(76,111,255,.07));
  border-color:rgba(124,92,255,.24);
}
.anniv-bar.is-next .tx b{color:#463A85}
.anniv-bar.is-next .tx span{color:#6E64A8}
.anniv-bar.is-next .tag{background:#7C5CFF}
.anniv-bar .ico{
  width:36px;height:36px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;
  font-size:19px;background:var(--surface);box-shadow:0 2px 8px -3px rgba(200,90,50,.4);
}
.anniv-bar .tx{flex:1;min-width:0}
.anniv-bar .tx b{display:block;font-size:13.5px;font-weight:750;color:#8A3A1E;letter-spacing:-.1px}
.anniv-bar .tx span{font-size:11.5px;color:#A4664C}
.anniv-bar .tag{
  font-size:10px;font-weight:700;color:#fff;background:#FF7A59;
  padding:4px 8px;border-radius:99px;letter-spacing:.3px;flex:0 0 auto;
}

.anniv-list{display:flex;flex-direction:column;gap:8px}
/* 主页最底部的署名：字号小、颜色淡，不抢内容，但信息一直在 */
.home-foot{
  -webkit-appearance:none;appearance:none;
  display:block;width:100%;margin:18px 0 2px;padding:6px 0;
  border:0;background:none;cursor:pointer;
  font:inherit;font-size:10.5px;line-height:1.5;text-align:center;
  color:var(--muted);opacity:.58;
}
.home-foot:hover{opacity:.9}
html.dark .home-foot{opacity:.5}

/* ---- 8.3.4 首次启动引导：遮罩挖洞 + 一句话说明 ---- */
.guide-root{position:fixed;top:0;right:0;bottom:0;left:0;z-index:210}
.guide-root[hidden]{display:none}
.guide-hole{
  position:fixed;border-radius:16px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(6,8,14,.66);
  outline:1.5px solid rgba(255,255,255,.55);outline-offset:2px;
  transition:top .26s cubic-bezier(.22,.9,.3,1),left .26s cubic-bezier(.22,.9,.3,1),
             width .26s cubic-bezier(.22,.9,.3,1),height .26s cubic-bezier(.22,.9,.3,1);
}
.guide-tip{
  position:fixed;left:14px;right:14px;max-width:420px;margin:0 auto;z-index:2;
  padding:14px 16px 12px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:0 22px 54px -20px rgba(0,0,0,.7);
  transition:top .26s cubic-bezier(.22,.9,.3,1);
}
.guide-tip b{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.guide-tip p{margin:6px 0 11px;font-size:12.5px;line-height:1.6;color:var(--ink2)}
.gt-acts{display:flex;align-items:center;gap:9px}
.gt-acts button{
  height:34px;padding:0 14px;border-radius:11px;font-size:12.5px;font-weight:650;
}
.gt-skip{color:var(--muted);border:1px solid var(--line2);background:transparent}
.gt-next{
  margin-left:auto;color:#fff;border:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 20px -10px rgba(76,111,255,.9);
}
.gt-dots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.gt-dots i{width:5px;height:5px;border-radius:99px;background:var(--line2)}
.gt-dots i.on{background:var(--accent);width:14px}

/* ==========================================================================
   8.3.6 开场层：加载时的一句话（逐字浮现 + 极光 + 微粒）
   ========================================================================== */
.boot-splash{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:9998;overflow:hidden;
  /* 宽高写死 + 底色单列：旧内核丢了 inset 或整条 background 简写时，
     这一层仍然是不透明的整屏，不会退化成顶上一条、露出下面的主页 */
  width:100%;height:100%;margin:0;
  background-color:#F3F5FC;
  display:grid;place-items:center;
  background-image:
    radial-gradient(120% 90% at 50% 8%, rgba(76,111,255,.16), transparent 62%),
    radial-gradient(100% 80% at 50% 100%, rgba(124,92,255,.14), transparent 60%),
    linear-gradient(168deg,#F3F5FC 0%,#F8F9FD 46%,#EDF1FA 100%);
  transition:opacity .46s cubic-bezier(.4,0,.2,1),
             transform .46s cubic-bezier(.4,0,.2,1);
}
html.dark .boot-splash{
  background-color:#0B0E15;
  background-image:
    radial-gradient(120% 90% at 50% 8%, rgba(76,111,255,.26), transparent 62%),
    radial-gradient(100% 80% at 50% 100%, rgba(124,92,255,.22), transparent 60%),
    linear-gradient(168deg,#0B0E15 0%,#10141D 46%,#0A0D14 100%);
}
.boot-splash[hidden]{display:none}

/* 收场：整层轻微放大淡出。
   不再用 filter:blur —— 旧内核对带 filter 的整屏合成层会把整幅画面一起糊掉 */
.boot-splash.is-out{
  opacity:0;transform:scale(1.06);pointer-events:none;
}

/* 极光：三团色斑缓慢漂移，纯 CSS，不占主线程 */
.bs-aurora{position:absolute;top:-18%;right:-18%;bottom:-18%;left:-18%;pointer-events:none;filter:blur(48px);opacity:.85}
.bs-aurora i{
  position:absolute;display:block;border-radius:50%;mix-blend-mode:screen;
  will-change:transform;
}
.bs-aurora i:nth-child(1){
  width:52vmax;height:52vmax;left:-8%;top:-14%;
  background:radial-gradient(circle at 50% 50%,rgba(76,111,255,.55),transparent 66%);
  animation:bsDrift1 17s ease-in-out infinite alternate;
}
.bs-aurora i:nth-child(2){
  width:46vmax;height:46vmax;right:-12%;top:6%;
  background:radial-gradient(circle at 50% 50%,rgba(124,92,255,.45),transparent 66%);
  animation:bsDrift2 21s ease-in-out infinite alternate;
}
.bs-aurora i:nth-child(3){
  width:40vmax;height:40vmax;left:24%;bottom:-22%;
  background:radial-gradient(circle at 50% 50%,rgba(34,197,194,.34),transparent 68%);
  animation:bsDrift3 25s ease-in-out infinite alternate;
}
@keyframes bsDrift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(14%,10%,0) scale(1.16)}}
@keyframes bsDrift2{from{transform:translate3d(0,0,0) scale(1.08)}to{transform:translate3d(-16%,14%,0) scale(.92)}}
@keyframes bsDrift3{from{transform:translate3d(0,0,0) scale(.95)}to{transform:translate3d(10%,-12%,0) scale(1.2)}}

/* 微粒：canvas 画，收场时一起淡掉 */
.bs-canvas{
  position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none;
  transition:opacity .5s ease;
}
/* 一层极淡的噪点，避免大色块发平 */
.bs-grain{
  position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(17,20,28,.055) 1px,transparent 1px);
  background-size:3px 3px;
}
html.dark .bs-grain{background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px)}

.bs-stage{
  position:relative;z-index:2;
  width:min(760px,86vw);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:26px;
}

/* 品牌行 */
.bs-brand{display:flex;align-items:center;gap:9px;animation:bsFade .7s .05s both}
.bs-leaf{
  width:34px;height:34px;border-radius:10px;overflow:hidden;flex:0 0 auto;
  box-shadow:0 8px 20px -8px rgba(76,111,255,.6);
}
.bs-leaf img{width:100%;height:100%;object-fit:cover;display:block}
.bs-name{font-size:15px;font-weight:750;letter-spacing:2px;color:var(--ink)}
.bs-sub{font-size:11px;color:var(--muted);letter-spacing:1.6px}

/* 语录本体 */
.bs-quote-wrap{position:relative;display:flex;align-items:flex-start;justify-content:center;gap:6px}
.bs-quo{
  font-family:Georgia,"Times New Roman",serif;line-height:1;
  font-size:clamp(34px,7vw,64px);color:rgba(76,111,255,.22);
  animation:bsFade .8s .15s both;user-select:none;
}
.bs-quo-l{align-self:flex-start;margin-top:.1em}
.bs-quo-r{align-self:flex-end;margin-bottom:-.15em}
.bs-quote{
  margin:0;max-width:min(620px,74vw);
  font-size:clamp(21px,4.4vw,36px);line-height:1.62;font-weight:600;
  letter-spacing:1.2px;color:var(--ink);
  text-wrap:balance;
}
/* 逐字：每个字一个 span，错峰浮现 + 上移 + 去虚化 */
.bs-quote .ch{
  display:inline-block;white-space:pre;
  animation:bsChar .62s cubic-bezier(.22,.9,.28,1) both;
}
@keyframes bsChar{
  from{opacity:0;transform:translate3d(0,.42em,0) scale(.94);filter:blur(6px)}
  to{opacity:1;transform:none;filter:blur(0)}
}
/* 末尾光标，打字机感 */
.bs-caret{
  display:inline-block;width:.055em;height:1.02em;vertical-align:-.16em;
  margin-left:.12em;background:var(--accent);border-radius:1px;
  animation:bsBlink .9s steps(1,end) 1.1s infinite;
}
@keyframes bsBlink{0%,49%{opacity:1}50%,100%{opacity:0}}

.bs-meta{
  display:flex;align-items:center;gap:9px;
  font-size:11.5px;color:var(--muted);letter-spacing:1px;
  animation:bsFade .7s .5s both;
}
.bs-dot{width:3px;height:3px;border-radius:50%;background:var(--ink-soft)}

/* 进度条：CSS 动画先跑到 88%，JS 收场时补满 */
.bs-bar{
  width:min(220px,52vw);height:3px;border-radius:99px;overflow:hidden;
  background:rgba(17,20,28,.09);animation:bsFade .7s .6s both;
}
html.dark .bs-bar{background:rgba(255,255,255,.12)}
.bs-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  animation:bsBar 1.5s cubic-bezier(.3,.7,.4,1) forwards;
}
@keyframes bsBar{from{width:0}to{width:88%}}
.boot-splash.is-out .bs-bar i{transition:width .3s ease;width:100%}

@keyframes bsFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 开场结束的接力：主页语录卡轻轻亮一下，视线自然接过去 */
@keyframes bsHandoff{
  0%{box-shadow:var(--shadow)}
  35%{box-shadow:0 0 0 3px rgba(76,111,255,.35),0 18px 40px -18px rgba(76,111,255,.7)}
  100%{box-shadow:var(--shadow)}
}
.quote-card.bs-handoff{animation:bsHandoff 1.1s ease}

/* 系统开了「减弱动效」：不逐字、不漂移，直接给一句 */
@media (prefers-reduced-motion:reduce){
  .bs-aurora,.bs-canvas{display:none}
  .bs-quote .ch{animation:none;opacity:1;transform:none;filter:none}
  .bs-caret{animation:none}
  .bs-bar i{animation:none;width:88%}
  .boot-splash.is-out{transition:opacity .2s ease;transform:none;filter:none}
}

/* ---- 8.3.5 闹钟响铃层 ---- */
.alarm-root{
  position:fixed; top:0;right:0;bottom:0;left:0; z-index:200;
  display:grid; place-items:center;
  background:rgba(8,10,16,.62);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  animation:fade .18s ease;
}
.alarm-root[hidden]{display:none}
.alarm-card{
  width:min(340px,86vw); padding:26px 22px 18px; border-radius:24px;
  background:var(--surface); border:1px solid var(--line);
  box-shadow:0 30px 80px -24px rgba(0,0,0,.7);
  text-align:center; animation:dlFade .18s ease;
}
.alarm-card .al-ico{font-size:38px;line-height:1;display:block;margin-bottom:10px}
.alarm-card .al-t{font-size:18px;font-weight:750;color:var(--ink);letter-spacing:-.2px}
.alarm-card .al-m{margin-top:6px;font-size:12.5px;color:var(--muted)}
.alarm-card .al-acts{display:flex;gap:9px;margin-top:18px}
.alarm-card .al-acts .btn{height:42px;font-size:13.5px}
.alarm-card .al-cd{margin-top:10px;font-size:10.5px;color:var(--ink-soft)}
/* 设置里「本功能不适用当前平台」的角标 */
.plat-note{
  font-size:10.5px;font-weight:600;color:var(--muted);
  padding:3px 8px;border-radius:7px;background:var(--surface-soft);border:1px solid var(--line);
}

/* ---- 8.4 数据概览：完成率 + 时间分配 ---- */
.stat-card{
  border-radius:16px;padding:14px 14px 12px;
  background:rgba(var(--card-rgb),var(--card-a,.78));border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:var(--shadow);
}
.st-sec + .st-sec{margin-top:13px;padding-top:13px;border-top:1px dashed var(--line)}
.st-sec[data-toggle]{cursor:pointer}
.st-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.st-row span{font-size:12px;color:var(--ink2);font-weight:600}
.st-row b{font-size:15px;color:var(--ink)}
.st-row .st-sub{font-size:11px;font-weight:400;color:var(--muted)}
.st-bar{
  height:8px;border-radius:5px;background:var(--track);
  overflow:hidden;display:flex;
}
.st-bar i{display:block;height:100%;border-radius:5px;background:var(--done);transition:width .3s ease}
.st-bar.stack i{border-radius:0}
.st-bar.stack i:first-child{border-radius:5px 0 0 5px}
.st-bar.stack i:last-child{border-radius:0 5px 5px 0}
.st-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.st-legend button{
  -webkit-appearance:none;appearance:none;
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--line);background:var(--surface-soft);color:var(--ink2);
  font:inherit;font-size:11px;padding:4px 9px;border-radius:20px;cursor:pointer;
}
.st-legend button i{width:8px;height:8px;border-radius:3px;background:hsl(var(--th) 62% 58%)}
.st-legend button:hover{border-color:hsl(var(--th) 50% 60%)}
.st-note{margin-top:8px;font-size:11px;line-height:1.5;color:var(--muted)}
.st-note.warn{color:#B4720F}
html.dark .st-note.warn{color:#F0B95A}
/* 明细列表 */
.st-detail{margin-top:4px}
.st-detail:not(.has){display:none}
.st-d-head{font-size:11px;font-weight:650;color:var(--ink2);margin:10px 0 7px}
.st-d-row{
  display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:5px;
  border-radius:10px;background:var(--surface-soft);border-left:3px solid hsl(var(--th) 55% 62%);
  font-size:11.5px;
}
.st-d-row .d{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums}
.st-d-row .t{flex:1;min-width:0;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.st-d-row .h{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums}
.st-d-row .ok{
  -webkit-appearance:none;appearance:none;flex:0 0 auto;
  width:24px;height:24px;border-radius:8px;border:0;cursor:pointer;
  background:rgba(22,163,74,.14);color:var(--done);font-size:13px;line-height:1;
}
.st-d-row .ok:active{transform:scale(.92)}
.st-empty{font-size:11px;color:var(--muted);padding:6px 2px}
.anniv-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:15px;
  background:rgba(var(--card-rgb),var(--card-a,.78));border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:var(--shadow);
}
.anniv-item .ico{
  width:34px;height:34px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;
  font-size:17px;background:rgba(255,122,89,.13);
}
.anniv-item .tt{flex:1;min-width:0}
.anniv-item .tt b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anniv-item .tt span{font-size:11px;color:var(--muted)}
.anniv-item .cd{font-size:12px;font-weight:750;color:#E8663F;font-variant-numeric:tabular-nums;flex:0 0 auto}
.anniv-item .cd.now{color:#fff;background:#FF7A59;padding:4px 9px;border-radius:99px;font-size:11px}

/* 日历格子里的纪念日小图标 */
.cc-anniv{position:absolute;right:5px;bottom:4px;font-size:13px;line-height:1;opacity:.92}
@media (max-width:959px){ .cc-anniv{right:3px;bottom:3px;font-size:10px} }

/* 桌面端编辑器是并排面板而非抽屉，不需要遮罩（否则整页会被压暗） */
@media (min-width:960px){ #noteScrim{display:none !important} }

/* ---- 8.4 重复规则表单 ---- */
.rep-box{
  display:flex;flex-direction:column;gap:10px;
  padding:12px;border-radius:14px;
  background:rgba(76,111,255,.05);border:1px solid rgba(76,111,255,.14);
}
.rep-seg{display:flex;gap:5px;flex-wrap:wrap;padding-bottom:1px}
.rep-seg button{
  flex:1 1 auto;height:31px;padding:0 8px;border-radius:9px;font-size:11.5px;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink2);
  white-space:nowrap;transition:.15s;
}
.rep-seg button.on{background:var(--accent);border-color:transparent;color:#fff;font-weight:650}
.wd-pick{display:flex;gap:5px;flex-wrap:wrap}
.wd-pick button{
  width:34px;height:32px;border-radius:9px;font-size:12px;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink2);transition:.15s;
}
.wd-pick button.on{background:var(--accent);border-color:transparent;color:#fff;font-weight:700}
.rep-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.rep-row input[type=date]{
  flex:1;height:32px;border-radius:9px;border:1px solid var(--line2);
  background:var(--surface);padding:0 9px;font-size:12px;color:var(--ink);outline:none;
}
/* 清理设置的自定义天数 */
.rep-row input[type=number]{
  width:88px;height:32px;border-radius:9px;border:1px solid var(--line2);
  background:var(--surface);padding:0 9px;font-size:12px;color:var(--ink);outline:none;
  font-variant-numeric:tabular-nums;
}
.rep-row input[type=number]:focus{border-color:rgba(76,111,255,.45)}
/* 重复区的一句话说明：说清「选了会怎样」，免得规则看着没头没尾 */
.rep-why{
  margin:0 0 8px;font-size:10.5px;line-height:1.6;color:var(--muted);
}
.rep-preview{font-size:11px;color:var(--accent);line-height:1.5}
.rep-preview.hide{display:none}

/* 编辑既有重复日程时的分组信息 */
.grp-row{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:13px;margin-bottom:12px;
  background:rgba(76,111,255,.07);border:1px solid rgba(76,111,255,.16);
  font-size:12px;color:var(--ink2);
}
.grp-row .ic{
  width:28px;height:28px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  background:var(--surface);color:var(--accent);font-size:14px;
}
.grp-row .tx{flex:1;min-width:0;line-height:1.45}
.grp-row .tx b{font-weight:700}
.grp-row button{
  flex:0 0 auto;height:30px;padding:0 11px;border-radius:9px;font-size:11.5px;
