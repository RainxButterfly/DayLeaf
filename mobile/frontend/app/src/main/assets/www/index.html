  /**
   * 计算拆分点。
   * 默认对半（floor 到整点），但长段优先落在偶数整点上：
   * 14:00–24:00 对半是 19:00，而 18:00 才是「下午 / 晚上」的自然分界。
   * @param {number} from 段起点（整点小时）
   * @param {number} to   段终点（整点小时）
   * @returns {number} 拆分点小时
   */
  function splitPointOf(from, to) {
    const span = to - from;
    const center = from + span / 2;

    /* 先对半，对齐到半小时 */
    let mid = Math.round(center * 2) / 2;
    if (mid <= from) mid = from + 0.5;
    if (mid >= to) mid = to - 0.5;
    if (span < 8) return mid;

    /* 长段优先落在偶数整点（14–24 分给 18:00 比 19:00 自然） */
    let best = mid;
    let bestGap = Infinity;
    const fromHalf = Math.round(from * 2);
    const toHalf = Math.round(to * 2);
    for (let k = 1; fromHalf + k < toHalf; k++) {
      const n = fromHalf + k;           // 半小时序号
      if (n % 4 !== 0) continue;        // 4 的倍数 = 偶数整点
      const m = n / 2;
      const gap = Math.abs(m - center);
      /* 距离相同时取较早的那个，前段先分出来 */
      if (gap < bestGap) { best = m; bestGap = gap; }
    }
    return best;
  }

  /** 在中间拆一刀，两段继承原权重（拆分本身不改变外观） */
  function splitBlock(i) {
    const b = state.blocks;
    const from = b.bounds[i];
    const to = b.bounds[i + 1];
    if (to - from < 2) return;
    const mid = splitPointOf(from, to);
    b.bounds.splice(i + 1, 0, mid);
    b.h.splice(i + 1, 0, b.h[i]);
    saveState();
  }

  /** 与下一段合并，采用当前段的权重 */
  function mergeBlock(i) {
    const b = state.blocks;
    if (b.h.length < 2) return;
    b.bounds.splice(i + 1, 1);
    b.h.splice(i + 1, 1);
    saveState();
  }

  /* --------------------------------------------------------------------------
   * 7.9.3 每日一句
   * ------------------------------------------------------------------------ */

  /** 当前可显示的语录池（受「来源」和单条开关约束） */
  function quotePool() {
    const q = state.quotes;
    const list = [];
    if (q.scope !== 'custom') {
      BUILTIN_QUOTES.forEach(function (it) {
        if (!q.off[it.id]) list.push(it);
      });
    }
    if (q.scope !== 'builtin') {
      (q.custom || []).forEach(function (it) {
        if (it.on !== false && it.text) list.push({ id: it.id, text: it.text });
      });
    }
    return list;
  }

  /** 把一条语录画到主页卡片上 */
  function renderQuoteCard(item) {
    const card = $('#quoteCard');
    if (!card) return;
    if (!item) { card.style.display = 'none'; return; }
    card.style.display = '';
    $('#qText').textContent = item.text;
    applyQuoteFont();
    applyQuoteStyle();
    applyQuoteBg();

    const mine = (state.quotes.custom || []).some(function (c) { return c.id === item.id; });
    $('#qSrc').textContent = mine ? '我的语录' : '叶历语录';
  }

  /** 随机换一条并记录，避免连续两次相同；背景图同时换一张 */
  function rollQuote() {
    const pool = quotePool();
    if (!pool.length) { renderQuoteCard(null); return null; }

    let idx = Math.floor(Math.random() * pool.length);
    const prevId = state.quotes.picked && state.quotes.picked.id;
    if (pool.length > 1 && prevId) {
      const pi = pool.map(function (x) { return x.id; }).indexOf(prevId);
      if (pi === idx) idx = (idx + 1) % pool.length;
    }

    const pick = pool[idx];
    state.quotes.picked = { id: pick.id, date: toYMD(new Date()) };
    pickQuoteBg();
    saveState();
    renderQuoteCard(pick);
    return pick;
  }

  /** 当前这条被隐藏/删除时，重新抽一条；否则原样重画 */
  function refreshQuoteCard() {
    const pool = quotePool();
    const picked = state.quotes.picked;
    const cur = picked ? pool.filter(function (x) { return x.id === picked.id; })[0] : null;
    if (cur) renderQuoteCard(cur);
    else rollQuote();
  }

  /* 跟随系统时，系统切换深浅也要跟着变 */
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if ((state.theme || 'light') === 'system') applyTheme();
    });
  }

  /** 启动时按频率决定要不要换 */
  function quoteOnBoot() {
    const q = state.quotes;
    if (!quotePool().length) { renderQuoteCard(null); return; }
    /* 开场层抽到的那条，主页卡片接着显示，视线从开场自然落到卡片上 */
    if (bootQuotePick) {
      const keep = quotePool().filter(function (x) { return x.id === bootQuotePick.id; })[0];
      bootQuotePick = null;
      if (keep) {
        q.picked = { id: keep.id, date: toYMD(new Date()) };
        pickQuoteBg();
        saveState();
        renderQuoteCard(keep);
        return;
      }
    }
    if (!q.picked) { rollQuote(); return; }
    if (q.freq === 'launch' || q.freq === 'view') { rollQuote(); return; }
    if (q.freq === 'daily' && q.picked.date !== toYMD(new Date())) { rollQuote(); return; }
    refreshQuoteCard();
  }

  /** 设置面板里的语录列表 */
  let qTab = 'builtin';
  function renderQuoteList(tab) {
    const list = $('#qList');
    if (!list) return;
    qTab = tab || qTab;

    const q = state.quotes;
    const custom = q.custom || [];

    if (qTab === 'builtin') {
      list.innerHTML = BUILTIN_QUOTES.map(function (it) {
        const on = !q.off[it.id];
        return '<div class="q-item' + (on ? '' : ' off') + '">' +
            '<button class="sw sm' + (on ? ' on' : '') + '" data-qid="' + it.id + '" aria-label="显示这条"></button>' +
            '<span class="q-txt">' + esc(it.text) + '</span>' +
          '</div>';
      }).join('');
    } else {
      list.innerHTML = custom.length
        ? custom.map(function (it) {
            const on = it.on !== false;
            return '<div class="q-item' + (on ? '' : ' off') + '">' +
                '<button class="sw sm' + (on ? ' on' : '') + '" data-qid="' + it.id + '" aria-label="显示这条"></button>' +
                '<span class="q-txt">' + esc(it.text) + '</span>' +
                '<button class="q-del" data-qdel="' + it.id + '" aria-label="删除">×</button>' +
              '</div>';
          }).join('')
        : '<div class="q-empty">还没有自己的语录</div>';
    }

    const tabs = $$('#qTabs button');
    if (tabs[0]) tabs[0].textContent = '内置 ' + BUILTIN_QUOTES.length;
    if (tabs[1]) tabs[1].textContent = '我的 ' + custom.length;
  }

  /* --------------------------------------------------------------------------
   * 7.9.4 资源库（语录背景图 / 自定义字体）
   * 图片和字体体积大，放 IndexedDB；localStorage 只存 id 之类的元数据。
   * IndexedDB 不可用时（例如某些浏览器直接打开本地文件）自动降级到
   * localStorage，再不行就只保留本次会话。
   * ------------------------------------------------------------------------ */

  const AssetDB = (function () {
    const DB = 'dayleaf-assets';
    const STORE = 'assets';
    const PREFIX = 'dlasset:';
    let dbp = null;
    let broken = false;

    function open() {
      if (broken) return Promise.reject(new Error('idb disabled'));
      if (!window.indexedDB) { broken = true; return Promise.reject(new Error('no idb')); }
      if (!dbp) {
        dbp = new Promise(function (resolve, reject) {
          const req = indexedDB.open(DB, 1);
          req.onupgradeneeded = function () {
            const db = req.result;
            if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
          };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error || new Error('idb open failed')); };
        }).catch(function (err) {
          broken = true;
          throw err;
        });
      }
      return dbp;
    }

    const mem = {};   // 最终兜底：仅本次会话

    return {
      /** 写入一个字符串资源（dataURL） */
      put: function (key, val) {
        mem[key] = val;
        return open().then(function (db) {
          return new Promise(function (res, rej) {
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).put(val, key);
            tx.oncomplete = function () { res(true); };
            tx.onerror = function () { rej(tx.error); };
          });
        }).catch(function () {
          try { localStorage.setItem(PREFIX + key, val); return true; }
          catch (e) { return false; }
        });
      },
      /** 删除资源 */
      del: function (key) {
        delete mem[key];
        try { localStorage.removeItem(PREFIX + key); } catch (e) { /* 忽略 */ }
        return open().then(function (db) {
          return new Promise(function (res) {
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).delete(key);
            tx.oncomplete = function () { res(true); };
            tx.onerror = function () { res(false); };
          });
        }).catch(function () { return false; });
      },
      /** 读出全部资源，返回 { key: dataURL } */
      all: function () {
        const out = Object.assign({}, mem);
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.indexOf(PREFIX) === 0) out[k.slice(PREFIX.length)] = localStorage.getItem(k);
          }
        } catch (e) { /* 忽略 */ }

        return open().then(function (db) {
          return new Promise(function (res) {
            const tx = db.transaction(STORE, 'readonly');
            const st = tx.objectStore(STORE);
            const keysReq = st.getAllKeys();
            const valsReq = st.getAll();
            tx.oncomplete = function () {
              const keys = keysReq.result || [];
              const vals = valsReq.result || [];
              keys.forEach(function (k, i) {
                if (typeof vals[i] === 'string') out[k] = vals[i];
              });
              res(out);
            };
            tx.onerror = function () { res(out); };
          });
        }).catch(function () { return out; });
      }
    };
  })();

  /* 运行期缓存：资源 id → dataURL / 已注册的字体族名 */
  const bgCache = {};
  const fontReady = {};
  let curQuoteBgId = null;

  /** ArrayBuffer → base64（分块，避免大字体把调用栈撑爆） */
  function bufToBase64(buf) {
    const bytes = new Uint8Array(buf);
    const CHUNK = 0x8000;
    let bin = '';
    for (let i = 0; i < bytes.length; i += CHUNK) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return btoa(bin);
  }

  /** 启动时把资源灌进缓存，并注册已保存的自定义字体 */
  function loadAssets() {
    return AssetDB.all().then(function (map) {
      Object.keys(map).forEach(function (key) {
        if (key.indexOf('qb_') === 0) {
          bgCache[key.slice(3)] = map[key];
        } else if (key.indexOf('font_') === 0) {
          registerCustomFont(key.slice(5), map[key]);
        }
      });
      /* 背景图 / 主卡图从 IndexedDB 读回（localStorage 里只剩空串） */
      if (map['bg'] && !state.bg.data) { state.bg.data = map['bg']; applyBg(); }
      if (map['hero'] && !state.home.img) { state.home.img = map['hero']; applyHomeLook(); }
      if (!curQuoteBgId) pickQuoteBg();
      applyQuoteFont();
      refreshQuoteCard();
    });
  }

  /**
   * 把 base64 字体注册成 FontFace。
   * @param {string} id     字体 id
   * @param {string} dataUrl data:font/...;base64,...
   */
  function registerCustomFont(id, dataUrl) {
    const meta = (state.quoteFont.custom || []).filter(function (x) { return x.id === id; })[0];
    if (!meta || fontReady[id]) return;
    const alias = 'DLFont_' + id;
    try {
      const face = new FontFace(alias, 'url(' + dataUrl + ')');
      face.load().then(function (loaded) {
        document.fonts.add(loaded);
        fontReady[id] = alias;
        if (state.quoteFont.key === id) applyQuoteFont();
        const pane = document.getElementById('qbPaneFont');
        if (pane && pane.classList.contains('on')) renderFontPane();
      }).catch(function (err) {
        console.warn('[DayLeaf] 字体载入失败', err);
        fontReady[id] = false;
      });
    } catch (err) {
      console.warn('[DayLeaf] 字体注册失败', err);
      fontReady[id] = false;
    }
  }

  /** 当前语录用什么字体栈 */
  function quoteFontStack() {
    const f = state.quoteFont;
    if (f.key && f.key.indexOf('f_') === 0) {
      const alias = fontReady[f.key];
      if (alias) return '"' + alias + '", system-ui, -apple-system, sans-serif';
    }
    const preset = FONT_PRESETS.filter(function (p) { return p.key === f.key; })[0];
    return (preset || FONT_PRESETS[0]).stack;
  }

  /** 把字体应用到语录正文 */
  function applyQuoteFont() {
    const el = $('#qText');
    if (el) el.style.fontFamily = quoteFontStack();
  }

  /** 随机挑一张启用的语录背景图 */
  function pickQuoteBg() {
    const items = (state.quoteBg.items || []).filter(function (it) {
      return it.on !== false && bgCache[it.id];
    });
    if (!items.length) { curQuoteBgId = null; return null; }

    let pool = items.filter(function (it) { return it.id !== curQuoteBgId; });
    if (!pool.length) pool = items;
    curQuoteBgId = pool[Math.floor(Math.random() * pool.length)].id;
    return curQuoteBgId;
  }

  /** 图片库变动后同步卡片：当前这张仍然有效就保留，否则重挑一张 */
  function syncQuoteBg() {
    const items = state.quoteBg.items || [];
    const valid = curQuoteBgId && items.some(function (it) {
      return it.id === curQuoteBgId && it.on !== false && bgCache[it.id];
    });
    if (!valid) {
      curQuoteBgId = null;
      pickQuoteBg();
    }
    applyQuoteBg();
  }

  /**
   * 语录背景变换：每张图都有自己的缩放/水平/垂直（s/x/y），
   * 没设置过的图回落到全局默认（quoteStyle）。
   */
  function curQuoteBgItem() {
    return (state.quoteBg.items || []).filter(function (x) { return x.id === curQuoteBgId; })[0] || null;
  }

  /** 当前生效的背景三参数（有图用图的，没图用全局默认） */
  function quoteBgEff() {
    const st = state.quoteStyle;
    const it = curQuoteBgItem();
    if (!it) return { scale: st.bgScale, x: st.bgX, y: st.bgY };
    return {
      scale: (it.s != null ? it.s : st.bgScale),
      x: (it.x != null ? it.x : st.bgX),
      y: (it.y != null ? it.y : st.bgY)
    };
  }

  /** 写入背景参数：有当前图就写到图上，没有就写到全局默认 */
  function setQuoteBgTweak(key, val) {
    const it = curQuoteBgItem();
    if (it) it[key] = val;
    else {
      if (key === 's') state.quoteStyle.bgScale = val;
      else if (key === 'x') state.quoteStyle.bgX = val;
      else state.quoteStyle.bgY = val;
    }
  }

  /* ------------------------------------------------------------------------
   * 卡片高度：倍率模式（60%–1000%）与 px 模式（12–600）共用一套 CSS 变量。
   * ---------------------------------------------------------------------- */

  /** 归一化：把历史 / 手改坏的数据拉回合法区间，返回 {mode, mul, px} */
  function normPad(st) {
    const s = st || state.quoteStyle || {};
    const mode = s.padMode === 'px' ? 'px' : 'mul';
    let mul = Number(s.pad);
    if (!isFinite(mul) || mul <= 0) mul = Q_PAD_DEF;
    mul = Math.min(Q_PAD_MAX, Math.max(Q_PAD_MIN, Math.round(mul * 100) / 100));
    let px = Number(s.padPx);
    if (!isFinite(px) || px <= 0) px = Q_PX_DEF;
    px = Math.min(Q_PX_MAX, Math.max(Q_PX_MIN, Math.round(px)));
    return { mode: mode, mul: mul, px: px };
  }

  /** 当前高度的人话标签：'1000%' 或 '260px' */
  function padLabel() {
    const p = normPad();
    return p.mode === 'px' ? (p.px + 'px') : (Math.round(p.mul * 100) + '%');
  }

  /** 滑块位置。px 模式按 15px ≈ 100% 折算，方便继续拖 */
  function padSliderVal() {
    const p = normPad();
    const v = p.mode === 'px' ? Math.round(p.px / 15 * 100) : Math.round(p.mul * 100);
    return Math.min(1000, Math.max(60, v));
  }

  /**
   * 解析用户手输的高度。
   * 支持 '3.5'（倍）/ '350%' / '260px'；裸数字 >10 当 px，≤10 当倍。
   * @returns {{ok:boolean, mode?:string, val?:number, msg?:string}}
   */
  function parsePadInput(raw) {
    const s = String(raw == null ? '' : raw).trim().replace(/\s+/g, '');
    if (!s) return { ok: false, msg: '先填个值，比如 3.5、350% 或 260px' };

    const m = s.match(/^(-?\d+(?:\.\d+)?)(px|%|倍|倍率|x|×)?$/i);
    if (!m) return { ok: false, msg: '只认数字，可带 % / px / 倍（例：3.5、350%、260px）' };

    const num = Number(m[1]);
    if (!isFinite(num) || num <= 0) return { ok: false, msg: '要填一个大于 0 的数' };

    const unit = (m[2] || '').toLowerCase();
    if (unit === 'px') {
      if (num < Q_PX_MIN || num > Q_PX_MAX) {
        return {
          ok: false, fallback: true,
          msg: '像素超出范围（' + Q_PX_MIN + '–' + Q_PX_MAX + 'px），已回到 100%'
        };
      }
      return { ok: true, mode: 'px', val: Math.round(num) };
    }
    const mul = (unit === '%') ? num / 100 : num;
    if (mul < Q_PAD_MIN || mul > Q_PAD_MAX) {
      return {
        ok: false, fallback: true,
        msg: '超出范围（' + Math.round(Q_PAD_MIN * 100) + '%–' + Math.round(Q_PAD_MAX * 100) + '%），已回到 100%'
      };
    }
    return { ok: true, mode: 'mul', val: Math.round(mul * 100) / 100 };
  }

  /** 写回 state 并重画；mode 为 'mul'|'px' */
  function setPad(mode, val) {
    const st = state.quoteStyle;
    if (mode === 'px') { st.padMode = 'px'; st.padPx = val; }
    else { st.padMode = 'mul'; st.pad = val; }
    applyQuoteStyle();
    syncPadUI();
    saveState();
  }

  /** 设置面板里的三处控件（滑块数值 / 档位高亮 / 输入框）保持一致 */
  function syncPadUI() {
    const lab = $('#vQPad');
    if (lab) lab.textContent = padLabel();
    const sl = $('#fQPad');
    if (sl) sl.value = String(padSliderVal());
    const inp = $('#fQPadCust');
    if (inp) { inp.value = padLabel(); inp.classList.remove('bad'); }
    $$('#qPadPreset button').forEach(function (b) {
      b.classList.toggle('on', state.quoteStyle.padMode !== 'px' &&
        Math.round(state.quoteStyle.pad * 100) === Number(b.dataset.pad));
    });
  }

  /** 语录卡的尺寸与背景变换（字号 / 高度 / 缩放 / 位置） */
  function applyQuoteStyle() {
    const st = state.quoteStyle || {};
    const card = $('#quoteCard');
    if (!card) return;

    const p = normPad(st);
    /* px 模式把倍率归零、px 模式把倍率关掉，两者相加就是最终内边距 */
    card.style.setProperty('--q-fs', String(st.fs));
    card.style.setProperty('--q-pad', p.mode === 'px' ? '0' : String(p.mul));
    card.style.setProperty('--q-padpx', p.mode === 'px' ? (p.px + 'px') : '0px');
    /* 单边内边距 ≥120px（约 800% 起）切到「海报式」居中排版 */
    const side = p.mode === 'px' ? p.px : Math.round(15 * p.mul);
    card.classList.toggle('is-tall', side >= 120);

    const layer = $('#qbg');
    if (layer) {
      /* 缩放作用在背景层上，卡片尺寸和文字排版都不受影响 */
      const t = quoteBgEff();
      layer.style.transform = 'scale(' + t.scale + ')';
      layer.style.backgroundPosition = t.x + '% ' + t.y + '%';
    }
  }

  /** 把当前背景图贴到卡片上 */
  function applyQuoteBg() {
    const card = $('#quoteCard');
    if (!card) return;
    const layer = $('#qbg');
    const url = curQuoteBgId ? bgCache[curQuoteBgId] : null;
    if (url) {
      card.classList.add('has-bg');
      if (layer) layer.style.backgroundImage = 'url("' + url + '")';
    } else {
      card.classList.remove('has-bg');
      if (layer) layer.style.backgroundImage = '';
    }
    applyQuoteStyle();
  }

  /** 设置面板里的图片库 */
  function renderQuoteBgPane() {
    const box = $('#qbPaneImage');
    if (!box) return;
    const items = state.quoteBg.items || [];

    let html = '';
    if (!items.length) {
      html += '<div class="qb-empty">还没有背景图。<br>加几张自然风景，每条语录会随机配一张。</div>';
    } else {
      html += '<div class="qb-grid">';
      items.forEach(function (it) {
        const on = it.on !== false;
        const url = bgCache[it.id] || '';
        html += '<div class="qb-cell' + (on ? ' on' : '') + '" data-qb="' + it.id + '" ' +
            'style="background-image:url(\'' + url + '\')" title="' + esc(it.name || '未命名') + '">' +
            '<span class="mask">已隐藏</span>' +
            '<button class="del" data-qbdel="' + it.id + '" aria-label="删除">×</button>' +
          '</div>';
      });
      html += '<label class="qb-add" style="position:relative;overflow:hidden">+<input type="file" id="fQbFile" accept="image/*" multiple style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>';
      html += '</div>';
      html += '<div class="sp-note" style="margin:0">点图片可切换是否参与随机；最多 ' + ASSET_LIMIT.image + ' 张。</div>';
    }
    box.innerHTML = html;

    if (!items.length) {
      box.innerHTML += '<label class="qb-add" style="position:relative;overflow:hidden">+ 添加图片' +
        '<input type="file" id="fQbFile" accept="image/*" multiple style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>';
    }
  }

  /** 设置面板里的字体列表 */
  function renderFontPane() {
    const box = $('#qbPaneFont');
    if (!box) return;
    const f = state.quoteFont;
    const custom = f.custom || [];

    let html = '<div class="fn-group">内置字体</div><div class="fn-list">';
    FONT_PRESETS.forEach(function (p) {
      html += '<div class="fn-item' + (f.key === p.key ? ' on' : '') + '" data-font="' + p.key + '">' +
          '<span class="fn-name" style="font-family:' + p.stack + '">' + p.label + ' · 把今天过完</span>' +
        '</div>';
    });
    html += '</div>';

    html += '<div class="fn-group">我的字体</div>';
    if (!custom.length) {
      html += '<div class="qb-empty">还没有上传字体。<br>支持 .ttf / .otf / .woff / .woff2，单个不超过 5 MB。</div>';
    } else {
      html += '<div class="fn-list">';
      custom.forEach(function (it) {
        const st = fontReady[it.id];
        const alias = typeof st === 'string' ? st : '';
        const tag = st === false ? '无法载入' : (alias ? '' : '载入中');
        html += '<div class="fn-item' + (f.key === it.id ? ' on' : '') + '" data-font="' + it.id + '">' +
            '<span class="fn-name" style="font-family:' + (alias || 'inherit') + '">' +
              esc(it.name) + (alias ? ' · 把今天过完' : '') +
            '</span>' +
            (tag ? '<span class="fn-tag">' + tag + '</span>' : '') +
            '<button class="fn-del" data-fndel="' + it.id + '" aria-label="删除">×</button>' +
          '</div>';
      });
      html += '</div>';
    }

    html += '<label class="qb-add" style="position:relative;overflow:hidden">+ 上传字体文件' +
      '<input type="file" id="fFontFile" accept=".ttf,.otf,.woff,.woff2,font/*" style="position:absolute;inset:0;opacity:0;cursor:pointer">' +
    '</label>';

    box.innerHTML = html;
  }

  /* --------------------------------------------------------------------------
   * 7.9.9 全局搜索
   * ------------------------------------------------------------------------ */

  /** 把匹配关键词的那一段包上高亮标记（先转义，避免注入） */
  function hlText(text, kw) {
    const safe = esc(text);
    if (!kw) return safe;
    const i = text.toLowerCase().indexOf(kw.toLowerCase());
    if (i < 0) return safe;
    return safe.slice(0, i) + '<mark>' + safe.slice(i, i + kw.length) + '</mark>' + safe.slice(i + kw.length);
  }

  function openSearch() {
    $('#searchRoot').classList.add('open');
    pushModal(closeSearch);
    $('#searchInput').value = '';
    renderSearch('');
    setTimeout(function () { $('#searchInput').focus(); }, 60);
  }

  function closeSearch() {
    popModal(closeSearch);
    $('#searchRoot').classList.remove('open');
  }

  /** 搜索标题 / 地点 / 备注，结果按日期时间升序 */
  function renderSearch(q) {
    const list = $('#searchList');
    const foot = $('#searchFoot');
    const kw = (q || '').trim();

    if (!kw) {
      list.innerHTML = isMobileView()
        ? '<div class="sr-empty">输入关键词，搜标题、地点、备注。</div>'
        : '<div class="sr-empty">输入关键词，搜标题、地点、备注。<br>随时按 Ctrl+K 唤起。</div>';
      foot.textContent = isMobileView() ? '点空白处关闭' : '按 Esc 关闭';
      return;
    }

    const lower = kw.toLowerCase();
    const results = state.events
      .filter(function (e) {
        return (e.t || '').toLowerCase().indexOf(lower) > -1 ||
          (e.p || '').toLowerCase().indexOf(lower) > -1 ||
          (e.n || '').toLowerCase().indexOf(lower) > -1;
      })
      .sort(function (a, b) { return (a.d + a.s).localeCompare(b.d + b.s); })
      .slice(0, 60);

    if (!results.length) {
      list.innerHTML = '<div class="sr-empty">没有匹配「' + esc(kw) + '」的日程</div>';
      foot.textContent = '';
      return;
    }

    const todayStr = toYMD(new Date());
    list.innerHTML = results.map(function (e) {
      const d = fromYMD(e.d);
      const past = e.d < todayStr;
      const sub = [e.p, e.n].filter(Boolean).join(' · ');
      return '<button class="sr-item" data-id="' + e.id + '">' +
        '<span class="sr-date' + (past ? ' is-past' : '') + '"><b>' + d.getDate() + '</b><span>' +
          (d.getMonth() + 1) + '月</span></span>' +
        '<span class="sr-main">' +
          '<span class="sr-title">' + hlText(e.t, kw) + '</span>' +
          (sub ? '<span class="sr-sub">' + hlText(sub, kw) + '</span>' : '') +
        '</span>' +
        '<span class="sr-time">' + e.s + '</span>' +
      '</button>';
    }).join('');

    foot.textContent = results.length + ' 条结果';
  }

  /** 跳到结果所在的那一周，并直接打开详情 */
  function goToEvent(id) {
    const ev = state.events.filter(function (x) { return x.id === id; })[0];
    if (!ev) return;
    closeSearch();
    switchView('grid');
    weekStart = startOfWeek(fromYMD(ev.d));
    renderGrid();
    scrollGridTo(Math.max(GRID_START / 60, toMin(ev.s) / 60 - 1));
    openEventDialog(id);
  }

  /* --------------------------------------------------------------------------
   * 7.9.8 首次启动引导（遮罩式分步教学）
   * 只在首次打开时出现一次；走完或跳过都写入本地标记，之后不再自动弹。
   * 每一步只讲一件事：这是什么、怎么用。
   * ------------------------------------------------------------------------ */

  const GUIDE_KEY = 'dayleaf.guide.v1';

  /**
   * 引导步骤。
   * view 会先切到对应视图，sel 是要聚焦的区域。
   */
  const GUIDE_STEPS = [
    {
      view: 'home', sel: '#hero', title: '倒计时主卡',
      text: '最近一件事的倒计时。点一下这张卡，可以直接改它的时间和地点。'
    },
    {
      view: 'home', sel: '#todayList', title: '今日日程',
      text: '今天所有安排按顺序排在这儿，点任意一条看详情、改状态。'
    },
    {
      view: 'grid', sel: '#gridWrap', title: '表格页',
      text: '左边是时间、上边是日期。点空格子新建一个日程；长按卡片可以拖着改时间，拖到别的列就是改日期。'
    },
    {
      view: 'notes', sel: '#calGrid', title: '记事页',
      text: '点某一天写日记或提纲；长按标记模式可以用颜色把相关的日子串起来。'
    },
    {
      view: 'home', sel: '#fab', title: '随时新建',
      text: '右下角这个 + 在任何页面都能新建日程。没写完就关掉也没关系，会留成草稿。'
    }
  ];

  let guideIdx = 0;

  function guideSeen() {
    try { return localStorage.getItem(GUIDE_KEY) === '1'; } catch (e) { return true; }
  }

  function markGuideDone() {
    try { localStorage.setItem(GUIDE_KEY, '1'); } catch (e) { /* 无痕模式就算了 */ }
  }

  function startGuide(force) {
    if (!force && guideSeen()) return;
    const root = $('#guideRoot');
    if (!root) return;
    guideIdx = 0;
    root.hidden = false;
    pushModal(endGuide);
    const skip = $('#gtSkip');
    const next = $('#gtNext');
    if (skip) skip.onclick = function () { endGuide(); };
    if (next) next.onclick = function () {
      if (guideIdx >= GUIDE_STEPS.length - 1) { endGuide(); return; }
      guideIdx++;
      paintGuide();
    };
    paintGuide();
  }

  function endGuide() {
    const root = $('#guideRoot');
    popModal(endGuide);
    if (root) { root.hidden = true; }
    markGuideDone();
    switchView('home');
  }

  /** 画当前这一步：切视图 → 定位高亮框 → 摆好气泡 */
  function paintGuide() {
    const step = GUIDE_STEPS[guideIdx];
    const root = $('#guideRoot');
    if (!step || !root) { endGuide(); return; }

    switchView(step.view);

    /* 等视图渲染完再量位置 */
    setTimeout(function () {
      const target = document.querySelector(step.sel);
      const hole = $('#guideHole');
      const tip = $('#guideTip');
      if (!target || !hole || !tip) { guideIdx++; paintGuide(); return; }

      const r = target.getBoundingClientRect();
      const pad = 8;
      const top = Math.max(6, r.top - pad);
      const left = Math.max(6, r.left - pad);
      hole.style.top = top + 'px';
      hole.style.left = left + 'px';
      hole.style.width = Math.min(window.innerWidth - 12, r.width + pad * 2) + 'px';
      hole.style.height = r.height + pad * 2 + 'px';

      $('#gtTitle').textContent = (guideIdx + 1) + ' / ' + GUIDE_STEPS.length + ' · ' + step.title;
      $('#gtText').textContent = step.text;
      $('#gtNext').textContent = guideIdx === GUIDE_STEPS.length - 1 ? '开始使用' : '下一步';

      $('#gtDots').innerHTML = GUIDE_STEPS.map(function (_, i) {
        return '<i class="' + (i === guideIdx ? 'on' : '') + '"></i>';
      }).join('');

      /* 高亮在屏幕下半 → 气泡放上面，反之放下面 */
      const tipH = tip.offsetHeight || 150;
      const below = top + r.height + 14 + tipH < window.innerHeight - 8;
      tip.style.top = (below
        ? Math.min(window.innerHeight - tipH - 10, top + r.height + pad + 12)
        : Math.max(10, top - tipH - 12)) + 'px';
    }, 260);
  }

  /** 窗口尺寸变化时重新摆一次，避免高亮框跑偏 */
  window.addEventListener('resize', function () {
    if ($('#guideRoot') && !$('#guideRoot').hidden) paintGuide();
  });

  /* --------------------------------------------------------------------------
   * 7.10 导航与全局交互
   * ------------------------------------------------------------------------ */
  function switchView(name) {
    currentView = name;
    $$('.view').forEach(function (v) {
      v.classList.toggle('active', v.id === 'view-' + name);
    });
    $$('[data-nav]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.nav === name);
    });
    /* 三个页面都能直接新建，不用为了加日程先切回主页 */
    /* 表格页不放加号：那一屏本来就是「点空格子直接画一条」，
       再挂个悬浮按钮既挡格子、拖日程时还会被当成无效区，纯冗余 */
    $('#fab').classList.toggle('show', name === 'home' || name === 'notes');

    if (name === 'home') {
      renderHome();
      /* 「回到主页」频率：每次切回来换一条 */
      if (quoteBooted && state.quotes.freq === 'view') rollQuote();
    }
    if (name === 'grid') {
      renderGrid();
      if (!gridInited) {
        gridInited = true;
        const h = defaultGridHour();
        setTimeout(function () { scrollGridTo(h); }, 30);
      }
    }
    if (name === 'notes') {
      renderCalendar();
      renderEditor();
    }
  }

  /** 全量重绘 */
  function renderAll() {
    renderHome();
    renderGrid();
    renderCalendar();
    renderEditor();
  }

  /* ---- 事件绑定 ---- */
  function bindEvents() {
    /* 导航 */
    $$('[data-nav]').forEach(function (b) {
      b.addEventListener('click', function () { switchView(b.dataset.nav); });
    });

    /* 设置入口（导轨 / 主页 / 记事页） */
    ['btnSettings', 'btnSettingsHome', 'btnSettingsNotes', 'btnSettingsRail'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.addEventListener('click', openSettings);
    });

    /* 新增按钮 */
    $('#fab').addEventListener('click', function () {
      if (currentView === 'grid') {
        const d = new Date();
        openEventDialog(null, { d: toYMD(d), s: '09:00', e: '10:00' });
      } else {
        openEventDialog(null);
      }
    });

    /* ---- 主页面：点今日日程打开详情 ---- */
    $('#todayList').addEventListener('click', function (e) {
      /* 点右侧的状态块 = 直接切换 待办 → 完成 → 缺席，不用进详情 */
      const badge = e.target.closest('.t-st');
      if (badge) {
        e.stopPropagation();
        const row = badge.closest('.trow');
        if (row) cycleEventStatus(row.dataset.id);
        return;
      }
      const row = e.target.closest('.trow');
      if (row) openEventDialog(row.dataset.id);
    });

    /* ---- 全局搜索：入口 + 输入 + 结果点击 ---- */
    ['btnSearchHome', 'btnSearchNotes', 'btnSearchGrid'].forEach(function (id) {
      const b = document.getElementById(id);
      if (b) {
        b.addEventListener('click', openSearch);
        /* 手机没有 Ctrl 键，去掉快捷键提示；桌面端保留 */
        if (isMobileView()) b.setAttribute('title', '搜索日程');
      }
    });
    /* 手机没有 Esc 键，搜索框关闭按钮显示「取消」而非 Esc */
    if (isMobileView()) {
      const escBtn = document.querySelector('#searchRoot .search-esc');
      if (escBtn) escBtn.textContent = '取消';
    }
    $('#searchInput').addEventListener('input', function () { renderSearch(this.value); });
    $('#searchList').addEventListener('click', function (e) {
      const item = e.target.closest('.sr-item');
      if (item) goToEvent(item.dataset.id);
    });
    $$('#searchRoot [data-close]').forEach(function (el) {
      el.addEventListener('click', closeSearch);
    });

    /* ---- 主页面：点主卡打开「下一个日程」的详情 ---- */
    $('#hero').addEventListener('click', function (e) {
      /* 收尾态上的「标记完成」优先，点其它地方才是看详情 */
      const doneBtn = e.target.closest('[data-hero-done]');
      if (doneBtn) {
        const target = state.events.filter(function (x) { return x.id === doneBtn.dataset.heroDone; })[0];
        if (target) {
          target.st = 'done';
          saveState();
          renderAll();
          toast('已标记完成 ✓');
        }
        return;
      }
      const id = this.dataset.ev;
      if (id) openEventDialog(id);
    });

    /* ---- 主页面：本周概览 → 跳到表格页对应周 ---- */
    $('#weekStrip').addEventListener('click', function (e) {
      const day = e.target.closest('.wk-day');
      if (!day) return;
      weekStart = startOfWeek(fromYMD(day.dataset.date));
      switchView('grid');
      scrollGridTo(defaultGridHour());
    });

    /* ---- 数据概览：展开明细 / 就地标完成 / 点标题进编辑 ---- */
    $('#statCard').addEventListener('click', function (e) {
      const doneBtn = e.target.closest('[data-done]');
      if (doneBtn) {
        const target = state.events.filter(function (x) { return x.id === doneBtn.dataset.done; })[0];
        if (target) {
          target.st = 'done';
          saveState();
          renderAll();
          toast('已标记完成 ✓');
        }
        return;
      }
      const open = e.target.closest('[data-open]');
      if (open) { openEventDialog(open.dataset.open); return; }

      const tog = e.target.closest('[data-toggle]');
      if (tog) {
        statOpen = statOpen === tog.dataset.toggle ? '' : tog.dataset.toggle;
        renderStatDetail();
      }
    });

    /* ---- 表格页：左右滑动切周（移动端手势） ---- */
    (function bindWeekSwipe() {
      const wrap = $('#gridWrap');
      let sx = 0;
      let sy = 0;
      let tracking = false;

      wrap.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) { tracking = false; return; }
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
        tracking = true;
      }, { passive: true });

      wrap.addEventListener('touchend', function (e) {
        if (!tracking) return;
        tracking = false;
        const t = e.changedTouches[0];
        const dx = t.clientX - sx;
        const dy = t.clientY - sy;

        /* 位移够长、且明显偏水平才算翻周；否则当成点卡片或上下滚动 */
        if (Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy) * 1.8) return;

        weekStart = addDays(weekStart, dx < 0 ? 7 : -7);
        renderGrid();
        toast(weekRangeText());
      }, { passive: true });
    })();

    /* ---- 表格页：周切换 ---- */
    $('#wkPrev').addEventListener('click', function () {
      weekStart = addDays(weekStart, -7); renderGrid();
    });
    $('#wkNext').addEventListener('click', function () {
      weekStart = addDays(weekStart, 7); renderGrid();
    });
    $('#wkToday').addEventListener('click', function () {
      weekStart = startOfWeek(new Date());
      renderGrid();
      scrollGridTo(defaultGridHour());
    });

    /* ---- 表格页：时间块拉伸 ---- */
    $('#btnStretch').addEventListener('click', openStretch);

    /* ---- 主页面：手动换一条语录 ---- */
    $('#qNext').addEventListener('click', function () { rollQuote(); });

    /* ---- 草稿条：继续编辑 / 丢弃（二次确认） ---- */
    $('#dbGo').addEventListener('click', resumeDraft);
    $('#dbX').addEventListener('click', function () {
      const btn = this;
      if (!btn.classList.contains('armed')) {
        btn.classList.add('armed');
        btn.textContent = '丢弃？';
        clearTimeout(btn._arm);
        btn._arm = setTimeout(function () {
          btn.classList.remove('armed');
          btn.textContent = '✕';
        }, 2600);
        return;
      }
      clearTimeout(btn._arm);
      clearDraft();
      toast('草稿已丢弃');
    });

    /* ---- 表格页：点表头 → 当天 09:00 新建 ---- */
    $('#gridHead').addEventListener('click', function (e) {
      const day = e.target.closest('.gh-day');
      if (!day) return;
      openEventDialog(null, { d: day.dataset.date, s: '09:00', e: '10:00' });
    });

    /* ---- 表格页：点日程 → 详情；点空白 → 按 30 分钟吸附新建 ---- */
    /* ---- 表格页：点空白建 1 小时；按住往下拖，划多大就是多久 ---- */
    (function bindGridCreate() {
      const body = $('#gridBody');
      const wrap = $('#gridWrap');
      const ARM_DELAY = 220;      // 按住多久进入拖拽
      const MOVE_TOL = 6;         // 超过这个位移就当成在动
      const DRAG_SLOT = 15;       // 拖拽吸附粒度（分钟）

      let cur = null;
      let armTimer = null;
      let lastCreate = 0;   // 记录最近一次创建时间，避免 pointerup 与 click 重复创建

      /** 像素位置 → 吸附到 15 分钟的时间 */
      let colTop = 0;   // 拖拽/点击期间缓存的列顶，避免反复 getBoundingClientRect

      function minAt(clientY) {
        if (!lastGeo) return GRID_START;
        const y = clientY - colTop;
        const raw = lastGeo.minOf(y);
        return Math.max(GRID_START, Math.min(GRID_END, Math.round(raw / DRAG_SLOT) * DRAG_SLOT));
      }

      function paintGhost() {
        if (!cur || !cur.armed || !lastGeo) return;
        const a = Math.min(cur.start, cur.end);
        const b = Math.max(cur.start, cur.end);
        const top = lastGeo.yOf(a);
        const hgt = Math.max(20, lastGeo.yOf(b) - top);

        if (!cur.ghost) {
          cur.ghost = document.createElement('div');
          cur.ghost.className = 'drag-ghost';
          cur.col.appendChild(cur.ghost);
        }
        cur.ghost.style.top = top.toFixed(1) + 'px';
        cur.ghost.style.height = hgt.toFixed(1) + 'px';
        cur.ghost.textContent = toHM(a) + ' – ' + toHM(b);
      }

      function cleanup() {
        clearTimeout(armTimer);
        armTimer = null;
        if (cur && cur.ghost) cur.ghost.remove();
        cur = null;
        document.body.classList.remove('is-dragging');
      }

      body.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (e.target.closest('.ev')) return;          // 点卡片是看详情
        const col = e.target.closest('.gcol');
        if (!col) return;
        colTop = col.getBoundingClientRect().top;

        cur = {
          col: col,
          date: col.dataset.date,
          start: minAt(e.clientY),
          end: minAt(e.clientY),
          y0: e.clientY,
          pointerId: e.pointerId,
          armed: false,
          moved: false,
          ghost: null
        };

        /* 按住不动 → 进入拖拽；直接松手 → 还是原来的「点一下建 1 小时」 */
        armTimer = setTimeout(function () {
          if (!cur) return;
          cur.armed = true;
          try { cur.col.setPointerCapture(cur.pointerId); } catch (err) {}
          document.body.classList.add('is-dragging');
          paintGhost();
        }, ARM_DELAY);
      });

      body.addEventListener('pointermove', function (e) {
        if (!cur || e.pointerId !== cur.pointerId) return;

        if (!cur.armed) {
          /* 还没按住就动了 → 用户想滚页面，让给浏览器 */
          if (Math.abs(e.clientY - cur.y0) > MOVE_TOL) cleanup();
          return;
        }

        cur.moved = true;
        cur.end = minAt(e.clientY);
        paintGhost();
        if (e.cancelable) e.preventDefault();
      }, { passive: false });

      /* 拖拽期间要挡住页面滚动，否则一拖就跟着走 */
      wrap.addEventListener('touchmove', function (e) {
        if (cur && cur.armed && e.cancelable) e.preventDefault();
      }, { passive: false });

      function finish(commit) {
        const c = cur;
        cleanup();
        if (!c || !commit) return;

        /* 只有真正拖拽（长按 + 移动）才在松手时创建；
           单击交给 click 处理，避免「松手先开面板、随后 click 又点到遮罩把面板关掉」的竞态 */
        if (!c.armed || !c.moved) return;

        const a = Math.min(c.start, c.end);
        let b = Math.max(c.start, c.end);
        if (b - a < DRAG_SLOT) b = Math.min(GRID_END, a + 60);

        lastCreate = Date.now();
        openEventDialog(null, { d: c.date, s: toHM(a), e: toHM(b) });
      }

      body.addEventListener('pointerup', function (e) {
        if (!cur || e.pointerId !== cur.pointerId) return;
        finish(true);
      });

      body.addEventListener('pointercancel', function () { finish(false); });

      /* 点卡片进详情；点空白单元格直接建 1 小时（单击即可创建） */
      body.addEventListener('click', function (e) {
        const evEl = e.target.closest('.ev');
        if (evEl) { openEventDialog(evEl.dataset.id); return; }
        if (Date.now() - lastCreate < 400) return;   // 刚由拖拽/点按创建过，别重复
        const col = e.target.closest('.gcol');
        if (!col) return;
        colTop = col.getBoundingClientRect().top;
        const a = Math.max(GRID_START, Math.min(GRID_END - 60, minAt(e.clientY)));
        const b = Math.min(GRID_END, a + 60);
        openEventDialog(null, { d: col.dataset.date, s: toHM(a), e: toHM(b) });
      });
    })();

    /* ------------------------------------------------------------------
     * 表格页：长按卡片 → 拖着改时间 / 改日期
     * 手势参数（写死在常量里，方便调）：
     *   HOLD_MS   300ms  按住多久进入拖动（比「按下就建」的 220ms 长，避免误触）
     *   MOVE_TOL  8px    进入拖动前的位移容差，超了就当成想滚动页面
     *   SNAP      15min  时间吸附粒度
     *   EDGE      52px   左右边缘热区宽度
     *   EDGE_WAIT 600ms  在边缘停留多久开始翻页
     *   EDGE_STEP 900ms  翻页后每隔多久再翻一页（翻页不打断拖动）
     * ---------------------------------------------------------------- */
    (function bindGridMove() {
      const body = $('#gridBody');
      const wrap = $('#gridWrap');

      const HOLD_MS = 300;
      const MOVE_TOL = 8;
      const SNAP = 15;
      const EDGE = 52;
      const EDGE_WAIT = 600;
      const EDGE_STEP = 900;

      let st = null;
      let lastMoveEnd = 0;      // 刚拖完的那一下不算「点击」
      let colCache = null;      // 拖拽期间缓存的列几何，避免每帧 getBoundingClientRect 强制回流
      let wrapRect = null;

      function cacheGeo() {
        wrapRect = wrap.getBoundingClientRect();
        colCache = [];
        body.querySelectorAll('.gcol').forEach(function (col) {
          const r = col.getBoundingClientRect();
          /* 只缓存横向位置（left/right 不随纵向滚动变化）与列高；
             纵向 top 会随 scrollTop 变，每帧实时取，避免缓存过期错位 */
          colCache.push({ el: col, left: r.left, right: r.right, h: col.clientHeight, date: col.dataset.date });
        });
      }

      function makeGhost(ev) {
        const g = document.createElement('div');
        g.className = 'move-ghost';
        g.style.setProperty('--h', hueOf(ev.t));
        g.innerHTML = '<b>' + esc(ev.t) + '</b><span></span>';
        document.body.appendChild(g);
        return g;
      }

      function makeTip() {
        const t = document.createElement('div');
        t.className = 'move-tip';
        document.body.appendChild(t);
        return t;
      }

      /**
       * 指针底下是哪一列、落在几点。
       * 用几何算而不是 elementFromPoint —— 手指底下的东西随时会变
       * （跟随的浮起卡片、加号按钮、气泡），用命中测试会被它们挡住，
       * 明明还在表格里却被判成「松手取消」。
       */
      function hitTestAt(cx, cy, dur) {
        if (!lastGeo) return null;
        if (!colCache || !wrapRect) cacheGeo();
        /* 真的拖出表格（比如甩到顶部日期栏、底部导航栏上）才算无效区 */
        if (cx < wrapRect.left - 24 || cx > wrapRect.right + 24) return null;
        if (cy < wrapRect.top - 10 || cy > wrapRect.bottom + 10) return null;

        /* 取横向最近的一列（不要求正压在列上，手指滑过缝隙也算）——用缓存，避免每帧强制回流 */
        let best = null;
        for (let i = 0; i < colCache.length; i++) {
          const r = colCache[i];
          const dx = (cx < r.left) ? (r.left - cx) : (cx > r.right ? cx - r.right : 0);
          if (!best || dx < best.dx) best = { c: r, dx: dx };
        }
        if (!best) return null;

        /* 纵向：命中列的顶部随滚动变化，实时取一次即可（原本每帧取 7 次） */
        const top = best.c.el.getBoundingClientRect().top;
        const y = Math.max(top, Math.min(top + best.c.h - 1, cy));
        const m = Math.round(lastGeo.minOf(y - top) / SNAP) * SNAP;
        return {
          col: best.c.el,
          date: best.c.date,
          start: Math.max(GRID_START, Math.min(GRID_END - dur, m))
        };
      }
      function hitTest(cx, cy) {
        return st ? hitTestAt(cx, cy, st.dur) : null;
      }

      /** 落点预览：在目标列画出「松手会落在这儿」，翻页后也能看见自己还捏着东西 */
      function paintSlot(hit) {
        if (!hit || !lastGeo) { $$('.move-slot').forEach(function (n) { n.remove(); }); return; }
        let slot = hit.col.querySelector('.move-slot');
        $$('.move-slot').forEach(function (n) { if (n !== slot) n.remove(); });
        if (!slot) {
          slot = document.createElement('div');
          slot.className = 'move-slot';
          slot.innerHTML = '<span></span>';
          hit.col.appendChild(slot);
        }
        const top = lastGeo.yOf(hit.start);
        const h = lastGeo.yOf(Math.min(GRID_END, hit.start + st.dur)) - top;
        slot.style.top = top + 'px';
        slot.style.height = Math.max(16, h) + 'px';
        slot.querySelector('span').textContent = toHM(hit.start) + '–' +
          toHM(Math.min(GRID_END, hit.start + st.dur));
      }

      function paint() {
        if (!st || !st.armed || !st.ghost) return;
        const hit = hitTest(st.cx, st.cy);
        st.target = hit;
        paintSlot(hit);
        const tail = toHM(Math.min(GRID_END, (hit ? hit.start : toMin(st.ev.s)) + st.dur));

        st.ghost.style.transform =
          'translate(' + (st.cx - st.x0) + 'px,' + (st.cy - st.y0) + 'px) scale(1.04)';
        st.ghost.querySelector('span').textContent = (hit ? toHM(hit.start) : st.ev.s) + '–' + tail;

        if (hit) {
          const d = fromYMD(hit.date);
          st.tip.className = 'move-tip';
          st.tip.textContent = WEEKDAY[d.getDay()] + ' ' + (d.getMonth() + 1) + '/' + d.getDate() +
            ' · ' + toHM(hit.start) + '–' + tail;
        } else {
          st.tip.className = 'move-tip is-bad';
          st.tip.textContent = '松手取消';
        }
        const tw = st.tip.offsetWidth || 120;
        st.tip.style.transform = 'translate(' +
          Math.max(8, Math.min(window.innerWidth - tw - 8, st.cx - tw / 2)) + 'px,' +
          Math.max(6, st.cy - 44) + 'px)';
      }

      function stopEdge(s) {
        clearTimeout(s.edgeTimer);
        clearInterval(s.edgeStep);
        clearInterval(s.scrollStep);
        s.edgeTimer = null;
        s.edgeStep = null;
        s.edgeDir = 0;
        s.scrollStep = null;
        s.scrollDir = 0;
      }

      /** 翻一页（上一周 / 下一周）；DOM 会重建，占位要重新挂上 */
      function flip(dir) {
        weekStart = addDays(weekStart, dir * 7);
        renderGrid();
        colCache = null; wrapRect = null;   // DOM 重建后缓存失效，下次 paint 重新缓存
        if (st.holdEl) st.holdEl.classList.remove('ev-source');
        st.holdEl = body.querySelector('.ev[data-id="' + st.id + '"]');
        if (st.holdEl) st.holdEl.classList.add('ev-source');
        paint();
      }

      /** 拖到上下边缘时自动滚动表格：想放到很早/很晚的时刻，不用先松手再滚 */
      function updateScroll(cy) {
        if (!wrapRect) cacheGeo();
        const dir = (cy - wrapRect.top <= 56) ? -1 : ((wrapRect.bottom - cy <= 56) ? 1 : 0);
        if (!dir) {
          if (st.scrollStep) { clearInterval(st.scrollStep); st.scrollStep = null; st.scrollDir = 0; }
          return;
        }
        if (st.scrollStep && st.scrollDir === dir) return;
        if (st.scrollStep) clearInterval(st.scrollStep);
        st.scrollDir = dir;
        st.scrollStep = setInterval(function () {
          if (!st) return;
          wrap.scrollTop += dir * 12;
          paint();
        }, 40);
      }

      function updateEdge(cx) {
        if (!wrapRect) cacheGeo();
        /* 只有真正拖出表格左右边界才翻页；在周一/周日等本周末列内绝不触发，
           否则「拖到周一放一下」会被误判成翻页 */
        const dir = (cx < wrapRect.left) ? -1 : (cx > wrapRect.right) ? 1 : 0;
        if (!dir) { stopEdge(st); return; }
        if (st.edgeDir === dir && st.edgeTimer) return;
        stopEdge(st);
        st.edgeDir = dir;
        st.edgeTimer = setTimeout(function () {
          if (!st) return;
          flip(dir);
          st.edgeStep = setInterval(function () { if (st) flip(dir); }, EDGE_STEP);
        }, EDGE_WAIT);
      }

      function finish(commit) {
        const s = st;
        st = null;
        if (!s) return;
        clearTimeout(s.timer);
        stopEdge(s);
        document.body.classList.remove('is-moving');
        lastMoveEnd = Date.now();

        if (s.ghost) {
          if (commit && s.target) {
            s.ghost.remove();
          } else {
            /* 无效区 / 取消：浮起卡片弹回原位再消失 */
            s.ghost.classList.add('snap-back');
            s.ghost.style.transform = 'translate(0,0) scale(1)';
            setTimeout(function () { s.ghost.remove(); }, 220);
          }
        }
        if (s.tip) s.tip.remove();
        if (s.holdEl) s.holdEl.classList.remove('ev-source');
        $$('.move-slot').forEach(function (n) { n.remove(); });

        if (!commit) return;

        /* 松手时按当前手指位置重新算一次落点：
           翻页（renderGrid 重建 DOM）后 s.target 可能已过期，直接用它会导致事件丢失 */
        const target = hitTestAt(s.cx, s.cy, s.dur);
        if (!target) return;

        const from = { d: s.ev.d, s: s.ev.s, e: s.ev.e };
        s.ev.d = target.date;
        s.ev.s = toHM(target.start);
        s.ev.e = toHM(Math.min(GRID_END, target.start + s.dur));
        /* 位置没变就别打扰用户 */
        if (from.d === s.ev.d && from.s === s.ev.s) return;

        saveState();
        renderAll();

        const dt = fromYMD(s.ev.d);
        toast('已移到 ' + WEEKDAY[dt.getDay()] + ' ' + (dt.getMonth() + 1) + '/' + dt.getDate() +
          ' ' + s.ev.s, {
          label: '撤销',
          fn: function () {
            s.ev.d = from.d; s.ev.s = from.s; s.ev.e = from.e;
            saveState(); renderAll(); toast('已移回原位');
          }
        });
      }

      body.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        const el = e.target.closest('.ev');
        if (!el || !el.dataset.id) return;
        const ev = state.events.filter(function (x) { return x.id === el.dataset.id; })[0];
        if (!ev) return;

        st = {
          id: ev.id, ev: ev, el: el,
          dur: Math.max(SNAP, toMin(ev.e) - toMin(ev.s)),
          x0: e.clientX, y0: e.clientY, cx: e.clientX, cy: e.clientY,
          pointerId: e.pointerId,
          armed: false, moved: false,
          ghost: null, tip: null, holdEl: null, target: null,
          timer: null, edgeTimer: null, edgeStep: null, edgeDir: 0,
          scrollStep: null, scrollDir: 0
        };

        st.timer = setTimeout(function () {
          if (!st) return;
          st.armed = true;
          document.body.classList.add('is-moving');

          st.holdEl = body.querySelector('.ev[data-id="' + st.id + '"]');
          if (st.holdEl) st.holdEl.classList.add('ev-source');

          const rect = st.el.getBoundingClientRect();
          st.ghost = makeGhost(st.ev);
          st.ghost.style.left = rect.left + 'px';
          st.ghost.style.top = rect.top + 'px';
          st.ghost.style.width = rect.width + 'px';
          st.ghost.style.height = rect.height + 'px';
          st.tip = makeTip();
          paint();
        }, HOLD_MS);
      });

      document.addEventListener('pointermove', function (e) {
        if (!st || e.pointerId !== st.pointerId) return;
        st.cx = e.clientX;
        st.cy = e.clientY;

        if (!st.armed) {
          /* 还没到长按阈值就动了 → 用户想滚页面，交还给浏览器 */
          if (Math.abs(st.cy - st.y0) > MOVE_TOL || Math.abs(st.cx - st.x0) > MOVE_TOL) finish(false);
          return;
        }
        st.moved = true;
        if (e.cancelable) e.preventDefault();
        paint();
        updateEdge(e.clientX);
        updateScroll(e.clientY);
      }, { passive: false });

      /* 拖动期间挡住页面滚动 */
      wrap.addEventListener('touchmove', function (e) {
        if (st && st.armed && e.cancelable) e.preventDefault();
      }, { passive: false });

      document.addEventListener('pointerup', function (e) {
        if (!st || e.pointerId !== st.pointerId) return;
        finish(true);
      });
      document.addEventListener('pointercancel', function () { if (st) finish(false); });

      /* 刚拖完那一下不要当成「点开详情」 */
      body.addEventListener('click', function (e) {
        if (Date.now() - lastMoveEnd < 400) return;
        const evEl = e.target.closest('.ev');
        if (!evEl) return;
        e.stopPropagation();   // 别让「点卡片看详情」的监听再开一次
        openEventDialog(evEl.dataset.id);
      }, true);
    })();

    /* ---- 记事页：月份切换 ---- */
    $('#calPrev').addEventListener('click', function () {
      calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1); renderCalendar();
    });
    $('#calNext').addEventListener('click', function () {
      calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1); renderCalendar();
    });
    $('#calToday').addEventListener('click', function () {
      const n = new Date();
      calCursor = new Date(n.getFullYear(), n.getMonth(), 1);
      selectedDate = toYMD(n);
      renderCalendar(); renderEditor();
    });

    /* ---- 记事页：颜色标记模式 ---- */
    $('#calMark').addEventListener('click', function () {
      markMode = !markMode;
      if (markMode) {
        const cur = selectedDate ? state.tags[selectedDate] : '';
        if (cur) { $('#markHex').value = cur; $('#markColor').value = cur.toLowerCase(); }
      }
      renderCalendar();
    });
    $('#markDone').addEventListener('click', function () {
      markMode = false;
      renderCalendar();
    });
    $('#markHex').addEventListener('input', function () {
      const v = normHex(this.value);
      if (v) $('#markColor').value = v.toLowerCase();
    });
    $('#markColor').addEventListener('input', function () {
      $('#markHex').value = this.value.toUpperCase();
    });

    /* ---- 记事页：点日期 ---- */
    $('#calGrid').addEventListener('click', function (e) {
      const cell = e.target.closest('.cal-cell');
      if (!cell) return;
      const ds = cell.dataset.date;

      if (markMode) {
        /* 标记模式：同色则取消，否则打标 */
        const color = normHex($('#markHex').value) || normHex($('#markColor').value) || '#4C6FFF';
        if (String(state.tags[ds] || '').toUpperCase() === color) delete state.tags[ds];
        else state.tags[ds] = color;
        saveState();
        renderCalendar();
        renderEditor();
        return;
      }

      selectedDate = ds;
      const d = fromYMD(ds);
      if (d.getMonth() !== calCursor.getMonth() || d.getFullYear() !== calCursor.getFullYear()) {
        calCursor = new Date(d.getFullYear(), d.getMonth(), 1);
      }
      renderCalendar();
      renderEditor();
      $('#noteEditor').classList.add('open');
      $('#noteScrim').classList.add('show');
    });

    $('#noteScrim').addEventListener('click', function () {
      $('#noteEditor').classList.remove('open');
      $('#noteScrim').classList.remove('show');
    });

    /* ---- 键盘 ---- */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if ($('#searchRoot').classList.contains('open')) { closeSearch(); return; }
        if ($('#cropper').classList.contains('open')) { closeCropper(); return; }
        if ($('#modalRoot').classList.contains('open')) closeModal();
        else {
          $('#noteEditor').classList.remove('open');
          $('#noteScrim').classList.remove('show');
        }
        return;
      }
      /* 裁剪器打开时不响应切页 / 新建快捷键 */
      if ($('#cropper').classList.contains('open')) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearch();
        return;
      }
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (/INPUT|TEXTAREA/.test(tag)) return;
      if (e.key === '1') switchView('home');
      if (e.key === '2') switchView('grid');
      if (e.key === '3') switchView('notes');
      if (e.key.toLowerCase() === 'n') $('#fab').click();
      /* [ ] 翻周，比去点箭头快 */
      if (e.key === '[' || e.key === ']') {
        if (currentView !== 'grid') switchView('grid');
        weekStart = addDays(weekStart, e.key === ']' ? 7 : -7);
        renderGrid();
        toast(weekRangeText());
      }
    });

    /* ---- 窗口尺寸变化（跨断点时 --hourH 变了，需要重算）----
       只有「宽度」变化才重算；输入法收起只改高度，不重建表格，避免收起键盘时的卡顿 */
    let rt = null;
    let lastW = window.innerWidth;
    window.addEventListener('resize', function () {
      if (window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      clearTimeout(rt);
      rt = setTimeout(function () {
        if (currentView === 'grid') renderGrid();
      }, 180);
    });
  }

  /* --------------------------------------------------------------------------
   * 7.11 启动
   * ------------------------------------------------------------------------ */
  /* ------------------------------------------------------------------------
   * 开场层：加载时随机抽一句语录，逐字浮现（极光 + 微粒同场）
   * 这一层永远盖在内容之上但不参与布局，内容照常渲染；读完自动淡出，
   * 点一下也能立刻跳过，所以不会拖慢进界面的时间。
   * ---------------------------------------------------------------------- */

  let bootQuotePick = null;    // 开场抽到的那条，交给主页卡片接着显示
  let bsStopParticles = null;  // 粒子循环的停止函数
  let bsTimer = 0;
  let bsClosed = false;
  let bsAfter = null;
  let bsNeedMs = 1200;         // 这一句至少要露多久（按字数算）

  /** 开场要显示哪一条：每天一次的频率下沿用今天那条，否则随机抽 */
  function pickBootQuote() {
    const pool = quotePool();
    if (!pool.length) return null;
    const q = state.quotes;
    if (q.freq === 'daily' && q.picked && q.picked.date === toYMD(new Date())) {
      const cur = pool.filter(function (x) { return x.id === q.picked.id; })[0];
      if (cur) return cur;
    }
    const prevId = q.picked && q.picked.id;
    let idx = Math.floor(Math.random() * pool.length);
    if (pool.length > 1 && prevId && pool[idx].id === prevId) idx = (idx + 1) % pool.length;
    return pool[idx];
  }

  /** 逐字入场：一个字一个 span，错峰触发 animation */
  function bsRenderQuote(text) {
    const el = $('#bsQuote');
    if (!el) return 0;
    el.textContent = '';
    const chars = Array.from(String(text || ''));
    /* 长句节奏加快，短句慢一点，整体控制在 1–2 秒内读完 */
    const step = chars.length > 40 ? 32 : 46;
    const frag = document.createDocumentFragment();
    chars.forEach(function (c, i) {
      const s = document.createElement('span');
      s.className = 'ch';
      s.textContent = c;
      s.style.animationDelay = (150 + i * step) + 'ms';
      frag.appendChild(s);
    });
    const caret = document.createElement('span');
    caret.className = 'bs-caret';
    frag.appendChild(caret);
    el.appendChild(frag);
    return 420 + chars.length * step * 0.7;   // 读完大概要多久
  }

  /** 上浮微粒：rAF 画，收场时停掉，不常驻 */
  function bsParticles(canvas) {
    const ctx = canvas.getContext && canvas.getContext('2d');
    if (!ctx) return null;
    let w = 0, h = 0, dots = [], raf = 0, dead = false;

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      w = canvas.clientWidth || window.innerWidth;
      h = canvas.clientHeight || window.innerHeight;
      canvas.width = Math.max(1, Math.floor(w * dpr));
      canvas.height = Math.max(1, Math.floor(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.max(14, Math.min(34, Math.round(w * h / 42000)));
      dots = [];
      for (let i = 0; i < n; i++) dots.push(newDot(true));
    }
    function newDot(init) {
      return {
        x: Math.random() * w,
        y: init ? Math.random() * h : h + 10 + Math.random() * 60,
        r: 0.8 + Math.random() * 2.2,
        vy: -(0.14 + Math.random() * 0.44),
        sw: 0.3 + Math.random() * 0.9,
        ph: Math.random() * Math.PI * 2,
        a: 0.16 + Math.random() * 0.4
      };
    }
    function tick() {
      if (dead) return;
      const dark = document.documentElement.classList.contains('dark');
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < dots.length; i++) {
        const d = dots[i];
        d.y += d.vy;
        d.ph += 0.013;
        d.x += Math.sin(d.ph) * d.sw * 0.34;
        if (d.y < -14) dots[i] = newDot(false);
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = (dark ? 'rgba(158,180,255,' : 'rgba(76,111,255,') + d.a.toFixed(2) + ')';
        ctx.fill();
      }
      raf = requestAnimationFrame(tick);
    }
    resize();
    tick();
    window.addEventListener('resize', resize);

    return function stop() {
      dead = true;
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
    };
  }

  /** 收场：整层淡出 → 主页语录卡接一下高亮 → 回调（引导之类的排队在后面） */
  function bsClose() {
    const root = $('#bootSplash');
    clearTimeout(bsTimer);

    const fire = function () {
      const f = bsAfter; bsAfter = null;
      if (typeof f === 'function') f();
    };
    /* 用户在排队收场之前就点了跳过：层已收完，直接放行后面的回调 */
    if (bsClosed) { fire(); return; }
    bsClosed = true;

    if (!root || root.hidden) { fire(); return; }

    root.classList.add('is-out');
    if (bsStopParticles) { bsStopParticles(); bsStopParticles = null; }
    const card = $('#quoteCard');
    if (card && card.style.display !== 'none') {
      card.classList.add('bs-handoff');
      setTimeout(function () { card.classList.remove('bs-handoff'); }, 1200);
    }
    setTimeout(function () {
      root.hidden = true;
      root.classList.remove('is-out');
      fire();
    }, 600);
  }

  /** 开场：抽一条语录并起动画（在 boot 的最前面调用） */
  function startBootSplash() {
    const root = $('#bootSplash');
    if (!root) return;
    bsClosed = false;
    bsTimer = 0;

    if (state.quotes.bootAnim === false) { root.hidden = true; return; }

    const pick = pickBootQuote();
    bootQuotePick = pick || null;
    if (!pick) { root.hidden = true; return; }   // 语料库空了就直接进界面

    root.hidden = false;
    const need = bsRenderQuote(pick.text);

    const src = $('#bsSrc');
    if (src) {
      const mine = (state.quotes.custom || []).some(function (c) { return c.id === pick.id; });
      src.textContent = mine ? '我的语录' : '叶历语录';
    }
    const tip = $('#bsTip');
    if (tip) {
      const todayStr = toYMD(new Date());
      const n = state.events.filter(function (e) { return e.d === todayStr; }).length;
      tip.textContent = n ? ('今天有 ' + n + ' 件事在等你') : '正在准备今天的日程…';
    }

    const cv = $('#bsCanvas');
    if (cv) bsStopParticles = bsParticles(cv);

    /* 不想看就点一下 / 按 Esc 直接跳过 */
    root.addEventListener('click', bsClose);
    const onKey = function (e) { if (e.key === 'Escape') { bsClose(); document.removeEventListener('keydown', onKey); } };
    document.addEventListener('keydown', onKey);

    bsNeedMs = Math.min(3000, Math.max(1550, need));
  }

  /** 读完了，安排收场（至少露一小会儿，太快会像闪一下） */
  function endBootSplash(done) {
    bsAfter = typeof done === 'function' ? done : null;
    bsTimer = setTimeout(bsClose, bsNeedMs);
  }

  function boot() {
    loadState();
    if (!selectedDate) selectedDate = toYMD(new Date());

    /* 先起开场动画：抽一条语录逐字浮现，内容在它下面继续渲染 */
    startBootSplash();

    applyTheme();
    applyBg();
    bindEvents();
    renderAll();
    switchView('home');
    quoteOnBoot();
    quoteBooted = true;
    /* 上次没写完的草稿，启动就把条子挂出来 */
    syncDraftBar();
    /* 开启了自动清理的话，每天首次打开时清一次 */
    autoCleanOnBoot();
    /* 电脑上空间够，主页的统计区默认摊开；手机上一进主页先收起来 */
    const homeFold = $('#homeFold');
    if (homeFold && window.innerWidth >= 960) homeFold.open = true;
    /* 提醒轮询（内部会看总开关，关着就不扫） */
    startReminders();

    /* 开场层读完自动收场，收完再排队放首次引导，两个遮罩不打架 */
    endBootSplash(function () {
      setTimeout(function () { startGuide(false); }, 340);
    });

    /* 主页底部署名：一行小字，点进设置能看到完整作者信息与邮箱 */
    const foot = $('#homeFoot');
    if (foot) {
      foot.textContent = APP.name + ' · ' + APP.cnName + ' v' + APP.version + ' · ' + APP.authorCn;
      foot.addEventListener('click', openSettings);
    }
    /* 图片与字体存在 IndexedDB，异步读回来后再补一次渲染 */
    loadAssets().catch(function (err) { console.warn('[DayLeaf] 资源加载失败', err); });

    /* 每秒刷新倒计时与时间红线 */
    setInterval(function () {
      if (currentView === 'home') {
        renderHero();
        const stat = $('#todayStat');
        if (stat) {
          const todayStr = toYMD(new Date());
          const todays = state.events.filter(function (e) { return e.d === todayStr; });
          const dn = todays.filter(function (e) { return e.st === 'done'; }).length;
          stat.textContent = todays.length ? ('已完成 ' + dn + ' / ' + todays.length) : '';
        }
      }
      if (currentView === 'grid') updateNowLine();
    }, 1000);

    console.log('%c' + APP.name + ' · ' + APP.cnName + '%c v' + APP.version,
      'color:#4C6FFF;font-weight:700', 'color:#888');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
