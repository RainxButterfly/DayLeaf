    {
      view: 'home', sel: '#fab', title: '随时新建',
      text: '右下角这个 + 在任何页面都能新建日程。没写完就关掉也没关系，会留成草稿。'
    }
  ];

  let guideIdx = 0;

  function guideSeen() {
    try { return localStorage.getItem(GUIDE_KEY) === '1'; } catch (e) { return true; }
  }

  function markGuideDone() {
    try { localStorage.setItem(GUIDE_KEY, '1'); } catch (e) { /* 无痕模式就算了 */ }
  }

  function startGuide(force) {
    if (!force && guideSeen()) return;
    const root = $('#guideRoot');
    if (!root) return;
    guideIdx = 0;
    root.hidden = false;
    pushModal(endGuide);
    const skip = $('#gtSkip');
    const next = $('#gtNext');
    if (skip) skip.onclick = function () { endGuide(); };
    if (next) next.onclick = function () {
      if (guideIdx >= GUIDE_STEPS.length - 1) { endGuide(); return; }
      guideIdx++;
      paintGuide();
    };
    paintGuide();
  }

  function endGuide() {
    const root = $('#guideRoot');
    popModal(endGuide);
    if (root) { root.hidden = true; }
    markGuideDone();
    switchView('home');
  }

  /** 画当前这一步：切视图 → 定位高亮框 → 摆好气泡 */
  function paintGuide() {
    const step = GUIDE_STEPS[guideIdx];
    const root = $('#guideRoot');
    if (!step || !root) { endGuide(); return; }

    switchView(step.view);

    /* 等视图渲染完再量位置 */
    setTimeout(function () {
      const target = document.querySelector(step.sel);
      const hole = $('#guideHole');
      const tip = $('#guideTip');
      if (!target || !hole || !tip) { guideIdx++; paintGuide(); return; }

      const r = target.getBoundingClientRect();
      const pad = 8;
      const top = Math.max(6, r.top - pad);
      const left = Math.max(6, r.left - pad);
      hole.style.top = top + 'px';
      hole.style.left = left + 'px';
      hole.style.width = Math.min(window.innerWidth - 12, r.width + pad * 2) + 'px';
      hole.style.height = r.height + pad * 2 + 'px';

      $('#gtTitle').textContent = (guideIdx + 1) + ' / ' + GUIDE_STEPS.length + ' · ' + step.title;
      $('#gtText').textContent = step.text;
      $('#gtNext').textContent = guideIdx === GUIDE_STEPS.length - 1 ? '开始使用' : '下一步';

      $('#gtDots').innerHTML = GUIDE_STEPS.map(function (_, i) {
        return '<i class="' + (i === guideIdx ? 'on' : '') + '"></i>';
      }).join('');

      /* 高亮在屏幕下半 → 气泡放上面，反之放下面 */
      const tipH = tip.offsetHeight || 150;
      const below = top + r.height + 14 + tipH < window.innerHeight - 8;
      tip.style.top = (below
        ? Math.min(window.innerHeight - tipH - 10, top + r.height + pad + 12)
        : Math.max(10, top - tipH - 12)) + 'px';
    }, 260);
  }

  /** 窗口尺寸变化时重新摆一次，避免高亮框跑偏 */
  window.addEventListener('resize', function () {
    if ($('#guideRoot') && !$('#guideRoot').hidden) paintGuide();
  });

  /* --------------------------------------------------------------------------
   * 7.10 导航与全局交互
   * ------------------------------------------------------------------------ */
  function switchView(name) {
    currentView = name;
    $$('.view').forEach(function (v) {
      v.classList.toggle('active', v.id === 'view-' + name);
    });
    $$('[data-nav]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.nav === name);
    });
    /* 三个页面都能直接新建，不用为了加日程先切回主页 */
    /* 表格页不放加号：那一屏本来就是「点空格子直接画一条」，
       再挂个悬浮按钮既挡格子、拖日程时还会被当成无效区，纯冗余 */
    $('#fab').classList.toggle('show', name === 'home' || name === 'notes');

    /* 跨天则强制重绘（「今天」的高亮、日期文案可能已经不对） */
    const today = toYMD(new Date());
    if (today !== lastRenderDay) {
      lastRenderDay = today;
      markViewsDirty();
    }

    /* 只有数据变过才重建，否则直接显示缓存好的 DOM */
    const need = viewDirty[name];
    viewDirty[name] = false;

    if (name === 'home') {
      if (need) renderHome();
      /* 「回到主页」频率：每次切回来换一条 */
      if (quoteBooted && state.quotes.freq === 'view') rollQuote();
    }
    if (name === 'grid') {
      if (need) renderGrid();
      if (!gridInited) {
        gridInited = true;
        const h = defaultGridHour();
        setTimeout(function () { scrollGridTo(h); }, 30);
      }
    }
    if (name === 'notes') {
      if (need) { renderCalendar(); renderEditor(); }
    }
  }

  /** 全量重绘 */
  function renderAll() {
    renderHome();
    renderGrid();
    renderCalendar();
    renderEditor();
  }

  /* ---- 事件绑定 ---- */
  function bindEvents() {
    /* 导航 */
    $$('[data-nav]').forEach(function (b) {
      b.addEventListener('click', function () { switchView(b.dataset.nav); });
    });

    /* 设置入口（导轨 / 主页 / 记事页） */
    ['btnSettings', 'btnSettingsHome', 'btnSettingsNotes', 'btnSettingsRail'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.addEventListener('click', openSettings);
    });

    /* 新增按钮 */
    $('#fab').addEventListener('click', function () {
      if (currentView === 'grid') {
        const d = new Date();
        openEventDialog(null, { d: toYMD(d), s: '09:00', e: '10:00' });
      } else {
        openEventDialog(null);
      }
    });

    /* ---- 主页面：点今日日程打开详情 ---- */
    $('#todayList').addEventListener('click', function (e) {
      /* 点右侧的状态块 = 直接切换 待办 → 完成 → 缺席，不用进详情 */
      const badge = e.target.closest('.t-st');
      if (badge) {
        e.stopPropagation();
        const row = badge.closest('.trow');
        if (row) cycleEventStatus(row.dataset.id);
        return;
      }
      const row = e.target.closest('.trow');
      if (row) openEventDialog(row.dataset.id);
    });

    /* ---- 全局搜索：入口 + 输入 + 结果点击 ---- */
    ['btnSearchHome', 'btnSearchNotes', 'btnSearchGrid'].forEach(function (id) {
      const b = document.getElementById(id);
      if (b) {
        b.addEventListener('click', openSearch);
        /* 手机没有 Ctrl 键，去掉快捷键提示；桌面端保留 */
        if (isMobileView()) b.setAttribute('title', '搜索日程');
      }
    });
    /* 手机没有 Esc 键，搜索框关闭按钮显示「取消」而非 Esc */
    if (isMobileView()) {
      const escBtn = document.querySelector('#searchRoot .search-esc');
      if (escBtn) escBtn.textContent = '取消';
    }
    $('#searchInput').addEventListener('input', function () { renderSearch(this.value); });
    $('#searchList').addEventListener('click', function (e) {
      const item = e.target.closest('.sr-item');
      if (!item) return;
      if (item.dataset.cmd) { runSearchCommand(item.dataset.cmd); return; }
      if (item.dataset.quick) {
        const t = item.dataset.quick;
        closeSearch();
        setTimeout(function () { openQuickAdd(t); }, 60);
        return;
      }
      if (item.dataset.note) {
        const ds = item.dataset.note;
        closeSearch();
        switchView('notes');
        selectedDate = ds;
        calCursor = new Date(fromYMD(ds).getFullYear(), fromYMD(ds).getMonth(), 1);
        renderCalendar();
        renderEditor();
        return;
      }
      if (item.dataset.anniv) { closeSearch(); switchView('home'); toast('纪念日：' + item.dataset.anniv + '（在记事页可编辑）'); return; }
      goToEvent(item.dataset.id);
    });
    $$('#searchRoot [data-close]').forEach(function (el) {
      el.addEventListener('click', closeSearch);
    });

    /* ---- 主页面：点主卡打开「下一个日程」的详情 ---- */
    $('#hero').addEventListener('click', function (e) {
      /* 收尾态上的「标记完成」优先，点其它地方才是看详情 */
      const doneBtn = e.target.closest('[data-hero-done]');
      if (doneBtn) {
        const target = state.events.filter(function (x) { return x.id === doneBtn.dataset.heroDone; })[0];
        if (target) {
          target.st = 'done';
          saveState();
          renderAll();
          toast('已标记完成 ✓');
        }
        return;
      }
      const id = this.dataset.ev;
      if (id) openEventDialog(id);
    });

    /* ---- 主页面：本周概览 → 跳到表格页对应周 ---- */
    $('#weekStrip').addEventListener('click', function (e) {
      const day = e.target.closest('.wk-day');
      if (!day) return;
      weekStart = startOfWeek(fromYMD(day.dataset.date));
      switchView('grid');
      scrollGridTo(defaultGridHour());
    });

    /* ---- 数据概览：展开明细 / 就地标完成 / 点标题进编辑 ---- */
    $('#statCard').addEventListener('click', function (e) {
      const doneBtn = e.target.closest('[data-done]');
      if (doneBtn) {
        const target = state.events.filter(function (x) { return x.id === doneBtn.dataset.done; })[0];
        if (target) {
          target.st = 'done';
          saveState();
          renderAll();
          toast('已标记完成 ✓');
        }
        return;
      }
      const open = e.target.closest('[data-open]');
      if (open) { openEventDialog(open.dataset.open); return; }

      const tog = e.target.closest('[data-toggle]');
      if (tog) {
        statOpen = statOpen === tog.dataset.toggle ? '' : tog.dataset.toggle;
        renderStatDetail();
      }
    });

    /* ---- 表格页：左右滑动切周（移动端手势） ---- */
    (function bindWeekSwipe() {
      const wrap = $('#gridWrap');
      let sx = 0;
      let sy = 0;
      let tracking = false;

      wrap.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) { tracking = false; return; }
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
        tracking = true;
      }, { passive: true });

      wrap.addEventListener('touchend', function (e) {
        if (!tracking) return;
        tracking = false;
        const t = e.changedTouches[0];
        const dx = t.clientX - sx;
        const dy = t.clientY - sy;

        /* 位移够长、且明显偏水平才算翻周；否则当成点卡片或上下滚动 */
        if (Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy) * 1.8) return;

        weekStart = addDays(weekStart, dx < 0 ? 7 : -7);
        renderGrid();
        toast(weekRangeText());
      }, { passive: true });
    })();

    /* ---- 表格页：周切换 ---- */
    $('#wkPrev').addEventListener('click', function () {
      weekStart = addDays(weekStart, -7); renderGrid();
    });
    $('#wkNext').addEventListener('click', function () {
      weekStart = addDays(weekStart, 7); renderGrid();
    });
    $('#wkToday').addEventListener('click', function () {
      weekStart = startOfWeek(new Date());
      renderGrid();
      scrollGridTo(defaultGridHour());
    });
    const gmPrev = document.getElementById('gmPrev');
    if (gmPrev) gmPrev.addEventListener('click', function () { document.getElementById('wkPrev').click(); });
    const gmNext = document.getElementById('gmNext');
    if (gmNext) gmNext.addEventListener('click', function () { document.getElementById('wkNext').click(); });
    const gmToday = document.getElementById('gmToday');
    if (gmToday) gmToday.addEventListener('click', function () { document.getElementById('wkToday').click(); });
    const gmSearch = document.getElementById('gmSearch');
    if (gmSearch) gmSearch.addEventListener('click', function () { document.getElementById('btnSearchGrid').click(); });
    const gmStretch = document.getElementById('gmStretch');
    if (gmStretch) gmStretch.addEventListener('click', function () { document.getElementById('btnStretch').click(); });

    /* ---- 表格页：时间块拉伸 ---- */
    $('#btnStretch').addEventListener('click', openStretch);

    /* ---- 主页面：手动换一条语录 ---- */
    $('#qNext').addEventListener('click', function () { rollQuote(); });

    /* ---- 草稿条：继续编辑 / 丢弃（二次确认） ---- */
    $('#dbGo').addEventListener('click', resumeDraft);
    $('#dbX').addEventListener('click', function () {
      const btn = this;
      if (!btn.classList.contains('armed')) {
        btn.classList.add('armed');
        btn.textContent = '丢弃？';
        clearTimeout(btn._arm);
        btn._arm = setTimeout(function () {
          btn.classList.remove('armed');
          btn.textContent = '✕';
        }, 2600);
        return;
      }
      clearTimeout(btn._arm);
      clearDraft();
      toast('草稿已丢弃');
    });

    /* ---- 表格页：点表头 → 当天 09:00 新建 ---- */
    $('#gridHead').addEventListener('click', function (e) {
      const day = e.target.closest('.gh-day');
      if (!day) return;
      openEventDialog(null, { d: day.dataset.date, s: '09:00', e: '10:00' });
    });

    /* ---- 表格页：点日程 → 详情；点空白 → 按 30 分钟吸附新建 ---- */
    /* ---- 表格页：点空白建 1 小时；按住往下拖，划多大就是多久 ---- */
    (function bindGridCreate() {
      const body = $('#gridBody');
      const wrap = $('#gridWrap');
      const ARM_DELAY = 220;      // 按住多久进入拖拽
      const MOVE_TOL = 10;        // 超过这个位移就当成在动（手指抖动一般 3~8px，给足余量）
      const DRAG_MIN = 6;         // 长按之后至少挪这么远才算「拖动」，否则仍按点击处理
      const DRAG_SLOT = 15;       // 拖拽吸附粒度（分钟）

      let cur = null;
      let armTimer = null;
      let lastCreate = 0;   // 记录最近一次创建时间，避免 pointerup 与 click 重复创建

      /** 像素位置 → 吸附到 15 分钟的时间 */
      let colTop = 0;   // 拖拽/点击期间缓存的列顶，避免反复 getBoundingClientRect

      function minAt(clientY) {
        if (!lastGeo) return GRID_START;
        const y = clientY - colTop;
        const raw = lastGeo.minOf(y);
        return Math.max(lastGeo.vs, Math.min(lastGeo.ve, Math.round(raw / DRAG_SLOT) * DRAG_SLOT));
      }

      function paintGhost() {
        if (!cur || !cur.armed || !lastGeo) return;
        const a = Math.min(cur.start, cur.end);
        const b = Math.max(cur.start, cur.end);
        const top = lastGeo.yOf(a);
        const hgt = Math.max(20, lastGeo.yOf(b) - top);

        if (!cur.ghost) {
          cur.ghost = document.createElement('div');
          cur.ghost.className = 'drag-ghost';
          cur.col.appendChild(cur.ghost);
        }
        cur.ghost.style.top = top.toFixed(1) + 'px';
        cur.ghost.style.height = hgt.toFixed(1) + 'px';
        cur.ghost.textContent = toHM(a) + ' – ' + toHM(b);
      }

      function cleanup() {
        clearTimeout(armTimer);
        armTimer = null;
        if (cur && cur.ghost) cur.ghost.remove();
        cur = null;
        document.body.classList.remove('is-dragging');
      }

      body.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (e.target.closest('.ev')) return;          // 点卡片是看详情
        const col = e.target.closest('.gcol');
        if (!col) return;
        colTop = col.getBoundingClientRect().top;

        cur = {
          col: col,
          date: col.dataset.date,
          start: minAt(e.clientY),
          end: minAt(e.clientY),
          y0: e.clientY,
          pointerId: e.pointerId,
          armed: false,
          moved: false,
          ghost: null
        };

        /* 按住不动 → 进入拖拽；直接松手 → 还是原来的「点一下建 1 小时」 */
        armTimer = setTimeout(function () {
          if (!cur) return;
          cur.armed = true;
          try { cur.col.setPointerCapture(cur.pointerId); } catch (err) {}
          document.body.classList.add('is-dragging');
          paintGhost();
        }, ARM_DELAY);
      });

      body.addEventListener('pointermove', function (e) {
        if (!cur || e.pointerId !== cur.pointerId) return;

        if (!cur.armed) {
          /* 还没按住就动了 → 用户想滚页面，让给浏览器 */
          if (Math.abs(e.clientY - cur.y0) > MOVE_TOL) cleanup();
          return;
        }

        if (e.cancelable) e.preventDefault();
        /* 长按之后手指抖动几个像素不算拖拽，仍然按“点一下建一小时”处理 */
        if (!cur.moved && Math.abs(e.clientY - cur.y0) < DRAG_MIN) return;
        cur.moved = true;
        cur.end = minAt(e.clientY);
        paintGhost();
      }, { passive: false });

      /* 拖拽期间挡住页面滚动：挂在 document 的捕获阶段。
         挂在 wrap 上时，手指一滑出表格范围就漏掉，浏览器随后接管成滚动，
         同时发出 pointercancel，这次拖拽就白做了。 */
      document.addEventListener('touchmove', function (e) {
        if (cur && cur.armed && e.cancelable) e.preventDefault();
      }, { passive: false, capture: true });

      function finish(commit) {
        const c = cur;
        cleanup();
        if (!c || !commit) return;

        /* 只有真正拖拽（长按 + 移动）才在松手时创建；
           单击交给 click 处理，避免「松手先开面板、随后 click 又点到遮罩把面板关掉」的竞态 */
        if (!c.armed || !c.moved) return;

        const a = Math.min(c.start, c.end);
        let b = Math.max(c.start, c.end);
        if (b - a < DRAG_SLOT) b = Math.min(lastGeo ? lastGeo.ve : GRID_END, a + 60);

        lastCreate = Date.now();
        openEventDialog(null, { d: c.date, s: toHM(a), e: toHM(b) });
      }

      body.addEventListener('pointerup', function (e) {
        if (!cur || e.pointerId !== cur.pointerId) return;
        finish(true);
      });

      /* 浏览器万一还是接管了手势（pointercancel），只要用户确实在拖，就照样建出来，
         别让「拖了半天松手什么都没有」这种情况发生 */
      body.addEventListener('pointercancel', function () {
        finish(!!(cur && cur.armed && cur.moved));
      });

      /* 点卡片进详情；点空白单元格直接建 1 小时（单击即可创建） */
      body.addEventListener('click', function (e) {
        const evEl = e.target.closest('.ev');
        if (evEl) { openEventDetail(evEl.dataset.id); return; }
        if (Date.now() - lastCreate < 400) return;   // 刚由拖拽/点按创建过，别重复
        const col = e.target.closest('.gcol');
        if (!col) return;
        colTop = col.getBoundingClientRect().top;
        const vs0 = lastGeo ? lastGeo.vs : GRID_START;
        const ve0 = lastGeo ? lastGeo.ve : GRID_END;
        const a = Math.max(vs0, Math.min(ve0 - 60, minAt(e.clientY)));
        const b = Math.min(ve0, a + 60);
        openEventDialog(null, { d: col.dataset.date, s: toHM(a), e: toHM(b) });
      });
    })();

    /* ------------------------------------------------------------------
     * 表格页：长按卡片 → 拖着改时间 / 改日期
     * 手势参数（写死在常量里，方便调）：
     *   HOLD_MS   300ms  按住多久进入拖动（比「按下就建」的 220ms 长，避免误触）
     *   MOVE_TOL  8px    进入拖动前的位移容差，超了就当成想滚动页面
     *   SNAP      15min  时间吸附粒度
     *   EDGE      52px   左右边缘热区宽度
     *   EDGE_WAIT 600ms  在边缘停留多久开始翻页
     *   EDGE_STEP 900ms  翻页后每隔多久再翻一页（翻页不打断拖动）
     * ---------------------------------------------------------------- */
    (function bindGridMove() {
      const body = $('#gridBody');
      const wrap = $('#gridWrap');

      const HOLD_MS = 300;
      const MOVE_TOL = 10;
      const DRAG_MIN = 6;       // 长按之后至少挪这么远才算“拖动”，否则仍按点击处理
      const SNAP = 15;
      const EDGE = 52;
      const EDGE_WAIT = 600;
      const EDGE_STEP = 900;

      let st = null;
      let lastMoveEnd = 0;      // 刚拖完的那一下不算「点击」
      let colCache = null;      // 拖拽期间缓存的列几何，避免每帧 getBoundingClientRect 强制回流
      let wrapRect = null;

      function cacheGeo() {
        wrapRect = wrap.getBoundingClientRect();
        colCache = [];
        body.querySelectorAll('.gcol').forEach(function (col) {
          const r = col.getBoundingClientRect();
          /* 只缓存横向位置（left/right 不随纵向滚动变化）与列高；
             纵向 top 会随 scrollTop 变，每帧实时取，避免缓存过期错位 */
          colCache.push({ el: col, left: r.left, right: r.right, h: col.clientHeight, date: col.dataset.date });
        });
      }

      function makeGhost(ev) {
        const g = document.createElement('div');
        g.className = 'move-ghost';
        g.style.setProperty('--h', hueOf(ev.t));
        g.innerHTML = '<b>' + esc(ev.t) + '</b><span></span>';
        document.body.appendChild(g);
        return g;
      }

      function makeTip() {
        const t = document.createElement('div');
        t.className = 'move-tip';
        document.body.appendChild(t);
        return t;
      }

      /**
       * 指针底下是哪一列、落在几点。
       * 用几何算而不是 elementFromPoint —— 手指底下的东西随时会变
       * （跟随的浮起卡片、加号按钮、气泡），用命中测试会被它们挡住，
       * 明明还在表格里却被判成「松手取消」。
       */
      function hitTestAt(cx, cy, dur) {
        if (!lastGeo) return null;
        if (!colCache || !wrapRect) cacheGeo();
        /* 真的拖出表格（比如甩到顶部日期栏、底部导航栏上）才算无效区 */
        if (cx < wrapRect.left - 24 || cx > wrapRect.right + 24) return null;
        if (cy < wrapRect.top - 10 || cy > wrapRect.bottom + 10) return null;

        /* 取横向最近的一列（不要求正压在列上，手指滑过缝隙也算）——用缓存，避免每帧强制回流 */
        let best = null;
        for (let i = 0; i < colCache.length; i++) {
          const r = colCache[i];
          const dx = (cx < r.left) ? (r.left - cx) : (cx > r.right ? cx - r.right : 0);
          if (!best || dx < best.dx) best = { c: r, dx: dx };
        }
        if (!best) return null;

        /* 纵向：命中列的顶部随滚动变化，实时取一次即可（原本每帧取 7 次） */
        const top = best.c.el.getBoundingClientRect().top;
        const y = Math.max(top, Math.min(top + best.c.h - 1, cy));
        const m = Math.round(lastGeo.minOf(y - top) / SNAP) * SNAP;
        return {
          col: best.c.el,
          date: best.c.date,
          start: Math.max(lastGeo.vs, Math.min(lastGeo.ve - dur, m))
        };
      }
      function hitTest(cx, cy) {
        return st ? hitTestAt(cx, cy, st.dur) : null;
      }

      /** 落点预览：在目标列画出「松手会落在这儿」，翻页后也能看见自己还捏着东西 */
      function paintSlot(hit) {
        if (!hit || !lastGeo) { $$('.move-slot').forEach(function (n) { n.remove(); }); return; }
        let slot = hit.col.querySelector('.move-slot');
        $$('.move-slot').forEach(function (n) { if (n !== slot) n.remove(); });
        if (!slot) {
          slot = document.createElement('div');
          slot.className = 'move-slot';
          slot.innerHTML = '<span></span>';
          hit.col.appendChild(slot);
        }
        const top = lastGeo.yOf(hit.start);
        const h = lastGeo.yOf(Math.min(GRID_END, hit.start + st.dur)) - top;
        slot.style.top = top + 'px';
        slot.style.height = Math.max(16, h) + 'px';
        slot.querySelector('span').textContent = toHM(hit.start) + '–' +
          toHM(Math.min(GRID_END, hit.start + st.dur));
      }

      function paint() {
        if (!st || !st.armed || !st.ghost) return;
        const hit = hitTest(st.cx, st.cy);
        st.target = hit;

        /* 只有落点（列 + 时间）真正变了才更新 DOM，避免每帧改文字 / 重建占位 */
        const key = hit ? (hit.date + '|' + hit.start) : 'none';
        if (key !== st._lastKey) {
          st._lastKey = key;
          paintSlot(hit);
          const tail = toHM(Math.min(GRID_END, (hit ? hit.start : toMin(st.ev.s)) + st.dur));
          st.ghost.querySelector('span').textContent = (hit ? toHM(hit.start) : st.ev.s) + '–' + tail;
          if (hit) {
            const d = fromYMD(hit.date);
            st.tip.className = 'move-tip';
            st.tip.textContent = WEEKDAY[d.getDay()] + ' ' + (d.getMonth() + 1) + '/' + d.getDate() +
              ' · ' + toHM(hit.start) + '–' + tail;
          } else {
            st.tip.className = 'move-tip is-bad';
            st.tip.textContent = '松手取消';
          }
          st._tipW = 0;   // 文本变了，宽度缓存失效
        }

        /* 浮起卡片只改 transform（走 GPU，不触发回流） */
        st.ghost.style.transform =
          'translate(' + (st.cx - st.x0) + 'px,' + (st.cy - st.y0) + 'px) scale(1.04)';

        /* 气泡宽度缓存：避免每帧读 offsetWidth 强制回流 */
        if (!st._tipW) st._tipW = st.tip.offsetWidth || 120;
        st.tip.style.transform = 'translate(' +
          Math.max(8, Math.min(window.innerWidth - st._tipW - 8, st.cx - st._tipW / 2)) + 'px,' +
          Math.max(6, st.cy - 44) + 'px)';
      }

      function stopEdge(s) {
        clearTimeout(s.edgeTimer);
        clearInterval(s.edgeStep);
        clearInterval(s.scrollStep);
        s.edgeTimer = null;
        s.edgeStep = null;
        s.edgeDir = 0;
        s.scrollStep = null;
        s.scrollDir = 0;
      }

      /** 翻一页（上一周 / 下一周）；DOM 会重建，占位要重新挂上 */
      function flip(dir) {
        weekStart = addDays(weekStart, dir * 7);
        renderGrid();
        colCache = null; wrapRect = null;   // DOM 重建后缓存失效，下次 paint 重新缓存
        if (st.holdEl) st.holdEl.classList.remove('ev-source');
        st.holdEl = body.querySelector('.ev[data-id="' + st.id + '"]');
        if (st.holdEl) st.holdEl.classList.add('ev-source');
        paint();
      }

      /** 拖到上下边缘时自动滚动表格：想放到很早/很晚的时刻，不用先松手再滚 */
      function updateScroll(cy) {
        if (!wrapRect) cacheGeo();
        const dir = (cy - wrapRect.top <= 56) ? -1 : ((wrapRect.bottom - cy <= 56) ? 1 : 0);
        if (!dir) {
          if (st.scrollStep) { clearInterval(st.scrollStep); st.scrollStep = null; st.scrollDir = 0; }
          return;
        }
        if (st.scrollStep && st.scrollDir === dir) return;
        if (st.scrollStep) clearInterval(st.scrollStep);
        st.scrollDir = dir;
        st.scrollStep = setInterval(function () {
          if (!st) return;
          wrap.scrollTop += dir * 12;
          paint();
        }, 40);
      }

      function updateEdge(cx) {
        if (!wrapRect) cacheGeo();
        /* 只有真正拖出表格左右边界才翻页；在周一/周日等本周末列内绝不触发，
           否则「拖到周一放一下」会被误判成翻页 */
        const dir = (cx < wrapRect.left) ? -1 : (cx > wrapRect.right) ? 1 : 0;
        if (!dir) { stopEdge(st); return; }
        if (st.edgeDir === dir && st.edgeTimer) return;
        stopEdge(st);
        st.edgeDir = dir;
        st.edgeTimer = setTimeout(function () {
          if (!st) return;
          flip(dir);
          st.edgeStep = setInterval(function () { if (st) flip(dir); }, EDGE_STEP);
        }, EDGE_WAIT);
      }

      function finish(commit) {
        const s = st;
        st = null;
        if (!s) return;
        clearTimeout(s.timer);
        stopEdge(s);
        document.body.classList.remove('is-moving');

        /* 只有「长按进入拖动并且真的移动过」才算一次拖拽。
           单纯点一下绝不能走到下面的落点计算里：那会把日程吸附到最近的
           15 分钟刻度上（看起来就是「点一下它自己乱跳」），而且会顺带
           把随后要打开编辑面板的 click 吞掉。 */
        const dragged = !!(s.armed && s.moved);
        if (dragged) lastMoveEnd = Date.now();

        if (s.ghost) {
          if (commit && dragged && s.target) {
            s.ghost.remove();
          } else {
            /* 无效区 / 取消 / 只是点了一下：浮起卡片弹回原位再消失 */
            s.ghost.classList.add('snap-back');
            s.ghost.style.transform = 'translate(0,0) scale(1)';
            setTimeout(function () { s.ghost.remove(); }, 220);
          }
        }
        if (s.tip) s.tip.remove();
        if (s.holdEl) s.holdEl.classList.remove('ev-source');
        $$('.move-slot').forEach(function (n) { n.remove(); });

        if (!commit || !dragged) return;

        /* 松手时按当前手指位置重新算一次落点：
           翻页（renderGrid 重建 DOM）后 s.target 可能已过期，直接用它会导致事件丢失 */
        const target = hitTestAt(s.cx, s.cy, s.dur);
        if (!target) return;

        const from = { d: s.ev.d, s: s.ev.s, e: s.ev.e };
        s.ev.d = target.date;
        s.ev.s = toHM(target.start);
        s.ev.e = toHM(Math.min(GRID_END, target.start + s.dur));
        /* 位置没变就别打扰用户 */
        if (from.d === s.ev.d && from.s === s.ev.s) return;

        saveState();
        renderAll();

        const dt = fromYMD(s.ev.d);
        toast('已移到 ' + WEEKDAY[dt.getDay()] + ' ' + (dt.getMonth() + 1) + '/' + dt.getDate() +
          ' ' + s.ev.s, {
          label: '撤销',
          fn: function () {
            s.ev.d = from.d; s.ev.s = from.s; s.ev.e = from.e;
            saveState(); renderAll(); toast('已移回原位');
          }
        });
      }

      body.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        const el = e.target.closest('.ev');
        if (!el || !el.dataset.id) return;
        const ev = state.events.filter(function (x) { return x.id === el.dataset.id; })[0];
        if (!ev) return;

        st = {
          id: ev.id, ev: ev, el: el,
          dur: Math.max(SNAP, toMin(ev.e) - toMin(ev.s)),
          x0: e.clientX, y0: e.clientY, cx: e.clientX, cy: e.clientY,
          pointerId: e.pointerId,
          armed: false, moved: false,
          ghost: null, tip: null, holdEl: null, target: null,
          timer: null, edgeTimer: null, edgeStep: null, edgeDir: 0,
          scrollStep: null, scrollDir: 0
        };

        st.timer = setTimeout(function () {
          if (!st) return;
          st.armed = true;
          document.body.classList.add('is-moving');

          /* 进入拖拽的这一刻重新量一次列几何：一次拖拽只多一次测量，
             却能保证表格刚渲染完、或被滚动过之后落点依然准确。 */
          cacheGeo();

          st.holdEl = body.querySelector('.ev[data-id="' + st.id + '"]');
          if (st.holdEl) st.holdEl.classList.add('ev-source');

          const rect = st.el.getBoundingClientRect();
          st.ghost = makeGhost(st.ev);
          st.ghost.style.left = rect.left + 'px';
          st.ghost.style.top = rect.top + 'px';
          st.ghost.style.width = rect.width + 'px';
          st.ghost.style.height = rect.height + 'px';
          st.tip = makeTip();
          paint();
        }, HOLD_MS);
      });

      document.addEventListener('pointermove', function (e) {
        if (!st || e.pointerId !== st.pointerId) return;
        st.cx = e.clientX;
        st.cy = e.clientY;

        if (!st.armed) {
          /* 还没到长按阈值就动了 → 用户想滚页面，交还给浏览器 */
          if (Math.abs(st.cy - st.y0) > MOVE_TOL || Math.abs(st.cx - st.x0) > MOVE_TOL) finish(false);
          return;
        }
        if (e.cancelable) e.preventDefault();
        /* 长按之后还要有实际位移才算拖动。只有几像素的抖动（手指其实没动）
           仍然按点击处理——否则松手会把日程吸到最近的刻度上，看起来像自己乱跳。 */
        if (!st.moved) {
          const dx = st.cx - st.x0;
          const dy = st.cy - st.y0;
          if (dx * dx + dy * dy < DRAG_MIN * DRAG_MIN) { paint(); return; }
          st.moved = true;
        }
        paint();
        updateEdge(e.clientX);
        updateScroll(e.clientY);
      }, { passive: false });

      /* 拖动期间挡住页面滚动（document 捕获阶段，手指滑出表格也拦得住） */
      document.addEventListener('touchmove', function (e) {
        if (st && st.armed && e.cancelable) e.preventDefault();
      }, { passive: false, capture: true });

      document.addEventListener('pointerup', function (e) {
        if (!st || e.pointerId !== st.pointerId) return;
        finish(true);
      });
      /* 规则与「新建」不同：改时间是有副作用的操作，手势被系统取消时宁可丢弃，
         也不要静默把别人的日程挪到别处 */
      document.addEventListener('pointercancel', function () { if (st) finish(false); });

      /* 刚拖完那一下不要当成「点开详情」 */
      body.addEventListener('click', function (e) {
        if (Date.now() - lastMoveEnd < 400) return;
        const evEl = e.target.closest('.ev');
        if (!evEl) return;
        e.stopPropagation();   // 别让「点卡片看详情」的监听再开一次
        openEventDetail(evEl.dataset.id);
      }, true);
    })();

    /* ---- 记事页：月份切换 ---- */
    $('#calPrev').addEventListener('click', function () {
      calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1); renderCalendar();
    });
    $('#calNext').addEventListener('click', function () {
      calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1); renderCalendar();
    });
    $('#calToday').addEventListener('click', function () {
      const n = new Date();
      calCursor = new Date(n.getFullYear(), n.getMonth(), 1);
      selectedDate = toYMD(n);
      renderCalendar(); renderEditor();
    });

    /* ---- 记事页：颜色标记模式 ---- */
    $('#calMark').addEventListener('click', function () {
      markMode = !markMode;
      if (markMode) {
        const cur = selectedDate ? state.tags[selectedDate] : '';
        if (cur) { $('#markHex').value = cur; $('#markColor').value = cur.toLowerCase(); }
      }
      renderCalendar();
    });
    $('#markDone').addEventListener('click', function () {
      markMode = false;
      renderCalendar();
    });
    $('#markHex').addEventListener('input', function () {
      const v = normHex(this.value);
      if (v) $('#markColor').value = v.toLowerCase();
    });
    $('#markColor').addEventListener('input', function () {
      $('#markHex').value = this.value.toUpperCase();
    });

    /* ---- 记事页：点日期 ---- */
    $('#calGrid').addEventListener('click', function (e) {
      const cell = e.target.closest('.cal-cell');
      if (!cell) return;
      const ds = cell.dataset.date;

      if (markMode) {
        /* 标记模式：同色则取消，否则打标 */
        const color = normHex($('#markHex').value) || normHex($('#markColor').value) || '#4C6FFF';
        if (String(state.tags[ds] || '').toUpperCase() === color) delete state.tags[ds];
        else state.tags[ds] = color;
        saveState();
        renderCalendar();
        renderEditor();
        return;
      }

      selectedDate = ds;
      const d = fromYMD(ds);
      if (d.getMonth() !== calCursor.getMonth() || d.getFullYear() !== calCursor.getFullYear()) {
        calCursor = new Date(d.getFullYear(), d.getMonth(), 1);
      }
      renderCalendar();
      renderEditor();
      $('#noteEditor').classList.add('open');
      $('#noteScrim').classList.add('show');
    });

    $('#noteScrim').addEventListener('click', function () {
      $('#noteEditor').classList.remove('open');
      $('#noteScrim').classList.remove('show');
    });

    /* ---- 键盘 ---- */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if ($('#searchRoot').classList.contains('open')) { closeSearch(); return; }
        if ($('#framer').classList.contains('open')) { closeFramer(); return; }
        if ($('#quickRoot') && $('#quickRoot').classList.contains('open')) { closeQuickAdd(); return; }
        if ($('#monthRoot') && $('#monthRoot').classList.contains('open')) { closeMonthView(); return; }
        if ($('#importRoot') && $('#importRoot').classList.contains('open')) { closeImport(); return; }
        if ($('#reviewRoot') && $('#reviewRoot').classList.contains('open')) { closeReview(); return; }
        if ($('#changelogRoot') && $('#changelogRoot').classList.contains('open')) { closeChangelog(); return; }
        if ($('#viewerRoot') && !$('#viewerRoot').hidden) { closeViewer(); return; }
        if ($('#askRoot') && !$('#askRoot').hidden) { $('#askCancel').click(); return; }
        if ($('#alarmRoot') && !$('#alarmRoot').hidden) { stopAlarm(); return; }
        if ($('#guideRoot') && !$('#guideRoot').hidden) { endGuide(); return; }
        const wp = document.querySelector('.wp-root');
        if (wp) { const c = wp.querySelector('.wp-cancel'); if (c) c.click(); return; }
        if ($('#ocrRoot')) { window.__closeTopModal(); return; }
        if ($('#modalRoot').classList.contains('open')) closeModal();
        else {
          $('#noteEditor').classList.remove('open');
          $('#noteScrim').classList.remove('show');
        }
        return;
      }
      /* 取景器打开时不响应切页 / 新建快捷键 */
      if ($('#framer').classList.contains('open')) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearch();
        return;
      }
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (/INPUT|TEXTAREA/.test(tag)) return;
      if (e.key === '1') switchView('home');
      if (e.key === '2') switchView('grid');
      if (e.key === '3') switchView('notes');
      if (e.key.toLowerCase() === 'n') $('#fab').click();
      /* [ ] 翻周，比去点箭头快 */
      if (e.key === '[' || e.key === ']') {
        if (currentView !== 'grid') switchView('grid');
        weekStart = addDays(weekStart, e.key === ']' ? 7 : -7);
        renderGrid();
        toast(weekRangeText());
      }
    });

    /* ---- 窗口尺寸变化（跨断点时 --hourH 变了，需要重算）----
       只有「宽度」变化才重算；输入法收起只改高度，不重建表格，避免收起键盘时的卡顿 */
    let rt = null;
    let lastW = window.innerWidth;
    window.addEventListener('resize', function () {
      if (window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      clearTimeout(rt);
      rt = setTimeout(function () {
        if (currentView === 'grid') renderGrid();
      }, 180);
    });
  }

  /* --------------------------------------------------------------------------
   * 7.11 启动
   * ------------------------------------------------------------------------ */
  /* ------------------------------------------------------------------------
   * 开场层：加载时随机抽一句语录，逐字浮现（极光 + 微粒同场）
   * 这一层永远盖在内容之上但不参与布局，内容照常渲染；读完自动淡出，
   * 点一下也能立刻跳过，所以不会拖慢进界面的时间。
   * ---------------------------------------------------------------------- */

  let bootQuotePick = null;    // 开场抽到的那条，交给主页卡片接着显示
  let bsStopParticles = null;  // 粒子循环的停止函数
  let bsTimer = 0;
  let bsClosed = false;
  let bsAfter = null;
  let bsNeedMs = 1200;         // 这一句至少要露多久（按字数算）

  /** 开场要显示哪一条：每天一次的频率下沿用今天那条，否则随机抽 */
  function pickBootQuote() {
    const pool = quotePool();
    if (!pool.length) return null;
    const q = state.quotes;
    if (q.freq === 'daily' && q.picked && q.picked.date === toYMD(new Date())) {
      const cur = pool.filter(function (x) { return x.id === q.picked.id; })[0];
      if (cur) return cur;
    }
    const prevId = q.picked && q.picked.id;
    let idx = Math.floor(Math.random() * pool.length);
    if (pool.length > 1 && prevId && pool[idx].id === prevId) idx = (idx + 1) % pool.length;
    return pool[idx];
  }

  /** 逐字入场：一个字一个 span，错峰触发 animation */
  function bsRenderQuote(text) {
    const el = $('#bsQuote');
    if (!el) return 0;
    el.textContent = '';
    const chars = Array.from(String(text || ''));
    /* 长句节奏加快，短句慢一点，整体控制在 1–2 秒内读完 */
    const step = chars.length > 40 ? 32 : 46;
    const frag = document.createDocumentFragment();
    chars.forEach(function (c, i) {
      const s = document.createElement('span');
      s.className = 'ch';
      s.textContent = c;
      s.style.animationDelay = (150 + i * step) + 'ms';
      frag.appendChild(s);
    });
    const caret = document.createElement('span');
    caret.className = 'bs-caret';
    frag.appendChild(caret);
    el.appendChild(frag);
    return 420 + chars.length * step * 0.7;   // 读完大概要多久
  }

  /** 上浮微粒：rAF 画，收场时停掉，不常驻 */
  function bsParticles(canvas) {
    const ctx = canvas.getContext && canvas.getContext('2d');
    if (!ctx) return null;
    let w = 0, h = 0, dots = [], raf = 0, dead = false;

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      w = canvas.clientWidth || window.innerWidth;
      h = canvas.clientHeight || window.innerHeight;
      canvas.width = Math.max(1, Math.floor(w * dpr));
      canvas.height = Math.max(1, Math.floor(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.max(14, Math.min(34, Math.round(w * h / 42000)));
      dots = [];
      for (let i = 0; i < n; i++) dots.push(newDot(true));
    }
    function newDot(init) {
      return {
        x: Math.random() * w,
        y: init ? Math.random() * h : h + 10 + Math.random() * 60,
        r: 0.8 + Math.random() * 2.2,
        vy: -(0.14 + Math.random() * 0.44),
        sw: 0.3 + Math.random() * 0.9,
        ph: Math.random() * Math.PI * 2,
        a: 0.16 + Math.random() * 0.4
      };
    }
    function tick() {
      if (dead) return;
      const dark = document.documentElement.classList.contains('dark');
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < dots.length; i++) {
        const d = dots[i];
        d.y += d.vy;
        d.ph += 0.013;
        d.x += Math.sin(d.ph) * d.sw * 0.34;
        if (d.y < -14) dots[i] = newDot(false);
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = (dark ? 'rgba(158,180,255,' : 'rgba(76,111,255,') + d.a.toFixed(2) + ')';
        ctx.fill();
      }
      raf = requestAnimationFrame(tick);
    }
    resize();
    tick();
    window.addEventListener('resize', resize);

    return function stop() {
      dead = true;
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
    };
  }

  /** 收场：整层淡出 → 主页语录卡接一下高亮 → 回调（引导之类的排队在后面） */
  function bsClose() {
    const root = $('#bootSplash');
    clearTimeout(bsTimer);

    const fire = function () {
      const f = bsAfter; bsAfter = null;
      if (typeof f === 'function') f();
    };
    /* 用户在排队收场之前就点了跳过：层已收完，直接放行后面的回调 */
    if (bsClosed) { fire(); return; }
    bsClosed = true;

    if (!root || root.hidden) { fire(); return; }

    root.classList.add('is-out');
    if (bsStopParticles) { bsStopParticles(); bsStopParticles = null; }
    const card = $('#quoteCard');
    if (card && card.style.display !== 'none') {
      card.classList.add('bs-handoff');
      setTimeout(function () { card.classList.remove('bs-handoff'); }, 1200);
    }
    setTimeout(function () {
      root.hidden = true;
      root.classList.remove('is-out');
      fire();
    }, 600);
  }

  /**
   * 开场层兜底。
   * 部分机型（实测 vivo，WebView 84–86）不认 `inset` 简写，fixed 层会退化成
   * 「按内容撑开、贴在左上角」的一条，露出下面的主页；`#modalRoot` 同样会塌成 0×0，
   * 表现就是点设置毫无反应。样式已改成四向长写，这里再量一次实际尺寸做保险：
   * 覆盖率不足就用内联样式钉死成整屏。
   */
  function hardenBootSplash() {
    const el = $('#bootSplash');
    if (!el || el.hidden) return;
    const w = window.innerWidth || 360;
    const h = window.innerHeight || 640;
    const r = el.getBoundingClientRect();
    if (r.width >= w * 0.92 && r.height >= h * 0.88) return;

    el.style.position = 'fixed';
    el.style.top = '0';
    el.style.right = '0';
    el.style.bottom = '0';
    el.style.left = '0';
    el.style.width = '100%';
    el.style.height = '100%';
    el.style.zIndex = '9998';
    console.warn('[DayLeaf] 开场层未覆盖整屏，已启用兜底布局', r.width, r.height, w, h);
  }

  /** 开场：抽一条语录并起动画（在 boot 的最前面调用） */
  function startBootSplash() {
    const root = $('#bootSplash');
    if (!root) return;
    bsClosed = false;
    bsTimer = 0;

    if (state.quotes.bootAnim === false) { root.hidden = true; return; }

    const pick = pickBootQuote();
    bootQuotePick = pick || null;
    if (!pick) { root.hidden = true; return; }   // 语料库空了就直接进界面

    root.hidden = false;
    const need = bsRenderQuote(pick.text);

    const src = $('#bsSrc');
    if (src) {
      const mine = (state.quotes.custom || []).some(function (c) { return c.id === pick.id; });
      src.textContent = mine ? '我的语录' : '叶历语录';
    }
    const tip = $('#bsTip');
    if (tip) {
      const todayStr = toYMD(new Date());
      const n = state.events.filter(function (e) { return e.d === todayStr; }).length;
      tip.textContent = n ? ('今天有 ' + n + ' 件事在等你') : '正在准备今天的日程…';
    }

    const cv = $('#bsCanvas');
    if (cv) bsStopParticles = bsParticles(cv);

    /* 不想看就点一下 / 按 Esc 直接跳过 */
    root.addEventListener('click', bsClose);
    const onKey = function (e) { if (e.key === 'Escape') { bsClose(); document.removeEventListener('keydown', onKey); } };
    document.addEventListener('keydown', onKey);

    bsNeedMs = Math.min(3000, Math.max(1550, need));
  }

  /** 读完了，安排收场（至少露一小会儿，太快会像闪一下） */
  function endBootSplash(done) {
    bsAfter = typeof done === 'function' ? done : null;
    bsTimer = setTimeout(bsClose, bsNeedMs);
  }

  function boot() {
    loadState();
    if (!selectedDate) selectedDate = toYMD(new Date());

    /* 先起开场动画：抽一条语录逐字浮现，内容在它下面继续渲染 */
    startBootSplash();
    hardenBootSplash();
    /* 兜底：万一某个内核把收场流程卡住，8 秒后无条件撤掉开场层，绝不让人卡在上面 */
    setTimeout(function () { if (!bsClosed) bsClose(); }, 8000);

    applyTheme();
    applyBg();
    bindEvents();
    renderAll();
    switchView('home');
    quoteOnBoot();
    quoteBooted = true;
    /* 上次没写完的草稿，启动就把条子挂出来 */
    syncDraftBar();
    /* 开启了自动清理的话，每天首次打开时清一次 */
    autoCleanOnBoot();
    /* 电脑上空间够，主页的统计区默认摊开；手机上一进主页先收起来 */
    const homeFold = $('#homeFold');
    if (homeFold && window.innerWidth >= 960) homeFold.open = true;
    /* 提醒轮询（内部会看总开关，关着就不扫） */
    startReminders();
    /* 1.1.0 新功能：快捷录入、搜索扩展、快照、云端同步、锁屏等 */
    try { init11Features(); } catch (e) { console.warn('[DayLeaf] 1.1.0 模块初始化失败', e); }

    /* 开场层读完自动收场，收完再排队放首次引导，两个遮罩不打架 */
    endBootSplash(function () {
      setTimeout(function () { startGuide(false); }, 340);
    });

    /* 版本号以原生为准：同一份界面被手机和电脑两套外壳加载，版本号并不一致 */
    let verText = APP.version;
    const nbFoot = nativeBridge();
    if (nbFoot) {
      try {
        const v = nbFoot.getVersionName && nbFoot.getVersionName();
        if (v) verText = String(v);
      } catch (e) { /* ignore */ }
    }

    /* 主页底部署名：一行小字，点进设置能看到完整作者信息与邮箱 */
    const foot = $('#homeFoot');
    if (foot) {
      foot.textContent = APP.name + ' · ' + APP.cnName + ' v' + verText + ' · ' + APP.authorCn;
      foot.addEventListener('click', openSettings);
    }
    /* 图片与字体存在 IndexedDB，异步读回来后再补一次渲染 */
    loadAssets().catch(function (err) { console.warn('[DayLeaf] 资源加载失败', err); });

    /* 每秒刷新倒计时与时间红线 */
    setInterval(function () {
      if (currentView === 'home') {
        renderHero();
        const stat = $('#todayStat');
        if (stat) {
          const todayStr = toYMD(new Date());
          const todays = state.events.filter(function (e) { return e.d === todayStr; });
          const dn = todays.filter(function (e) { return e.st === 'done'; }).length;
          stat.textContent = todays.length ? ('已完成 ' + dn + ' / ' + todays.length) : '';
        }
      }
      if (currentView === 'grid') updateNowLine();
    }, 1000);

    console.log('%c' + APP.name + ' · ' + APP.cnName + '%c v' + APP.version,
      'color:#4C6FFF;font-weight:700', 'color:#888');
  }

  /* ---------- 8.1 通用工具 ---------- */
  function dlAsk(title, desc, okLabel, onOk, cancelLabel, extra) {
    const root = $('#askRoot');
    if (!root) { if (window.confirm(title + '\n' + desc)) onOk(); return; }
    $('#askTitle').textContent = title;
    $('#askDesc').textContent = desc || '';
    $('#askOk').textContent = okLabel || '确定';
    $('#askCancel').textContent = cancelLabel || '取消';
    const ex = $('#askExtra');
    if (extra && extra.label) { ex.hidden = false; ex.textContent = extra.label; }
    else { ex.hidden = true; ex.textContent = ''; }
    root.hidden = false;
    const close = function () {
      root.hidden = true;
      $('#askOk').onclick = null; $('#askCancel').onclick = null; ex.onclick = null;
      if (root._stacked) { root._stacked = false; popModal(close); }
    };
    if (!root._stacked) { root._stacked = true; pushModal(close); }
    $('#askCancel').onclick = close;
    root.querySelector('[data-ask-cancel]').onclick = close;
    ex.onclick = function () { close(); if (extra && extra.fn) extra.fn(); };
    $('#askOk').onclick = function () { close(); if (onOk) onOk(); };
  }

  function fmtBytes(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(2) + ' MB';
  }

  function closeViewer() {
    const root = $('#viewerRoot');
    if (!root) return;
    if (root._stacked) { root._stacked = false; popModal(closeViewer); }
    root.hidden = true;
  }
  function openViewer(src) {
    const root = $('#viewerRoot');
    if (!root) return;
    $('#viewerImg').src = src;
    root.hidden = false;
    if (!root._stacked) { root._stacked = true; pushModal(closeViewer); }
  }

  /* ---------- 8.2 中国节假日 / 调休（2025–2026 官方安排） ---------- */
  var HOLIDAY_TABLE = (function () {
    function range(y, m1, d1, m2, d2) {
      const out = [];
      let cur = new Date(y, m1 - 1, d1);
      const end = new Date(y, m2 - 1, d2);
      while (cur <= end) { out.push(toYMD(cur)); cur = addDays(cur, 1); }
      return out;
    }
    function mk(y, parts, works) {
      const off = {};
      const name = {};
      parts.forEach(function (p) {
        range(y, p[0], p[1], p[2], p[3]).forEach(function (ds) {
          off[ds] = 1;
          if (!name[ds]) name[ds] = p[4];
        });
      });
      const work = {};
      (works || []).forEach(function (ds) { work[y + '-' + ds] = 1; });
      return { off: off, work: work, name: name };
    }
    return {
      2025: mk(2025, [
        [1, 1, 1, 1, '元旦'],
        [1, 28, 2, 4, '春节'],
        [4, 4, 4, 6, '清明'],
        [5, 1, 5, 5, '劳动节'],
        [5, 31, 6, 2, '端午'],
        [10, 1, 10, 8, '国庆·中秋']
      ], ['01-26', '02-08', '04-27', '09-28', '10-11']),
      2026: mk(2026, [
        [1, 1, 1, 3, '元旦'],
        [2, 15, 2, 23, '春节'],
        [4, 4, 4, 6, '清明'],
        [5, 1, 5, 5, '劳动节'],
        [6, 19, 6, 21, '端午'],
        [9, 25, 9, 27, '中秋'],
        [10, 1, 10, 7, '国庆']
      ], ['01-04', '02-14', '02-28', '05-09', '09-20', '10-10'])
    };
  })();

  /** 返回 {off:boolean, work:boolean, name:string}；表里没有的年份只认固定节日 */
  function holidayInfoOf(ds) {
    const y = ds.slice(0, 4);
    const t = HOLIDAY_TABLE[y];
    if (t) {
      return { off: !!t.off[ds], work: !!t.work[ds], name: t.name[ds] || '' };
    }
    const md = ds.slice(5);
    const fixed = { '01-01': '元旦', '05-01': '劳动节', '10-01': '国庆' };
    return { off: !!fixed[md], work: false, name: fixed[md] || '' };
  }
  function isHolidayDate(ds) { return holidayInfoOf(ds).off; }
  function isWorkdayDate(ds) {
    const info = holidayInfoOf(ds);
    if (info.work) return true;
    if (info.off) return false;
    const dow = fromYMD(ds).getDay();
    return dow >= 1 && dow <= 5;
  }
  function holidayTagHtml(ds, cls) {
    if (state.settings && state.settings.hideHoliday) return '';
    const info = holidayInfoOf(ds);
    if (info.work) {
      return '<span class="' + cls + ' work" title="调休上班">班</span>';
    }
    if (info.off) {
      /* 能查到节日名就显示名字（如 国庆/春节），比单独一个「休」更有信息量 */
      const short = String(info.name || '').split('·')[0].slice(0, 2);
      const label = short || '休';
      return '<span class="' + cls + '" title="' + esc(info.name || '法定节假日') + ' · 放假">' + esc(label) + '</span>';
    }
    return '';
  }

  /* ---------- 8.3 快照与完整备份 ---------- */
  var SnapshotDB = (function () {
    const DB = 'dayleaf-snaps';
    const STORE = 'snaps';
    let dbp = null, broken = false;
    function open() {
      if (broken || !window.indexedDB) { broken = true; return Promise.reject(new Error('no idb')); }
      if (!dbp) {
        dbp = new Promise(function (res, rej) {
          const req = indexedDB.open(DB, 1);
          req.onupgradeneeded = function () {
            const db = req.result;
            if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
          };
          req.onsuccess = function () { res(req.result); };
          req.onerror = function () { rej(req.error); };
        }).catch(function (e) { broken = true; throw e; });
      }
      return dbp;
    }
    return {
      put: function (id, val) {
        return open().then(function (db) {
          return new Promise(function (res, rej) {
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).put(val, id);
            tx.oncomplete = function () { res(true); };
            tx.onerror = function () { rej(tx.error); };
          });
        });
      },
      get: function (id) {
        return open().then(function (db) {
          return new Promise(function (res) {
            const tx = db.transaction(STORE, 'readonly');
            const rq = tx.objectStore(STORE).get(id);
            rq.onsuccess = function () { res(rq.result || null); };
            rq.onerror = function () { res(null); };
          });
        }).catch(function () { return null; });
      },
      keys: function () {
        return open().then(function (db) {
          return new Promise(function (res) {
            const tx = db.transaction(STORE, 'readonly');
            const rq = tx.objectStore(STORE).getAllKeys();
            rq.onsuccess = function () { res(rq.result || []); };
            rq.onerror = function () { res([]); };
          });
        }).catch(function () { return []; });
      },
      del: function (id) {
        return open().then(function (db) {
          return new Promise(function (res) {
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).delete(id);
            tx.oncomplete = function () { res(true); };
            tx.onerror = function () { res(false); };
          });
        }).catch(function () { return false; });
      }
    };
  })();

  const SNAP_KEY = 'dayleaf.snaps';
  function snapIndex() {
    try { return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]') || []; } catch (e) { return []; }
  }
  function snapIndexSave(list) {
    try { localStorage.setItem(SNAP_KEY, JSON.stringify(list.slice(0, 12))); } catch (e) { /* ignore */ }
  }

  /** 收集当前数据（withAssets 时连图片/字体一起打包） */
  function collectBundle(withAssets, cb) {
    const meta = {
      app: APP.name,
      version: APP.version,
      exportedAt: new Date().toISOString(),
      kind: withAssets ? 'full' : 'meta',
      state: (function () {
        const copy = Object.assign({}, state);
        copy.bg = Object.assign({}, state.bg, { data: withAssets ? state.bg.data : '' });
        copy.home = Object.assign({}, state.home, { img: withAssets ? state.home.img : '' });
        return copy;
      })()
    };
    if (!withAssets) { cb(meta); return; }
    AssetDB.all().then(function (assets) {
      meta.assets = assets || {};
      cb(meta);
    }).catch(function () { meta.assets = {}; cb(meta); });
  }

  /** 恢复一个备份对象（含资产），成功后重载界面 */
  function restoreBundle(obj, label) {
    if (!obj || !obj.state || !Array.isArray(obj.state.events)) { toast('备份格式不对'); return; }
    takeSnapshot('恢复前自动快照', function () {
      const st = obj.state;
      state.events = st.events || [];
      state.notes = st.notes || {};
      state.tags = st.tags || {};
      state.annual = st.annual || {};
      state.blocks = ensureBlocks(st.blocks);
      state.cols = ensureCols(st.cols);
      state.draft = null;
      ['theme', 'home', 'quoteStyle', 'quotes', 'quoteBg', 'quoteFont', 'typeStyle', 'ui', 'clean', 'notify', 'settings', 'lock', 'meta'].forEach(function (k) {
        if (st[k] != null) state[k] = st[k];
      });
      ensure11Defaults();
      const done = function () {
        saveState();
        toast('已恢复' + (label || '备份') + '，正在重载…');
        setTimeout(function () { location.reload(); }, 700);
      };
      if (obj.assets && Object.keys(obj.assets).length) {
        const keys = Object.keys(obj.assets);
        let i = 0;
        const step = function () {
          if (i >= keys.length) { done(); return; }
          const k = keys[i++];
          AssetDB.put(k, obj.assets[k]).then(step, step);
        };
        step();
      } else done();
    });
  }

  /** 打一份本机快照（含资产），最多保留 6 份 */
  function takeSnapshot(reason, done) {
    collectBundle(true, function (bundle) {
      const id = 'snap-' + Date.now();
      let str = '';
      try { str = JSON.stringify(bundle); } catch (e) { toast('快照失败：数据过大'); if (done) done(); return; }
      SnapshotDB.put(id, str).then(function (ok) {
        if (!ok) { if (done) done(); return; }
        const list = snapIndex();
        list.unshift({ id: id, at: Date.now(), reason: reason || '手动快照', size: str.length });
        list.splice(6);
        snapIndexSave(list);
        /* 删掉被挤出去的快照本体 */
        SnapshotDB.keys().then(function (keys) {
          keys.forEach(function (k) { if (!list.some(function (x) { return x.id === k; })) SnapshotDB.del(k); });
        });
        if (done) done();
      }).catch(function () { if (done) done(); });
    });
  }

  function renderSnapList(box) {
    if (!box) return;
    const list = snapIndex();
    if (!list.length) { box.innerHTML = '<p class="hint">还没有本机快照，点「立即备份」留一份。</p>'; return; }
    box.innerHTML = list.map(function (x) {
      const d = new Date(x.at);
      const when = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
      return '<div class="dl-snap" data-snap="' + x.id + '">' +
        '<span class="when">' + when + '</span>' +
        '<span class="why">' + esc(x.reason) + ' · ' + fmtBytes(x.size) + '</span>' +
        '<button data-snap-restore="' + x.id + '">恢复</button>' +
        '<button class="del" data-snap-del="' + x.id + '">删除</button>' +
      '</div>';
    }).join('');
  }

  function autoSnapshotOnBoot() {
    const list = snapIndex();
    const today = toYMD(new Date());
    const has = list.some(function (x) { return toYMD(new Date(x.at)) === today; });
    if (has) return;
    takeSnapshot('每日自动快照');
  }

  /* ---------- 8.4 快速录入：中文自然语言解析 ---------- */
  function parseQuickText(raw) {
    const text = String(raw || '').trim();
    const out = { title: '', d: toYMD(new Date()), s: '', e: '', p: '', rm: null };
    if (!text) return out;
    let rest = text;
    const today = new Date();

    /* 日期 */
    const dt = (function () {
      let m = rest.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
      if (m) { rest = rest.replace(m[0], ' '); return new Date(+m[1], +m[2] - 1, +m[3]); }
      m = rest.match(/(\d{1,2})月(\d{1,2})[日号]/);
      if (m) {
        rest = rest.replace(m[0], ' ');
        const d = new Date(today.getFullYear(), +m[1] - 1, +m[2]);
        if (d < addDays(today, -180)) d.setFullYear(d.getFullYear() + 1);
        return d;
      }
      m = rest.match(/(下周|下下周|这周|本周)?\s*(周|星期|礼拜)([一二三四五六日天])/);
      if (m) {
        rest = rest.replace(m[0], ' ');
        const map = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 日: 0, 天: 0 };
        const target = map[m[3]];
        const base = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        let delta = (target - base.getDay() + 7) % 7;
        if (delta === 0) delta = 7;
        if (m[1] === '下周' || m[1] === '下下周') delta += 7;
        if (m[1] === '下下周') delta += 7;
        return addDays(base, delta);
      }
      const rel = [['大后天', 3], ['后天', 2], ['明天', 1], ['今天', 0], ['今晚', 0], ['明晚', 1]];
      for (let i = 0; i < rel.length; i++) {
        if (rest.indexOf(rel[i][0]) >= 0) {
          rest = rest.replace(rel[i][0], ' ');
          if (rel[i][0] === '今晚' || rel[i][0] === '明晚') out.pmHint = 1;
          return addDays(today, rel[i][1]);
        }
      }
      return null;
    })();
    if (dt) out.d = toYMD(dt);

    /* 时间：14:30 / 下午3点半 / 晚上8点 / 早上8点20 */
    const tm = rest.match(/(上午|早上|早晨|中午|下午|傍晚|晚上|夜里)?\s*(\d{1,2})\s*[点:：]\s*(\d{1,2})?\s*(半|一刻|三刻)?/);
    if (tm) {
      rest = rest.replace(tm[0], ' ');
      let h = parseInt(tm[2], 10);
      let mi = 0;
      if (tm[3]) mi = parseInt(tm[3], 10);
      else if (tm[4] === '半') mi = 30;
      else if (tm[4] === '一刻') mi = 15;
      else if (tm[4] === '三刻') mi = 45;
      const pm = tm[1] && /下午|傍晚|晚上|夜里|中午/.test(tm[1]);
      if (pm && h < 12) h += 12;
      if (!pm && out.pmHint && h < 12) h += 12;
      if (h >= 24) h = h % 24;
      out.s = toHM(h * 60 + mi);
    } else {
      const bare = rest.match(/(?:^|\s)(\d{1,2})点(半)?/);
      if (bare) {
        rest = rest.replace(bare[0], ' ');
        let h = parseInt(bare[1], 10);
        if (out.pmHint && h < 12) h += 12;
        out.s = toHM(h * 60 + (bare[2] ? 30 : 0));
      }
    }

    /* 时长 */
    let durMin = 0;
    const dm = rest.match(/(\d+(?:\.\d+)?)\s*个?\s*半?\s*小时/);
    if (dm) { durMin = Math.round(parseFloat(dm[1]) * 60) + (dm[0].indexOf('半') >= 0 ? 30 : 0); rest = rest.replace(dm[0], ' '); }
    const mm2 = rest.match(/(\d+)\s*分钟/);
    if (!durMin && mm2) { durMin = parseInt(mm2[1], 10); rest = rest.replace(mm2[0], ' '); }
    if (!durMin) durMin = 60;

    /* 提醒 */
    const rm = rest.match(/提前\s*(\d+)\s*(分钟|小时)/);
    if (rm) {
      out.rm = rm[2] === '小时' ? parseInt(rm[1], 10) * 60 : parseInt(rm[1], 10);
      rest = rest.replace(rm[0], ' ');
    }

    /* 地点：在XXX / @XXX */
    const pl = rest.match(/(?:在|@)\s*([^\s，,。;；]{2,20})/);
    if (pl) { out.p = pl[1]; rest = rest.replace(pl[0], ' '); }

    out.title = rest.replace(/\s+/g, ' ').replace(/^[，,。;；:\-]+|[，,。;；:\-]+$/g, '').trim();
    if (!out.title) out.title = '新日程';
    out.title = out.title.slice(0, 40);
    if (!out.s) out.s = '09:00';
    out.e = toHM(Math.min(23 * 60 + 59, toMin(out.s) + durMin));
    return out;
  }

  /* ---------- 8.6 首页滑动：左滑完成 / 右滑删除 ---------- */
  function bindSwipeRows(list) {
    if (!list || list.__dlSwipe) return;
    list.__dlSwipe = 1;
    let sx = 0, sy = 0, cur = null, moved = false;
    list.addEventListener('touchstart', function (e) {
      const row = e.target.closest ? e.target.closest('.trow') : null;
      if (!row || e.touches.length !== 1) return;
      cur = row; sx = e.touches[0].clientX; sy = e.touches[0].clientY; moved = false;
      cur.style.transition = 'none';
    }, { passive: true });
    list.addEventListener('touchmove', function (e) {
      if (!cur || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - sx;
      const dy = e.touches[0].clientY - sy;
      if (!moved && Math.abs(dy) > Math.abs(dx) + 6) { cur.style.transform = ''; cur.style.transition = ''; cur = null; return; }
      if (Math.abs(dx) > 8) { moved = true; if (e.cancelable) e.preventDefault(); }
      if (moved) cur.style.transform = 'translateX(' + Math.max(-120, Math.min(120, dx)) + 'px)';
    }, { passive: false });
    list.addEventListener('touchend', function () {
      if (!cur) return;
      const row = cur; cur = null;
      const m = /translateX\((-?\d+(?:\.\d+)?)px\)/.exec(row.style.transform || '');
      const dx = m ? parseFloat(m[1]) : 0;
      row.style.transition = '';
      if (Math.abs(dx) > 64 && moved) {
        row.style.transform = '';
        const id = row.dataset.id;
        const ev = state.events.filter(function (x) { return x.id === id; })[0];
        if (!ev) return;
        if (dx > 0) {
          deleteEventsWithUndo([ev], '已删除「' + ev.t + '」');
        } else {
          const before = ev.st;
          ev.st = ev.st === 'done' ? 'todo' : 'done';
          saveState(); renderAll();
          toast(ev.st === 'done' ? '已完成「' + ev.t + '」' : '已恢复「' + ev.t + '」', {
            label: '撤销', fn: function () { ev.st = before; saveState(); renderAll(); }
          });
        }
      } else {
        row.style.transform = '';
      }
    });
  }

  /* ---------- 8.7 冲突检测与空档 ---------- */
  function findConflicts(date, start, end, excludeIds) {
    const s1 = toMin(start), e1 = toMin(end);
    const ex = {};
    (excludeIds || []).forEach(function (id) { ex[id] = 1; });
    return state.events.filter(function (ev) {
      if (ev.d !== date || ex[ev.id]) return false;
      const s2 = toMin(ev.s), e2 = toMin(ev.e);
      return s1 < e2 && s2 < e1;
    });
  }
  function suggestFreeSlot(date, start, duration, excludeIds) {
    const ex = {};
    (excludeIds || []).forEach(function (id) { ex[id] = 1; });
    const dur = Math.max(10, duration || 60);
    let t = Math.max(7 * 60, toMin(start));
    for (let i = 0; i < 60; i++) {
      const conflicts = findConflicts(date, toHM(t), toHM(t + dur), excludeIds);
      if (!conflicts.length && t + dur <= 23 * 60) return { s: toHM(t), e: toHM(t + dur) };
      t += 10;
    }
    return null;
  }

  function renderImportHome() {

      '<p class="im-note">Excel 课表按「周一到周日为列、节次为行」识别；支持单元格里多行填写课程名/老师/教室/周次。CSV 与 Excel 同一套识别；ICS 只导入其中的日程事件。<br>识别结果先预览，再确认导入，不会直接改你的数据。</p>';

  function parseTimetableWorkbook(buf, filename) {
    if (typeof XLSX === 'undefined') { toast('Excel 解析库没加载成功，改用 CSV 试试'); return; }
    const wb = typeof buf === 'string'
      ? XLSX.read(buf, { type: 'string' })
      : XLSX.read(buf, { type: 'array', cellDates: false });
    const ws = wb.Sheets[wb.SheetNames[0]];
    if (!ws) { toast('这个表里没有工作表'); return; }
    /* 合并单元格填充：SheetJS 只把值放在左上角 */
    const merges = ws['!merges'] || [];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
    merges.forEach(function (m) {
      const v = rows[m.s.r] && rows[m.s.r][m.s.c];
      if (v == null || v === '') return;
      for (let r = m.s.r; r <= m.e.r; r++) {
        rows[r] = rows[r] || [];
        for (let c = m.s.c; c <= m.e.c; c++) if (!rows[r][c]) rows[r][c] = v;
      }
    });
    const wdRe = /周\s*([一二三四五六日天])|星期\s*([一二三四五六日天])|礼拜\s*([一二三四五六日天])/;
    /* 找表头行 */
    let headRow = -1, headCols = {};
    for (let r = 0; r < Math.min(rows.length, 15); r++) {
      const cols = {};
      (rows[r] || []).forEach(function (cell, c) {
        const m = wdRe.exec(String(cell || ''));
        if (m) {
          const ch = m[1] || m[2] || m[3];
          const map = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 日: 0, 天: 0 };
          cols[c] = map[ch];
        }
      });
      if (Object.keys(cols).length >= 3) { headRow = r; headCols = cols; break; }
    }
    if (headRow < 0) { toast('没找到「周一…周日」表头，请确认这是课表'); return; }
    const courses = [];
    const warnings = [];
    for (let r = headRow + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const rowText = row.slice(0, Math.min(4, row.length)).join(' ');
      let timeRange = null, periodIdx = null;
      const tm = rowText.match(/(\d{1,2}:\d{2})\s*[-~—]\s*(\d{1,2}:\d{2})/);
      if (tm) timeRange = [tm[1], tm[2]];
      else {
        const p = rowText.match(/第?\s*(\d{1,2})\s*[-~—]?\s*(\d{1,2})?\s*节/);
        if (p) periodIdx = parseInt(p[1], 10) - 1;
      }
      Object.keys(headCols).forEach(function (cs) {
        const c = parseInt(cs, 10);
        const raw = String(row[c] || '').trim();
        if (!raw) return;
        const lines = raw.replace(/\\n/g, '\n').split(/\r?\n|\s{2,}/).map(function (x) { return x.trim(); }).filter(Boolean);
        if (!lines.length) return;
        const title = lines[0].slice(0, 40);
        if (!title) return;
        let room = '', teacher = '', weeks = null, single = 0;
        lines.slice(1).forEach(function (ln) {
          const wm = ln.match(/(\d{1,2})\s*[-~—]\s*(\d{1,2})\s*周/);
          if (wm) { weeks = [parseInt(wm[1], 10), parseInt(wm[2], 10)]; if (/单周/.test(ln)) single = 1; if (/双周/.test(ln)) single = 2; return; }
          if (/[老师教授讲师]/.test(ln)) { teacher = ln.replace(/老师|教授|讲师/g, '').trim(); return; }
          if (/楼|室|教室|机房|馆|区|栋|[A-Za-z]\s*\d{3}/.test(ln)) { room = ln; return; }
          if (!teacher && ln.length <= 6) { teacher = ln; return; }
          if (!room) room = ln;
        });
        let s = '', e = '';
        if (timeRange) { s = timeRange[0]; e = timeRange[1]; }
        else if (periodIdx != null && periodTime(periodIdx + 1)) {
          const pt = periodTime(periodIdx + 1);
          s = pt.s; e = pt.e;
        } else { s = '08:00'; e = '09:40'; warnings.push(title + '：没识别到时间，暂用 08:00–09:40'); }
        courses.push({ dow: headCols[cs], title: title, room: room, teacher: teacher, weeks: weeks, single: single, s: s, e: e });
      });
    }
    if (!courses.length) { toast('课表里没识别到课程，确认一下表格格式'); return; }
    const defStart = (function () {
      const t = new Date();
      const mon = startOfWeek(t);
      return toYMD(addDays(mon, -7 * 8));
    })();
    importState = { kind: 'courses', courses: courses, warnings: warnings, startYMD: defStart, skipExisting: true, name: filename || '课表' };
    renderImportPreview();
  }

    body.innerHTML =

      '<div class="im-row"><span>重复周数</span><select class="inp" id="imWeeks"><option value="16">16 周</option><option value="18" selected>18 周</option><option value="20">20 周</option></select></div>' +
      '<div class="im-row"><span>已存在</span><label style="font-size:12px"><input type="checkbox" id="imSkip" ' + (st.skipExisting ? 'checked' : '') + '> 跳过同时间同名的日程</label></div>' +
      '<p class="im-note">识别到 <b>' + st.courses.length + '</b> 门课；按上面的「第 1 周周一」和周数展开成具体日期。' +
        (st.warnings.length ? '<br><span class="im-bad">' + st.warnings.slice(0, 3).map(esc).join('<br>') + '</span>' : '') + '</p>' +
      '<table><thead><tr><th>星期</th><th>课程</th><th>时间</th><th>教室</th><th>周次</th></tr></thead><tbody>' + rows + '</tbody></table>' +

    $('#imBack').addEventListener('click', renderImportHome);
