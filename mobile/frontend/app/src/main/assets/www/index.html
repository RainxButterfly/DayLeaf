          const w = Number(b.dataset.w);
          const i = repWds.indexOf(w);
          if (i > -1) { if (repWds.length > 1) repWds.splice(i, 1); }
          else repWds.push(w);
          wdTouched = true;
          syncWd();
          updatePreview();
        });
      });

      $('#fUntil').addEventListener('change', updatePreview);

      $('#fDate').addEventListener('change', function () {
        if (!wdTouched) {
          repWds = [fromYMD(this.value || base.d).getDay()];
          syncWd();
        }
        updatePreview();
      });
    }

    /* ---- 日期 / 时间快选：手机上原生 date/time 是转轮，换成更好点的 ---- */
    const WD_CN = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const p2 = function (n) { return (n < 10 ? '0' : '') + n; };
    const dtMin = function (s) {
      const p = String(s || '00:00').split(':');
      return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0);
    };
    const dtHHMM = function (m) {
      m = ((m % 1440) + 1440) % 1440;
      return p2(Math.floor(m / 60)) + ':' + p2(m % 60);
    };
    /** 日期的人话：几月几日 + 周几 + 今天/明天/后天 */
    const dtDateLabel = function (ymd) {
      const d = fromYMD(ymd);
      const diff = Math.round((d - fromYMD(toYMD(new Date()))) / 86400000);
      const tag = diff === 0 ? '今天' : diff === 1 ? '明天' : diff === 2 ? '后天' : diff === -1 ? '昨天' : '';
      return { main: (d.getMonth() + 1) + '月' + d.getDate() + '日', wd: WD_CN[d.getDay()], tag: tag };
    };
    /** 当前时长（分钟），跨夜按 (e-s+1440)%1440 算；00:00–23:59 视作一整天 */
    const dtDur = function () {
      const s = dtMin($('#fStart').value), e = dtMin($('#fEnd').value);
      if (s === 0 && e === 1439) return 1440;
      const d = ((e - s) + 1440) % 1440;
      return d === 0 ? 1440 : d;
    };

    /** 把三个原生 input 的值翻成界面上的样子 */
    function dtSync() {
      const dEl = $('#fDate'), sEl = $('#fStart'), eEl = $('#fEnd');
      if (!dEl || !sEl || !eEl) return;
      const s = dtMin(sEl.value), e = dtMin(eEl.value), dur = dtDur();
      const overnight = dur < 1440 && e <= s;

      const dl = dtDateLabel(dEl.value || base.d);
      const lbl = $('#fDateLbl');
      if (lbl) {
        lbl.innerHTML = '<span>' + dl.main + '</span><em>' + dl.wd + '</em>' +
          (dl.tag ? '<i>' + dl.tag + '</i>' : '');
      }
      const sl = $('#fStartLbl'), elb = $('#fEndLbl');
      if (sl) sl.textContent = dtHHMM(s);
      if (elb) elb.innerHTML = dtHHMM(e) + (overnight ? '<small>次日</small>' : '');

      const ul = $('#fUntilLbl'), uEl = $('#fUntil');
      if (ul && uEl && uEl.value) {
        const u = dtDateLabel(uEl.value);
        ul.textContent = u.main + ' ' + u.wd;
      }

      const hint = $('#dtHint');
      if (hint) {
        const h = dur >= 1440 ? '一整天'
          : (dur >= 60 ? Math.floor(dur / 60) + ' 小时' + (dur % 60 ? ' ' + (dur % 60) + ' 分' : '')
            : dur + ' 分钟');
        hint.textContent = overnight
          ? '结束早于开始，算到次日 ' + dtHHMM(e) + '，共 ' + h
          : '共 ' + h;
        hint.classList.toggle('overnight', overnight);
      }
      const adBtn = $('#fAllDay');
      if (adBtn) {
        const allDay = sEl.value === '00:00' && eEl.value === '23:59';
        adBtn.classList.toggle('on', allDay);
        $$('.dt-time').forEach(function (x) { x.classList.toggle('is-off', allDay); });
      }
    }

    /**
     * 改日期/时间。o: { d?, dur?, at?, start?, end? }，时间都是分钟数。
     * 开始与结束互相独立：动一头绝不牵动另一头（除非显式选了「时长」）。
     */
    function dtSet(o) {
      const dEl = $('#fDate'), sEl = $('#fStart'), eEl = $('#fEnd');
      if (!sEl || !eEl) return;
      if (o.d && dEl) { dEl.value = o.d; dEl.dispatchEvent(new Event('change')); }

      let s = dtMin(sEl.value), e = dtMin(eEl.value);

      if (o.dur != null) {
        /* 只有「选时长」才会同时动两头，这是用户明确点了时长 */
        const v = Number(o.dur);
        if (v === 0) { s = 0; e = 1439; }          /* 全天 */
        else e = (s + v) % 1440;
      } else if (o.at != null || o.start != null) {
        s = ((Number(o.at != null ? o.at : o.start) % 1440) + 1440) % 1440;
      } else if (o.end != null) {
        e = ((Number(o.end) % 1440) + 1440) % 1440;
      }
      sEl.value = dtHHMM(s);
      eEl.value = dtHHMM(e);
      sEl.dispatchEvent(new Event('change'));
      eEl.dispatchEvent(new Event('change'));
      dtSync();
    }

    /* 全天：收在「更多选项」里，开就铺满 00:00–23:59，关就回到 09:00–10:00 */
    const alldayBtn = $('#fAllDay');
    const syncAllDay = function () {
      if (!alldayBtn) return;
      const on = $('#fStart').value === '00:00' && $('#fEnd').value === '23:59';
      alldayBtn.classList.toggle('on', on);
      $$('.dt-time').forEach(function (el) { el.classList.toggle('is-off', on); });
    };
    if (alldayBtn) {
      alldayBtn.addEventListener('click', function () {
        const on = alldayBtn.classList.contains('on');
        if (on) {
          const sEl = $('#fStart'), eEl = $('#fEnd');
          sEl.value = '09:00'; eEl.value = '10:00';
          sEl.dispatchEvent(new Event('change'));
          eEl.dispatchEvent(new Event('change'));
          dtSync();
        } else dtSet({ dur: 0 });
      });
    }

    $$('.dt-time .dt-step').forEach(function (b) {
      b.addEventListener('click', function () {
        const delta = Number(b.dataset.dir) * dtStep();
        if (b.dataset.t === 's') dtSet({ start: dtMin($('#fStart').value) + delta });
        else dtSet({ end: dtMin($('#fEnd').value) + delta });
      });
    });
    /* 手机上点时间数字直接滚轮选，比 ± 快 */
    $$('.dt-tval').forEach(function (el) {
      el.addEventListener('click', function () {
        const which = el.dataset.t;
        openTimeWheel(dtMin($('#' + (which === 's' ? 'fStart' : 'fEnd')).value), function (m) {
          dtSet(which === 's' ? { start: m } : { end: m });
        });
      });
    });
    /* 标签本身也点得开日历 —— 手指最容易戳到的就是那一大片 */
    const dLbl = $('#fDateLbl'), dCal = $('#fDateCal');
    [dLbl, dCal].forEach(function (el) {
      if (!el) return;
      el.addEventListener('click', function () {
        if (isMobileView()) {
          openDateWheel($('#fDate').value, function (ymd) { dtSet({ d: ymd }); });
        } else {
          openMiniCal(el, $('#fDate').value, function (ymd) { dtSet({ d: ymd }); });
        }
      });
    });
    const uLbl = $('#fUntilLbl'), uCal = $('#fUntilCal');
    [uLbl, uCal].forEach(function (el) {
      if (!el) return;
      el.addEventListener('click', function () {
        openMiniCal(el, $('#fUntil').value, function (ymd) {
          const u = $('#fUntil');
          u.value = ymd;
          u.dispatchEvent(new Event('change'));
          dtSync();
        });
      });
    });
    /* 原生 input 被藏起来了，但键盘用户仍可能改到它 —— 跟着刷一遍界面 */
    [['#fStart', 'change'], ['#fEnd', 'change'], ['#fDate', 'change']].forEach(function (p) {
      const el = $(p[0]);
      if (el) el.addEventListener(p[1], dtSync);
    });
    dtSync();

    /* ---- 草稿：恢复上次没写完的内容 ---- */
    if (!ev && opts && opts.draft) {
      const d = opts.draft;
      if (d.repRule) {
        repRule = d.repRule;
        $$('#repSeg button').forEach(function (x) { x.classList.toggle('on', x.dataset.rule === repRule); });
        $('#repWd').style.display = (repRule === 'weekly' || repRule === 'biweekly') ? 'flex' : 'none';
        $('#repUntilRow').style.display = repRule === 'none' ? 'none' : 'flex';
      }
      if (d.repWds && d.repWds.length) {
        repWds = d.repWds.slice();
        wdTouched = true;
      }
      if (d.repUntil) $('#fUntil').value = d.repUntil;
      if (d.imp && impBtn) { impOn = true; impBtn.classList.add('on'); }
      if (d.rmOn === true || Number(d.rm) > 0) {
        rmOn = true;
        rmMin = Number(d.rm) || 0;
        alarmOn = !!d.al;
        if (rmBtn) rmBtn.classList.add('on');
        syncRemind();
      }
      syncWd();
      updatePreview();
    }

    /* 状态切换 */
    let st = curSt;
    $$('#fSeg button').forEach(function (b) {
      b.addEventListener('click', function () {
        st = b.dataset.st;
        $$('#fSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
      });
    });

    /* 重要项目开关（自动清理豁免） */
    let impOn = !!base.imp;
    const impBtn = $('#fImp');
    if (impBtn) {
      impBtn.addEventListener('click', function () {
        impOn = !impOn;
        impBtn.classList.toggle('on', impOn);
      });
    }

    /**
     * 提醒三态：关 / 到点（提前 0 分钟）/ 提前 N 分钟。
     * 所以「开没开」和「提前多久」必须分开记：rmOn 是开关，rm 是分钟数。
     */
    let rmOn = remindOn(base);
    let rmMin = Number(base.rm) || 0;
    let alarmOn = !!base.al;

    const syncRemind = function () {
      const row = $('#rmMinRow');
      if (row) row.style.display = rmOn ? 'flex' : 'none';
      const alRow = $('#rmAlarmRow');
      if (alRow) alRow.style.display = rmOn ? 'flex' : 'none';
      $$('#rmSeg button').forEach(function (b) {
        b.classList.toggle('on', rmOn && Number(b.dataset.min) === rmMin);
      });
      const alBtn = $('#rmAlarm');
      if (alBtn) alBtn.classList.toggle('on', alarmOn);
    };

    const rmBtn = $('#rmOn');
    if (rmBtn) {
      rmBtn.addEventListener('click', function () {
        if (rmOn) { rmOn = false; alarmOn = false; }
        else {
          rmOn = true;
          rmMin = (Number(state.notify && state.notify.defMin) || 10);
          if (!canNotify() && !notifiedPermWarn) {
            notifiedPermWarn = true;
            toast('还没开启系统通知权限，去「个性化 → 通知与闹钟」里点一下授权');
          }
        }
        rmBtn.classList.toggle('on', rmOn);
        syncRemind();
      });
    }

    $$('#rmSeg button').forEach(function (b) {
      b.addEventListener('click', function () {
        rmMin = Number(b.dataset.min) || 0;   // 0 = 到点提醒
        rmOn = true;
        if (rmBtn) rmBtn.classList.add('on');
        syncRemind();
      });
    });

    const rmAlarmBtn = $('#rmAlarm');
    if (rmAlarmBtn) {
      rmAlarmBtn.addEventListener('click', function () {
        alarmOn = !alarmOn;
        rmAlarmBtn.classList.toggle('on', alarmOn);
      });
    }
    syncRemind();

    /* 背景图：选中后压到 480px，只影响这一条日程 */
    function paintImgThumb() {
      const el = $('#fImgThumb');
      if (!el) return;
      if (imgData) {
        el.classList.remove('empty');
        el.style.backgroundImage = 'url(\'' + imgData + '\')';
        el.textContent = '';
      } else {
        el.classList.add('empty');
        el.style.backgroundImage = '';
        el.textContent = '无';
      }
    }
    paintImgThumb();

    $('#fImgFile').addEventListener('change', function () {
      const file = this.files && this.files[0];
      if (!file) return;
      readImageAsData(file, 480, 0.72, function (data) {
        imgData = data;
        paintImgThumb();
      });
    });

    $('#fImgClear').addEventListener('click', function () {
      imgData = '';
      paintImgThumb();
    });

    /* ---- 通知识别：粘贴后自动填，也可以点按钮重试 ---- */
    const pasteRun = $('#fPasteRun');
    if (pasteRun) {
      const runParse = function () {
        const raw = ($('#fPaste').value || '').trim();
        if (!raw) { toast('先把通知粘进来'); return; }

        const r = parseNotice(raw);

        /* 识别是「整段重填」：标题、日期、地点直接覆盖，
           没认出地点就清空，免得留下上一段的旧值；
           时间没认出来则保留默认的 09:00，只提示用户补 */
        $('#fTitle').value = r.t || '';
        if (r.d) $('#fDate').value = r.d;
        if (r.s) {
          $('#fStart').value = r.s;
          $('#fEnd').value = r.e;
        }
        $('#fPlace').value = r.p || '';
        if (r.n) $('#fNote').value = r.n;

        /* 「重复至」跟着新日期走，免得还停在上次的默认值 */
        if (r.d && $('#fUntil')) {
          $('#fUntil').value = toYMD(addDays(fromYMD(r.d), 60));
        }
        /* 识别出来的地点 / 备注在「更多选项」里，顺手摊开给人看一眼 */
        updatePreview();
        dtSync();
        scheduleDraftSave();

        const bits = [];
        if (r.d) {
          const dt = fromYMD(r.d);
          bits.push((dt.getMonth() + 1) + '月' + dt.getDate() + '日 ' + WEEKDAY[dt.getDay()]);
        }
        if (r.s) bits.push(r.s + '–' + r.e);
        if (r.p) bits.push(r.p);
        toast(bits.length ? '已识别：' + bits.join(' · ') : '只认出文字，时间请手动补');
      };

      pasteRun.addEventListener('click', runParse);

      /* 直接粘贴就自动识别，不用再点一次 */
      $('#fPaste').addEventListener('paste', function () {
        setTimeout(runParse, 60);
      });
    }

    /* ---- 课表图片识别（OCR）：读图 → 识别 → 预览逐项确认 ---- */
    const ocrFile = $('#fOcrFile');
    if (ocrFile) {
      ocrFile.addEventListener('change', function () {
        const file = this.files && this.files[0];
        this.value = '';
        if (!file) return;
        const prog = $('#ocrProg');
        const showProg = function (txt) {
          if (!prog) return;
          prog.classList.remove('hide');
          prog.textContent = txt;
        };

        showProg('正在读图…');
        readImageAsData(file, 1600, 0.9, function (data) {
          showProg('正在加载识别引擎…首次约 10MB，请稍等');
          ocrImage(data, function (p) {
            showProg('正在识别… ' + Math.round(p * 100) + '%');
          }).then(function (text) {
            const rows = parseScheduleText(text);
            if (prog) prog.classList.add('hide');
            if (!rows.length) {
              showProg('没认出课程行。可以换一张更清晰的截图，或把文字复制到上面用「识别并填入」。');
              return;
            }
            openOcrPreview(rows);
          }).catch(function (err) {
            console.warn('[DayLeaf] OCR 失败', err);
            showProg('识别失败：' + (err && err.message ? err.message : '引擎没加载成功') +
              '。首次使用需要联网；也可以直接把文字粘到上面的输入框识别。');
          });
        });
      });
    }

    /* ---- 草稿：注册读取器 + 输入时自动保存（仅新建） ---- */
    if (!ev) {
      draftCtx = {
        read: function () {
          return {
            t: $('#fTitle').value.trim(),
            d: $('#fDate').value,
            s: $('#fStart').value,
            e: $('#fEnd').value,
            p: $('#fPlace').value.trim(),
            n: $('#fNote').value.trim(),
            st: st,
            img: imgData || '',
            imp: !!impOn,
            rm: rmOn ? rmMin : 0,
            rmOn: !!rmOn,
            al: !!(rmOn && alarmOn),
            repRule: repRule,
            repWds: repWds.slice(),
            repUntil: $('#fUntil') ? $('#fUntil').value : ''
          };
        }
      };

      const panel = $('.mb-panel', root);
      if (panel) {
        panel.addEventListener('input', scheduleDraftSave);
        panel.addEventListener('change', scheduleDraftSave);
        /* 状态切换、重复规则、拆分按钮这些不是 input 事件，补一个 click */
        panel.addEventListener('click', function (e) {
          if (e.target.closest('[data-close]')) return;
          scheduleDraftSave();
        });
      }
    }

    /* 关闭 */
    $$('[data-close]', root).forEach(function (el) {
      el.addEventListener('click', closeModal);
    });

    /* 保存 */
    $('#fSave').addEventListener('click', function () {
      const title = $('#fTitle').value.trim() || '未命名日程';
      const date = $('#fDate').value || toYMD(new Date());
      const start = $('#fStart').value || '09:00';
      let end = $('#fEnd').value;

      /* 结束时间缺失或早于开始 → 默认 +1 小时（上限 23:59） */
      if (!end || toMin(end) <= toMin(start)) {
        end = toHM(Math.min(23 * 60 + 59, toMin(start) + 60));
      }

      const payload = {
        d: date,
        s: start,
        e: end,
        t: title,
        p: $('#fPlace').value.trim(),
        n: $('#fNote').value.trim(),
        st: st,
        img: imgData || '',
        imp: !!impOn,
        /* 提醒提前分钟（0=关）/ 闹钟（到点响铃） */
        rm: rmOn ? rmMin : 0,
        rmOn: !!rmOn,
        al: !!(rmOn && alarmOn)
      };

      /* --- 编辑既有：只改当前这一条 --- */
      if (editingId) {
        const i = state.events.findIndex(function (x) { return x.id === editingId; });
        if (i > -1) state.events[i] = Object.assign({}, state.events[i], payload);
        saveState();
        closeModal();
        renderAll();
        return;
      }

      /* --- 新建：按重复规则展开成一批 --- */
      const dates = repRule === 'none'
        ? [date]
        : expandRepeat(date, $('#fUntil').value || date, repRule, repWds);
      const anchor = dates[0] || date;

      if (dates.length > 1) {
        /* 整组共用同一个 gid（项目组标识），供「删除整组」一次性清理 */
        const gid = uid('grp');
        dates.forEach(function (ds) {
          state.events.push(Object.assign({ id: uid('ev'), gid: gid, gt: title }, payload, { d: ds }));
        });
      } else {
        state.events.push(Object.assign({ id: uid('ev') }, payload, { d: anchor }));
      }

      /* 跳到起始日所在周，方便立刻看到结果 */
      weekStart = startOfWeek(fromYMD(anchor));

      /* 已经提交，草稿作废；先置空读取器，关闭时就不会再回写 */
      draftCtx = null;
      clearDraft();

      closeModal();
      renderAll();
      toast(dates.length > 1 ? ('已生成 ' + dates.length + ' 项重复日程') : '已添加日程');
    });

    /**
     * 删除并给一次「撤销」机会。
     * 用户已经确认过一次，这里不再弹窗打扰；但只要还在当前页面，
     * 提示条上的「撤销」就能把数据原样塞回去。
     * @param {Array} victims 被删掉的日程对象（原引用，恢复时直接 concat）
     * @param {string} msg    提示文案
     */
    function deleteWithUndo(victims, msg) {
      if (!victims.length) { closeModal(); return; }

      const ids = {};
      victims.forEach(function (x) { ids[x.id] = 1; });
      state.events = state.events.filter(function (x) { return !ids[x.id]; });
      saveState();
      closeModal();
      renderAll();

      toast(msg, {
        label: '撤销',
        fn: function () {
          state.events = state.events.concat(victims);
          saveState();
          renderAll();
          toast('已恢复 ' + victims.length + ' 项');
        }
      });
    }

    /* 删除单条：点第一下变「再点一次」，3 秒没动作自动复位，避免误删 */
    const del = $('#fDel');
    if (del) {
      let armed = false;
      let armTimer = null;
      const disarm = function () {
        armed = false;
        clearTimeout(armTimer);
        del.classList.remove('armed');
        del.textContent = '删除';
      };
      del.addEventListener('click', function () {
        if (!armed) {
          armed = true;
          del.classList.add('armed');
          del.textContent = '再点一次确认删除';
          armTimer = setTimeout(disarm, 3000);
          return;
        }
        clearTimeout(armTimer);
        const victim = state.events.filter(function (x) { return x.id === editingId; });
        deleteWithUndo(victim, '已删除「' + (victim[0] ? victim[0].t : '日程') + '」');
      });
    }

    /* 删除整组（按 gid 一次性清理）：同样是二次点击确认 */
    const delGrp = $('#fDelGrp');
    if (delGrp && ev && ev.gid) {
      delGrp.addEventListener('click', function () {
        if (!delGrp.classList.contains('armed')) {
          delGrp.classList.add('armed');
          delGrp.textContent = '确认删除 ' + groupMembers.length + ' 项？';
          return;
        }
        deleteWithUndo(groupMembers.slice(), '已删除整组 ' + groupMembers.length + ' 项');
      });
    }

    /* 自动聚焦标题 */
    setTimeout(function () { const t = $('#fTitle'); if (t) t.focus(); }, 120);
  }

  /* --------------------------------------------------------------------------
   * 7.8.1 新建日程草稿
   * 关掉弹窗时把已填内容留下来，可以先去翻日历、再回来接着写。
   * 只有一份草稿；提交成功后立刻清空。
   * ------------------------------------------------------------------------ */

  /** 当前打开着的新建弹窗会注册一个读取器，用来抓表单当前值 */
  let draftCtx = null;
  let draftTimer = null;

  /** 这份内容值不值得留成草稿（什么都不填就不打扰） */
  function draftIsMeaningful(d) {
    if (!d) return false;
    return !!((d.t || '').trim() ||
      (d.n || '').trim() ||
      (d.p || '').trim() ||
      d.img ||
      (d.repRule && d.repRule !== 'none'));
  }

  /** 立刻把表单写进草稿：关闭弹窗时调用，或输入停顿 350ms 后自动调用 */
  function flushDraft() {
    clearTimeout(draftTimer);
    draftTimer = null;
    if (!draftCtx) return;

    const d = draftCtx.read();
    if (draftIsMeaningful(d)) {
      d.savedAt = Date.now();
      state.draft = d;
    } else {
      state.draft = null;
    }
    saveState();
    syncDraftBar();
  }

  /** 输入时延迟保存，避免一个字一次写盘 */
  function scheduleDraftSave() {
    if (!draftCtx) return;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(flushDraft, 350);
  }

  /** 清掉草稿 */
  function clearDraft() {
    clearTimeout(draftTimer);
    draftTimer = null;
    if (!state.draft) return;
    state.draft = null;
    saveState();
    syncDraftBar();
  }

  /** 草稿条上的摘要文案 */
  function draftMetaText(d) {
    const parts = [];
    if (d.d) {
      const dt = fromYMD(d.d);
      parts.push((dt.getMonth() + 1) + '月' + dt.getDate() + '日');
    }
    if (d.s) parts.push(d.s + (d.e ? '–' + d.e : ''));
    if (d.repRule && d.repRule !== 'none') {
      const r = REPEAT_RULES.filter(function (x) { return x.key === d.repRule; })[0];
      if (r) parts.push(r.label);
    }
    return parts.join(' · ') + ' · 未提交';
  }

  /** 有草稿就显示草稿条，没有就收起 */
  function syncDraftBar() {
    const bar = $('#draftBar');
    if (!bar) return;
    const d = state.draft;
    const show = !!d;

    bar.classList.toggle('show', show);
    document.body.classList.toggle('has-draft', show);
    if (!show) return;

    $('#dbTitle').textContent = (d.t || '').trim() || '未命名日程';
    $('#dbMeta').textContent = draftMetaText(d);

    const x = $('#dbX');
    if (x) { x.classList.remove('armed'); x.textContent = '✕'; }
  }

  /** 点「继续编辑」：带着草稿内容重新打开弹窗 */
  function resumeDraft() {
    const d = state.draft;
    if (!d) return;
    openEventDialog(null, {
      d: d.d, s: d.s, e: d.e, t: d.t, p: d.p, n: d.n, st: d.st, img: d.img
    }, { draft: d });
  }

  function closeModal() {
    /* 真正关闭时才回写草稿；提交路径会先把 draftCtx 置空 */
    if (draftCtx) {
      flushDraft();
      draftCtx = null;
    }
    clearTimeout(draftTimer);

    const root = $('#modalRoot');
    popModal(closeModal);
    root.classList.remove('open');
    root.innerHTML = '';
    editingId = null;
  }

  /**
   * 轻量提示条（批量生成 / 删除后的反馈）
   * @param {string} msg 提示文字
   * @param {{label:string, fn:Function}|null} [act]
   *   可选的动作按钮，用于「撤销」这类需要补救的操作。
   *   带按钮时停留时间更长，给用户留出反应余地。
   */
  let toastTimer = null;
  function toast(msg, act) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = '';

    const span = document.createElement('span');
    span.textContent = msg;
    el.appendChild(span);

    if (act && typeof act.fn === 'function') {
      const btn = document.createElement('button');
      btn.className = 't-act';
      btn.textContent = act.label || '撤销';
      btn.addEventListener('click', function () {
        hideToast();
        try { act.fn(); } catch (err) { console.warn('[DayLeaf] 提示条动作执行失败', err); }
      });
      el.appendChild(btn);
    }

    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, act ? 5000 : 2200);
  }

  /** 收起提示条（换一条提示前也会先收，避免闪一下旧文案） */
  function hideToast() {
    const el = document.getElementById('toast');
    if (el) el.classList.remove('show');
  }

  /* --------------------------------------------------------------------------
   * 7.8.5 过期日程自动清理
   * 规则很简单：早于「今天 - 保留天数」的日程会被清掉，但标了「重要项目」
   * （imp）的永远保留。默认关闭，由用户在设置里自己决定要不要开。
   * ------------------------------------------------------------------------ */

  /** 当前保留天数是否落在三个预设上（否则由自定义输入框接管） */
  function cleanIsPreset() {
    const days = Number(state.clean.days) || 30;
    return CLEAN_SPANS.some(function (c) { return c.days === days; });
  }

  /**
   * 设置面板里是否处于「自定义」态。
   * 光看天数不够：从「一个月」切到自定义时天数还是 30，
   * 会被误判成预设，输入框就不出来了。
   */
  let cleanCustomUI = false;

  /** 当前会被清理掉的日程（重要项目不在其中） */
  function cleanableEvents() {
    const days = Number(state.clean.days) || 30;
    const cutoff = toYMD(addDays(new Date(), -days));
    return state.events.filter(function (x) {
      return !x.imp && typeof x.d === 'string' && x.d < cutoff;
    });
  }

  /**
   * 执行一次清理。
   * @param {boolean} [manual] 用户手动触发时给明确反馈（没东西可清也要说一声）
   * @returns {number} 实际清掉的条数
   */
  function runClean(manual) {
    const today = toYMD(new Date());
    const list = cleanableEvents();

    state.clean.lastRun = today;

    if (!list.length) {
      saveState();
      if (manual) toast('没有需要清理的日程');
      return 0;
    }

    const ids = {};
    list.forEach(function (x) { ids[x.id] = 1; });
    state.events = state.events.filter(function (x) { return !ids[x.id]; });
    saveState();
    renderAll();

    /* 清理是后台做的，用户可能压根没注意；留一个撤销口子 */
    toast('已清理 ' + list.length + ' 条过期日程', {
      label: '撤销',
      fn: function () {
        state.events = state.events.concat(list);
        saveState();
        renderAll();
        toast('已恢复 ' + list.length + ' 条');
      }
    });
    return list.length;
  }

  /** 启动时跑一次自动清理：只在开启时生效，且一天最多一次 */
  function autoCleanOnBoot() {
    if (!state.clean.on) return;
    if (state.clean.lastRun === toYMD(new Date())) return;
    runClean(false);
  }

  /* --------------------------------------------------------------------------
   * 7.8.6 提醒与闹钟
   * 两条线：
   * · 提醒 = 提前 N 分钟弹系统通知（Notification API），没权限就退成页面提示条；
   * · 闹钟 = 事件开始时弹全屏面板 + 响铃 + 震动。
   * Web 端写不了系统闹钟，想要真正系统级的，用「导出 .ics」导进手机日历。
   * ------------------------------------------------------------------------ */

  /** 权限提示只提醒一次，别每次开提醒都烦人 */
  let notifiedPermWarn = false;

  /** 原生壳桥接：打包成 App 后 window.DayLeafNative 才存在；网页原型里为 null */
  function nativeBridge() {
    try {
      return (window.DayLeafNative && window.DayLeafNative.checkUpdate) ? window.DayLeafNative : null;
    } catch (e) { return null; }
  }
  /** 保存文本文件：App 里走原生「另存为」，网页里退回 blob 下载（WebView 不认 <a download>） */
  function saveTextFile(filename, content, mime) {
    const nat = nativeBridge();
    if (nat && nat.saveTextFile) {
      try { nat.saveTextFile(filename, content); return; } catch (e) { /* 退回下载 */ }
    }
    const blob = new Blob([content], { type: mime || 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }
  function notifySupported() {
    return typeof window.Notification !== 'undefined' || !!nativeBridge();
  }

  /**
   * 是否「手机端」。闹钟是手机端专属功能：电脑上不显示、不响，
   * 免得在办公场景里突然响铃。断点跟 UI 一致（<960px 视为手机）。
   */
  function isMobileView() {
    return !!(window.matchMedia && window.matchMedia('(max-width:959px)').matches);
  }

  /**
   * 这条日程有没有开提醒。
   * 0 分钟是「到点提醒」而不是「关」，所以开关和分钟数得分开存：
   * 新数据看 rmOn；老数据（只有 rm>0 才叫开）也能正确还原。
   * @param {Object} ev
   */
  function remindOn(ev) {
    if (!ev) return false;
    if (typeof ev.rmOn === 'boolean') return ev.rmOn;
    return Number(ev.rm) > 0;
  }

  /** 提醒文案：到点 / 提前 N 分钟 */
  function remindText(ev) {
    return Number(ev.rm) > 0 ? '提前 ' + ev.rm + ' 分钟' : '到点';
  }

  /** 设置里那颗按钮的文案：把权限状态翻译成人话 */
  function notifyPermText() {
    if (nativeBridge()) return '已授权（App 内原生通知）';
    if (!notifySupported()) return '此浏览器不支持通知';
    const p = Notification.permission;
    if (p === 'granted') return '已授权 ✓（点此复查）';
    if (p === 'denied') return '已被拒绝（浏览器设置里改）';
    return '点击授权';
  }
  function canNotify() {
    if (nativeBridge()) return true;   // App 内由原生处理权限
    return notifySupported() && Notification.permission === 'granted';
  }

  /** 请求系统通知权限；cb(granted) */
  function askNotifyPermission(cb) {
    const _nb = nativeBridge();
    if (_nb) {
      try { if (_nb.ensureNotifyPermission) _nb.ensureNotifyPermission(); } catch (e) { /* ignore */ }
      cb && cb(true);
      return;
    }
    if (!notifySupported()) { cb && cb(false); return; }
    if (Notification.permission === 'granted') { cb && cb(true); return; }
    try {
      const r = Notification.requestPermission(function (p) { cb && cb(p === 'granted'); });
      if (r && r.then) r.then(function (p) { cb && cb(p === 'granted'); });
    } catch (err) { cb && cb(false); }
  }

  /** 日程开始的绝对时间戳（本地时区） */
  function evStartTs(ev) {
    return fromYMD(ev.d).getTime() + toMin(ev.s) * 60000;
  }

  let remindTimer = null;
  /** 启动轮询（20 秒一次，够准又不费电；关掉总开关时直接不扫） */
  function startReminders() {
    if (remindTimer) return;
    remindTimer = setInterval(tickReminders, 20000);
    tickReminders();
  }

  function firedKey(ev, kind) { return ev.id + '|' + ev.d + '|' + kind; }

  /** 触发记录只留 3 天，别让它无限长 */
  function pruneFired() {
    const f = state.notify.fired || {};
    const cut = Date.now() - 3 * 24 * 3600 * 1000;
    Object.keys(f).forEach(function (k) { if (!f[k] || f[k] < cut) delete f[k]; });
  }

  function tickReminders() {
    if (!state.notify || !state.notify.on) return;
    const now = Date.now();

    state.events.forEach(function (ev) {
      if (!remindOn(ev)) return;                // 没开提醒
      const st = evStartTs(ev);

      /* 提醒：提前 rm 分钟；迟到半小时内仍补一次（比如刚打开软件） */
      const rt = st - ev.rm * 60000;
      if (now >= rt && now <= rt + 30 * 60 * 1000) tryFire(ev, 'rm');

      /* 闹钟：到点响；迟到 15 分钟内也认（手机端专属，电脑端不响） */
      if (ev.al && isMobileView() && now >= st && now <= st + 15 * 60 * 1000) tryFire(ev, 'al');
    });
  }

  function tryFire(ev, kind) {
    const f = state.notify.fired || (state.notify.fired = {});
    const key = firedKey(ev, kind);
    if (f[key]) return;
    f[key] = Date.now();
    pruneFired();
    saveState();
    if (kind === 'al') openAlarm(ev);
    else pushRemind(ev);
  }

  /** 系统通知；拿不到权限就退回页面内提示条 */
  function pushRemind(ev) {
    const body = (Number(ev.rm) > 0 ? '还有 ' + ev.rm + ' 分钟开始' : '到点了') +
      ' · ' + ev.s + (ev.p ? ' · ' + ev.p : '');
    const _nb = nativeBridge();
    if (_nb) {
      try { _nb.notify(ev.t, body, 'dayleaf-' + ev.id); } catch (e) { /* ignore */ }
      return;
    }
    if (canNotify()) {
      try {
        const n = new Notification(ev.t, { body: body, tag: 'dayleaf-' + ev.id, icon: '' });
        n.onclick = function () {
          try { window.focus(); } catch (e) { /* ignore */ }
          switchView('grid');
          weekStart = startOfWeek(fromYMD(ev.d));
          renderGrid();
          openEventDialog(ev.id);
        };
        return;
      } catch (err) { /* 部分平台要用 ServiceWorker，落回页面提示 */ }
    }
    toast('🔔 ' + ev.t + ' · ' + body);
  }

  /* ---- 闹钟：全屏面板 + 响铃 + 震动 ---- */
  let alarmAudio = null;

  function startAlarmSound() {
    if (!state.notify.sound) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      alarmAudio = new AC();
      const beep = function () {
        if (!alarmAudio) return;
        const t0 = alarmAudio.currentTime;
        [0, 0.24].forEach(function (off) {
          const o = alarmAudio.createOscillator();
          const g = alarmAudio.createGain();
          o.type = 'sine';
          o.frequency.value = 880;
          g.gain.setValueAtTime(0.0001, t0 + off);
          g.gain.exponentialRampToValueAtTime(0.3, t0 + off + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.18);
          o.connect(g); g.connect(alarmAudio.destination);
          o.start(t0 + off); o.stop(t0 + off + 0.2);
        });
      };
      beep();
      alarmAudio._timer = setInterval(beep, 1500);
    } catch (err) { /* 没有音频设备就算了 */ }
  }

  function stopAlarmSound() {
    if (!alarmAudio) return;
    clearInterval(alarmAudio._timer);
    try { alarmAudio.close(); } catch (e) { /* ignore */ }
    alarmAudio = null;
  }

  function ringAlarm() {
    startAlarmSound();
    let left = 30;                    // 最多响 30 秒，没人理就自动收
    const box = $('#alarmRoot');
    if (!box) return;
    box._timer = setInterval(function () {
      left--;
      if (left <= 0) { stopAlarm(); return; }
      if (box._cd) box._cd.textContent = left;
      try { navigator.vibrate && navigator.vibrate([500, 300, 500]); } catch (e) { /* ignore */ }
    }, 1000);
    try { navigator.vibrate && navigator.vibrate([700, 400, 700]); } catch (e) { /* ignore */ }
  }

  function openAlarm(ev) {
    const box = $('#alarmRoot');
    if (!box) return;
    box.hidden = false;
    box.innerHTML =
      '<div class="alarm-card" role="alertdialog" aria-modal="true">' +
        '<span class="al-ico">⏰</span>' +
        '<div class="al-t">' + esc(ev.t) + '</div>' +
        '<div class="al-m">' + esc(ev.s) + '–' + esc(ev.e) +
          (ev.p ? ' · ' + esc(ev.p) : '') + '</div>' +
        '<div class="al-acts">' +
          '<button class="btn ghost" id="alSnooze">稍后 5 分钟</button>' +
          '<button class="btn primary" id="alStop">停止</button>' +
        '</div>' +
        '<div class="al-cd"><span id="alCd">30</span> 秒后自动停止</div>' +
      '</div>';
    box._cd = $('#alCd', box) || document.getElementById('alCd');

    const stop = function () { stopAlarm(); };
    const stopBtn = document.getElementById('alStop');
    const snzBtn = document.getElementById('alSnooze');
    if (stopBtn) stopBtn.addEventListener('click', stop);
    if (snzBtn) snzBtn.addEventListener('click', function () {
      /* 5 分钟后再响一次：把这一条的触发记录推迟 */
      const f = state.notify.fired || (state.notify.fired = {});
      f[firedKey(ev, 'al')] = Date.now() - 14 * 60 * 1000; // 让它落在窗口内、稍后重新命中
      saveState();
      stopAlarm();
      toast('5 分钟后再响一次');
    });
    ringAlarm();
  }

  function stopAlarm() {
    stopAlarmSound();
    try { navigator.vibrate && navigator.vibrate(0); } catch (e) { /* ignore */ }
    const box = $('#alarmRoot');
    if (!box) return;
    clearInterval(box._timer);
    box.hidden = true;
    box.innerHTML = '';
    box._cd = null;
  }

  /**
   * 导出 .ics：只导出开了提醒 / 闹钟的日程。
   * 手机日历导入后，VALARM 会变成系统级提醒 —— 这是 Web 端唯一能
   * 真正落到「系统闹钟」的办法。
   */
  function exportIcs() {
    const items = state.events.filter(function (e) { return remindOn(e); });
    if (!items.length) { toast('还没有开启提醒的日程'); return; }
    const p2 = function (v) { return String(v).padStart(2, '0'); };
    const stamp = function (d) {
      return d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + 'T' +
        p2(d.getHours()) + p2(d.getMinutes()) + '00';
    };
    const escTxt = function (s) {
      return String(s || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
    };
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//DayLeaf//叶历//ZH', 'CALSCALE:GREGORIAN'];
    items.forEach(function (ev) {
      const st = new Date(evStartTs(ev));
      const en = new Date(fromYMD(ev.d).getTime() + toMin(ev.e) * 60000);
      L.push('BEGIN:VEVENT',
        'UID:' + ev.id + '@dayleaf',
        'DTSTAMP:' + stamp(new Date()),
        'DTSTART:' + stamp(st),
        'DTEND:' + stamp(en),
        'SUMMARY:' + escTxt(ev.t),
        'DESCRIPTION:' + escTxt(ev.p || ''),
        'BEGIN:VALARM',
        'TRIGGER:' + (Number(ev.rm) > 0 ? '-PT' + ev.rm + 'M' : 'PT0M'),
        'ACTION:DISPLAY',
        'DESCRIPTION:' + escTxt(ev.t + (Number(ev.rm) > 0 ? ' 还有 ' + ev.rm + ' 分钟开始' : ' 时间到了')),
        'END:VALARM');
      if (ev.al) {
        /* 闹钟：到点的响铃提醒 */
        L.push('BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:AUDIO',
          'DESCRIPTION:' + escTxt(ev.t + ' 时间到了'), 'END:VALARM');
      }
      L.push('END:VEVENT');
    });
    L.push('END:VCALENDAR');

    saveTextFile('dayleaf-reminders-' + toYMD(new Date()) + '.ics', L.join('\r\n'), 'text/calendar;charset=utf-8');
    toast('已导出 ' + items.length + ' 条带提醒的日程（.ics）');
  }

    /* ---- 滑块：实时预览 ---- */
    function bindRange(id, labelId, fmt, apply) {
      const el = $('#' + id);
      if (!el) return;
      /* 拖动中只做视觉预览，不写 localStorage：背景图是几百 KB 的 dataURL，
         每帧序列化 + 同步写盘正是滑块卡顿的主因。松手（change）才落盘。 */
      el.addEventListener('input', function () {
        const v = Number(el.value);
        $('#' + labelId).textContent = fmt(v);
        apply(v);
        applyBg();
      });
      el.addEventListener('change', function () { saveState(); });
    }
    bindRange('fOp', 'vOp', function (v) { return v + '%'; }, function (v) { state.bg.opacity = v / 100; });
    bindRange('fBl', 'vBl', function (v) { return v + 'px'; }, function (v) { state.bg.blur = v; });
    bindRange('fSc', 'vSc', function (v) { return v + '%'; }, function (v) { state.bg.scale = v / 100; });
    bindRange('fX', 'vX', function (v) { return v + '%'; }, function (v) { state.bg.x = v; });
    bindRange('fY', 'vY', function (v) { return v + '%'; }, function (v) { state.bg.y = v; });

    $('#themeSeg').addEventListener('click', function (e) {

      $$('#themeSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
      applyTheme();
      saveState();
    });

    /* ---- 主页外观：主卡图片 / 位置 / 透明度 / 内容卡透明度 ---- */
    function syncHeroPreview() {
      const box = $('#heroPrev');
      const layer = $('#heroPrevBg');
      if (!box || !layer) return;
      const h = state.home;
      box.style.setProperty('--hp-a', String(h.alpha));
      box.classList.toggle('is-faint', h.alpha < 0.62);
      if (h.img) {
        layer.style.backgroundImage =
          'linear-gradient(180deg,rgba(10,14,42,.30),rgba(10,14,42,.64)),url("' + h.img + '")';
        layer.style.backgroundSize = 'auto, cover';
        layer.style.backgroundPosition = '50% 50%, ' + h.imgX + '% ' + h.imgY + '%';
      } else {
        layer.style.backgroundImage = '';
        layer.style.backgroundSize = '';
        layer.style.backgroundPosition = '';
      }
    }

    /* 通用的外观滑块：拖动即时生效，预览与真实主卡一起变 */
    function bindHomeRange(id, labelId, fmt, apply) {
      const el = $('#' + id);
      if (!el) return;
      /* 同背景滑块：拖动中不落盘，松手才保存 */
      el.addEventListener('input', function () {
        const v = Number(el.value);
        $('#' + labelId).textContent = fmt(v);
        apply(v);
        applyHomeLook();
        syncHeroPreview();
        if (id === 'fCardA') applyQuoteStyle();
      });
      el.addEventListener('change', function () { saveState(); });
    }

    bindHomeRange('fHx', 'vHx', function (v) { return v + '%'; }, function (v) { state.home.imgX = v; });
    bindHomeRange('fHy', 'vHy', function (v) { return v + '%'; }, function (v) { state.home.imgY = v; });
    bindHomeRange('fHeroA', 'vHeroA', function (v) { return v + '%'; }, function (v) { state.home.alpha = v / 100; });
    bindHomeRange('fCardA', 'vCardA', function (v) { return v + '%'; }, function (v) { state.home.cardAlpha = v / 100; });

    /* 选图：压到 1000px 再存，主卡是整屏宽度但只需要中等清晰度 */
    $('#fHeroFile').addEventListener('change', function () {
      const file = this.files && this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const MAX = 1000;
          const k = Math.min(1, MAX / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * k);
          cv.height = Math.round(img.height * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          state.home.img = cv.toDataURL('image/jpeg', 0.85);
          AssetDB.put('hero', state.home.img);
          applyHomeLook();
          syncHeroPreview();
          saveState();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

      state.home.borderHero = state.home.borderHero === false;

      saveState();

    /* 常用档位：一键跳到 100% / 200% / 400% / 700% / 1000% */

    if (padPreset) {
      padPreset.addEventListener('click', function (e) {
        const b = e.target.closest('button[data-pad]');
        if (!b) return;
        setPad('mul', Math.round(Number(b.dataset.pad)) / 100);
      });

    /* 手输：3.5 / 350% / 260px，越界提示并回退 100% */
    const padInput = $('#fQPadCust');
    const padApply = $('#fQPadApply');
    if (padInput && padApply) {
      const doApply = function () {
        const r = parsePadInput(padInput.value);
        if (!r.ok) {
          toast(r.msg);
          if (r.fallback) {
            setPad('mul', Q_PAD_DEF);               // 安全回退到默认
            padInput.classList.add('bad');          // 红框留在那儿，说明刚才那次被驳回了
          } else {
            padInput.classList.add('bad');
          }
          return;
        }
        setPad(r.mode, r.val);
        toast('卡片高度已设为 ' + padLabel());
      };
      padApply.addEventListener('click', doApply);
      padInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); doApply(); }

      const cell = e.target.closest('[data-qb]');

  /**
   * 把当前背景参数同步到设置面板里的预览块。
   * 写法与 applyBg 完全一致（cover + position + scale + blur + opacity），
   * 所以预览里看到的就是真实效果。
   */
  function syncBgPreview() {
    const box = $('#bgPrev');
    const img = $('#bgPrevImg');
    if (!box || !img) return;

    const bg = state.bg;
    if (!bg.data) {
      box.classList.remove('has-img');
      img.style.backgroundImage = 'none';
      return;
    }
    box.classList.add('has-img');
    img.style.backgroundImage = 'url("' + bg.data + '")';
    img.style.backgroundPosition = bg.x + '% ' + bg.y + '%';
    img.style.transform = 'scale(' + bg.scale + ')';
    img.style.filter = 'blur(' + bg.blur + 'px)';
    img.style.opacity = String(bg.opacity);
  }

  /** 把 state.bg 应用到背景层 */
  let _lastBgSrc = null;
  function applyBg() {
    const bg = state.bg;
    const layer = $('#bgImage');
    if (bg.data) {
      /* 只有换图才重设 backgroundImage；拖滑块时只改 opacity / blur / scale / position，
         避免每帧重新解析几百 KB 的 dataURL */
      if (_lastBgSrc !== bg.data) {
        layer.style.backgroundImage = 'url(' + bg.data + ')';
        _lastBgSrc = bg.data;
      }
      layer.style.opacity = String(bg.opacity);
      layer.style.filter = 'blur(' + bg.blur + 'px)';
      layer.style.transform = 'scale(' + bg.scale + ')';
      layer.style.backgroundPosition = bg.x + '% ' + bg.y + '%';
      document.body.classList.add('has-bg');
    } else {
      if (_lastBgSrc !== '') { layer.style.backgroundImage = 'none'; _lastBgSrc = ''; }
      document.body.classList.remove('has-bg');
    }
    /* 预览与背景层永远同源，任何参数变化都走这里 */
    syncBgPreview();
  }

  /**
   * 今日清单里点角标循环切换状态（待办 → 完成 → 缺席 → 待办）。
   * 只改这一条，重复组里其他日期互不影响。
   * @param {string} id 日程 id
   */
  function cycleEventStatus(id) {
    const ev = state.events.filter(function (x) { return x.id === id; })[0];
    if (!ev) return;

    const order = ['todo', 'done', 'absent'];
    const cur = order.indexOf(ev.st || 'todo');
    const next = order[(cur + 1) % order.length];
    ev.st = next;

    saveState();
    renderHome();
    toast('已标记为「' + STATUS[next].label + '」');
  }

  /** 主题实际生效的深浅 */
  function isDarkTheme() {
    const t = state.theme || 'light';
    if (t === 'dark') return true;
    if (t === 'system') {
      return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    return false;
  }

  /** 把主题套到 html 上，并同步浏览器主题色 */
  function applyTheme() {
    const dark = isDarkTheme();
    document.documentElement.classList.toggle('dark', dark);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#0E1118' : '#4C6FFF');
  }

  /**
   * 应用主页外观：主卡底色 / 图片 / 透明度，以及其余内容卡的统一透明度。
   * 主卡的「不透明度」只降底色层，文字永远保持原样，所以透出来看背景图时依然可读；
   * 底色淡到 62% 以下时自动把字改成深色，避免白字落在浅色页面上看不见。
   */
  let _lastHeroSrc = null;
  function applyHomeLook() {
    const h = state.home || {};
    const alpha = Number(h.alpha);
    const cardAlpha = Number(h.cardAlpha);

    const layer = $('#heroBg');
    const hero = $('#hero');

    if (layer) {
      if (h.img) {
        /* 同背景层：图片没变就不重设，拖动位置滑块时只改 background-position */
        if (_lastHeroSrc !== h.img) {
          layer.style.backgroundImage =
            'linear-gradient(180deg,rgba(10,14,42,.30),rgba(10,14,42,.64)),url("' + h.img + '")';
          layer.style.backgroundSize = 'auto, cover';
          _lastHeroSrc = h.img;
        }
        layer.style.backgroundPosition = '50% 50%, ' + h.imgX + '% ' + h.imgY + '%';
      } else {
        if (_lastHeroSrc !== '') {
          layer.style.backgroundImage = '';
          layer.style.backgroundSize = '';
          _lastHeroSrc = '';
        }
        layer.style.backgroundPosition = '';
      }
      layer.style.opacity = String(alpha);
    }

    if (hero) {
      hero.classList.toggle('is-faint', alpha < 0.62);
      hero.classList.toggle('is-bare', alpha < 0.12);
      hero.style.setProperty('--hero-a', String(alpha));
    }

    document.documentElement.style.setProperty('--card-a', String(cardAlpha));
    document.body.classList.toggle('no-bd-hero', h.borderHero === false);
    document.body.classList.toggle('no-bd-card', h.borderCard === false);
  }

  /* --------------------------------------------------------------------------
   * 7.9.1 背景裁剪器
   * 取景框在舞台上拖动/缩放，确认后按原图像素重绘到 canvas，
   * 输出 JPEG dataURL 回写 state.bg.data。
   * ------------------------------------------------------------------------ */

  /** 可选裁剪比例：v = 宽/高，0 表示自由 */
  const CROP_RATIOS = Object.freeze([
    { key: 'free', label: '自由', v: 0 },
    { key: '1:1',  label: '1:1',  v: 1 },
    { key: '4:5',  label: '4:5',  v: 4 / 5 },
    { key: '3:4',  label: '3:4',  v: 3 / 4 },
    { key: '9:16', label: '9:16', v: 9 / 16 },
    { key: '16:9', label: '16:9', v: 16 / 9 }
  ]);

  const clampNum = function (v, min, max) { return Math.max(min, Math.min(max, v)); };

  /** 裁剪会话状态 */
  let crop = null;

  /** 打开裁剪器 */
  function openCropper() {
    if (!state.bg.data) { toast('请先选择一张背景图片'); return; }

    const root = $('#cropper');
    root.innerHTML =
      '<div class="crop-back" data-crop-close></div>' +
      '<div class="crop-panel" role="dialog" aria-modal="true">' +
        '<div class="crop-head"><h3>裁剪背景</h3>' +
          '<button class="icon-btn sm" data-crop-close aria-label="关闭">✕</button></div>' +

        '<div class="crop-stage" id="cropStage">' +
          '<img id="cropImg" alt="待裁剪的背景图">' +
          '<div class="crop-box" id="cropBox">' +
            '<span class="grid"></span>' +
            '<i class="h" data-corner="nw"></i><i class="h" data-corner="ne"></i>' +
            '<i class="h" data-corner="sw"></i><i class="h" data-corner="se"></i>' +
          '</div>' +
        '</div>' +

        '<div class="crop-ratios" id="cropRatios">' +
          CROP_RATIOS.map(function (r) {
            return '<button data-ratio="' + r.key + '" class="' + (r.key === 'free' ? 'on' : '') + '">' + r.label + '</button>';
          }).join('') +
        '</div>' +

        '<div class="crop-tip">拖动白框取景，四角圆点可缩放。裁剪会以原图重新取景，应用后「缩放 / 位置」会重置。</div>' +

        '<div class="mb-foot">' +
          '<button class="btn ghost" data-crop-close>取消</button>' +
          '<button class="btn primary" id="cropApply">应用裁剪</button>' +
        '</div>' +
      '</div>';

    root.classList.add('open');

    const img = $('#cropImg');
    img.onload = function () {
      /* 等一帧，确保面板已完成布局再读取尺寸 */
      requestAnimationFrame(function () { initCropBox(img); });
    };
    img.src = state.bg.data;

    /* 关闭 */
    $$('[data-crop-close]', root).forEach(function (el) {
      el.addEventListener('click', closeCropper);
    });

    /* 比例切换 */
    $$('#cropRatios button').forEach(function (b) {
      b.addEventListener('click', function () {
        const item = CROP_RATIOS.filter(function (r) { return r.key === b.dataset.ratio; })[0];
        $$('#cropRatios button').forEach(function (x) { x.classList.toggle('on', x === b); });
        if (crop) setCropRatio(item.v);
      });
    });

    $('#cropApply').addEventListener('click', applyCrop);
  }

  /**
   * 初始化裁剪框：以「居中 cover」为基准，默认取画面中间 80%。
   * @param {HTMLImageElement} img
   */
  function initCropBox(img) {
    const stage = $('#cropStage');
    const sw = stage.clientWidth;
    const sh = stage.clientHeight;
    const iw = img.naturalWidth;
    const ih = img.naturalHeight;
    if (!sw || !sh || !iw || !ih) return;

    /* object-fit: cover 的换算参数：缩放比 k、绘制尺寸、居中偏移 */
    const k = Math.max(sw / iw, sh / ih);
    const dw = iw * k;
    const dh = ih * k;

    crop = {
      img: img,
      stage: { w: sw, h: sh },
      base: { k: k, dw: dw, dh: dh, dx: (sw - dw) / 2, dy: (sh - dh) / 2 },
      ratio: 0,
      box: { x: sw * 0.1, y: sh * 0.1, w: sw * 0.8, h: sh * 0.8 }
    };

    lockCropBoxInStage();
    drawCrop();
    bindCropDrag();
  }

  /** 把裁剪框渲染到 DOM */
  function drawCrop() {
    const el = $('#cropBox');
    if (!el || !crop) return;
    const b = crop.box;
    el.style.left = b.x + 'px';
    el.style.top = b.y + 'px';
    el.style.width = b.w + 'px';
    el.style.height = b.h + 'px';
  }

  /** 裁剪框整体夹在舞台内，并保证最小尺寸 */
  function lockCropBoxInStage() {
    const s = crop.stage;
    const b = crop.box;
    const MIN = 60;
    b.w = clampNum(b.w, MIN, s.w);
    b.h = clampNum(b.h, MIN, s.h);
    b.x = clampNum(b.x, 0, s.w - b.w);
    b.y = clampNum(b.y, 0, s.h - b.h);
  }

  /**
   * 切换宽高比：以当前框中心为基准重新计算宽高。
   * @param {number} v 宽/高，0 表示自由
   */
  function setCropRatio(v) {
    if (!crop) return;
    crop.ratio = v;

    const s = crop.stage;
    const cx = crop.box.x + crop.box.w / 2;
    const cy = crop.box.y + crop.box.h / 2;
    let w = crop.box.w;
    let h = crop.box.h;

    if (v) {
      /* 取能装下当前面积的等比尺寸 */
      if (w / h > v) h = w / v; else w = h * v;
      if (w > s.w) { w = s.w; h = w / v; }
      if (h > s.h) { h = s.h; w = h * v; }
    }

    crop.box = { x: cx - w / 2, y: cy - h / 2, w: w, h: h };
    lockCropBoxInStage();
    drawCrop();
  }

  /**
   * 拖拽角点缩放（对角点固定）。
   * @param {string} corner 'nw' | 'ne' | 'sw' | 'se'
   * @param {Object} start  按下时的 box
   * @param {number} dx     指针位移
   * @param {number} dy
   */
  function resizeByCorner(corner, start, dx, dy) {
    const MIN = 60;
    const s = crop.stage;
    const r = crop.ratio;
    const isW = corner.indexOf('w') > -1;
    const isN = corner.indexOf('n') > -1;

    /* 固定不动的对角点 */
    const ax = isW ? start.x + start.w : start.x;
    const ay = isN ? start.y + start.h : start.y;

    /* 指针的绝对位置 → 相对锚点的尺寸 */
    const mx = isW ? start.x + dx : start.x + start.w + dx;
    const my = isN ? start.y + dy : start.y + start.h + dy;

    let w = Math.abs(mx - ax);
    let h = Math.abs(my - ay);

    if (r) { if (w / h > r) h = w / r; else w = h * r; }

    /* 不超出舞台可用范围 */
    const maxW = isW ? ax : s.w - ax;
    const maxH = isN ? ay : s.h - ay;
    if (w > maxW) { w = maxW; if (r) h = w / r; }
    if (h > maxH) { h = maxH; if (r) w = h * r; }

    /* 最小尺寸（等比时同步修正另一侧） */
    if (w < MIN) { w = MIN; if (r) h = w / r; }
    if (h < MIN) { h = MIN; if (r) w = h * r; }

    crop.box = { x: isW ? ax - w : ax, y: isN ? ay - h : ay, w: w, h: h };
  }

  /** 绑定拖动 / 缩放（Pointer Events，鼠标与触摸统一） */
  function bindCropDrag() {
    const stage = $('#cropStage');
    const boxEl = $('#cropBox');
    let drag = null;

    stage.addEventListener('pointerdown', function (e) {
      if (!crop) return;
      const handle = e.target.closest ? e.target.closest('.h') : null;
      const inside = e.target.closest ? e.target.closest('#cropBox') : null;
      if (!handle && !inside) return;

      e.preventDefault();
      drag = {
        mode: handle ? handle.dataset.corner : 'move',
        x: e.clientX,
        y: e.clientY,
        box: Object.assign({}, crop.box)
      };
      try { stage.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    });

    stage.addEventListener('pointermove', function (e) {
      if (!drag || !crop) return;
      const dx = e.clientX - drag.x;
      const dy = e.clientY - drag.y;

      if (drag.mode === 'move') {
        crop.box.x = clampNum(drag.box.x + dx, 0, crop.stage.w - drag.box.w);
        crop.box.y = clampNum(drag.box.y + dy, 0, crop.stage.h - drag.box.h);
      } else {
        resizeByCorner(drag.mode, drag.box, dx, dy);
      }
      drawCrop();
    });

    const end = function () { drag = null; };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);
  }

  /** 把裁剪框区域按原图像素重绘并写回背景 */
  function applyCrop() {
    if (!crop) return;
    const base = crop.base;
    const b = crop.box;

    /* 舞台像素 → 原图像素 */
    const sx = (b.x - base.dx) / base.k;
    const sy = (b.y - base.dy) / base.k;
    const sw = b.w / base.k;
    const sh = b.h / base.k;

    const MAXW = 1400;
    const outW = Math.max(1, Math.min(MAXW, Math.round(sw)));
    const outH = Math.max(1, Math.round(outW * sh / sw));

    const cv = document.createElement('canvas');
    cv.width = outW;
    cv.height = outH;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(crop.img, sx, sy, sw, sh, 0, 0, outW, outH);

    state.bg.data = cv.toDataURL('image/jpeg', 0.86);
    AssetDB.put('bg', state.bg.data);
    /* 裁剪已完成取景，缩放与位置回到默认 */
    state.bg.scale = 1;
    state.bg.x = 50;
    state.bg.y = 50;

    applyBg();
    saveState();
    syncBgControls();
    closeCropper();
    toast('已应用裁剪（' + outW + ' × ' + outH + '）');
  }

  function closeCropper() {
    const root = $('#cropper');
    root.classList.remove('open');
    root.innerHTML = '';
    crop = null;
  }

  /** 裁剪后把设置面板上的滑块同步到新值 */
  function syncBgControls() {
    const set = function (id, val) {
      const el = document.getElementById(id);
      if (el) el.value = val;
    };
    set('fSc', Math.round(state.bg.scale * 100));
    set('fX', state.bg.x);
    set('fY', state.bg.y);
    const l1 = document.getElementById('vSc');
    const l2 = document.getElementById('vX');
    const l3 = document.getElementById('vY');
    if (l1) l1.textContent = Math.round(state.bg.scale * 100) + '%';
    if (l2) l2.textContent = state.bg.x + '%';
    if (l3) l3.textContent = state.bg.y + '%';
  }

  /**
   * 读入图片文件并压到指定边长，回调返回 dataURL。
   * @param {File} file
   * @param {number} maxSide 最长边像素
   * @param {number} quality JPEG 质量
   * @param {Function} cb (dataURL, width, height)
   */
  function readImageAsData(file, maxSide, quality, cb) {
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        const k = Math.min(1, maxSide / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * k));
        cv.height = Math.max(1, Math.round(img.height * k));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL('image/jpeg', quality), cv.width, cv.height);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  /* --------------------------------------------------------------------------
   * 7.9.2 时间块拉伸
   * 每个时间块可独立设「高度权重」和「卡片宽度占比」，

      if (el.dataset.k === 'edge') {
        state.blocks.bounds[i + 1] = Math.round(v) / 60;
        syncBlockLabels();
        saveState();
        renderGridSoon();
        return;
      }

      state.blocks.h[i] = v / 100;
      const label = el.parentNode.querySelector('b');
      if (label) label.textContent = (v / 100).toFixed(1) + '×';

    /* 切点：点结束时间展开调节行；点 ± 半小时微调 */
    $('#spList').addEventListener('click', function (e) {

  /** 渲染「时间段高度」列表 */

  /** 改切点后只刷新文字，不重建 DOM（否则拖动时焦点会丢） */
