.dl-viewer{position:fixed;top:0;right:0;bottom:0;left:0;z-index:890;display:grid;place-items:center;background:rgba(6,8,14,.86)}
.dl-viewer img{max-width:92vw;max-height:86vh;border-radius:12px}
.dl-viewer-x{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:16px}
.dl-snap-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.dl-snap{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:11px;background:var(--surface-soft);border:1px solid var(--line);font-size:11.5px}
.dl-snap .when{flex:1;min-width:0;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-snap .why{color:var(--muted);font-size:10.5px;flex:0 0 auto}
.dl-snap button{font-size:11px;color:var(--accent);padding:3px 6px;border-radius:7px}
.dl-snap button.del{color:var(--absent)}
.att-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.att-thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line2)}
.att-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.att-thumb button{position:absolute;right:2px;top:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;line-height:1}
.att-thumb.pick{display:grid;place-items:center;border-style:dashed;color:var(--muted);font-size:20px;background:var(--surface-soft);position:relative;overflow:hidden;cursor:pointer}
#next7Block{margin-top:18px}
.n7-row{display:flex;align-items:baseline;gap:10px;padding:7px 2px;border-bottom:1px dashed var(--line)}
.n7-row:last-child{border-bottom:0}
.n7-day{flex:0 0 62px;font-size:11.5px;color:var(--muted)}
.n7-main{flex:1;min-width:0}
.n7-t{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n7-meta{font-size:10.5px;color:var(--muted)}
.gh-hd{margin-left:3px;font-size:8.5px;padding:0 3px;border-radius:5px;background:rgba(244,63,94,.16);color:#F43F5E;vertical-align:1px}
.gh-hd.work{background:rgba(22,163,74,.16);color:#16A34A}
.cc-hd{position:absolute;right:4px;bottom:4px;z-index:2;font-size:8.5px;line-height:1.35;padding:0 4px;border-radius:5px;background:rgba(244,63,94,.18);color:#F43F5E;letter-spacing:0}
.cc-hd.work{background:rgba(22,163,74,.18);color:#16A34A}
.cc-hd.work{background:rgba(22,163,74,.16);color:#16A34A}
.cloud-warn{color:#F59E0B;font-size:11px}
</style>
</head>

   * 除了加 open，还量一次实际尺寸：旧内核不认 `inset` 时 fixed 层会塌成 0×0，
   * 弹层整个跑到视口外，用户看到的就是「点了没反应」。塌了就补内联尺寸。
   */
  function openLayer(root) {
    if (!root) return;
    root.classList.add('open');
    const w = window.innerWidth || 360;
    const h = window.innerHeight || 640;
    const r = root.getBoundingClientRect();
    if (r.width < w * 0.9 || r.height < h * 0.9) {
      root.style.position = 'fixed';
      root.style.top = '0';
      root.style.right = '0';
      root.style.bottom = '0';
      root.style.left = '0';
      root.style.width = '100%';
      root.style.height = '100%';
    }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(APP.storageKey);
      if (!raw) return false;

      if (!obj || !Array.isArray(obj.events)) return false;
      state.events = obj.events;
      state.notes = obj.notes || {};
      state.tags = obj.tags || {};
      state.annual = obj.annual || {};

      state.cols = ensureCols(obj.cols);

      state.home = Object.assign(state.home, obj.home || {});

      if (obj.home && typeof obj.home.border === 'boolean') {
        state.home.borderHero = obj.home.border;
        state.home.borderCard = obj.home.border;
      }
      state.quoteStyle = Object.assign(state.quoteStyle, obj.quoteStyle || {});
      /* 卡片高度：老数据没有 padMode / padPx，手改坏了也要夹回合法区间 */
      const np = normPad(state.quoteStyle);
      state.quoteStyle.padMode = np.mode;
      state.quoteStyle.pad = np.mul;
      state.quoteStyle.padPx = np.px;
      state.quoteStyle.fs = Math.max(0.8, Math.min(3, Number(state.quoteStyle.fs) || 1));
      if (['left', 'center', 'right'].indexOf(String(state.quoteStyle.align)) < 0) state.quoteStyle.align = 'left';

      const ts = obj.typeStyle || {};

      ['home', 'grid', 'notes'].forEach(function (k) {
        const v = ts[k] || {};

        state.typeStyle[k] = {
          color: hexOk(v.color),
          color2: hexOk(v.color2),
          color3: hexOk(v.color3),

    if (lunar) {
      /* 闰月是独立的月份：闰月里的日期只匹配闰月条目，普通月不跟着亮 */
      const k = 'L:' + lunar.m + '-' + lunar.d + (lunar.leap ? '-leap' : '');
      if (state.annual[k]) return { key: k, item: state.annual[k] };
      /* 农历三十遇到小月只有廿九：把「三十」的纪念日落在当月最后一天 */
      if (!lunar.leap && lunar.d === lunarMonthDays(lunar.y, lunar.m) && lunar.d < 30) {
        const k30 = 'L:' + lunar.m + '-30';
        if (state.annual[k30]) return { key: k30, item: state.annual[k30] };
      }
    }
    return null;
  }
  function annualForDate(dateStr) {
    const e = annualEntryForDate(dateStr);
    return e ? e.item : null;
  }

  /**
   * 按重复规则展开成一组日期。
   * @param {string} startYMD 起始日（含）
   * @param {string} untilYMD 截止日（含）
   * @param {string} rule     规则 key，见 REPEAT_RULES
   * @param {number[]} wds    选中的星期（0=周日），weekly/biweekly 生效
   * @returns {string[]} 日期数组（已排序，长度 ≤ REPEAT_LIMIT）
   */
  function expandRepeat(startYMD, untilYMD, rule, wds) {
    if (!rule || rule === 'none') return [startYMD];

    const start = fromYMD(startYMD);
    const until = untilYMD ? fromYMD(untilYMD) : addDays(start, 180);
    if (until < start) return [startYMD];

    /* 星期筛选集合：未指定时默认沿用起始日的星期 */
    const wset = {};
    (wds && wds.length ? wds : [start.getDay()]).forEach(function (w) { wset[w] = true; });

    const baseWeek = startOfWeek(start).getTime();
    const out = [];
    let cur = new Date(start.getTime());
    let guard = 0;

    while (cur <= until && out.length < REPEAT_LIMIT && guard++ < 4000) {
      const dow = cur.getDay();
      let hit = false;

      if (rule === 'daily') hit = true;
      else if (rule === 'workday') hit = isWorkdayDate(toYMD(cur));
      else if (rule === 'weekly') hit = !!wset[dow];
      else if (rule === 'biweekly') {
        const weeks = Math.round((startOfWeek(cur).getTime() - baseWeek) / (7 * 86400000));
        hit = !!wset[dow] && weeks % 2 === 0;
      } else if (rule === 'monthly') {
        hit = cur.getDate() === start.getDate();
      }

      if (hit) out.push(toYMD(cur));
      cur = addDays(cur, 1);
    }

    return out.length ? out : [startYMD];
  }

  /**
   * 旧数据的重复组没有存规则。根据成员日期反推一个最接近的规则，
   * 只用于界面上给用户一个合理默认值；改没改过由调用方单独判断。
   */
  function inferRepeatMeta(members) {
    const dates = Array.from(new Set((members || []).map(function (x) { return x.d; }))).sort();
    if (dates.length <= 1) return { rule: 'none', wds: [], until: dates[0] || '', uncertain: true };
    const ds = dates.map(fromYMD);
    const deltas = [];
    for (let i = 1; i < ds.length; i++) {
      deltas.push(Math.round((ds[i] - ds[i - 1]) / 86400000));
    }
    const firstDow = ds[0].getDay();
    const sameDow = ds.every(function (d) { return d.getDay() === firstDow; });
    const sameDom = ds.every(function (d) { return d.getDate() === ds[0].getDate(); });
    const allWorkday = ds.every(function (d) { return d.getDay() >= 1 && d.getDay() <= 5; });
    const until = dates[dates.length - 1];

    if (deltas.every(function (n) { return n === 1; })) return { rule: 'daily', wds: [], until: until };
    if (sameDow && deltas.every(function (n) { return n === 7; })) return { rule: 'weekly', wds: [firstDow], until: until };
    if (sameDow && deltas.every(function (n) { return n === 14; })) return { rule: 'biweekly', wds: [firstDow], until: until };
    if (allWorkday && deltas.every(function (n) { return n === 1 || n === 3; })) return { rule: 'workday', wds: [], until: until };
    if (sameDom) return { rule: 'monthly', wds: [], until: until };
    /* 认不出来：给每周、但标 uncertain，保存时若用户没动重复项就不重建日期 */
    return { rule: 'weekly', wds: [firstDow], until: until, uncertain: true };
  }

  /**
   * 取某条日程所属重复组的规则信息。
   * 新数据直接读事件上的 rr/rw/ru/ga；旧数据按日期反推。
   */
  function repeatMetaOf(ev) {
    if (!ev || !ev.gid) return null;
    const members = state.events.filter(function (x) { return x.gid === ev.gid; })
      .sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
    if (!members.length) return null;
    const carrier = members.filter(function (x) { return x.rr; })[0] || null;
    const inferred = inferRepeatMeta(members);
    const rule = carrier ? carrier.rr : inferred.rule;
    const wds = carrier && Array.isArray(carrier.rw) && carrier.rw.length
      ? carrier.rw.slice()
      : (inferred.wds || []);
    const until = (carrier && carrier.ru) || inferred.until || members[members.length - 1].d;
    const anchor = (carrier && carrier.ga) || members[0].d;
    return {
      rule: rule,
      wds: wds,
      until: until,
      anchor: anchor,
      uncertain: !carrier && !!inferred.uncertain,
      members: members
    };
  }

  function repeatRuleLabel(rule) {
    const r = REPEAT_RULES.filter(function (x) { return x.key === rule; })[0];
    return r ? r.label : '重复';
  }

  /** 详情弹窗里的一行重复说明 */
  function repeatSummaryOf(ev) {
    const meta = repeatMetaOf(ev);
    if (!meta) return '';
    const n = meta.members.length;
    let s = repeatRuleLabel(meta.rule) + ' · 共 ' + n + ' 项';
    if (meta.rule !== 'none' && meta.until) s += ' · 至 ' + meta.until;
    return s;
  }

  /**
   * 计算某个「MM-DD」纪念日的下一次出现。
   * @param {string} md 'MM-DD'
   * @returns {{date: Date, days: number}} days = 距今天数（0 表示就是今天）
   */
  function nextAnniv(md) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const mm = Number(md.slice(0, 2));
    const dd = Number(md.slice(3, 5));
    let d = new Date(today.getFullYear(), mm - 1, dd);
    if (d < today) d = new Date(today.getFullYear() + 1, mm - 1, dd);
    return { date: d, days: Math.round((d - today) / 86400000) };
  }

  /** 取最近 n 个纪念日（按距今天数升序） */
  function upcomingAnniv(n) {
    const list = Object.keys(state.annual).map(function (md) {
      const item = state.annual[md] || {};
      const occ = nextAnnivFor(md, item);
      if (!occ) return null;
      return { md: md, item: item, date: occ.date, days: occ.days };
    }).filter(Boolean);
    list.sort(function (a, b) { return a.days - b.days; });
    return list.slice(0, n || 3);
  }

  /* --------------------------------------------------------------------------
   * 7.3.1 时间块与表格几何
   * 表格纵向不再固定「每小时等高」，而是按时间块的权重换算：
   *   yOf(minute) 给出该分钟在表格中的像素位置，供刻度、日程、当前时间线共用。
   * ------------------------------------------------------------------------ */

  const H_START = GRID_START / 60;   // 6
  const H_END = GRID_END / 60;       // 24

  /**
   * 清洗时间块配置，保证：边界从 0 到 24 递增、块数与高度权重数量一致。
   * 任何来源（旧缓存 / 导入文件 / 用户拖动）都先过这一层。
   * 宽度已归到「星期列」，这里只管高度。
   *
   * 旧版本表格从 06:00 起算（bounds 以 6 开头）。这里在清洗前先把
   * 「凌晨段」补到最前面，否则老用户打开会直接丢掉 0–6 点。
   * @param {Object} [raw]
   * @returns {{bounds:number[], h:number[]}}
   */
  function ensureBlocks(raw) {
    const src = (function () {
      const s = raw || defaultBlocks();
      const bs = Array.isArray(s.bounds) ? s.bounds : [];
      if (bs.length && Number(bs[0]) > H_START) {
        /* 起点晚于 0 点 → 前面缺一段凌晨，补上（权重用默认的 0.6） */
        const h = Array.isArray(s.h) ? s.h.slice() : [];
        return { bounds: [H_START].concat(bs), h: [0.6].concat(h) };
      }
      return s;
    })();
    const bounds = [];
    const srcBounds = Array.isArray(src.bounds) ? src.bounds : [];

    srcBounds.forEach(function (v) {
      const raw = Number(v);
      if (!isFinite(raw)) return;
      /* 边界支持半小时（整点半点各占一格），旧数据是整数小时也照样兼容 */
      const n = Math.round(raw * 2) / 2;
      const c = Math.max(H_START, Math.min(H_END, n));
      if (!bounds.length || c > bounds[bounds.length - 1]) bounds.push(c);
    });
    if (!bounds.length || bounds[0] > H_START) bounds.unshift(H_START);
    if (bounds[bounds.length - 1] < H_END) bounds.push(H_END);

    const count = bounds.length - 1;
    const h = [];
    for (let i = 0; i < count; i++) {
      const hv = Number(src.h && src.h[i]);
      h.push(isFinite(hv) ? Math.max(0.5, Math.min(3, hv)) : 1);
    }
    return { bounds: bounds, h: h };
  }

  /**
   * 清洗七列的宽度权重（周一 → 周日）。
   * @param {Array} [raw]
   * @returns {number[]} 长度固定为 7，取值 0.6–2.0
   */
  function ensureCols(raw) {
    const out = [];
    for (let i = 0; i < 7; i++) {
      const v = Number(raw && raw[i]);
      out.push(isFinite(v) ? Math.max(0.6, Math.min(2, v)) : 1);
    }
    return out;
  }

  /** 某一分钟属于第几个时间块 */
  function blockIndexAt(min) {
    const h = min / 60;
    const b = state.blocks.bounds;
    for (let i = 0; i < b.length - 1; i++) {
      if (h >= b[i] && h < b[i + 1]) return i;
    }
    return b.length - 2;
  }

  /**
   * 睡眠时段折叠范围（分钟）。
   * 只有「开始时间晚于结束时间」才当作跨夜睡眠（例如 23:00–07:00）；
   * 起止相同、或开始早于结束时不做折叠——否则一天会被切成两段，理解和拖拽都变复杂。
   * @returns {{from:number,to:number}|null}
   */
  function sleepRange() {
    const s = state.ui.sleep || {};
    if (!s.on) return null;
    const from = Math.round(toMin(s.from));
    const to = Math.round(toMin(s.to));
    if (!isFinite(from) || !isFinite(to)) return null;
    if (from <= to) return null;
    return { from: from, to: to };
  }

  /** 表格可见时段的起点分钟（没折叠时就是 0） */
  function visStart() { const r = sleepRange(); return r ? r.to : GRID_START; }
  /** 表格可见时段的终点分钟（没折叠时就是 24:00） */
  function visEnd() { const r = sleepRange(); return r ? r.from : GRID_END; }
  /** 某个分钟是否落在被折叠的时段里 */
  function inSleepSpan(m, r) {
    if (!r) return false;
    return m < r.to || m >= r.from;
  }

  /**
   * 构建本次渲染的纵向坐标表。
   * @returns {{total:number, yOf:Function}}
   */
  function buildGeo() {
    const base = hourH() / 60;               // 每分钟基准像素
    const blocks = state.blocks;
    const size = GRID_END - GRID_START + 1;
    const off = new Float64Array(size);
    const span = sleepRange();
    const vs = span ? span.to : GRID_START;
    const ve = span ? span.from : GRID_END;
    let px = 0;

    for (let m = GRID_START; m < GRID_END; m++) {
      const bi = blockIndexAt(m);
      off[m - GRID_START] = px;
      /* 睡眠时段不占高度，整张表就短了这一截 */
      if (!inSleepSpan(m, span)) px += base * (blocks.h[bi] || 1);
    }
    off[size - 1] = px;

    return {
      total: px,
      vs: vs,
      ve: ve,
      yOf: function (m) {
        const i = Math.max(GRID_START, Math.min(GRID_END, Math.round(m))) - GRID_START;
        return off[i];
      },
      /**
       * 反查：某个纵向像素位置对应第几分钟。拖拽创建时要用它，
       * 拉伸过时间块之后线性换算会算错，必须走这张坐标表。
       * @param {number} y 相对表格顶部的像素
       * @returns {number} 分钟（0–24*60）
       */
      minOf: function (y) {
        const v = Math.max(0, Math.min(px, y));
        let lo = 0;
        let hi = size - 1;
        while (lo < hi - 1) {
          const mid = (lo + hi) >> 1;
          if (off[mid] <= v) lo = mid; else hi = mid;
        }
        /* 折叠段的分钟高度为 0，会把落点吸到段首；夹回可见范围才不会建到睡眠时间里 */
        const m = GRID_START + lo;
        return Math.max(vs, Math.min(ve, m));
      }
    };
  }

  /** 按纵向坐标表生成整点横线的 background-image 串 */
  function hourLinesCss(geo) {
    const parts = [];
    for (let hour = H_START; hour <= H_END; hour++) {
      const m = hour * 60;
      /* 折叠掉的时段不画线（它在坐标表里高度为 0，画出来会全叠在边界上） */
      if (m < geo.vs || m > geo.ve) continue;
      const y = Math.round(geo.yOf(m));
      parts.push('linear-gradient(to bottom,transparent ' + y + 'px,var(--line) ' + y +
        'px,var(--line) ' + (y + 1) + 'px,transparent ' + (y + 1) + 'px)');
    }

    /* 自定义切点（尤其落在半点上的）单独标一条蓝线，
       否则调完切点看不出来分界在哪 */
    state.blocks.bounds.forEach(function (edge, i) {
      if (i === 0) return;                       // 起点就是表格顶边，不用画
      if (Math.round(edge) === edge) return;      // 整点已经有了
      if (edge * 60 < geo.vs || edge * 60 > geo.ve) return;   // 折叠段里的切点也不画
      const y = Math.round(geo.yOf(edge * 60));
      parts.push('linear-gradient(to bottom,transparent ' + y + 'px,rgba(76,111,255,.62) ' + y +
        'px,rgba(76,111,255,.62) ' + (y + 1) + 'px,transparent ' + (y + 1) + 'px)');
    });
    return parts.join(',');
  }


  /* --------------------------------------------------------------------------
   * 7.5 渲染：主页面
   * ------------------------------------------------------------------------ */

  /**
   * 找出「下一个要发生的日程」。
   * 规则：状态不为缺席、结束时间晚于现在，按开始时间升序取第一个。
   * @returns {{ev:EventItem, s:number, e:number}|null}
   */
  function nextUpcoming() {
    const nowTs = Date.now();
    const list = [];
    state.events.forEach(function (ev) {
      if (ev.st === 'absent' || ev.st === 'done') return;
      const s = stampOf(ev.d, ev.s);
      const e = stampOf(ev.d, ev.e);
      if (e <= nowTs) return;
      list.push({ ev: ev, s: s, e: e });
    });
    list.sort(function (a, b) { return a.s - b.s; });
    return list[0] || null;
  }

  /** 渲染主页面 */
  function renderHome() {
    viewDirty.home = false;
    const now = new Date();
    const todayStr = toYMD(now);

    $('#homeGreet').textContent = greeting(now);
    $('#homeDate').textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日 · ' + WEEKDAY[now.getDay()];
    document.title = APP.name + ' · ' + APP.cnName;

    renderHero();
    renderWeekStrip();
    renderAnniv();
    renderStats();
    renderNext7();

    const todays = state.events
      .filter(function (ev) { return ev.d === todayStr; })
      .sort(function (a, b) { return toMin(a.s) - toMin(b.s); });

    const doneCount = todays.filter(function (e) { return e.st === 'done'; }).length;
    $('#todayStat').textContent = todays.length ? ('已完成 ' + doneCount + ' / ' + todays.length) : '';

    $('#todayList').innerHTML = todays.map(function (ev) {
      const isPast = toMin(ev.e) <= nowMin;

        '<span class="t-time"><b>' + esc(ev.s) + '</b><i>' + esc(ev.e) + '</i></span>' +
        '<span class="t-main"><span class="t-title">' +
          (ev.imp ? '<i class="t-imp" title="重要项目">★</i>' : '') + esc(ev.t) + '</span>' +
        '<span class="t-sub">' + (ev.p ? esc(ev.p) + ' · ' : '') +
          (remindOn(ev) ? (ev.al ? '⏰' : '🔔') + ' ' + remindText(ev) + ' · ' : '') +
          (ev.imp ? '重要项目 · ' : '') + STATUS[ev.st].label + '</span></span>' +
        '<span class="t-st">' + STATUS[ev.st].sym + '</span>' +

  /** 主卡水印（叶片轮廓）——与品牌标记同源 */
  const MARK = '<svg class="hero-mark" viewBox="0 0 24 24"><path d="M4.6 19.4c-.6-8.3 5.2-14.6 15.2-15.2.4 9.9-5.9 15.8-14.2 15.2"/><path d="M4.6 19.4 13.4 10.6"/><path d="M9.2 14.8c2.2-1.6 4.6-2.6 7.4-3.2"/></svg>';

  /** 渲染倒计时主卡 */
  let heroSig = '';   // 上次渲染的主卡状态签名
  function renderHero() {
    const hero = $('#hero');
    const now = new Date();
    const nowTs = now.getTime();
    const up = nextUpcoming();

    /* ---- 归零状态：刚结束 5 分钟内的日程，主卡进入「收尾」态 ---- */
    const OVER_WINDOW = 5 * 60 * 1000;
    const over = state.events.filter(function (e) {
      if (e.st === 'done' || e.st === 'absent') return false;
      const endTs = stampOf(e.d, e.e);
      return endTs <= nowTs && (nowTs - endTs) <= OVER_WINDOW;
    }).sort(function (a, b) { return stampOf(b.d, b.e) - stampOf(a.d, a.e); })[0];

    /* 状态签名：状态没变就只刷新倒计时数字，避免每秒重建整个主卡（有背景图时尤其卡） */
    const isRunning = up ? (up.s <= nowTs) : false;
    const SEC_WIN = 2 * 60 * 1000;
    const sig = over ? ('over|' + over.id + '|' + over.d)
      : up ? ('up|' + up.ev.id + '|' + (isRunning ? 'r' : 'u'))
      : 'empty';
    if (sig === heroSig && hero.dataset.hs === '1') {
      if (up && !over) {
        const left2 = isRunning ? (up.e - nowTs) : (up.s - nowTs);
        const isSec2 = left2 > 0 && left2 < SEC_WIN;
        const parts2 = isSec2 ? gapSeconds(left2) : gapParts(left2);
        const tail2 = isRunning ? '后结束' : '后开始';
        const countEl = hero.querySelector('.hero-count');
        if (countEl) {
          countEl.className = 'hero-count' + (isSec2 ? ' is-sec' : '');
          countEl.innerHTML = parts2.map(function (p) {
            return '<b>' + esc(p[0]) + '</b><i>' + esc(p[1]) + '</i>';
          }).join('') + '<span class="hero-after">' + tail2 + '</span>';
        }
        hero.className = 'hero' + (isSec2 ? ' is-sec' : '');
      }
      return;
    }
    heroSig = sig;
    hero.dataset.hs = '1';

    if (over) {
      /* 只在这一次跨过零点的瞬间提示一次，之后安静放着 */
      const key = 'over|' + over.id + '|' + over.d;
      const f = state.notify.fired || (state.notify.fired = {});
      if (!f[key]) {
        f[key] = Date.now();
        saveState();
        toast('⏰ 时间到：' + over.t + ' 已到结束时间');
      }
      const ovToday = state.events.filter(function (e) { return e.d === toYMD(now); });
      const ovDone = ovToday.filter(function (e) { return e.st === 'done'; }).length;

      hero.className = 'hero is-over';
      hero.dataset.ev = over.id;
      hero.innerHTML = '<div class="hero-bg" id="heroBg"></div>' + MARK +
        '<span class="hero-eyebrow"><span class="pulse"></span>时间到 · 该收尾了</span>' +
        '<div class="hero-count"><b>时间到</b></div>' +
        '<div class="hero-ev">' +
          '<div class="hero-ev-title">' + esc(over.t) + '</div>' +
          '<div class="hero-ev-meta">' +
            '<span class="tnum">' + esc(over.s) + ' – ' + esc(over.e) + '</span>' +
            (over.p ? '<span class="sep"></span><span>' + esc(over.p) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="hero-foot"><div class="hero-over">' +
          '<span>结束了就顺手结掉，5 分钟后自动回到正常倒计时</span>' +
          '<button class="ov-done" data-hero-done="' + over.id + '">标记完成</button>' +
        '</div>' +
        '<div class="hero-prog"><span>今日进度</span>' +
          '<span class="bar"><i style="width:' +
            (ovToday.length ? Math.round(ovDone / ovToday.length * 100) : 0) + '%"></i></span>' +
          '<span class="tnum">' + ovDone + '/' + ovToday.length + '</span></div>' +
        '</div>';
      applyHomeLook();
      return;
    }

    /* ---- 空状态 ---- */
    if (!up) {
      hero.className = 'hero is-empty';
      hero.innerHTML = '<div class="hero-bg" id="heroBg"></div>' + MARK +
        '<span class="hero-eyebrow"><span class="pulse"></span>暂无安排</span>' +
        '<div class="hero-count"><b>空白</b><i>时段</i></div>' +
        '<div class="hero-ev"><div class="hero-ev-title">接下来没有日程</div>' +
        '<div class="hero-ev-meta">去表格页点一格，把它填上</div></div>';
      hero.dataset.ev = '';
      /* 重建 DOM 会丢掉底色层，这里补一次外观 */
      applyHomeLook();
      return;
    }

    const running = up.s <= nowTs;
    const left = running ? (up.e - nowTs) : (up.s - nowTs);

    /* 最后 2 分钟切成逐秒：这时候「还有多久」是按秒算的，分钟精度没意义 */
    const SEC_WINDOW = 2 * 60 * 1000;
    const isSec = left > 0 && left < SEC_WINDOW;
    const parts = isSec ? gapSeconds(left) : gapParts(left);
    const tail = running ? '后结束' : '后开始';
    const dayLabel = dayLabelOf(up.ev.d);

    const big = parts.map(function (p) {
      return '<b>' + esc(p[0]) + '</b><i>' + esc(p[1]) + '</i>';
    }).join('');

    const todays = state.events.filter(function (e) { return e.d === toYMD(new Date()); });
    const doneCount = todays.filter(function (e) { return e.st === 'done'; }).length;
    const pct = todays.length ? Math.round(doneCount / todays.length * 100) : 0;

    hero.className = 'hero' + (isSec ? ' is-sec' : '');
    hero.dataset.ev = up.ev.id;
    hero.innerHTML = '<div class="hero-bg" id="heroBg"></div>' + MARK +
      '<span class="hero-eyebrow"><span class="pulse"></span>' +
        (isSec ? '马上就到' : running ? '正在进行' : '即将开始') + ' · ' + esc(dayLabel) +
      '</span>' +
      '<div class="hero-count' + (isSec ? ' is-sec' : '') + '">' + big +
        '<span class="hero-after">' + tail + '</span></div>' +
      '<div class="hero-ev">' +
        '<div class="hero-ev-title">' + (up.ev.imp ? '<i class="t-imp">★</i>' : '') + esc(up.ev.t) + '</div>' +
        '<div class="hero-ev-meta">' +
          '<span class="tnum">' + esc(up.ev.s) + ' – ' + esc(up.ev.e) + '</span>' +
          (up.ev.p ? '<span class="sep"></span><span>' + esc(up.ev.p) + '</span>' : '') +
          (remindOn(up.ev)
            ? '<span class="sep"></span><span>' + (up.ev.al ? '⏰' : '🔔') + ' ' + remindText(up.ev) + '</span>'
            : '') +
          '<span class="sep"></span><span>' + STATUS[up.ev.st].label + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="hero-foot"><div class="hero-prog">' +
        '<span>今日进度</span>' +
        '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
        '<span class="tnum">' + doneCount + '/' + todays.length + '</span>' +
      '</div></div>';

    applyHomeLook();
    /* 主卡每秒重绘一次，内联字号会丢；只在设过非标准字号时补一遍 */
    if (state.typeStyle && state.typeStyle.home && Math.abs(Number(state.typeStyle.home.size) - 1) > 0.01) {
      applyTypeScale('home');
    }
  }

  /** 相对日期描述：今天 / 明天 / M月D日 */
  function dayLabelOf(dateStr) {
    const t = toYMD(new Date());
    if (dateStr === t) return '今天';
    if (dateStr === toYMD(addDays(new Date(), 1))) return '明天';
    const d = fromYMD(dateStr);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  /**
   * 渲染「本周概览」：7 个迷你日卡，进度条表示当天日程密度（5 项即满格）。
   * 点击任意一天 → 跳到表格页的对应周。
   */
  function renderWeekStrip() {
    const ws = startOfWeek(new Date());
    const todayStr = toYMD(new Date());
    let html = '';
    let total = 0;

    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i);
      const ds = toYMD(d);
      const n = state.events.filter(function (e) { return e.d === ds; }).length;
      total += n;
      const pct = Math.min(100, Math.round(n / 5 * 100));

      html += '<button class="wk-day' + (ds === todayStr ? ' is-today' : '') + '" data-date="' + ds + '"' +
          ' title="' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · ' + n + ' 项日程">' +
          '<span class="wk-wd">' + WEEKDAY[d.getDay()] + '</span>' +
          '<span class="wk-dn">' + d.getDate() + '</span>' +
          '<span class="wk-bar"><i style="width:' + pct + '%"></i></span>' +
        '</button>';
    }

    $('#weekStrip').innerHTML = html;
    $('#weekStat').textContent = total ? ('共 ' + total + ' 项') : '本周空白';
  }

  function renderAnniv() {

          '<span class="ico">' + (a.item.icon || '🎂') + '</span>' +
          '<span class="tx">' +
            '<b>' + (isToday ? '今天' : '明天') + ' · ' + esc(a.item.title || '纪念日') + '</b>' +
            '<span>' + sub + '</span>' +
          '</span>' +
          '<span class="tag">' + (isToday ? '就是今天' : '还有 1 天') + '</span>' +

    /* ---- 最近纪念日列表 ---- */

      const d = a.date;

        ? '<span class="cd now">今天</span>'

  /* --------------------------------------------------------------------------
   * 7.5.1 数据概览：完成率 + 时间分配
   * 口径（界面上也写了提示，避免数字好看但没法用）：
   * · 应完成 = 本周一到今天里「已经开始」的日程（日期早于今天，
   *   或今天且结束时间已过）；完成率 = 已打勾 / 应完成。
   * · 未完成 = 应完成里没打勾的；时间缺口 = 它们的时长合计。
   * · 时间分配 = 本周全部日程（含未来）按类别聚合的时长占比，
   *   时长 = 结束 - 开始（不足 15 分钟按 15 分钟算）。
   * ------------------------------------------------------------------------ */

  /** 日程类别：按标题/地点/备注关键词归类，都不中就进「其他」 */
  const EV_TYPES = [
    { key: 'study', label: '课程学习', hue: 256, re: /课|上课|实验|考试|测验|作业|自习|讲座|答辩|培训|学习|复习|答疑/ },
    { key: 'meet',  label: '会议事务', hue: 214, re: /会|评审|汇报|例会|讨论|面谈|面试|宣讲|值班|沟通/ },
    { key: 'act',   label: '社团活动', hue: 338, re: /活动|社团|比赛|竞赛|聚会|聚餐|志愿|演出|排练|展览|游园|博览|晚会/ },
    { key: 'life',  label: '生活日常', hue: 168, re: /吃饭|早餐|午餐|晚餐|食堂|快递|购物|理发|就医|运动|锻炼|跑步|健身|打扫|洗衣|取件/ },
    { key: 'rest',  label: '休息娱乐', hue: 26,  re: /午休|午睡|睡觉|电影|游戏|逛街|休息|追剧/ }
  ];
  const TYPE_OTHER = { key: 'other', label: '其他', hue: 220 };

  function typeOfEvent(ev) {
    const hay = (ev.t || '') + ' ' + (ev.p || '') + ' ' + (ev.n || '');
    for (let i = 0; i < EV_TYPES.length; i++) {
      if (EV_TYPES[i].re.test(hay)) return EV_TYPES[i];
    }
    return TYPE_OTHER;
  }

  /** 日程时长（分钟），下限 15，避免 0 分钟项把占比挤没了；跨夜按次日算 */
  function evDuration(ev) {
    const s = toMin(ev.s);
    const e = toMin(ev.e);
    const raw = e > s ? (e - s) : (24 * 60 - s + e);
    return Math.max(15, raw);
  }

  /** 当前展开的明细：'' | 'todo' | 'type:<key>'，一次只开一个 */
  let statOpen = '';

  function renderStats() {
    const card = $('#statCard');
    if (!card) return;

    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const todayStr = toYMD(now);
    const ws = startOfWeek(now);
    const weStr = toYMD(addDays(ws, 6));
    const week = state.events.filter(function (x) { return x.d >= toYMD(ws) && x.d <= weStr; });

    /* ---- 完成率（只统计已经开始的，未来日程不背指标） ---- */
    const due = week.filter(function (x) { return x.d < todayStr || (x.d === todayStr && toMin(x.e) <= nowMin); });
    const done = due.filter(function (x) { return x.st === 'done'; });
    const undone = due.filter(function (x) { return x.st !== 'done'; });
    const gapMin = undone.reduce(function (s, x) { return s + evDuration(x); }, 0);
    const rate = due.length ? Math.round(done.length / due.length * 100) : null;

    /* ---- 时间分配（本周全部日程，含未来） ---- */
    const byType = {};
    let totalMin = 0;
    week.forEach(function (x) {
      const tp = typeOfEvent(x);
      const d = evDuration(x);
      if (!byType[tp.key]) byType[tp.key] = { type: tp, min: 0, items: [] };
      byType[tp.key].min += d;
      byType[tp.key].items.push(x);
      totalMin += d;
    });
    const types = Object.keys(byType).map(function (k) { return byType[k]; })
      .sort(function (a, b) { return b.min - a.min; });

    const hm = function (m) {
      const h = Math.floor(m / 60), mm = Math.round(m % 60);
      return h ? (mm ? h + ' 小时 ' + mm + ' 分' : h + ' 小时') : mm + ' 分钟';
    };

    let html = '';

    /* 完成率块（整块可点开未完成明细） */
    html += '<div class="st-sec" data-toggle="todo" role="button" tabindex="0">' +
        '<div class="st-row"><span>本周完成率' + (rate === null ? '' : '（' + due.length + ' 项已开始）') + '</span>' +
          '<b>' + (rate === null ? '—' : rate + '%') + '</b></div>' +
        '<div class="st-bar"><i style="width:' + (rate || 0) + '%"></i></div>' +
        '<div class="st-note' + (undone.length ? ' warn' : '') + '">' +
          (rate === null
            ? '本周还没有已开始的日程；第一项开始后这里才出数字'
            : undone.length
              ? '还有 ' + undone.length + ' 项未完成 · 时间缺口约 ' + hm(gapMin) + ' · 点开看明细'
              : '已开始的日程全部完成 ✓') +
        '</div>' +
      '</div>';

    /* 时间分配块（点类别看明细） */
    html += '<div class="st-sec">' +
        '<div class="st-row"><span>时间分配</span><span class="st-sub">本周共 ' + (totalMin ? hm(totalMin) : '0') + '</span></div>' +
        (totalMin
          ? '<div class="st-bar stack">' + types.map(function (g) {
              return '<i style="width:' + Math.max(2, Math.round(g.min / totalMin * 100)) + '%;' +
                'background:hsl(' + g.type.hue + ' 62% 58%)"></i>';
            }).join('') + '</div>' +
            '<div class="st-legend">' + types.map(function (g) {
              return '<button data-toggle="type:' + g.type.key + '" style="--th:' + g.type.hue + '">' +
                  '<i></i>' + g.type.label + ' ' + hm(g.min) + ' · ' +
                  Math.round(g.min / totalMin * 100) + '%</button>';
            }).join('') + '</div>' +
            (types.length && types[0].min / totalMin >= 0.6 && totalMin >= 8 * 60
              ? '<div class="st-note warn">时间比较集中在「' + types[0].type.label + '」（占 ' +
                Math.round(types[0].min / totalMin * 100) + '%）；如果连续几周都这样，考虑给别的类别留点空间</div>'
              : '')
          : '<div class="st-note">本周还没有日程；去表格页或点右下角 + 添加</div>') +
      '</div>';

    html += '<div class="st-detail" id="statDetail"></div>';

    card.innerHTML = html;
    const stat = $('#statStat');
    if (stat) {
      const we = addDays(ws, 6);
      stat.textContent = week.length
        ? (week.length + ' 项 · ' + (ws.getMonth() + 1) + '/' + ws.getDate() + '–' + (we.getMonth() + 1) + '/' + we.getDate())
        : '';
    }
    renderStatDetail();
  }

  /** 明细列表：未完成（可就地标完成）/ 某个类别的本周日程 */
  function renderStatDetail() {
    const box = $('#statDetail');
    if (!box) return;
    if (!statOpen) { box.innerHTML = ''; box.classList.remove('has'); return; }

    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const todayStr = toYMD(now);
    const ws = startOfWeek(now);
    const weStr = toYMD(addDays(ws, 6));
    const week = state.events.filter(function (x) { return x.d >= toYMD(ws) && x.d <= weStr; });

    let list = [];
    let head = '';
    if (statOpen === 'todo') {
      list = week.filter(function (x) {
        return x.st !== 'done' &&
          (x.d < todayStr || (x.d === todayStr && toMin(x.e) <= nowMin));
      }).sort(function (a, b) {
        return a.d < b.d ? -1 : a.d > b.d ? 1 : toMin(a.s) - toMin(b.s);
      });
      head = '未完成 ' + list.length + ' 项 · 点 ✓ 直接标完成，点标题进编辑';
    } else if (statOpen.indexOf('type:') === 0) {
      const key = statOpen.slice(5);
      const tp = EV_TYPES.filter(function (t) { return t.key === key; })[0] || TYPE_OTHER;
      list = week.filter(function (x) { return typeOfEvent(x).key === key; })
        .sort(function (a, b) {
          return a.d < b.d ? -1 : a.d > b.d ? 1 : toMin(a.s) - toMin(b.s);
        });
      head = tp.label + ' · ' + list.length + ' 项';
    }

    box.classList.add('has');
    box.innerHTML = '<div class="st-d-head">' + esc(head) + '</div>' +
      (list.length ? list.map(function (x) {
        const d = fromYMD(x.d);
        const tp = typeOfEvent(x);
        return '<div class="st-d-row" data-id="' + x.id + '" style="--th:' + tp.hue + '">' +
            '<span class="d">' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + esc(x.s) + '–' + esc(x.e) + '</span>' +
            '<span class="t" data-open="' + x.id + '">' + esc(x.t) + '</span>' +
            '<span class="h">' + (Math.round(evDuration(x) / 6) / 10) + 'h</span>' +
            (statOpen === 'todo' ? '<button class="ok" data-done="' + x.id + '" aria-label="标记完成">✓</button>' : '') +
          '</div>';
      }).join('') : '<div class="st-empty">这一类本周没有日程</div>');
  }

  /* --------------------------------------------------------------------------
   * 7.6 渲染：表格页
   * ------------------------------------------------------------------------ */
  function renderGrid() {
    viewDirty.grid = false;
    const geo = buildGeo();
    const todayStr = toYMD(new Date());
    const lineBg = hourLinesCss(geo);

    /* ---- 周区间标题 ---- */
    const rangeText = weekRangeText();
    $('#gridRange').textContent = rangeText;
    const gmRange = document.getElementById('gmRange');
    if (gmRange) gmRange.textContent = rangeText;

    /* ---- 表头：日期 / 星期 ---- */
    let head = '<div class="gh-gutter"></div>';
    for (let i = 0; i < 7; i++) {
      const d = addDays(weekStart, i);
      const ds = toYMD(d);
      head += '<button class="gh-day' + (ds === todayStr ? ' is-today' : '') + '" data-date="' + ds + '" title="在此日期新建日程">' +
          '<span class="gh-wd">' + WEEKDAY[d.getDay()] + holidayTagHtml(ds, 'gh-hd') + '</span>' +
          '<span class="gh-dt">' + d.getDate() + '</span>' +
          '<span class="gh-add" aria-hidden="true">+</span>' +
        '</button>';
    }
    $('#gridHead').innerHTML = head;

    /* 七列宽度由各自权重决定：fr 会自动按比例分配剩余空间，
       表头与表体必须用同一份模板，否则列会错位 */
    const tpl = 'var(--gutter) ' + state.cols.map(function (c) { return c.toFixed(2) + 'fr'; }).join(' ');
    $('#gridHead').style.gridTemplateColumns = tpl;
    $('#gridBody').style.gridTemplateColumns = tpl;

    /* ---- 表体：时间刻度 + 7 列（刻度位置由时间块权重决定） ---- */
    let gutter = '';
    const hlSpan = function (y, minute) {
      /* 折叠后顶/底不一定是整点，用 时:分 标出来 */
      const h = Math.floor(minute / 60);
      const mi = minute % 60;
      const txt = mi === 0 ? pad2(h) + ':00' : pad2(h) + ':' + pad2(mi);
      return '<span class="hl" style="top:' + y.toFixed(1) + 'px">' + txt + '</span>';
    };
    if (geo.vs > GRID_START) gutter += hlSpan(0, geo.vs);
    for (let m = GRID_START; m < GRID_END; m += 60) {
      if (m < geo.vs || m >= geo.ve) continue;     // 折叠掉的时段不摆刻度
      if (geo.vs > GRID_START && m === geo.vs) continue;   // 顶边已经标过
      gutter += hlSpan(geo.yOf(m), m);
    }
    /* 底边也补一个刻度，看得出表格到几点为止（上移一点，别被裁掉半行） */
    if (geo.ve < GRID_END && geo.total > 14) gutter += hlSpan(geo.total - 9, geo.ve);

    let cols = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(weekStart, i);
      const ds = toYMD(d);

      const evs = state.events.filter(function (x) { return x.d === ds; }).map(function (x) {
        /* 跨夜（结束早于开始，如 23:00–02:00）：画到表底为止，
           时间文字仍原样显示，看得出是越过零点的那一段 */
        const s = toMin(x.s);
        const e = toMin(x.e);
        return Object.assign({}, x, {
          _s: s,
          _e: e > s ? e : GRID_END,
          _cross: e <= s
        });
      });
      assignLanes(evs);

      let inner = '';
      evs.forEach(function (x) {
        /* 落在被折叠时段里的日程不画：那一段没有高度，画出来会全挤在边界上 */
        if (x._e <= geo.vs || x._s >= geo.ve) return;
        const s0 = Math.max(x._s, geo.vs);
        const e0 = Math.min(x._e, geo.ve);
        const top = geo.yOf(s0);
        const hgt = Math.max(26, geo.yOf(e0) - top - 3);

        /* 卡片铺满自己的车道；列宽本身已由「星期宽度」决定 */
        const lane = x._lane || 0;
        const n = Math.max(1, x._lanes || 1);
        const cardPct = 100 / n;
        const leftPct = lane * cardPct;

        const mini = hgt < 42 ? ' is-mini' : (hgt < 64 ? ' is-short' : '');
        const hasImg = x.img ? ' has-img' : '';
        const bgImg = x.img ? ';background-image:url(\'' + x.img + '\')' : '';

        inner += '<div class="ev st-' + (x.st || 'todo') + mini + hasImg +
            (x._cross ? ' is-cross' : '') + '" data-id="' + x.id + '" ' +
            'style="top:' + top.toFixed(1) + 'px;height:' + hgt.toFixed(1) + 'px;' +
            'left:calc(' + leftPct.toFixed(3) + '% + 2px);width:calc(' + cardPct.toFixed(3) + '% - 4px);' +
            '--h:' + hueOf(x.t) + bgImg + '">' +
            '<span class="ev-badge">' + STATUS[x.st || 'todo'].sym + '</span>' +
            (x.imp ? '<span class="ev-imp" title="重要项目">★</span>' : '') +
            '<div class="ev-t">' + esc(x.t) + '</div>' +
            (x.p ? '<div class="ev-loc" title="' + esc(x.p) + '">' + esc(x.p) + '</div>' : '') +
            '<div class="ev-hm"><span class="hm-full">' + esc(x.s) + '–' + esc(x.e) +
              (x._cross ? '↓' : '') + '</span>' +
              '<span class="hm-short">' + esc(x.s) + '</span></div>' +
            (remindOn(x) ? '<span class="ev-rm" title="' +
              (x.al ? '提醒 + 闹钟' : remindText(x) + '提醒') + '">' +
              (x.al ? '⏰' : '🔔') + '</span>' : '') +
            (x.gid ? '<span class="ev-rep" title="重复日程">↻</span>' : '') +
          '</div>';
      });

      const nowLine = ds === todayStr ? '<div class="now-line" id="nowLine"><i></i></div>' : '';
      cols += '<div class="gcol' + (ds === todayStr ? ' is-today' : '') + '" data-date="' + ds + '" ' +
          'style="height:' + geo.total.toFixed(1) + 'px;background-image:' + lineBg + '">' +
          inner + nowLine + '</div>';
    }

    $('#gridBody').innerHTML =
      '<div class="gutter" style="height:' + geo.total.toFixed(1) + 'px;background-image:' + lineBg + '">' +
        gutter + '</div>' + cols;

    lastGeo = geo;
    updateNowLine();
    applyTypeStyle('grid');
  }

  /** 拖动滑块时用 rAF 节流，避免每像素都重排整张表 */
  let gridRaf = null;
  function renderGridSoon() {
    if (gridRaf) return;
    gridRaf = requestAnimationFrame(function () {
      gridRaf = null;
      renderGrid();
    });
  }

  /** 当前周的区间文案，如「10月19日 – 10月25日」 */
  function weekRangeText() {
    const ws = weekStart;
    const we = addDays(weekStart, 6);
    return (ws.getMonth() + 1) + '月' + ws.getDate() + '日 – ' +
      (we.getMonth() + 1) + '月' + we.getDate() + '日';
  }

  /** 更新「当前时间」红线位置 */
  function updateNowLine() {
    const el = document.getElementById('nowLine');
    if (!el) return;
    const n = new Date();
    const m = n.getHours() * 60 + n.getMinutes();
    const geo = buildGeo();
    /* 折叠掉的时段里红线没有意义（高度是 0），直接不显示 */
    if (m < geo.vs || m > geo.ve) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.style.top = geo.yOf(m).toFixed(1) + 'px';
  }

  /**
   * 默认把表格滚到几点：
   * 白天固定从 6 点前后看起（大多数人的一天），凌晨就跟着当前时间走。
   */
  function defaultGridHour() {
    const h = new Date().getHours();
    return h < 6 ? Math.max(0, h - 1) : Math.max(6, h - 1);
  }

  /** 把表格滚动到某个整点（纵向坐标已按时间块拉伸，直接查表即可） */
  function scrollGridTo(hour) {
    const w = $('#gridWrap');
    if (!w) return;
    const geo = buildGeo();
    /* 目标整点可能落在被折叠的睡眠时段里，夹回可见范围 */
    const mm = Math.max(geo.vs, Math.min(geo.ve, hour * 60));
    const want = geo.yOf(mm);
    const max = Math.max(0, w.scrollHeight - w.clientHeight);
    w.scrollTop = Math.min(Math.max(0, want), max);
  }

  /* --------------------------------------------------------------------------
   * 7.7 渲染：记事页
   * ------------------------------------------------------------------------ */
  function renderCalendar() {
    viewDirty.notes = false;
    const y = calCursor.getFullYear();
    const m = calCursor.getMonth();
    $('#calTitle').textContent = y + ' 年 ' + (m + 1) + ' 月';

    const first = new Date(y, m, 1);
    const lead = (first.getDay() + 6) % 7;              // 周一为第一列
    const dim = new Date(y, m + 1, 0).getDate();
    const total = Math.ceil((lead + dim) / 7) * 7;
    const todayStr = toYMD(new Date());

    let html = '';
    for (let i = 0; i < total; i++) {
      const d = addDays(first, -lead + i);
      const ds = toYMD(d);
      const note = state.notes[ds];
      const tag = state.tags[ds];
      const ann = annualForDate(ds);
      const isOut = d.getMonth() !== m;

      const cls = [
        'cal-cell',
        isOut ? 'is-out' : '',
        ds === todayStr ? 'is-today' : '',
        ds === selectedDate ? 'is-sel' : '',
        tag ? 'is-marked' : ''
      ].join(' ');

      const style = tag
        ? 'background:' + hexA(tag, 0.13) + ';box-shadow:inset 0 0 0 1.5px ' + hexA(tag, 0.5)
        : '';

      const hd = holidayInfoOf(ds);
      const hdTitle = hd.work ? ' title="调休上班"' : (hd.off ? ' title="' + esc(hd.name || '法定节假日') + ' · 放假"' : '');
      html += '<button class="' + cls + '" data-date="' + ds + '"' + (style ? ' style="' + style + '"' : '') + hdTitle + '>' +
          '<span class="cc-num">' + d.getDate() + '</span>' + holidayTagHtml(ds, 'cc-hd') +
          (note && note.title ? '<span class="cc-note">' + esc(note.title) + '</span>' : '') +
          (tag ? '<span class="cc-tag" style="background:' + tag + '"></span>' : '') +
          (ann ? '<span class="cc-anniv" title="' + esc(ann.title || '纪念日') + ' · 每年重复">' + (ann.icon || '🎂') + '</span>' : '') +
        '</button>';
    }
    const grid = $('#calGrid');
    grid.innerHTML = html;
    grid.classList.toggle('markable', markMode);
    $('#markBar').classList.toggle('on', markMode);
    $('#calMark').classList.toggle('on', markMode);
    applyTypeStyle('notes');
  }

    $$('#neIcons button').forEach(function (b) {

    });

  }

  /* --------------------------------------------------------------------------
   * 7.6.1 通知解析：从一段中文通知里抽日期 / 时间 / 标题 / 地点
   * 纯本地规则，不联网、不加载模型，断网可用，结果瞬时返回。
   * 只覆盖会议、活动通知的常见写法；认不出来的部分留空，交给用户补。
   * ------------------------------------------------------------------------ */

  /** 中文数字转阿拉伯数字，支持「三」「十一」「二十三」这类写法 */
  function cnNum(str) {
    const t = String(str).trim();
    if (/^\d+$/.test(t)) return Number(t);
    const map = { 零: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
    if (t === '十') return 10;
    if (t.indexOf('十') === 0) return 10 + (map[t[1]] || 0);
    if (t.length === 2 && t[1] === '十') return (map[t[0]] || 0) * 10;
    if (t.length === 3 && t[1] === '十') return (map[t[0]] || 0) * 10 + (map[t[2]] || 0);
    return map[t] !== undefined ? map[t] : NaN;
  }

  /**
   * 「下午三点半」「19:30」这类写法统一折算成分钟数。
   * @param {string} hRaw    小时部分（可能是中文数字）
   * @param {string} [mRaw]  分钟部分，'半' 视作 30
   * @param {string} [period] 时段前缀：上午 / 下午 / 晚上 …
   * @returns {number|null}
   */
  function clockToMin(hRaw, mRaw, period) {
    let h = cnNum(hRaw);
    let mi = 0;
    if (mRaw !== undefined && mRaw !== null && mRaw !== '') {
      mi = (mRaw === '半') ? 30 : cnNum(String(mRaw).replace(/[分]/g, ''));
    }
    if (!isFinite(h) || !isFinite(mi)) return null;

    if (period) {
      if (/下午|晚上|晚间|傍晚/.test(period) && h < 12) h += 12;
      else if (/中午/.test(period) && h < 11) h += 12;
      else if (/凌晨/.test(period) && h === 12) h = 0;
      else if (/上午|早上|早晨/.test(period) && h === 12) h = 0;
    }
    if (h > 24 || mi > 59) return null;
    return h * 60 + mi;
  }

  /** 泛化标题（「会议通知」这种），不能当成日程标题 */
  const TITLE_STOP = ['会议', '通知', '会议通知', '重要通知', '公告', '提醒', '活动', '安排'];

  /**
   * 去掉一行里的时间、日期、@、方括号标记，剩下的当标题候选。
   * @param {string} line
   * @returns {string}
   */
  function stripTimeWords(line) {
    return String(line)
      .replace(/^[@＠]\S+\s*/g, '')
      .replace(/【[^】]{0,12}】/g, ' ')
      .replace(/(20\d{2}\s*[-/.年])?\s*\d{1,2}\s*月\s*\d{1,2}\s*[日号]/g, ' ')
      .replace(/(上午|下午|晚上|晚间|中午|早上|凌晨)?\s*\d{1,2}\s*:\s*\d{2}\s*([-–—~～至到]\s*(上午|下午|晚上)?\s*\d{1,2}\s*:\s*\d{2})?/g, ' ')
      .replace(/(大后天|后天|明天|明日|今日|今天|今晚|明晚|今早)/g, ' ')
      .replace(/[（(][^）)]{0,8}[）)]/g, ' ')
      .replace(/^[\s\-—·:,、]+|[\s\-—·:,、]+$/g, '')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  /**
   * 解析一段通知文本。
   * @param {string} raw 用户粘贴的原文
   * @returns {{d:string,s:string,e:string,t:string,p:string,n:string,hits:string[]}}
   *   hits 记录识别到了哪几项，供界面提示用
   */
  function parseNotice(raw) {
    const text = String(raw || '')
      .replace(/\r/g, '')
      .replace(/[：]/g, ':')
      .replace(/[，、]/g, ',')
      .replace(/\u3000/g, ' ')
      /* 聊天软件里粘贴进来的图片 / 表情占位符：识别不了，直接清掉 */
      .replace(/@image#\S*/gi, ' ')
      .replace(/\d\uFE0F?\u20E3/g, ' '); /* 1️⃣ 2️⃣ 3️⃣ 这类键帽序号 */

    const base = new Date();
    const today = new Date(base.getFullYear(), base.getMonth(), base.getDate());
    const hits = [];
    let date = null;
    let sMin = null;
    let eMin = null;
    let title = '';

    /* ---------------- 日期 ---------------- */
    let m = text.match(/(20\d{2})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})/);
    if (m) {
      date = new Date(+m[1], +m[2] - 1, +m[3]);
      hits.push('日期');
    }
    if (!date) {
      m = text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/);
      if (m) {
        date = new Date(base.getFullYear(), +m[1] - 1, +m[2]);
        hits.push('日期');
      }
    }
    if (!date) {
      /* 10/25 这种写法；限定前一位不是数字或冒号，避免把 19:00 之类的切走 */
      m = text.match(/(?:^|[^\d:])(\d{1,2})\/(\d{1,2})(?!\d)/);
      if (m) {
        date = new Date(base.getFullYear(), +m[1] - 1, +m[2]);
        hits.push('日期');
      }
    }
    if (!date) {
      const rel = text.match(/(大后天|后天|明天|明日|明晚|今天|今日|今晚|今早)/);
      if (rel) {
        const step = { 大后天: 3, 后天: 2, 明天: 1, 明日: 1, 明晚: 1, 今天: 0, 今日: 0, 今晚: 0, 今早: 0 };
        date = addDays(today, step[rel[1]]);
        hits.push('日期');
      }
    }
    if (!date) {
      const wm = text.match(/(下下|下|本|这)?\s*(?:周|星期|礼拜)\s*([一二三四五六日天七])/);
      if (wm) {
        const wd = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 日: 0, 天: 0, 七: 0 }[wm[2]];
        let d = addDays(startOfWeek(today), (wd + 6) % 7);
        if (wm[1] === '下') d = addDays(d, 7);
        else if (wm[1] === '下下') d = addDays(d, 14);
        /* 只写「周三」而今天已经过了 → 默认指下周 */
        else if (!wm[1] && d < today) d = addDays(d, 7);
        date = d;
        hits.push('日期');
      }
    }

    /* ---------------- 时间 ---------------- */
    const PERIOD = '(上午|下午|晚上|晚间|傍晚|中午|早上|早晨|凌晨)?';

    /* 先找带冒号的写法，兼容「晚上7:00」这种时制前缀 */
    m = text.match(new RegExp(PERIOD + '\\s*(\\d{1,2})\\s*:\\s*(\\d{2})\\s*(?:[-–—~～至到]\\s*' + PERIOD + '\\s*(\\d{1,2})\\s*:\\s*(\\d{2}))?'));
    if (m) {
      sMin = clockToMin(m[2], m[3], m[1]);
      if (m[5] !== undefined) eMin = clockToMin(m[5], m[6], m[4] || m[1]);
      hits.push('时间');
    }

    /* 再找「下午三点半」「19点到20点」 */
    if (sMin === null) {
      const re = new RegExp(
        PERIOD + '\\s*(\\d{1,2}|[一二三四五六七八九十]{1,3})\\s*[点时]\\s*(半|\\d{1,2})?\\s*' +
        '(?:[-–—~～至到]\\s*' + PERIOD + '\\s*(\\d{1,2}|[一二三四五六七八九十]{1,3})\\s*[点时]?\\s*(半|\\d{1,2})?)?'
      );
      const tm = text.match(re);
      if (tm) {
        sMin = clockToMin(tm[2], tm[3], tm[1]);
        if (tm[5]) eMin = clockToMin(tm[5], tm[6], tm[4] || tm[1]);
        if (sMin !== null) hits.push('时间');
      }
    }

    /* ---------------- 地点（先算，标题要参考它） ---------------- */
    let placeRaw = '';
    /* 「地点：」后面的内容允许带逗号（多校区各一个地点），到句号/换行为止 */
    const pm1 = text.match(/(?:地点|地址|会议地点|位置)\s*:\s*([^\n。;]{2,70})/);
    if (pm1) placeRaw = pm1[1].trim();

    if (!placeRaw) {
      const pm2 = text.match(/(?:在|于)\s*([^\n,。;:]{2,24}?(?:会议室|教室|实验室|报告厅|室|厅|楼|中心|大厦|校区|广场|酒店|食堂))/);
      if (pm2) placeRaw = pm2[1].trim();
    }
    if (!placeRaw) {
      /* 光写「二教201教室」而没有「在」字的，直接认地点名词 */
      const pm3 = text.match(/([\u4e00-\u9fa5A-Za-z0-9]{1,8}(?:教室|会议室|实验室|报告厅|礼堂|体育馆|食堂|咖啡厅))/);
      if (pm3) placeRaw = pm3[1];
    }
    if (!placeRaw) {
      const on = text.match(/(腾讯会议|钉钉会议|钉钉|飞书会议|飞书|Zoom|zoom|线上[^\s,。;]{0,8})/);
      if (on) placeRaw = on[1];
    }
    /* 地点后面常跟着「请准时参加」之类的句子：只保留真正像地点的片段。
       多个真实地点（3F 会议室、1F 大厅）仍会保留下来。 */
    if (placeRaw) {
      const parts = placeRaw.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      const locWord = /(会议室|教室|实验室|报告厅|礼堂|体育馆|食堂|咖啡厅|办公室|大厅|楼|室|厅|中心|大厦|校区|广场|酒店|线上|腾讯会议|钉钉|飞书|Zoom)/i;
      const locParts = parts.filter(function (x) { return locWord.test(x); });
      placeRaw = (locParts.length ? locParts : parts.slice(0, 1)).join('；');
    }
    let place = placeRaw ? placeRaw.replace(/,+$/g, '').replace(/,/g, '；') : '';
    if (place.length > 60) place = place.slice(0, 60);

    /* ---------------- 标题 ---------------- */
    /* 先把地点从文本里挖掉：「在 3F 大会议室召开…会」里的「会议」会被误当关键词 */
    const titleText = place ? text.split(place).join(' ') : text;

    const tm1 = titleText.match(/(?:主题|会议主题|活动名称|事项|议题)\s*:\s*([^\n,。;]{2,30})/);
    if (tm1) title = tm1[1].trim();

    /* 「XX博览会将于…举办」这类把「将于/举办」写在一句话里的：
       直接截「将于」前面的主体当标题（跨度可含换行，通知常在日期处折行）。
       注意用懒惰量词，否则字组会把「将」也吞进去 */
    if (!title) {
      const tm2 = titleText.match(
        /([\u4e00-\u9fa5A-Za-z0-9·\-()（）]{4,26}?)\s*将?\s*于[\s\S]{0,40}?(?:举办|举行|召开|开幕|开展|启动)/
      );
      if (tm2) title = tm2[1].replace(/[将于]$/, '').trim();
    }

    if (!title) {
      const kw = titleText.match(/(?:召开|举办|举行|组织|开展|参加)?\s*([\u4e00-\u9fa5A-Za-z0-9()（）·\-]{2,16}?(?:评审会|评审|培训|活动|分享会|分享|聚餐|面试|汇报|宣讲|讨论|答辩|讲座|例会|会议|博览会|招聘会|运动会|晚会|游园会|沙龙|论坛|竞赛|比赛|考试|展览))/);
      if (kw) title = kw[1].trim();
    }

    /* 【会议通知】这类方括号标题优先；即使它比较泛，也比正文里随便一句强 */
    if (!title) {
      const bm = text.match(/【([^】]{2,20})】/);
      if (bm && !/id|链接|二维码|图片/i.test(bm[1])) title = bm[1].trim();
    }

    /* 兜底：取前几行里第一句「像标题」的话，顺手把时间和日期片段剥掉 */
    if (!title) {
      const lines = titleText.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
      for (let i = 0; i < Math.min(lines.length, 5); i++) {
        const line = lines[i];
        /* 问候 / 行动号召 / 带序号的条目行都不是标题 */
        if (/大家好|各位同学|各位老师|同学们|请及时|请大家|转发|感谢|特此|活动地点|活动内容|活动时间|活动id|^\d[、.．]|@image#|\.(png|jpe?g|gif|webp)\s*$/i.test(line)) continue;
        const cleaned = stripTimeWords(line);
        if (cleaned && TITLE_STOP.indexOf(cleaned) === -1 && cleaned.length >= 4) { title = cleaned.slice(0, 20); break; }
      }
    }
    title = title.replace(/^[「『"']|[」』"']$/g, '').replace(/的?通知$/, '').trim();
    /* 标题开头常带着「召开 / 定于」，反复削掉 */
    const VERB_HEAD = /^(关于|定于|于|召开|举办|举行|组织|开展|参加|特此)\s*/;
    while (VERB_HEAD.test(title)) title = title.replace(VERB_HEAD, '');
    title = title.trim().slice(0, 30);

    /* ---------------- 兜底与收尾 ---------------- */
    if (!date) {
      /* 没写日期：时间还没过就放今天，过了就放明天 */
      date = today;
      if (sMin !== null && sMin <= base.getHours() * 60 + base.getMinutes()) {
        date = addDays(today, 1);
      }
    }

    let sTxt = '';
    let eTxt = '';
    if (sMin !== null) {
      sTxt = toHM(sMin);
      eTxt = toHM(eMin !== null && eMin > sMin ? eMin : Math.min(23 * 60 + 59, sMin + 60));
    }

    return {
      d: toYMD(date),
      s: sTxt,
      e: eTxt,
      t: title,
      p: place,
      n: String(raw || '').trim(),
      hits: hits
    };
  }

  /* --------------------------------------------------------------------------
   * 7.7.1 课表图片识别（OCR）
   * 引擎：tesseract.js（免费开源），首次使用时从 CDN 按需加载，识别全程
   * 在本机跑，截图不会上传。识别不出的字段留空并标红，由用户手动补。
   * ------------------------------------------------------------------------ */

  /** 节次 → 上下课时间（常见十二节制；截图里只写「第3-4节」时兜底） */
  const PERIOD_TIMES = {
    1: ['08:00', '08:45'], 2: ['08:55', '09:40'], 3: ['10:00', '10:45'], 4: ['10:55', '11:40'],
    5: ['14:00', '14:45'], 6: ['14:55', '15:40'], 7: ['16:00', '16:45'], 8: ['16:55', '17:40'],
    9: ['19:00', '19:45'], 10: ['19:55', '20:40'], 11: ['21:00', '21:45'], 12: ['21:55', '22:40']
  };

  let tessLoading = null;
  /** 按需加载 tesseract.js（只加载一次；失败可重试） */
  function loadTessEngine() {
    if (window.Tesseract) return Promise.resolve();
    if (tessLoading) return tessLoading;
    tessLoading = new Promise(function (resolve, reject) {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload = resolve;
      s.onerror = function () { tessLoading = null; reject(new Error('引擎没加载成功（需要联网）')); };
      document.head.appendChild(s);
    });
    return tessLoading;
  }

  /**
   * OCR 一张课表截图。
   * @param {string} dataUrl 压缩后的 dataURL
   * @param {Function} [onProg] (pct) 进度回调 0–1
   * @returns {Promise<string>} 识别出的整段文本
   */
  function ocrImage(dataUrl, onProg) {
    return loadTessEngine().then(function () {
      return window.Tesseract.recognize(dataUrl, 'chi_sim+eng', {
        logger: function (m) {
          if (onProg && m && m.progress != null) onProg(m.progress);
        }
      });
    }).then(function (r) { return r.data.text; });
  }

  /**
   * 把 OCR 文本按行解析成课程行（能认多少认多少，认不出的留空）。
   * @param {string} raw
   * @returns {Array<{t:string,wd:number|null,s:string,e:string,p:string,tea:string}>}
   */
  function parseScheduleText(raw) {
    const WDS = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 日: 0, 天: 0 };
    const lines = String(raw || '').split(/\n+/)
      .map(function (x) {
        return x.replace(/@image#\S*/gi, ' ').replace(/\s+/g, ' ').trim();
      })
      .filter(function (x) {
        return x.length >= 4 && !/\.(png|jpe?g|gif|webp)\s*$/i.test(x);
      });

    const rows = [];
    lines.forEach(function (line) {
      let rest = line;
      let wd = null;
      let s = '';
      let e = '';

      const wm = rest.match(/(?:周|星期|礼拜)\s*([一二三四五六日天])/);
      if (wm) { wd = WDS[wm[1]]; rest = rest.replace(wm[0], ' '); }

      const tm = rest.match(/(\d{1,2})\s*[:：]\s*(\d{2})\s*(?:[-–—~～至到]\s*(\d{1,2})\s*[:：]\s*(\d{2}))?/);
      if (tm) {
        s = ('0' + tm[1]).slice(-2) + ':' + tm[2];
        e = tm[3] != null ? ('0' + tm[3]).slice(-2) + ':' + tm[4] : '';
        rest = rest.replace(tm[0], ' ');
      }
      if (!s) {
        const pm = rest.match(/第\s*(\d{1,2})\s*[-–—~～]\s*(\d{1,2})\s*节/);
        if (pm && PERIOD_TIMES[+pm[1]] && PERIOD_TIMES[+pm[2]]) {
          s = PERIOD_TIMES[+pm[1]][0];
          e = PERIOD_TIMES[+pm[2]][1];
          rest = rest.replace(pm[0], ' ');
        }
      }

      /* 教师：XX老师 / XX教授 / 教师：XXX */
      let tea = '';
      const tk = rest.match(/(?:教师|老师|主讲)\s*[:：]?\s*([\u4e00-\u9fa5]{2,4})|([\u4e00-\u9fa5]{2,4})(?:老师|教授)/);
      if (tk) {
        tea = (tk[1] || tk[2] || '').trim();
        rest = rest.replace(tk[0], ' ');
      }

      /* 地点：认地点后缀或「教三201 / A101 / 3-201」式教室编号 */
      let place = '';
      const tokens = rest.split(/[,，;；、\s]+/).filter(Boolean);
      for (let i = 0; i < tokens.length; i++) {
        const tok = tokens[i];
        const looksPlace =
          /(教室|实验室|会议室|报告厅|机房|体育馆|游泳馆|图书馆|实训楼|教学楼|实验楼)/.test(tok) ||
          /[\u4e00-\u9fa5]{1,4}楼\s?[A-Za-z]?\d{2,4}$/.test(tok) ||
          /^(?:[A-Za-z]?[\u4e00-\u9fa5]{0,3})?\d{1,2}[-–]\d{3,4}[A-Za-z]?$/.test(tok) ||
          /^[A-Za-z]\d{3,4}$/.test(tok) ||
          /^[东西南北]?[\u4e00-\u9fa5]{1,3}\d{3,4}$/.test(tok);
        if (looksPlace) { place = tok; tokens.splice(i, 1); break; }
      }

      /* 剩下最长的词大概率是课程名 */
      const title = tokens.filter(function (t) {
        return !/^(第|共|周|节|单|双|全|上|下)/.test(t) && !/^\d+$/.test(t);
      }).sort(function (a, b) { return b.length - a.length; })[0] || '';

      /* 整行连时间/星期都没有的（多半是表头、页脚），不进预览 */
      if (s === '' && wd === null) return;
      rows.push({ t: title, wd: wd, s: s, e: e, p: place, tea: tea });
    });
    return rows;
  }

  /** 星期下拉的选项（空值 = 未识别，让用户自己挑） */
  function ocrWdOptions(sel) {
    let h = '<option value=""' + (sel == null ? ' selected' : '') + '>?（未识别）</option>';
    ['周一', '周二', '周三', '周四', '周五', '周六', '周日'].forEach(function (n, i) {
      h += '<option value="' + ((i + 1) % 7) + '"' + (sel === (i + 1) % 7 ? ' selected' : '') + '>' + n + '</option>';
    });
    return h;
  }

  /**
   * 识别结果预览：逐行勾选 + 编辑，确认后按周重复写入。
   * @param {Array} rows parseScheduleText 的结果
   */
  function openOcrPreview(rows, rawText, onAdded) {
    const until0 = toYMD(addDays(new Date(), 16 * 7));

    const rowHtml = function (r, i) {
      const missT = !r.t;
      const missS = !r.s;
      const missWd = r.wd == null;
      const ok = !missT && !missS && !missWd;
      return '<div class="ocr-item">' +
          '<div class="oi-head">' +
            '<label><input type="checkbox" class="oi-check"' + (ok ? ' checked' : '') + '> 第 ' + (i + 1) + ' 行</label>' +
            (!ok ? '<span class="miss-tag">信息不全：可勾掉，或补全后再勾</span>' : '') +
          '</div>' +
          '<div class="ocr-grid">' +
            '<div class="f wide' + (missT ? ' miss' : '') + '"><span>课程名</span>' +
              '<input class="inp oi-t" maxlength="40" value="' + esc(r.t) + '"></div>' +
            '<div class="f' + (missWd ? ' miss' : '') + '"><span>星期</span>' +
              '<select class="inp oi-wd">' + ocrWdOptions(r.wd) + '</select></div>' +
            '<div class="f' + (missS ? ' miss' : '') + '"><span>开始</span>' +
              '<input type="time" class="inp oi-s" value="' + esc(r.s) + '"></div>' +
            '<div class="f"><span>结束</span>' +
              '<input type="time" class="inp oi-e" value="' + esc(r.e) + '"></div>' +
            '<div class="f wide"><span>地点</span>' +
              '<input class="inp oi-p" maxlength="60" value="' + esc(r.p) + '"></div>' +
            '<div class="f wide"><span>教师（会写进备注）</span>' +
              '<input class="inp oi-tea" maxlength="20" value="' + esc(r.tea) + '"></div>' +
          '</div>' +
        '</div>';
    };

    const rawBlock = rawText
      ? '<details class="ocr-raw"><summary>查看识别原文（识别不准时可以对照）</summary><pre>' + esc(rawText) + '</pre></details>'
      : '';

    /* 独立浮层：盖在新建日程弹窗之上；关闭后回到原来的表单，不再替换它。
       这解决了旧版「放弃/叉号点不动、只能被迫添加」的问题。 */
    const root = document.createElement('div');
    root.className = 'modal-root ocr-root';
    root.id = 'ocrRoot';
    root.innerHTML =
      '<div class="mb-back" data-ocr-close></div>' +
      '<div class="mb-panel ocr-panel" role="dialog" aria-modal="true">' +
        '<div class="mb-head"><h3>识别结果 · 逐项确认</h3>' +
          '<button class="icon-btn sm" data-ocr-close aria-label="关闭">✕</button></div>' +
        rawBlock +
        '<div class="ocr-list">' + rows.map(rowHtml).join('') + '</div>' +
        '<div class="ocr-foot">' +
          '<div class="until"><span>每周重复，至</span>' +
            '<input type="date" id="ocrUntil" value="' + until0 + '"></div>' +
          '<p class="hint">只添加勾选的行；不想要就点「放弃」或右上角 ✕，不会动原来的表单。</p>' +
          '<div class="mb-foot">' +
            '<button class="btn danger" data-ocr-close>放弃</button>' +
            '<button class="btn primary" id="ocrAdd">添加选中项</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(root);
    openLayer(root);

    function closeOcr() {
      popModal(closeOcr);
      root.classList.remove('open');
      if (root.parentNode) root.parentNode.removeChild(root);
    }
    pushModal(closeOcr);
    $$('[data-ocr-close]', root).forEach(function (el) {
      el.addEventListener('click', closeOcr);
    });

    /* 计数跟勾选走 */
    const addBtn = $('#ocrAdd', root);
    const syncCount = function () {
      const n = $$('.oi-check', root).filter(function (c) { return c.checked; }).length;
      addBtn.textContent = '添加选中项（' + n + '）';
    };
    $$('.oi-check', root).forEach(function (c) { c.addEventListener('change', syncCount); });
    syncCount();

    addBtn.addEventListener('click', function () {
      const until = $('#ocrUntil', root).value || until0;
      const today = new Date();
      let n = 0;

      $$('.ocr-item', root).forEach(function (item) {
        if (!$('.oi-check', item).checked) return;
        const t = $('.oi-t', item).value.trim();
        if (!t) return; /* 课程名是底线 */
        const wdRaw = $('.oi-wd', item).value;
        const s = $('.oi-s', item).value || '08:00';
        let e = $('.oi-e', item).value;
        if (!e || toMin(e) <= toMin(s)) e = toHM(Math.min(23 * 60 + 59, toMin(s) + 90));
        const p = $('.oi-p', item).value.trim();
        const tea = $('.oi-tea', item).value.trim();
        const note = tea ? '教师：' + tea : '';

        if (wdRaw === '') {
          /* 没认出星期：先建一条放在今天，用户自己再调 */
          state.events.push({ id: uid('ev'), d: toYMD(today), s: s, e: e, t: t, p: p, n: note, st: 'todo' });
          n++;
          return;
        }

        const wdn = Number(wdRaw);
        /* 从今天起（含今天）第一个该星期几 */
        const first = addDays(today, (wdn - today.getDay() + 7) % 7);
        const dates = expandRepeat(toYMD(first), until, 'weekly', [wdn]);
        if (!dates.length) return;
        const gid = uid('grp');
        dates.forEach(function (ds) {
          state.events.push({
            id: uid('ev'), gid: gid, gt: t, d: ds, s: s, e: e, t: t, p: p, n: note, st: 'todo',
            rr: 'weekly', rw: [wdn], ru: until, ga: toYMD(first)
          });
        });
        n += dates.length;
      });

      if (!n) { toast('没有可添加的行：课程名不能为空'); return; }

      saveState();
      closeOcr();
      if (typeof onAdded === 'function') onAdded(n);
      else toast('已添加 ' + n + ' 项课程日程');
    });
  }

  /**
   * 打开日程弹窗。
   * @param {string|null} id     传入则编辑，否则新建
   * @param {Object} [preset]    新建时的预填值 { d, s, e }
   */
  /**
   * 内嵌月历浮层：比原生 date 转轮好点太多，手机上一指头就能选。
   * @param {HTMLElement} anchor  贴着哪个按钮弹
   * @param {string} ymd          当前选中的日期
   * @param {(ymd:string)=>void} onPick
   */
  function openMiniCal(anchor, ymd, onPick) {
    const WD = ['一', '二', '三', '四', '五', '六', '日'];
    const cur0 = fromYMD(ymd || toYMD(new Date()));
    const todayStr = toYMD(new Date());
    let y = cur0.getFullYear(), m = cur0.getMonth();

    const pop = document.createElement('div');
    pop.className = 'dt-pop';
    pop.innerHTML =
      '<div class="dt-pop-h">' +
        '<button type="button" data-mv="-1" aria-label="上个月">‹</button>' +
        '<b id="dtpTitle"></b>' +
        '<button type="button" data-mv="1" aria-label="下个月">›</button>' +
      '</div>' +
      '<div class="dt-pop-w">' +
        WD.map(function (w) { return '<span>' + w + '</span>'; }).join('') +
      '</div>' +
      '<div class="dt-pop-g" id="dtpGrid"></div>';
    const title = pop.querySelector('#dtpTitle');
    const grid = pop.querySelector('#dtpGrid');

    function draw() {
      title.textContent = y + '年' + (m + 1) + '月';
      const lead = (new Date(y, m, 1).getDay() + 6) % 7;    /* 周一开头 */
      const days = new Date(y, m + 1, 0).getDate();
      let html = '';
      for (let i = 0; i < lead; i++) html += '<span></span>';
      for (let d = 1; d <= days; d++) {
        const s = toYMD(new Date(y, m, d));
        const cls = (s === todayStr ? 'today ' : '') + (s === ymd ? 'sel' : '');
        html += '<button type="button" data-d="' + s + '" class="' + cls + '">' + d + '</button>';
      }
      grid.innerHTML = html;
    }

    let escKey = null;
    function close() {
      document.removeEventListener('mousedown', onOut, true);
      document.removeEventListener('touchstart', onOut, true);
      window.removeEventListener('resize', close);
      if (escKey) { document.removeEventListener('keydown', escKey); escKey = null; }
      if (pop.parentNode) pop.parentNode.removeChild(pop);
      if (pop._stacked) { pop._stacked = false; popModal(close); }
    }
    function onOut(e) {
      if (!pop.contains(e.target) && e.target !== anchor) close();
    }

    draw();
    document.body.appendChild(pop);
    pop._stacked = true;
    pushModal(close);
    escKey = function (e) { if (e.key === 'Escape') { close(); } };
    document.addEventListener('keydown', escKey);

    /* 贴着按钮下方；下面放不下就翻到上面 */
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    const left = Math.min(Math.max(8, r.left), Math.max(8, window.innerWidth - w - 8));
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';

    pop.addEventListener('click', function (e) {
      const mv = e.target.closest('[data-mv]');
      if (mv) {
        m += Number(mv.dataset.mv);
        if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
        draw();
        return;
      }
      const b = e.target.closest('button[data-d]');
      if (b) { close(); onPick(b.dataset.d); }
    });

    setTimeout(function () {
      document.addEventListener('mousedown', onOut, true);
      document.addEventListener('touchstart', onOut, true);
    }, 0);
    window.addEventListener('resize', close);
    return close;
  }

  /* ------------------------------------------------------------------------
   * 滚轮选择器（移动端底部 sheet）
   * 选中项固定在顶部一行：字号最大最亮，往下一层层缩小变暗，手指一划就换。
   * ---------------------------------------------------------------------- */
  const WP_ITEM = 44;

  /** ± 按钮一次走多少分钟（设置里改，弹窗不摆这一行，保持清爽） */
  function dtStep() {
    const v = Math.round(Number(state.ui && state.ui.dtStep));
    return (isFinite(v) && v >= 1) ? Math.min(120, v) : 15;
  }
  function setDtStep(v) {
    v = Math.round(Number(v));
    if (!isFinite(v) || v < 1 || v > 120) { toast('步长要在 1–120 分钟之间'); return false; }
    state.ui.dtStep = v;
    saveState();
    $$('#dtStepSeg button').forEach(function (b) {
      b.classList.toggle('on', Number(b.dataset.step) === v);
    });
    return true;
  }

  /**
   * @param {string} title
   * @param {{key:string,items:{v:*,l:string}[],value:*}[]} cols
   * @param {(v:Object)=>void} onOk
   * @param {{onChange?:(v:Object,api:{rebuild:Function})=>void}} [opt]
   */
  function openWheelPicker(title, cols, onOk, opt) {
    opt = opt || {};
    const root = document.createElement('div');
    root.className = 'wp-root';
    root.innerHTML =
      '<div class="wp-scrim"></div>' +
      '<div class="wp-sheet">' +
        '<div class="wp-title">' + esc(title) + '</div>' +
        '<div class="wp-cols"></div>' +
        '<div class="wp-acts">' +
          '<button type="button" class="wp-ok">确定</button>' +
          '<button type="button" class="wp-cancel">取消</button>' +
        '</div>' +
      '</div>';
    const sheet = root.querySelector('.wp-sheet');
    const colsEl = root.querySelector('.wp-cols');
    const colState = {};

    function paint(list) {
      const idx = Math.max(0, Math.round(list.scrollTop / WP_ITEM));
      const items = list.querySelectorAll('.wp-item');
      for (let i = 0; i < items.length; i++) {
        const d = i - idx;
        const el = items[i];
        if (d < 0) { el.style.opacity = '0'; continue; }
        const k = d > 4 ? 4 : d;
        const op = [1, 0.66, 0.44, 0.3, 0.18][k];
        el.style.opacity = op;
        el.style.fontSize = [23, 19, 16.5, 15, 14][k] + 'px';
        el.style.color = 'rgba(255,255,255,' + (0.12 + 0.88 * op).toFixed(3) + ')';
      }
      const st = colState[list.parentNode.dataset.key];
      if (st) st.idx = idx;
    }

    function values() {
      const o = {};
      Object.keys(colState).forEach(function (k) {
        const st = colState[k];
        o[k] = st.items[Math.min(st.idx, st.items.length - 1)].v;
      });
      return o;
    }

    function build(col) {
      const box = document.createElement('div');
      box.className = 'wp-col';
      box.dataset.key = col.key;
      const list = document.createElement('div');
      list.className = 'wp-list';
      box.appendChild(list);
      colsEl.appendChild(box);
      colState[col.key] = { list: list, items: col.items, idx: 0 };
      rebuild(col.key, col.items, col.value);

      let t = 0;
      list.addEventListener('scroll', function () {
        paint(list);
        clearTimeout(t);
        t = setTimeout(function () {
          if (opt.onChange) opt.onChange(values(), { rebuild: rebuild });
        }, 130);
      }, { passive: true });
      /* 直接点某一项也能滚过去 */
      list.addEventListener('click', function (e) {
        const it = e.target.closest('.wp-item');
        if (!it) return;
        const i = Array.prototype.indexOf.call(list.querySelectorAll('.wp-item'), it);
        list.scrollTo({ top: i * WP_ITEM, behavior: 'smooth' });
      });
      return box;
    }

    /** 重铺某一列（年/月变了，日数要跟着变） */
    function rebuild(key, items, value) {
      const st = colState[key];
      const list = st.list;
      list.innerHTML = '';
      items.forEach(function (it) {
        const el = document.createElement('div');
        el.className = 'wp-item';
        el.dataset.v = it.v;
        el.textContent = it.l;
        list.appendChild(el);
      });
      const pad = document.createElement('div');
      pad.className = 'wp-pad';
      list.appendChild(pad);
      st.items = items;
      let idx = 0;
      for (let i = 0; i < items.length; i++) {
        if (String(items[i].v) === String(value)) { idx = i; break; }
      }
      st.idx = idx;
      list.scrollTop = idx * WP_ITEM;
      paint(list);
    }

    /* 必须先入 DOM 再建列：没布局的列表设 scrollTop 会被忽略，初始就停在第 1 项 */
    document.body.appendChild(root);
    cols.forEach(build);
    requestAnimationFrame(function () { root.classList.add('in'); });

    function close() {
      popModal(close);
      root.classList.remove('in');
      setTimeout(function () { if (root.parentNode) root.parentNode.removeChild(root); }, 300);
    }
    root.querySelector('.wp-scrim').addEventListener('click', close);
    root.querySelector('.wp-cancel').addEventListener('click', close);
    root.querySelector('.wp-ok').addEventListener('click', function () {
      const v = values();
      close();
      onOk(v);
    });
    pushModal(close);
    return close;
  }

  /** 日期滚轮：年 / 月 / 日 三列 */
  function openDateWheel(ymd, onOk) {
    const cur = fromYMD(ymd || toYMD(new Date()));
    const yNow = new Date().getFullYear();
    const years = [];
    for (let i = yNow - 3; i <= yNow + 8; i++) years.push({ v: i, l: i + '年' });
    const months = [];
    for (let i = 1; i <= 12; i++) months.push({ v: i, l: i + '月' });
    const daysOf = function (yy, mm) {
      const n = new Date(yy, mm, 0).getDate();
      const a = [];
      for (let i = 1; i <= n; i++) a.push({ v: i, l: i + '日' });
      return a;
    };
    let lastN = 0;

    openWheelPicker('选择日期', [
      { key: 'y', items: years, value: cur.getFullYear() },
      { key: 'm', items: months, value: cur.getMonth() + 1 },
      { key: 'd', items: daysOf(cur.getFullYear(), cur.getMonth() + 1), value: cur.getDate() }
    ], function (v) {
      const n = new Date(v.y, v.m, 0).getDate();
      onOk(toYMD(new Date(v.y, v.m - 1, Math.min(v.d, n))));
    }, {
      onChange: function (v, api) {
        const n = new Date(v.y, v.m, 0).getDate();
        if (n !== lastN) { lastN = n; api.rebuild('d', daysOf(v.y, v.m), Math.min(v.d, n)); }
      }
    });
  }

  /** 时间滚轮：时 / 分 两列 */
  function openTimeWheel(minutes, onOk) {
    const mm = ((Number(minutes) % 1440) + 1440) % 1440;
    const hs = [], ms = [];
    for (let i = 0; i < 24; i++) hs.push({ v: i, l: (i < 10 ? '0' : '') + i + '时' });
    for (let i = 0; i < 60; i++) ms.push({ v: i, l: (i < 10 ? '0' : '') + i + '分' });
    openWheelPicker('选择时间', [
      { key: 'h', items: hs, value: Math.floor(mm / 60) },
      { key: 'm', items: ms, value: mm % 60 }
    ], function (v) { onOk(v.h * 60 + v.m); });
  }

        /* 智能识别：提升为主区卡片（仅新建时出现，用得多，放在顺手的位置） */
        (ev ? '' :
        '<div class="fcard fcard-accent" id="smartCard">' + pasteHtml + '</div>') +

        /* 更多选项：低频字段 + 备注 */
        '<details class="more-box" id="moreBox">' +
          '<summary><span>更多选项</span><i>全天 · 重复 · 状态 · 图片 · 备注</i></summary>' +
          '<div class="more-inner">' +
            '<div class="field"><div class="row-sw">' +
