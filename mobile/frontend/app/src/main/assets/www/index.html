<!DOCTYPE html>
<!--
  DayLeaf · 叶历 —— 表格化日程 / 记事应用（v1.0.0）

  作者名：StarLeaf·Roxy
  创建日期：2026-10-25
  ============================================================================
  @file      index.html
  @brief     单文件、零依赖、可离线运行的日程 / 记事应用。包含三大视图：
             1) 主页面 Home   —— 倒计时主卡 + 今日清单 + 本周概览 + 纪念日提醒
                                （纪念日会在前一天就出现在顶部，方便提前准备）
             2) 表格页 Grid   —— 课表式时间轴（日期为列 / 时间为行），
                                纵向按「时间段」调行高、横向按「星期」调列宽
             3) 记事页 Notes  —— 月历 + 每日标题正文 + 颜色标记串联日期 + 每年纪念日
             另含个性化背景（取图 / 裁剪取景 / 缩放 / 模糊 / 透明度）、
             新建日程草稿（关闭弹窗后可随时回来接着写）、粘贴通知自动识别
             （本地规则解析，不联网）、全局搜索（Ctrl+K）、表格页按住拖拽
             划出时间范围、深色模式（浅色 / 深色 / 跟随系统）、
             数据导入导出与本地持久化。另含日程自动清理（可设保留一周 / 一个月 /
             一年 / 自定义，重要项目豁免）、重要项目标记、删除二次确认与误删撤销、
             提醒与闹钟、首次启动引导、表格事件拖拽调整、短时事务逐秒倒计时、
             加载开场（随机语录逐字浮现）与语录卡高度自定义（60%–1000% 或 px）。
  ----------------------------------------------------------------------------
  交互约定（定稿参数，实现时照此）
  · 表格事件拖拽：长按 300ms 进入拖动（位移 >8px 视为滚动并取消）；
    拖动中原位留半透明占位（.ev-source），手指上浮起 1.04× 的卡片（.move-ghost）
    并显示目标「周几 起止时间」气泡；时间吸附 15 分钟，跨列即改日期、保持时长；
    指针进入左右 52px 热区并停留 600ms 后翻页，之后每 900ms 再翻一页，翻页不打断拖动；
    松手在无效区（不在任何列上）→ 浮起卡片回弹消失、数据不变；
    短按（未达阈值）视为点击打开详情，刚拖完 400ms 内的 click 不再触发详情。
  · 闹钟：手机端专属（<960px），电脑端不显示入口也不响铃；提醒（通知）两端都有。
  · 首次启动引导：遮罩分步 5 步，每步聚焦一个区域 + 一句话说明，支持跳过，
    走完/跳过后写入 dayleaf.guide.v1，不再自动弹出；设置里可重看。
  · 短时倒计时：剩余 <2 分钟时切逐秒（「1 分 59 秒」），数字等宽；
    归零（结束）后主卡进入 is-over 收尾态（灰化 +「时间到」+「标记完成」按钮），
    5 分钟后自动恢复；跨过零点瞬间只提示一次。
  · 语录卡高度：倍率 0.6–10（60%–1000%）或 px 12–600（单边内边距），两种模式并存；
    CSS 用 --q-pad + --q-padpx 相加，读时统一 normPad() 夹区间；手输越界 → toast 提示
    并回退 100%，输入框标红；单边 ≥120px 时加 .is-tall 改居中「海报式」排版。
  · 日期时间选择（新建/编辑弹窗）：按设备切换 —— 手机端（<960px）用滚轮 sheet
    （日期三列 年/月/日，时间两列 时/分；深色底，选中项固定在顶行、字号最大最亮，
     往下逐级变小变暗；底部「确定」胶囊描边按钮 +「取消」文字）；电脑端保留原生
    date/time 输入框不动。开始与结束互相独立：± 只动自己那一端，只有显式选「时长」
    才同时改两头。微调步长（1/4/15/30 分）放在「个性化 → 时间微调」，弹窗里不摆。
  · 手机端（<960px）所有底部 sheet 一律铺满整屏：顶到屏幕最上沿、去圆角，
    上方不再留那一条点不到也没内容的空白；电脑端仍是原来的样子。
  · 表单精简（移动端优先）：新建/编辑弹窗首屏只留「标题 / 日期 / 开始–结束 / 提醒」。
    快捷日期（昨天今天明天）、时长 chips、预设时刻 chips 全部删除 —— 与滚轮、± 重复；
    其余（重复、状态、重要项目、全天、地点、备注、图片、粘贴识别）收进「更多选项」折叠。
    主操作「保存」在移动端常驻底部（sticky + margin-top:auto，内容不足一屏也贴底）。
  · 导航：FAB 在三个页面都显示，加日程不必先切回主页；主页「数据概览 / 纪念日」
    在手机上默认折叠（#homeFold），电脑端自动展开。
  · 表单主区 = 标题 / 日期 / 开始–结束 / 提醒 / 地点 / 备注；其余（全天 · 重复 · 状态 ·
    重要项目 · 图片 · 粘贴识别）收进「更多选项」。
  · 表格页不放悬浮加号：它挡格子，拖日程时还会被误判成无效区。新建走「按住空白
    拖出一条」或点表头某一天的日期。
  · 拖动日程的命中判定改成几何算（不再用 elementFromPoint）：手指底下的加号、浮起
    卡片、气泡都不再挡路 —— 以前滑过加号就被判「松手取消」。目标列实时画「落点
    预览」虚线框（翻页后也跟着走，不会看着像手上空了）；左右边缘停 600ms 翻上一周/
    下一周、之后每 900ms 再翻，翻页不中断拖拽；上下边缘自动滚表格（想放到很早或很晚
    的时刻）；只有真甩出表格（表头以上 / 底部导航栏）才回弹取消。
  · 开场层：加载时随机抽一条语录，居中逐字浮现（每字 .ch，错峰 32–46ms）+ 极光渐变
    + canvas 上浮微粒 + 进度条；只做遮罩不参与布局，内容照常渲染；点击 / Esc 可跳过；
    读完自动淡出并让主页语录卡接一次高亮（.bs-handoff），随后才排队放首次引导；
    prefers-reduced-motion 下退化为直接显示。开关：quotes.bootAnim。

  ----------------------------------------------------------------------------
  设计目标（为后续 Android / Desktop 实体实现定调）
  · 体积：单文件 ~100KB 级，无框架、无图标字体，图标全部内联 SVG。
  · 触控：最小可点区域 40px，表格单元格以 30 分钟为吸附粒度。
  · 响应式：<960px 移动端（底部 Tab + 悬浮按钮 + 底部抽屉）；
            ≥960px 桌面端（左侧导轨 + 双栏 + 居中弹窗）。
  ----------------------------------------------------------------------------
  数据模型（对应原生端的四张表，键名 dayleaf.prototype.v2）
  · events[]  { id, d, s, e, t, p, n, st, gid?, gt?, img?, imp?, rm?, al? }
             img = 该日程的背景图 dataURL（480px 内，可选）
             imp = true 表示「重要项目」，自动清理时不会被删除
             rmOn = 是否开提醒；rm = 提前分钟（0 = 到点提醒）；al = 是否同时作为闹钟
             gid = 项目组标识：一次重复插入生成的所有事件共享同一 gid，
                   用于「删除整组」；gt 为分组名称（取生成时的标题）。
  · notes{}   { 'YYYY-MM-DD': { title, body } }        每日日记
  · tags{}    { 'YYYY-MM-DD': '#RRGGBB' }              同色即同一组关联日期
  · annual{}  { 'MM-DD': { title, icon, note } }       每年重复的纪念日
  · blocks    { bounds:number[], h:number[] }
             bounds 为整点边界（相邻块共享边界），h 为每段的高度权重
  · cols      number[7]  周一到周日的列宽权重（0.6–2.0），fr 按比例分配
  · draft     null | { t,d,s,e,p,n,st,img,repRule,repWds,repUntil,savedAt }
             未提交的日程草稿，只有一个槽位；关闭新建弹窗时有内容就写入，提交后清空
  · quotes    { custom[], off{}, scope, freq, picked, bootAnim }  每日一句（bootAnim 控制开场层）
  · quoteBg   { items:[{id,name,on,s,x,y}] }           语录背景图（元数据 + 每张图的缩放/位置）
  · ui        { dtStep }                              界面偏好：时间微调步长（分钟，1–120）
  · quoteStyle { fs, pad, padMode, padPx, bgScale, bgX, bgY }  语录卡外观（padMode: mul|px）
  · quoteFont { key, custom:[{id,name}] }              语录字体（key 为内置键或字体 id）
  ── 体积较大的二进制/图片不放 localStorage，统一进 IndexedDB（库名 dayleaf-assets，
     键前缀 qb_ / font_）；IndexedDB 不可用时降级到 localStorage，再不行只留内存。
  · bg        { data, opacity, blur, scale, x, y }      个性化背景（data 由裁剪器回写）
  · clean     { on, days, lastRun }                     过期日程自动清理（重要项目豁免）
  · notify    { on, defMin, sound, fired{} }            提醒与闹钟（fired 防重复触发）
  ----------------------------------------------------------------------------
  目录
  ── 1. 设计令牌与基础样式
  ── 2. 布局骨架（导轨 / 视图 / Tab / FAB）
  ── 3. 主页面

  ── 5. 记事页
  ── 6. 弹窗与表单
  ── 7. 脚本：常量 / 存储 / 工具 / 渲染 / 交互
  ── 8. 增量样式（标题区 / 重复日程 / 纪念日 / 数据备份 / 背景裁剪）
  ── 9. 增量样式（日程背景图 / 时间块拉伸 / 语录）
  ── 10. 增量样式（悬浮按钮避让 / 语录背景图 / 语录字体）
  ── 11. 增量样式（日程草稿条）
  ── 15. 全局搜索
  ── 16. 深色模式变量（html.dark）

<style>
/* ==========================================================================
   1. 设计令牌与基础样式
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}

:root{ color-scheme:light; }
html.dark{ color-scheme:dark; }

:root{
  /* 色板 */
  --bg:#ECEFF6;
  --bg-grad:linear-gradient(165deg,#EAEEF8 0%,#F6F7FB 42%,#EDF0F7 100%);
  --ink:#11141C;
  --ink2:#3A4050;
  --muted:#767E90;
  --ink-soft:#A9B0BF;
  --line:rgba(17,20,28,.08);
  --line2:rgba(17,20,28,.14);
  --card:rgba(255,255,255,.78);
  /* 内容卡底色 RGB（深色模式换成深底），透明度仍由 --card-a 控制 */
  --card-rgb:255,255,255;
  /* 主页内容卡的白色底透明度，设置里可调（见「主页外观」） */
  --card-a:.78;
  --surface:#FFFFFF;
  --surface-2:#F5F6FA;
  --surface-soft:rgba(255,255,255,.6);
  --track:rgba(17,20,28,.16);
  --overlay:rgba(12,15,22,.44);
  --accent:#4C6FFF;
  --accent2:#7C5CFF;
  --done:#16A34A;
  --absent:#F43F5E;
  --todo:#94A3B8;

  /* 阴影 / 圆角 */
  --shadow:0 1px 2px rgba(16,20,30,.04),0 12px 28px -18px rgba(16,20,30,.34);
  --shadow-lift:0 2px 6px rgba(16,20,30,.06),0 20px 44px -20px rgba(16,20,30,.34);
  --r-lg:20px; --r-md:14px; --r-sm:10px;

  /* 表格几何（JS 会读取 --hourH 做像素换算） */
  --hourH:48px;
  --gutter:44px;
  --rail:86px;
}
@media (max-width:959px){
  :root{ --hourH:52px; --gutter:40px; }
}

/* ---- 深色模式（html.dark 下整体换肤） ---- */
html.dark{
  --bg:#0E1118;
  --bg-grad:linear-gradient(165deg,#0C0F15 0%,#11141C 42%,#0E1219 100%);
  --ink:#E8EBF3;
  --ink2:#B9C0D0;
  --muted:#8B93A7;
  --ink-soft:#5C6478;
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.16);
  --card:rgba(30,35,48,.72);
  --card-rgb:30,35,48;
  --surface:#1A1E2A;
  --surface-2:#232836;
  --surface-soft:rgba(26,30,42,.62);
  --track:rgba(255,255,255,.18);
  --overlay:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 28px -18px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55),0 20px 44px -20px rgba(0,0,0,.75);
  --done:#34C568;
  --absent:#FB5577;
  --todo:#64748B;
}

html,body{height:100%;margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background-color:var(--bg);
  background-image:var(--bg-grad);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* 滚动条 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(17,20,28,.16);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(17,20,28,.28)}
::-webkit-scrollbar-track{background:transparent}

/* 个性化背景层（图片 + 白色柔光罩） */
#bgImage{
  position:fixed; inset:-12%; z-index:0; pointer-events:none;
  background-position:50% 50%; background-size:cover;
  opacity:0; transition:opacity .4s ease, filter .25s ease, transform .25s ease;
}
#bgVeil{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.58) 45%,rgba(255,255,255,.80));
  transition:opacity .4s ease;
}
body.has-bg #bgVeil{opacity:1}

/* ==========================================================================
   2. 布局骨架
   ========================================================================== */
#app{
  /* 注意：这里不能设置 z-index。一旦 #app 形成层叠上下文，
     内部固定定位的抽屉（z-60）就无法盖过根层级的遮罩（z-58），
     会导致打开记事时整个界面（含抽屉）被遮罩压暗。 */
  position:relative;
  height:100vh; height:100dvh;
  display:flex; flex-direction:column;
}
main{flex:1;min-height:0;position:relative}

/* ---- 视图容器 ---- */
.view{display:none}
#view-home.active,#view-notes.active{
  display:block; height:100%; overflow-y:auto; overflow-x:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 104px;
}
#view-grid.active{display:flex;flex-direction:column;height:100%;padding-top:calc(env(safe-area-inset-top,0px) + 8px)}

/* ---- 移动端底部 Tab ---- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  display:flex; gap:4px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--surface-soft);
  -webkit-backdrop-filter:blur(22px) saturate(1.7);
  backdrop-filter:blur(22px) saturate(1.7);
  border-top:1px solid var(--line);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:7px 0; border-radius:13px; color:var(--muted);
  font-size:10px; letter-spacing:.2px; transition:.16s;
}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);background:rgba(76,111,255,.09)}
.tab:active{transform:scale(.96)}

/* ---- 悬浮新增按钮 ---- */
#fab{
  position:fixed; right:16px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:55;
  width:52px; height:52px; border-radius:18px;
  display:none; align-items:center; justify-content:center;
  color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 12px 26px -8px rgba(76,111,255,.62),0 2px 6px rgba(16,20,30,.12);
  transition:transform .16s ease, box-shadow .16s ease;
}
#fab.show{display:flex}
#fab:active{transform:scale(.94)}
#fab svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}

/* ---- 桌面端左侧导轨 ---- */
.rail{display:none}
@media (min-width:960px){
  #app{flex-direction:row}
  .rail{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    width:var(--rail); flex:0 0 var(--rail);
    padding:22px 10px 20px;
    border-right:1px solid var(--line);
    background:rgba(var(--card-rgb),.55);
    -webkit-backdrop-filter:blur(20px) saturate(1.5);
    backdrop-filter:blur(20px) saturate(1.5);
  }
  .tabbar{display:none}
  #view-home.active,#view-notes.active{padding:30px 30px 44px}
  #view-grid.active{padding-top:18px}
  #fab{right:30px;bottom:30px;width:56px;height:56px;border-radius:20px}
}
.brand{
  width:40px;height:40px;border-radius:13px;margin-bottom:20px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 18px -8px rgba(76,111,255,.7);
  flex:0 0 auto;
}
.brand svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail-btn{
  width:100%; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:10px 0; border-radius:14px; color:var(--muted);
  font-size:10px; transition:.16s;
}
.rail-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail-btn.on{color:var(--accent);background:rgba(76,111,255,.10)}
.rail-btn:hover{background:rgba(17,20,28,.04)}
.rail-sp{flex:1}

/* ==========================================================================
   3. 主页面
   ========================================================================== */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.ph-sub{font-size:13px;color:var(--muted);letter-spacing:.3px;margin-bottom:3px}
.ph-title{font-size:24px;font-weight:750;letter-spacing:-.5px}
.icon-btn{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  color:var(--ink2); background:var(--card); border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  transition:.16s; flex:0 0 auto;
}
.icon-btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.sm{width:32px;height:32px;border-radius:10px}

@media (min-width:960px){
  .home-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:stretch}
  .ph-title{font-size:28px}
}

/* ---- 倒计时主卡 ---- */
.hero{
  position:relative; overflow:hidden;
  border-radius:24px; padding:22px 22px 20px; color:#fff;
  border:1px solid rgba(255,255,255,.16);
  background:transparent;
  box-shadow:0 18px 40px -20px rgba(76,88,220,.85),0 2px 8px rgba(16,20,30,.08);
  margin-bottom:20px;
  cursor:pointer;transition:transform .16s ease, box-shadow .16s ease;
}
.hero.is-empty{cursor:default}
.hero:not(.is-empty):active{transform:scale(.994)}
/* 底色单独一层：这样调不透明度时只有底色变淡，文字依然清晰 */
.hero-bg{
  position:absolute; inset:0; z-index:0;
  background-image:linear-gradient(140deg,#4C6FFF 0%,#5B5BE8 48%,#7C5CFF 100%);
  background-size:cover; background-position:50% 50%; background-repeat:no-repeat;
  opacity:1; transition:opacity .2s ease;
}
.hero.is-empty .hero-bg{background-image:linear-gradient(140deg,#5C6478,#767E92)}
/* 光斑压在底色之上、内容之下 */
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:1;opacity:var(--hero-a,1)}
.hero::before{width:230px;height:230px;right:-70px;top:-100px;background:radial-gradient(circle,rgba(255,255,255,.30),transparent 68%)}
.hero::after{width:180px;height:180px;left:-60px;bottom:-110px;background:radial-gradient(circle,rgba(160,140,255,.55),transparent 70%)}

/* 底色很淡时改成深色字：否则白字直接消失在浅色页面上 */
.hero.is-faint{
  color:var(--ink);
  border-color:var(--line);
  box-shadow:0 12px 30px -24px rgba(40,50,120,.32),0 1px 3px rgba(16,20,30,.05);
}
.hero.is-bare{box-shadow:none}

/* 最后 2 分钟：逐秒跳动，数字等宽避免左右抖，配色转强调色 */
.hero-count.is-sec b{
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  color:#FFD9A0;
}
.hero.is-sec .hero-eyebrow .pulse{background:#FFB454;animation:pulse .9s ease-in-out infinite}
/* 归零（刚结束）：整卡灰下来，给一个「标记完成」的出口 */
.hero.is-over{filter:saturate(.25);opacity:.92}
.hero.is-over .hero-count b{color:#FFE0B2}
.hero-over{
  display:flex;align-items:center;gap:10px;margin-bottom:9px;
  font-size:11.5px;color:rgba(255,255,255,.82);
}
.hero-over span{flex:1;min-width:0;line-height:1.45}
.hero-over .ov-done{
  flex:0 0 auto;height:28px;padding:0 12px;border-radius:9px;
  font-size:11.5px;font-weight:650;color:#11141C;background:#fff;
  box-shadow:0 4px 12px -4px rgba(0,0,0,.4);
}
.hero-over .ov-done:active{transform:scale(.96)}
.hero.is-faint .hero-eyebrow{background:var(--surface-soft);border-color:var(--line2)}
.hero.is-faint .hero-count b{text-shadow:none}
.hero.is-faint .hero-ev-meta{opacity:.78}
.hero.is-faint .hero-prog .bar{background:var(--track)}
.hero.is-faint .hero-prog .bar i{background:linear-gradient(90deg,#4C6FFF,#7C5CFF)}
.hero.is-faint .hero-mark{stroke:currentColor;opacity:calc(.11 * var(--hero-a,1))}
@media (min-width:960px){ .hero{margin-bottom:0;padding:28px 28px 24px;min-height:330px;display:flex;flex-direction:column} }

.hero-eyebrow{
  position:relative;z-index:2;
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:600;letter-spacing:.4px;
  padding:5px 11px 5px 9px;border-radius:99px;
  background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.hero-eyebrow .pulse{width:6px;height:6px;border-radius:50%;background:#8CFFC0;box-shadow:0 0 0 0 rgba(140,255,192,.8);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(140,255,192,.7)}70%{box-shadow:0 0 0 8px rgba(140,255,192,0)}100%{box-shadow:0 0 0 0 rgba(140,255,192,0)}}

.hero-count{
  display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 4px;
  margin:18px 0 6px;position:relative;z-index:2;
}
.hero-count b{
  font-size:clamp(42px,11vw,60px);line-height:.92;font-weight:800;letter-spacing:-2px;
  font-variant-numeric:tabular-nums;
  text-shadow:0 6px 26px rgba(20,26,80,.28);
}
.hero-count i{font-style:normal;font-size:14px;font-weight:600;opacity:.88;margin-right:6px;transform:translateY(-6px)}
.hero-after{font-size:14px;font-weight:600;opacity:.82;transform:translateY(-6px);margin-left:2px}

.hero-ev{position:relative;z-index:2;margin-top:14px}
.hero-ev-title{font-size:19px;font-weight:700;letter-spacing:-.2px;margin-bottom:4px}
.hero-ev-meta{font-size:13px;opacity:.86;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-ev-meta .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}

.hero-foot{position:relative;z-index:2;margin-top:auto;padding-top:20px}
.hero-prog{display:flex;align-items:center;gap:10px;font-size:11.5px;opacity:.9}
.hero-prog .bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.26);overflow:hidden}
.hero-prog .bar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .5s cubic-bezier(.22,.9,.3,1)}

/* 桌面端主卡：数字在上、信息与进度贴底，撑满行高后依然稳定 */
@media (min-width:960px){
  .hero{min-height:372px}
  .hero-count b{font-size:clamp(54px,5.4vw,74px)}
  .hero-foot{padding-top:18px}
}
/* 主卡水印：一枚大号叶片，填充留白同时强化品牌识别 */
.hero-mark{
  position:absolute; right:-34px; bottom:-46px; width:230px; height:230px;
  fill:none; stroke:#fff; stroke-width:1.05; stroke-linecap:round; stroke-linejoin:round;
  opacity:calc(.11 * var(--hero-a,1)); pointer-events:none; transform:rotate(-10deg); z-index:1;
}
/* 窄屏主卡较矮：水印移到右上角，避免压住底部进度条 */
@media (max-width:959px){
  .hero-mark{right:-30px; top:-26px; bottom:auto; width:168px; height:168px; opacity:.13}
}

/* ---- 今日日程 ---- */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.sec-head h2{font-size:14px;font-weight:700;letter-spacing:.2px;color:var(--ink2)}
.sec-stat{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.today-list{display:flex;flex-direction:column;gap:8px}
.trow{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:16px;text-align:left;width:100%;
  background:rgba(var(--card-rgb),var(--card-a,.78));border:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  box-shadow:var(--shadow);
  transition:transform .16s ease, box-shadow .16s ease;
}
.trow:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift)}
.trow:active{transform:scale(.994)}
.t-time{display:flex;flex-direction:column;align-items:flex-end;min-width:44px;line-height:1.15}
.t-time b{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.t-time i{font-style:normal;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;border-left:3px solid hsl(var(--h) 70% 60%);padding-left:10px}
.t-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 清单 / 主卡里的「重要项目」星标 */
.t-imp{
  font-style:normal; font-size:11px; margin-right:4px;
  color:#E8A33D; vertical-align:1px;
}
html.dark .t-imp{color:#F5C56B}
.t-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-st{
  position:relative;
  width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  font-size:12px;font-weight:800;flex:0 0 auto;
  cursor:pointer;transition:transform .14s ease, background .14s ease;
}
/* 24px 的方块手指不好点，用伪元素把热区扩到 38px */
.t-st::after{content:"";position:absolute;inset:-7px;border-radius:12px}
.t-st:active{transform:scale(.9)}
.st-todo .t-st{background:rgba(148,163,184,.16);color:#64748B}
.st-done .t-st{background:rgba(22,163,74,.14);color:var(--done)}
.st-absent .t-st{background:rgba(244,63,94,.13);color:var(--absent)}
.st-absent .t-title{color:var(--muted);text-decoration:line-through}
.st-done .t-title{color:var(--ink2)}
.trow.past{opacity:.84}
.trow.past .t-title{color:var(--ink2)}
.trow.past .t-time b{color:var(--ink2)}

/* ---- 本周概览 ---- */
.week-block{margin-top:22px}
.wk-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk-day{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px 9px;border-radius:14px;
  background:rgba(var(--card-rgb),var(--card-a,.78));border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.wk-day:hover{transform:translateY(-2px);background:var(--surface-2);box-shadow:var(--shadow)}
.wk-day:active{transform:scale(.97)}
.wk-wd{font-size:9.5px;color:var(--muted);letter-spacing:.2px}
.wk-dn{font-size:15px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.wk-bar{width:100%;height:3px;border-radius:99px;background:rgba(17,20,28,.07);overflow:hidden;margin-top:3px}
.wk-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.wk-day.is-today{background:linear-gradient(160deg,rgba(76,111,255,.14),rgba(124,92,255,.10));border-color:rgba(76,111,255,.3)}
.wk-day.is-today .wk-dn,.wk-day.is-today .wk-wd{color:var(--accent)}

.empty-tip{
  text-align:center;padding:34px 16px;border-radius:18px;
  border:1px dashed var(--line2);color:var(--muted);font-size:13px;
}

/* ==========================================================================
   4. 表格页
   ========================================================================== */
.gv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px 10px}
.gv-title{font-size:15px;font-weight:750;letter-spacing:-.2px}
.gv-nav{display:flex;align-items:center;gap:6px}
.gv-nav button{
  height:32px;min-width:32px;padding:0 10px;border-radius:10px;
  background:var(--card);border:1px solid var(--line);color:var(--ink2);
  font-size:12.5px;display:grid;place-items:center;transition:.16s;
}
.gv-nav button:hover{background:var(--surface-2)}
.gv-nav button:active{transform:scale(.95)}
.gv-nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.grid-wrap{flex:1;min-height:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
/* 底部留白，避免最后几个时段被底部导航遮住 */
#gridWrap::after{content:"";display:block;height:88px}
@media (min-width:960px){ #gridWrap::after{height:40px} }

/* 表头：日期 / 星期 */
.grid-head{
  position:sticky; top:0; z-index:8;
  display:grid; grid-template-columns:var(--gutter) repeat(7,1fr);
  background:var(--surface);
  -webkit-backdrop-filter:blur(18px) saturate(1.6); backdrop-filter:blur(18px) saturate(1.6);
  border-bottom:1px solid var(--line);
  padding-top:2px;
}
.gh-gutter{min-width:0}
.gh-day{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 0 8px;color:var(--muted);transition:.16s;
}
.gh-wd{font-size:10px;letter-spacing:.2px}
.gh-dt{
  font-size:15px;font-weight:750;color:var(--ink);
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-variant-numeric:tabular-nums;transition:.16s;
}
.gh-day.is-today .gh-wd{color:var(--accent);font-weight:700}
.gh-day.is-today .gh-dt{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 12px -4px rgba(76,111,255,.75)}
.gh-day:hover .gh-dt{background:rgba(17,20,28,.05)}
.gh-day.is-today:hover .gh-dt{background:linear-gradient(135deg,var(--accent),var(--accent2))}

/* 表体：时间轴 */
.grid-body{
  display:grid; grid-template-columns:var(--gutter) repeat(7,1fr);
  align-items:start; position:relative;
  background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hourH));
}
.gutter{position:relative}
.hl{
  position:absolute;right:6px;transform:translateY(-50%);
  font-size:11px;font-weight:600;color:var(--ink2);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.1px;pointer-events:none;
  /* 整点线会从数字中间穿过，用底色描边把线「垫」下去；颜色跟随主题，避免深色下发白模糊 */
  text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 2px var(--surface);
}
@media (max-width:959px){
  .hl{font-size:11px;right:5px;letter-spacing:-.2px}
}
.gutter .hl:first-child{transform:none}
.gcol{
  position:relative; border-left:1px solid var(--line); cursor:cell;
}
.grid-body .gcol:last-child{border-right:1px solid var(--line)}
.gcol.is-today{background:rgba(76,111,255,.035)}
.gcol:hover{background:rgba(76,111,255,.02)}

/* 日程块 */
.ev{
  position:absolute; overflow:hidden; border-radius:9px;
  padding:6px 8px 7px 8px; text-align:left;
  background:hsl(var(--h) 88% 95.5%);
  border-left:3px solid hsl(var(--h) 72% 58%);
  color:hsl(var(--h) 52% 27%);
  box-shadow:0 1px 2px rgba(16,20,30,.05);
  transition:transform .13s ease, box-shadow .13s ease;
  cursor:pointer;
  touch-action:none;   /* 触屏上长按拖拽时，别让浏览器把手指动作当成滚动 */
}
.ev:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(16,20,30,.4);z-index:3}
.ev:active{transform:scale(.985)}
.ev-t{
  font-size:12.5px;font-weight:700;line-height:1.26;letter-spacing:-.1px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  padding-right:12px;
}
.ev-hm{margin-top:3px;font-size:10.5px;opacity:.72;font-variant-numeric:tabular-nums;letter-spacing:-.1px}
.hm-short{display:none}

/* 角标：完成 / 缺席 / 待办 */
.ev-badge{
  position:absolute; top:0; right:0;
  width:15px; height:15px; border-radius:0 9px 0 8px;
  display:grid; place-items:center;
  font-size:8.5px; font-weight:800; line-height:1; color:#fff;
  background:var(--todo);
}
.st-done .ev-badge{background:var(--done)}
.st-absent .ev-badge{background:var(--absent)}
/* 只作用于表格里的日程卡片：首页清单同样带 st-done / st-absent 类，
   不限定作用域会把清单卡片的白底整个盖掉 */
.ev.st-done{background:hsl(var(--h) 55% 97%);border-left-color:hsl(var(--h) 35% 72%);color:hsl(var(--h) 25% 40%)}
.ev.st-absent{background:rgba(244,63,94,.055);border-left-color:rgba(244,63,94,.55);color:#9F1239}
.st-absent .ev-t{text-decoration:line-through;opacity:.78}
.st-absent .ev-hm{opacity:.55}

/* 深色模式下日程卡片换成深底浅字，仍是同色相 */
html.dark .ev{background:hsl(var(--h) 40% 19%);border-left-color:hsl(var(--h) 62% 58%);color:hsl(var(--h) 72% 80%)}
html.dark .ev.st-done{background:hsl(var(--h) 28% 17%);border-left-color:hsl(var(--h) 34% 46%);color:hsl(var(--h) 28% 64%)}
html.dark .ev.st-absent{background:rgba(251,85,119,.14);border-left-color:rgba(251,85,119,.6);color:#FB5577}
html.dark .ev .ev-hm{opacity:.66}
html.dark .ev:hover{box-shadow:0 6px 16px -8px rgba(0,0,0,.7)}

/* ---- 深色下的零散适配：hover 高亮、小控件底色、玻璃条 ---- */
html.dark ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22)}
html.dark .icon-btn:hover{background:rgba(255,255,255,.08)}
html.dark .wk-day:hover{background:var(--surface-2)}
html.dark .gv-nav button:hover,
html.dark .rail-btn:hover,
html.dark .tab:hover{background:rgba(255,255,255,.08)}
html.dark .gh-day:hover .gh-dt{background:rgba(255,255,255,.1)}
html.dark .chip-btn{background:var(--surface-2)}
html.dark .chip-btn:hover{background:var(--surface)}
html.dark .same-chip{background:var(--surface-2)}
html.dark .same-chip:hover{background:var(--surface)}
html.dark .mini-btn:hover{background:rgba(255,255,255,.08)}
html.dark .seg{background:rgba(255,255,255,.06)}
html.dark .seg button.on{background:var(--surface-2)}
html.dark .sw{background:rgba(255,255,255,.14)}
html.dark .sw.on{background:linear-gradient(135deg,var(--accent),var(--accent2))}
html.dark .q-tabs{background:rgba(255,255,255,.06)}
html.dark .q-tabs button.on{background:var(--surface-2)}
html.dark .qb-tabs{background:rgba(255,255,255,.06)}
html.dark .qb-tabs button.on{background:var(--surface-2)}
html.dark .q-add input,
html.dark .q-add button{background:var(--surface-2)}
html.dark .q-add button{color:var(--ink)}
html.dark .rep-seg button{background:var(--surface-2)}
html.dark .rep-seg button.on{background:var(--accent);border-color:transparent;color:#fff}
html.dark .chips button{background:var(--surface-2)}
html.dark .chips button.on{background:var(--accent);border-color:transparent;color:#fff}
html.dark .search-esc{background:rgba(255,255,255,.05)}
html.dark .sp-nudge{background:var(--surface-2)}
html.dark .paste-inner textarea{background:var(--surface-2)}
html.dark .bg-preview{background:linear-gradient(160deg,#171B26,#232836 45%,#1B202C)}
html.dark .bg-prev-veil{
  background:linear-gradient(180deg,rgba(10,13,20,.22),rgba(10,13,20,.5) 45%,rgba(10,13,20,.74));
}
html.dark .bg-prev-tag{color:var(--muted);background:rgba(255,255,255,.08)}
html.dark .bg-prev-ui i{background:rgba(255,255,255,.1)}
html.dark .btn.ghost{background:var(--surface-2);color:var(--ink2);border-color:var(--line2)}
html.dark .btn.ghost:hover{background:var(--surface)}
html.dark .btn.danger{background:rgba(244,63,94,.14);border-color:rgba(244,63,94,.4)}
html.dark .hero-prev .hp-bg{background-image:linear-gradient(140deg,#3946A8 0%,#4340C9 48%,#5F41D6 100%)}
html.dark .anniv-bar{background:linear-gradient(115deg,rgba(255,122,89,.2),rgba(255,154,89,.12) 45%,rgba(124,92,255,.14))}
html.dark .quote-card .q-act{background:rgba(76,111,255,.16)}
html.dark .t-st.st-todo{background:rgba(148,163,184,.2)}
/* 深色的「完成」绿偏亮，白勾在上面看不清 → 换成深色字 */
html.dark .st-done .ev-badge{color:#07130C}
/* 日历 / 周历里选中态用的是 accent 底白字，深色下保持；周边未选中格子压暗一点 */
html.dark .cal-cell.other{opacity:.42}
html.dark .q-item.off .q-txt{color:#6B7284}
/* 输入框占位符在深底上统一调到可读区间 */
html.dark ::placeholder{color:#6E7689}

/* 当前时间指示线 */
.now-line{position:absolute;left:0;right:0;height:0;border-top:2px solid #F43F5E;z-index:4;pointer-events:none}
.now-line i{position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:#F43F5E;box-shadow:0 0 0 3px rgba(244,63,94,.18)}

@media (max-width:959px){
  .ev{padding:4px 4px 4px 5px;border-radius:7px;border-left-width:2.5px}
  .ev-t{font-size:10px;line-height:1.18;-webkit-line-clamp:4;padding-right:9px;letter-spacing:0}
  .ev-hm{font-size:8px;margin-top:2px;opacity:.66}
  .ev-badge{width:11px;height:11px;font-size:7px;border-radius:0 7px 0 6px}
  .gh-dt{font-size:14px;width:24px;height:24px}
  .gh-wd{font-size:9px}

#noteScrim{position:fixed;inset:0;z-index:58;background:rgba(12,15,22,.34);opacity:0;pointer-events:none;transition:opacity .26s}

/* ==========================================================================
   15. 全局搜索
   ========================================================================== */
.search-root{position:fixed;inset:0;z-index:96;display:none;align-items:flex-start;justify-content:center}

.search-root .search-scrim{position:absolute;inset:0;background:var(--overlay);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.search-panel{
  position:relative;z-index:1;width:min(600px,100%);

  background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 30px 80px -28px rgba(16,20,30,.55);
  overflow:hidden;animation:pop .18s ease;
  max-height:min(68vh,640px);display:flex;flex-direction:column;
}
.search-bar{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line);
}

.search-bar input{

.search-esc{

}
.search-list{overflow-y:auto;padding:6px}

  padding:10px 12px;border-radius:12px;text-align:left;width:100%;

}
.sr-item:hover,.sr-item:focus-visible{background:rgba(76,111,255,.07)}

}

.sr-date span{font-size:9px;opacity:.75;margin-top:2px}
.sr-date.is-past{background:rgba(17,20,28,.05);color:var(--muted)}
.sr-main{flex:1;min-width:0}
.sr-title{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sr-sub mark{background:rgba(76,111,255,.14);color:inherit;border-radius:3px;padding:0 1px}
.sr-time{flex:0 0 auto;font-size:12px;font-weight:650;color:var(--ink2);font-variant-numeric:tabular-nums}
.sr-empty{padding:30px 20px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.7}
.search-foot{padding:8px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}

.modal-root{position:fixed;inset:0;z-index:90;display:none}
.modal-root.open{display:block}
.mb-back{position:absolute;inset:0;background:var(--overlay);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mb-panel{
  position:absolute;left:0;right:0;bottom:0;
  /* flex 布局下子项默认会被压扁 —— 那样「更多选项」展开后内容溢出、
     父容器 scrollHeight 却不增长，手机上就滑不动了。一律不许压缩。 */
  display:flex;flex-direction:column;
  background:var(--surface);border-radius:24px 24px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  max-height:90vh;overflow-y:auto;
  box-shadow:0 -16px 50px -12px rgba(16,20,30,.4);
  animation:sheetUp .28s cubic-bezier(.22,.9,.3,1);
}
.mb-panel>*{flex:0 0 auto}   /* 不许压缩：内容该多高就多高，超出再交给滚动 */
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
/* 手机上直接铺满整屏 —— 顶部不再留一条点不到、也没内容的空白 */
@media (max-width:959px){
  .mb-panel{
    top:0;height:100%;max-height:none;border-radius:0;box-shadow:none;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    padding-left:18px;padding-right:18px;padding-bottom:0;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
}

/* 移动端触控尺寸统一挪到样式表末尾，避免被前面的基础样式盖掉 */
.mb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mb-head h3{font-size:16.5px;font-weight:750;letter-spacing:-.2px}

/* 「更多选项」：把低频字段收进去，首屏只留标题 / 日期 / 时间 / 提醒 */
.more-box{
  margin:6px 0 4px;border-radius:14px;overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line2);
}
.more-box>summary{
  display:flex;align-items:center;gap:8px;padding:13px 14px;
  font-size:13px;font-weight:650;color:var(--ink2);
  cursor:pointer;list-style:none;user-select:none;
}
/* 主页底部的「数据概览 / 纪念日」折叠：手机上默认收起，电脑端自动展开 */
.home-fold{
  margin-top:22px;border-radius:16px;overflow:hidden;
  background:rgba(var(--card-rgb),var(--card-a,.78));border:1px solid var(--line);
}
.home-fold>summary{
  display:flex;align-items:center;gap:8px;padding:14px 16px;
  font-size:13px;font-weight:650;color:var(--ink2);
  cursor:pointer;list-style:none;user-select:none;
}
.home-fold>summary::-webkit-details-marker{display:none}
.home-fold>summary::before{
  content:"";width:0;height:0;flex:0 0 auto;
  border-left:4.5px solid currentColor;
  border-top:4px solid transparent;border-bottom:4px solid transparent;
  transition:transform .18s ease;
}
.home-fold[open]>summary::before{transform:rotate(90deg)}
.home-fold>summary i{
  font-style:normal;font-size:10.5px;font-weight:500;
  color:var(--muted);margin-left:auto;
}
.fold-inner{padding:0 12px 4px}
.home-fold .week-block{margin-top:12px}
.home-fold .week-block:first-child{margin-top:0}
.more-box>summary::-webkit-details-marker{display:none}
.more-box>summary::before{
  content:"";width:0;height:0;flex:0 0 auto;
  border-left:4.5px solid currentColor;
  border-top:4px solid transparent;border-bottom:4px solid transparent;
  transition:transform .18s ease;
}
.more-box[open]>summary::before{transform:rotate(90deg)}
.more-box>summary i{
  font-style:normal;font-size:10.5px;font-weight:500;
  color:var(--muted);margin-left:auto;letter-spacing:.2px;
}
.more-inner{padding:2px 14px 14px}
.more-inner>.field:first-child{margin-top:0}
.more-inner .hint{margin-bottom:10px}
.field{margin-bottom:12px}
.field>label{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.2px}
.field>label b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.inp{
  width:100%;border:1px solid var(--line2);background:var(--surface-2);
  border-radius:12px;padding:10px 12px;font-size:14px;outline:none;transition:.18s;
}
.inp:focus{border-color:rgba(76,111,255,.55);background:var(--surface);box-shadow:0 0 0 4px rgba(76,111,255,.10)}
textarea.inp{resize:vertical;line-height:1.6;font-size:13.5px}
input[type=date].inp,input[type=time].inp{font-variant-numeric:tabular-nums}
.field-row{display:grid;gap:10px;margin-bottom:12px}
.field-row.two{grid-template-columns:1fr 1fr}
.field-row .field{margin-bottom:0;min-width:0}
.hint{font-size:10.5px;color:var(--ink-soft);margin:-6px 0 12px 2px}

/* ==========================================================================
   11. 日期 / 时间快选：手机上原生 date/time 是转轮，很难点
   —— 这里改成「人话标签 + 快捷 chips + ±15 分钟大按钮 + 内嵌月历」
   ========================================================================== */
.dt-dlabel{
  flex:1;min-width:0;height:44px;padding:0 14px;border-radius:13px;
  display:flex;align-items:center;gap:7px;text-align:left;
  border:1px solid var(--line2);background:var(--surface-2);

  transition:.16s;
}

.dt-cal{
  flex:0 0 46px;height:44px;border-radius:13px;display:grid;place-items:center;
  border:1px solid var(--line2);background:var(--surface-2);transition:.16s;
}
.dt-cal:active{transform:scale(.96)}

/* 横滑 chips：不换行，手指一划就能挑，比下拉/转轮快 */
.dt-scroll{
  display:flex;gap:6px;margin-top:7px;

}

/* ---- 按设备切换：桌面端原生 date/time 照旧；移动端换成滚轮 + 快选 ---- */

   ========================================================================== */
.wp-root{position:fixed;inset:0;z-index:1500}

  padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));

  transition:transform .28s cubic-bezier(.32,.72,0,1);
}
