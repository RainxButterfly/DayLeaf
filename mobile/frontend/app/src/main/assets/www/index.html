  color:var(--absent);background:rgba(244,63,94,.11);white-space:nowrap;
}
.grp-row button.armed{background:var(--absent);color:#fff;font-weight:650}

/* 长表单（含重复设置）滚动时，主操作按钮始终吸在底部 */
.mb-foot{
  position:sticky; bottom:-16px; z-index:3;
  margin:16px -16px -16px;
  padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(var(--card-rgb),.72),rgba(var(--card-rgb),.98) 30%);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
}

/* ---- 8.5 设置页数据区 ---- */
.data-pick{display:flex;gap:10px}
.data-pick .btn{height:42px;font-size:13px}
.about .ver{color:var(--accent);font-weight:700}

/* ---- 8.6 记事编辑器：更大的标题区 + 纪念日开关 ---- */
.ne-title{padding:11px 2px 13px;font-size:17px}
.ne-date{font-size:16px}
.ne-anniv{border-top:1px dashed var(--line2);padding-top:11px;display:flex;flex-direction:column;gap:9px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink2)}
.switch-row .lb{display:flex;align-items:center;gap:7px}
.switch-row .lb i{font-style:normal;font-size:13px;opacity:.85}
.sw{
  position:relative;width:42px;height:24px;flex:0 0 auto;border-radius:99px;
  background:rgba(17,20,28,.16);transition:background .2s;
}
.sw::after{
  content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(16,20,30,.28);transition:transform .22s cubic-bezier(.3,.9,.3,1);
}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(18px)}
.anniv-fields{display:none;flex-direction:column;gap:9px}
.anniv-fields.on{display:flex}
.anniv-fields input[type=text]{
  width:100%;height:34px;border-radius:10px;border:1px solid var(--line2);
  background:var(--surface);padding:0 10px;font-size:12.5px;outline:none;
}
.icon-pick{display:flex;gap:6px;flex-wrap:wrap}
.icon-pick button{
  width:34px;height:34px;border-radius:10px;font-size:16px;
  background:rgba(17,20,28,.045);border:1.5px solid transparent;transition:.15s;
}
.icon-pick button.on{border-color:var(--accent);background:var(--surface);transform:translateY(-1px)}

@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---- 8.7 取景器（全局背景 / 主卡背景 / 语录图片共用） ---- */
.framer-root{position:fixed;top:0;right:0;bottom:0;left:0;z-index:110;display:none}
.framer-root.open{display:block}
.framer-back{
  position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(10,12,18,.6);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  animation:fade .2s ease;
}
.framer-panel{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(440px,92vw);max-height:94vh;overflow-y:auto;
  background:var(--surface);border-radius:22px;padding:16px;
  box-shadow:0 30px 80px -24px rgba(10,14,24,.6);
  animation:pop .2s ease;
}
.framer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.framer-head h3{font-size:16.5px;font-weight:750;letter-spacing:-.2px}

/* 舞台就是「最终看到的那块区域」：比例与真实位置一致，
   图片在里面拖动/缩放，所见即所得 */
.framer-stage{
  position:relative;margin:0 auto;border-radius:14px;overflow:hidden;
  background:#0E1016;touch-action:none;user-select:none;
  cursor:grab;
}
.framer-stage.dragging{cursor:grabbing}
/* 页面背景的真实效果：清晰层四周由同图放大模糊补边，取景时也照这个显示 */
.framer-blur{
  position:absolute;top:-6%;right:-6%;bottom:-6%;left:-6%;
  background-position:50% 50%;background-size:cover;background-repeat:no-repeat;
  filter:blur(18px) saturate(1.08);opacity:.6;
}
.framer-img{
  position:absolute;top:0;right:0;bottom:0;left:0;
  background-repeat:no-repeat;background-position:50% 50%;background-size:cover;
  pointer-events:none;will-change:transform;
  -webkit-user-drag:none;user-select:none;
}
.framer-frame{
  position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9);
}
.framer-frame .grid{
  position:absolute;top:0;right:0;bottom:0;left:0;
  background-image:
    repeating-linear-gradient(to right,rgba(255,255,255,.16) 0 1px,transparent 1px 33.333%),
    repeating-linear-gradient(to bottom,rgba(255,255,255,.16) 0 1px,transparent 1px 33.333%);
}
.fr-hint{
  position:absolute;left:0;right:0;bottom:7px;text-align:center;
  font-size:10.5px;color:rgba(255,255,255,.66);pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.7);
}
.framer-modes{display:flex;gap:8px;margin-top:12px}
.framer-modes button{
  flex:1;height:36px;border-radius:11px;font-size:12.5px;
  background:var(--surface-2);border:1px solid transparent;color:var(--ink2);
  transition:.15s;
}
.framer-modes button.on{background:var(--accent);color:#fff;font-weight:650}
.framer-zoom{display:flex;align-items:center;gap:10px;margin-top:12px}
.framer-zoom>span{font-size:11.5px;color:var(--muted);flex:0 0 auto}
.framer-zoom input[type=range]{flex:1;min-width:0}
.framer-zoom b{font-size:11.5px;color:var(--accent);min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.framer-zoom.is-off{opacity:.45}
.framer-tip{font-size:10.5px;color:var(--ink-soft);margin-top:10px;line-height:1.6}

/* ---- 8.7 轻提示 ---- */#toast{
  position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,14px);
  z-index:120; padding:11px 17px; border-radius:13px;
  display:inline-flex; align-items:center; gap:10px;
  font-size:12.5px; line-height:1; color:#fff; white-space:nowrap;
  background:rgba(20,24,34,.9);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  box-shadow:0 12px 30px -10px rgba(16,20,30,.55);
  opacity:0; pointer-events:none;
  transition:opacity .24s ease, transform .24s cubic-bezier(.22,.9,.3,1);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* 提示条里的动作按钮（撤销删除等），只在传了动作时才出现 */
#toast .t-act{
  -webkit-appearance:none; appearance:none;
  border:0; margin:0; padding:5px 11px; border-radius:9px;
  font:inherit; font-size:12px; font-weight:600; color:#fff;
  background:rgba(255,255,255,.18); cursor:pointer;
}
#toast .t-act:hover{background:rgba(255,255,255,.3)}
#toast .t-act:active{transform:scale(.96)}
#toast.show{pointer-events:auto}
@media (min-width:960px){ #toast{bottom:42px} }

/* ==========================================================================
   9. 增量样式：日程背景图 / 时间块拉伸 / 语录
   ========================================================================== */

/* 表体原本用 repeating-gradient 画等高横线；现在横线按时间块逐条画在列上 */
.grid-body{background-image:none}

/* ---- 9.1 日程项背景图（未设置时完全沿用原样式） ---- */
.ev.has-img{
  background-size:cover;
  background-position:center;
  border-left-color:rgba(255,255,255,.72);
  color:#fff;
}
.ev.has-img::before{
  content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,10,16,.22) 0%,rgba(8,10,16,.42) 55%,rgba(8,10,16,.66) 100%);
}
.ev.has-img .ev-t,
.ev.has-img .ev-hm,
.ev.has-img .ev-rep{position:relative;z-index:1;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.ev.has-img .ev-hm{opacity:.92}
.ev.has-img .ev-badge{z-index:2}
.ev.has-img.st-absent .ev-t{text-decoration:line-through}

/* 详情弹窗里的图片选择 */
.img-pick{display:flex;align-items:center;gap:10px}
.img-thumb{
  width:58px;height:42px;border-radius:9px;flex:0 0 auto;
  background:rgba(17,20,28,.05) center/cover no-repeat;
  border:1px solid var(--line2);
  display:grid;place-items:center;font-size:10px;color:var(--ink-soft);
}
.img-thumb.empty{background-image:none}
.img-acts{display:flex;gap:7px;flex-wrap:wrap}
.img-acts .mini-btn{height:30px}

/* ---- 9.2 时间块拉伸 ---- */
.sp-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.sp-row{
  border:1px solid var(--line);border-radius:14px;padding:11px 12px 9px;
  background:var(--surface-soft);
}
.sp-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.sp-range{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px;display:flex;align-items:center;gap:3px}
.sp-range i{font-style:normal}
.sp-range em{font-style:normal;color:var(--muted);font-weight:500;margin-left:5px;font-size:11px}
.sp-fixed{font-weight:700}

/* 可点的切点：虚线下划线 + 小铅笔，暗示「这里能改」 */
.sp-edge{
  font:inherit;font-weight:700;color:var(--accent);
  padding:0 2px;border-bottom:1px dashed rgba(76,111,255,.5);
  transition:.15s;white-space:nowrap;
}
.sp-edge::after{
  content:"";display:inline-block;width:0;height:0;
  border-left:3.5px solid transparent;border-right:3.5px solid transparent;
  border-top:4px solid currentColor;
  margin-left:4px;vertical-align:2px;opacity:.7;
}
.sp-edge:hover{background:rgba(76,111,255,.1);border-bottom-style:solid}
.sp-edge.is-open{background:rgba(76,111,255,.14);border-bottom-style:solid;border-radius:5px 5px 0 0}

/* 展开后的切点调节行 */
.sp-adj{
  display:none;align-items:center;gap:7px;margin-top:9px;
  padding:7px 9px;border-radius:10px;
  background:rgba(76,111,255,.07);
}
.sp-adj.open{display:flex}
.sp-adj-lab{font-size:10.5px;color:var(--muted);flex:0 0 auto}
.sp-adj input{flex:1;min-width:0}
.sp-adj>b{
  font-size:11.5px;font-weight:700;color:var(--accent);
  flex:0 0 auto;width:42px;text-align:right;font-variant-numeric:tabular-nums;
}
.sp-nudge{
  width:24px;height:24px;flex:0 0 auto;border-radius:7px;
  display:grid;place-items:center;font-size:13px;line-height:1;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink2);
  transition:.14s;
}
.sp-nudge:hover{background:rgba(76,111,255,.1);color:var(--accent);border-color:rgba(76,111,255,.3)}
.sp-nudge:active{transform:scale(.92)}
.sp-ops{display:flex;gap:6px}
.sp-ops button{
  height:26px;padding:0 9px;border-radius:8px;font-size:11px;
  background:rgba(17,20,28,.05);color:var(--ink2);white-space:nowrap;
}
.sp-ops button:hover{background:rgba(76,111,255,.1);color:var(--accent)}
.sp-ops button:disabled{opacity:.35;pointer-events:none}

.sp-slider{display:flex;align-items:center;gap:9px;margin-top:4px}
.sp-slider>span{font-size:11px;color:var(--muted);width:26px;flex:0 0 auto}
.sp-slider input[type=range]{flex:1;height:22px;accent-color:var(--accent)}
.sp-slider b{
  font-size:11.5px;font-weight:700;color:var(--accent);
  width:46px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums;
}
.sp-note{font-size:10.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 10px}
.sp-panel .qb-tabs{margin-bottom:12px}
.sp-panel .qb-pane>*:last-child{margin-bottom:0}
.sp-resets{display:flex;gap:8px;margin-bottom:10px}
.sp-resets .btn{flex:1;height:38px;font-size:12px;border-radius:12px;padding:0 6px}

/* 拉伸面板要能边拖边看表格，所以背景只做轻微压暗、不加模糊 */
.sp-back{background:rgba(12,15,22,.16) !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
.sp-panel{max-height:70vh !important}

/* 设置面板的章节分隔 */
.sec-line{display:flex;align-items:center;gap:10px;margin:18px 0 11px;font-size:11px;color:var(--muted);letter-spacing:.6px}
.sec-line::after{content:"";flex:1;height:1px;background:var(--line2)}
.sec-line:first-child{margin-top:0}

/* 睡眠时间的两个时间按钮：整块可点，点开滚轮 */
.sleep-time{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:44px;border-radius:11px;
  border:1px solid var(--line2);background:var(--surface);
  font-size:16px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;
}
.sleep-time:active{background:var(--surface-2)}

/* ---- 9.3 语录 ---- */
.quote-card{
  position:relative;margin-top:18px;
  /* --q-pad  倍率模式的内边距倍数（px 模式下为 0）
     --q-padpx px 模式的单边内边距（倍率模式下为 0px）
     两者相加，一套 CSS 同时支持「1000%」和「260px」两种写法 */
  --q-fs:1; --q-pad:1; --q-padpx:0px;
  padding-top:calc(15px * var(--q-pad) + var(--q-padpx));
  padding-right:16px;
  padding-bottom:calc(12px * var(--q-pad) + var(--q-padpx) * .8);
  padding-left:16px;
  border-radius:18px;overflow:hidden;
  background:rgba(var(--card-rgb),var(--card-a,.78));border:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
  box-shadow:var(--shadow);
  transition:padding-top .18s ease,padding-bottom .18s ease;
  /* 极端高度下也别被内容撑破：长串英文/链接强制换行 */
  min-width:0;
}
/* 语录背景单独一层，缩放 / 位置只作用于这一层，不影响文字布局 */
.quote-card .qbg{
  position:absolute;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;
  background-size:cover;background-position:50% 50%;background-repeat:no-repeat;
  opacity:0;transition:opacity .25s ease;
  transform-origin:center center;
}
.quote-card.has-bg .qbg{opacity:1}
.quote-card .q-mark{
  position:absolute;left:9px;top:-4px;
  font-family:Georgia,"Times New Roman",serif;font-size:50px;line-height:1;
  color:rgba(76,111,255,.12);pointer-events:none;z-index:1;
}
.quote-card .q-text{
  position:relative;z-index:1;
  font-size:calc(13.5px * var(--q-fs));line-height:1.7;color:var(--ink2);
  letter-spacing:.2px;padding-left:16px;min-height:22px;
  overflow-wrap:anywhere;word-break:break-word;
  text-align:var(--q-align,left);
}
.quote-card .q-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.quote-card.q-align-center .q-text{text-align:center;padding-left:0}
.quote-card.q-align-right .q-text{text-align:right;padding-left:0}
.quote-card .q-src{font-size:10.5px;color:var(--muted);letter-spacing:.4px}
.quote-card .q-act{
  font-size:11px;color:var(--accent);padding:4px 9px;border-radius:8px;
  background:rgba(76,111,255,.08);transition:.15s;
}
.quote-card .q-act:hover{background:rgba(76,111,255,.14)}
/* 宽屏改成横向一条：语录在左，来源和换一条贴在右侧，避免大片空白 */
@media (min-width:960px){
  .quote-card{
    display:flex;align-items:center;gap:18px;
    padding-top:calc(16px * var(--q-pad) + var(--q-padpx));
    padding-right:22px;
    padding-bottom:calc(13px * var(--q-pad) + var(--q-padpx) * .82);
    padding-left:22px;
  }
  .quote-card .q-text{flex:1;margin:0;font-size:calc(14.5px * var(--q-fs));padding-left:18px}
  .quote-card .q-foot{margin:0;flex:0 0 auto;gap:14px}
  .quote-card .q-mark{left:14px;top:50%;transform:translateY(-52%);font-size:56px}
}

/* ---- 高卡片（单边内边距 ≥ 120px，约 800% 以上）----
   高度拉大后内容会贴在上边缘，这里改成垂直居中 + 引号放大，
   空出来的地方留给背景图，看起来是「一张海报」而不是「一条被拉长的横线」。 */
.quote-card.is-tall{display:flex;flex-direction:column;justify-content:center}
.quote-card.is-tall .q-text{flex:0 0 auto;font-size:calc(14.5px * var(--q-fs));line-height:1.85}
.quote-card.is-tall .q-mark{font-size:clamp(64px,13vw,128px);left:4px;top:-14px}
.quote-card.is-tall .q-foot{margin-top:14px}
@media (min-width:960px){
  .quote-card.is-tall{flex-direction:row;align-items:center}
  .quote-card.is-tall .q-mark{left:10px;top:50%;transform:translateY(-52%)}
}
/* 窄屏兜底：再怎么调也只动上下内边距，横向留白不变，不会溢出屏幕 */
@media (max-width:559px){
  .quote-card{overflow-wrap:anywhere}
  .quote-card.is-tall .q-text{font-size:calc(14px * var(--q-fs))}
}

/* 设置里的语录配置 */
.q-set{display:flex;flex-direction:column;gap:9px}
.q-line{display:flex;align-items:center;gap:8px}
.q-line>span.q-lab{font-size:11px;color:var(--muted);width:32px;flex:0 0 auto}
.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.chips button{
  height:28px;padding:0 10px;border-radius:8px;font-size:11px;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink2);
  white-space:nowrap;transition:.15s;
}
.chips button.on{background:var(--accent);border-color:transparent;color:#fff;font-weight:650}
/* 铺满 / 完整：两个等宽按钮，跟在选图按钮下面 */
.chips.fit-row{margin-top:10px}
.chips.fit-row button{flex:1}

.q-manage{display:none;flex-direction:column;gap:9px;margin-top:2px}
.q-manage.on{display:flex}
.q-tabs{display:flex;gap:5px;background:rgba(17,20,28,.05);padding:3px;border-radius:10px}
.q-tabs button{flex:1;height:26px;border-radius:8px;font-size:11.5px;color:var(--muted)}
.q-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,20,30,.12);font-weight:650}
.q-list{
  max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;
  padding-right:2px;
}
.q-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--surface-soft)}
.q-txt{flex:1;min-width:0;font-size:11.5px;line-height:1.5;color:var(--ink2)}
.q-item.off .q-txt{color:#B4BAC8;text-decoration:line-through}
.q-del{width:22px;height:22px;border-radius:7px;color:var(--muted);font-size:14px;line-height:1;flex:0 0 auto}
.q-del:hover{background:rgba(244,63,94,.12);color:var(--absent)}
.q-empty{font-size:11.5px;color:var(--muted);padding:14px 0;text-align:center}
.q-add{display:flex;gap:7px}
.q-add input{
  flex:1;height:32px;border-radius:9px;border:1px solid var(--line2);
  background:var(--surface);padding:0 10px;font-size:12px;outline:none;
}
.q-add button{
  height:32px;padding:0 12px;border-radius:9px;font-size:12px;
  background:var(--accent);color:#fff;white-space:nowrap;
}
/* 小号开关，用在语录列表里 */
.sw.sm{width:34px;height:20px}
.sw.sm::after{width:14px;height:14px;top:3px;left:3px}
.sw.sm.on::after{transform:translateX(14px)}

/* ==========================================================================
   10. 增量：悬浮按钮避让 / 语录背景图 / 语录字体
   ========================================================================== */

/* ---- 10.1 让最后一块内容能滚出悬浮按钮 ---- */
/* 底部留白 = 按钮下边距 + 按钮高度 + 一点呼吸空间，滚到底时不会被压住 */
:root{ --fab-bottom:84px; --fab-size:52px; --fab-space:150px; }
@media (min-width:960px){ :root{ --fab-bottom:30px; --fab-size:56px; --fab-space:118px; } }

#view-home.active,
#view-notes.active{ padding-bottom:var(--fab-space); }
#gridWrap::after{ height:var(--fab-space); }

/* ---- 10.2 语录卡片：随机背景图 ---- */
.quote-card.has-bg{
  border-color:rgba(255,255,255,.16);
  background:rgba(255,255,255,.10);
}
.quote-card.has-bg::after{
  content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(8,10,16,.34) 0%,rgba(8,10,16,.52) 100%);
}
.quote-card.has-bg .q-text{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);z-index:1}
.quote-card.has-bg .q-src{color:rgba(255,255,255,.8);z-index:1}
.quote-card.has-bg .q-act{color:#fff;background:rgba(255,255,255,.18);z-index:1}
.quote-card.has-bg .q-act:hover{background:rgba(255,255,255,.3)}
.quote-card.has-bg .q-mark{color:rgba(255,255,255,.22);z-index:1}
.quote-card.has-bg .q-foot{position:relative;z-index:1}

/* ---- 10.3 设置：语录库 / 图片库 / 字体 三个页签 ---- */
.qb-tabs{display:flex;gap:5px;background:rgba(17,20,28,.05);padding:3px;border-radius:10px}
.qb-tabs button{flex:1;height:28px;border-radius:8px;font-size:11.5px;color:var(--muted);transition:.15s}
.qb-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,20,30,.12);font-weight:650}
.qb-pane{display:none;flex-direction:column;gap:9px}
.qb-pane.on{display:flex}

/* 图片库 */
.qb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.qb-cell{
  position:relative;padding-top:62%;border-radius:10px;overflow:hidden;
  background:rgba(17,20,28,.05) center/cover no-repeat;
  border:1.5px solid transparent;cursor:pointer;
}
.qb-cell.on{border-color:var(--accent)}
.qb-cell .mask{
  position:absolute;top:0;right:0;bottom:0;left:0;display:none;place-items:center;
  background:rgba(8,10,16,.5);color:#fff;font-size:10px;letter-spacing:.5px;
}
.qb-cell:not(.on) .mask{display:grid}
.qb-cell .del{
  position:absolute;right:2px;top:2px;width:20px;height:20px;border-radius:7px;
  background:rgba(8,10,16,.55);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center;
}
.qb-cell .del:hover{background:rgba(244,63,94,.9)}
.qb-cell .fr{
  position:absolute;left:2px;bottom:2px;height:20px;padding:0 7px;border-radius:7px;
  background:rgba(8,10,16,.55);color:#fff;font-size:10px;line-height:1;
  display:grid;place-items:center;
}
.qb-cell .fr:hover{background:rgba(76,111,255,.94)}
.qb-add{
  height:64px;border-radius:10px;border:1px dashed var(--line2);
  display:grid;place-items:center;font-size:11.5px;color:var(--muted);
  background:var(--surface-soft);cursor:pointer;transition:.15s;
}
.qb-add:hover{border-color:var(--accent);color:var(--accent)}
.qb-empty{
  padding:18px 10px;text-align:center;font-size:11.5px;color:var(--muted);
  border:1px dashed var(--line2);border-radius:10px;line-height:1.7;
}

/* 背景效果实时预览 */
.bg-preview{
  position:relative;height:116px;border-radius:12px;overflow:hidden;
  max-width:100%;
  border:1px solid var(--line2);
  background:linear-gradient(160deg,#EAEEF8,#F6F7FB 45%,#EDF0F7);
}
.bg-prev-img{
  position:absolute;top:0;right:0;bottom:0;left:0;
  background-size:contain;background-position:50% 50%;background-repeat:no-repeat;
  opacity:0;
}
.bg-prev-veil{
  position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transition:opacity .18s;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.58) 45%,rgba(255,255,255,.80));
}
.bg-prev-ui{
  position:absolute;left:12px;right:12px;bottom:11px;
  display:flex;gap:7px;opacity:0;transition:opacity .18s;
}
.bg-prev-ui i{
  flex:1;height:24px;border-radius:7px;
  background:rgba(var(--card-rgb),.85);box-shadow:0 1px 3px rgba(16,20,30,.05);
}
.bg-prev-tag{
  position:absolute;right:9px;top:9px;
  font-size:9.5px;letter-spacing:.4px;color:var(--muted);
  padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;transition:opacity .18s;
}
.bg-prev-empty{
  position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;
  font-size:11.5px;color:var(--ink-soft);letter-spacing:.3px;
}
.bg-preview.has-img .bg-prev-veil,
.bg-preview.has-img .bg-prev-tag{opacity:1}
.bg-preview.has-img .bg-prev-ui{opacity:.9}
.bg-preview.has-img .bg-prev-empty{display:none}
/* 宽屏面板更宽，预览给高一点，纵向信息多露一些 */
@media (min-width:960px){ .bg-preview{height:142px} }

/* 字体 */
.fn-group{font-size:10.5px;color:var(--muted);margin:2px 0 -2px;letter-spacing:.4px}
.fn-list{display:flex;flex-direction:column;gap:6px}
.fn-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;
  background:var(--surface-soft);border:1px solid transparent;cursor:pointer;transition:.15s;
}
.fn-item:hover{background:var(--surface-2)}
.fn-item.on{border-color:var(--accent);background:var(--surface)}
.fn-name{flex:1;min-width:0;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn-tag{font-size:9.5px;color:var(--muted);flex:0 0 auto;padding:1px 5px;border-radius:5px;background:rgba(17,20,28,.06)}
.fn-del{width:20px;height:20px;border-radius:6px;color:var(--muted);font-size:13px;flex:0 0 auto}
.fn-del:hover{background:rgba(244,63,94,.12);color:var(--absent)}

/* ==========================================================================
   14. 表格页：按住拖拽划出时间范围
   ========================================================================== */
.drag-ghost{
  position:absolute; left:2px; right:2px; z-index:6;
  border-radius:8px;
  border:1.5px dashed rgba(76,111,255,.55);
  background:rgba(76,111,255,.13);
  color:var(--accent);
  font-size:11px; font-weight:700; line-height:1;
  display:flex; align-items:flex-start; justify-content:center;
  padding-top:5px;
  pointer-events:none;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.2px;
}
body.is-dragging, body.is-dragging .gcol, body.is-dragging .ev{cursor:ns-resize}

/* ==========================================================================
   13. 新建日程：粘贴通知自动识别
   ========================================================================== */
.paste-box{
  margin:2px 0 14px;border-radius:13px;overflow:hidden;
  background:rgba(76,111,255,.05);
  border:1px solid rgba(76,111,255,.16);
}
.paste-box>summary{
  display:flex;align-items:center;gap:7px;
  padding:10px 12px;font-size:12px;font-weight:650;color:var(--accent);
  cursor:pointer;list-style:none;user-select:none;
}
.paste-box>summary::-webkit-details-marker{display:none}
.paste-box>summary::before{
  content:"";width:0;height:0;flex:0 0 auto;
  border-left:4px solid currentColor;
  border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
  transition:transform .18s ease;
}
.paste-box[open]>summary::before{transform:rotate(90deg)}
.paste-box>summary i{
  font-style:normal;font-size:9.5px;font-weight:500;
  color:var(--muted);margin-left:auto;letter-spacing:.2px;
}
.paste-inner{padding:0 12px 12px}
.paste-inner textarea{
  width:100%;min-height:86px;resize:vertical;
  padding:9px 10px;border-radius:10px;
  border:1px solid var(--line2);background:var(--surface);
  font-size:12.5px;line-height:1.55;color:var(--ink);
  font-family:inherit;
}
.paste-inner textarea::placeholder{color:var(--ink-soft)}
.paste-inner textarea:focus{
  outline:none;border-color:rgba(76,111,255,.45);
  box-shadow:0 0 0 3px rgba(76,111,255,.1);
}
/* 课表图片识别入口 / 进度 */
.ocr-pick{display:flex;gap:9px;align-items:flex-start;margin-top:9px}
.ocr-pick .mini-btn{flex:0 0 auto}
.ocr-pick>span{flex:1;font-size:10.5px;line-height:1.5;color:var(--muted)}
.ocr-prog{
  margin-top:8px;padding:7px 10px;border-radius:9px;
  background:rgba(76,111,255,.08);font-size:11px;color:var(--accent);
}
.ocr-prog.hide{display:none}
/* 识别结果预览（弹窗内的可编辑列表） */
.ocr-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ocr-item{border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--surface-soft)}
.ocr-item .oi-head{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.ocr-item .oi-head label{font-size:11.5px;font-weight:650;color:var(--ink2);display:flex;gap:6px;align-items:center;cursor:pointer}
.ocr-item .oi-head .miss-tag{margin-left:auto;font-size:9.5px;color:#B4720F}
html.dark .ocr-item .oi-head .miss-tag{color:#F0B95A}
.ocr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ocr-grid .f{display:flex;flex-direction:column;gap:3px}
.ocr-grid .f.wide{grid-column:1/-1}
.ocr-grid .f span{font-size:10px;color:var(--muted)}
.ocr-grid .inp{height:30px;font-size:12px;padding:0 8px}
.ocr-grid .f.miss .inp{border-color:rgba(244,63,94,.55)}
.ocr-grid .f.miss span::after{content:"（未识别，请手动补）";color:var(--absent)}
.ocr-foot{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.ocr-foot .until{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2)}
.ocr-foot .until input{flex:1;height:32px;border-radius:9px;border:1px solid var(--line2);padding:0 8px;font:inherit;font-size:12px;background:var(--surface);color:var(--ink)}

/* ==========================================================================
   12. 主页外观：主卡预览 / 卡片透明度 / 语录尺寸
   ========================================================================== */
/* 主卡与内容卡的描边分开控制 */
body.no-bd-hero .hero{border-color:transparent}
body.no-bd-card .trow,
body.no-bd-card .wk-day,
body.no-bd-card .anniv-item,
body.no-bd-card .quote-card{border-color:transparent}

/* 设置里的一行开关 */
.row-sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-sw>span{font-size:11.5px;color:var(--muted);letter-spacing:.2px}


.hero-prev{
  position:relative;height:104px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line2);
  --hp-a:1;
}
.hp-bg{
  position:absolute;top:0;right:0;bottom:0;left:0;
  background-image:linear-gradient(140deg,#4C6FFF 0%,#5B5BE8 48%,#7C5CFF 100%);
  background-size:cover;background-position:50% 50%;background-repeat:no-repeat;
  opacity:var(--hp-a);transition:opacity .18s;
}
.hp-txt{position:absolute;left:13px;right:13px;bottom:12px;color:#fff;line-height:1.3;z-index:1}
.hp-txt b{display:block;font-size:17px;font-weight:800;letter-spacing:-.5px}
.hp-txt span{font-size:10.5px;opacity:.85}
.hero-prev.is-faint .hp-txt{color:var(--ink)}
.hero-prev .hp-tag{
  position:absolute;right:8px;top:8px;z-index:1;
  font-size:9px;letter-spacing:.4px;padding:3px 7px;border-radius:6px;
  color:#fff;background:rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.hero-prev.is-faint .hp-tag{color:var(--ink2);background:var(--surface-soft)}

.q-slide{display:flex;align-items:center;gap:9px}
.q-slide>span{font-size:11px;color:var(--muted);flex:0 0 auto;width:54px}
.q-slide>input{flex:1;min-width:0}
.q-slide>b{
  font-size:11px;font-weight:650;color:var(--ink2);
  flex:0 0 auto;min-width:46px;text-align:right;font-variant-numeric:tabular-nums;
}
/* 卡片高度：滑块跨度 60–1000，光拖不好精调 → 补一排常用档位 + 一个手输框 */
.q-pad-row{display:flex;flex-direction:column;gap:7px;padding-left:63px}
.q-pad-preset button{
  font-size:10.5px;padding:3px 9px;border-radius:8px;
  background:rgba(17,20,28,.05);color:var(--muted);transition:.15s;
}
html.dark .q-pad-preset button{background:rgba(255,255,255,.07)}
.q-pad-preset button:hover{color:var(--accent)}
.q-pad-preset button.on{background:var(--accent);color:#fff}
.q-pad-cust{display:flex;gap:7px;align-items:center}
.q-pad-cust input{
  flex:1;min-width:0;height:34px;border-radius:10px;padding:0 10px;
  font-size:12px;color:var(--ink2);
  background:var(--surface-2);border:1px solid var(--line);
}
.q-pad-cust input:focus{outline:none;border-color:var(--accent)}
.q-pad-cust input.bad{border-color:var(--absent);background:rgba(244,63,94,.07)}
.q-pad-cust .btn{
  flex:0 0 auto;height:34px;padding:0 13px;font-size:12px;border-radius:10px;font-weight:650;
}
@media (max-width:559px){ .q-pad-row{padding-left:0} }

/* ==========================================================================
   11. 日程草稿条：未提交的输入随时可回到
   ========================================================================== */
.draft-bar{
  position:fixed; left:10px; right:10px; z-index:53;
  bottom:calc(76px + env(safe-area-inset-bottom,0px));
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:16px;
  background:var(--surface);
  -webkit-backdrop-filter:blur(20px) saturate(1.7);
  backdrop-filter:blur(20px) saturate(1.7);
  border:1px solid var(--line);
  box-shadow:0 14px 34px -14px rgba(16,20,30,.4);
  transform:translateY(calc(100% + 20px));
  opacity:0; pointer-events:none;
  transition:transform .3s cubic-bezier(.22,.9,.3,1), opacity .2s ease;
}
.draft-bar.show{transform:none;opacity:1;pointer-events:auto}
.db-ico{
  width:30px;height:30px;flex:0 0 auto;border-radius:10px;
  display:grid;place-items:center;font-size:14px;
  background:rgba(76,111,255,.1);color:var(--accent);
}
.db-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.db-main b{
  font-size:13px;font-weight:650;letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.db-main span{
  font-size:10.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.db-go{
  flex:0 0 auto;height:30px;padding:0 12px;border-radius:9px;
  font-size:12px;font-weight:650;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.db-go:active{transform:scale(.96)}
.db-x{
  flex:0 0 auto;width:26px;height:26px;border-radius:8px;
  font-size:13px;line-height:1;color:var(--muted);transition:.15s;
}
.db-x:hover{background:rgba(244,63,94,.1);color:var(--absent)}
.db-x.armed{
  width:auto;padding:0 9px;font-size:11px;
  background:var(--absent);color:#fff;
}

/* 有草稿时，按钮和内容都要让位，避免叠在一起 */
body.has-draft #fab{ bottom:calc(150px + env(safe-area-inset-bottom,0px)); }
body.has-draft #view-home.active,
body.has-draft #view-notes.active{ padding-bottom:calc(var(--fab-space) + 68px); }

@media (min-width:960px){
  .draft-bar{
    left:calc(var(--rail) + 24px); right:104px; bottom:22px;
    border-radius:14px; padding:10px 14px;
  }
  body.has-draft #fab{bottom:30px}
  body.has-draft #view-home.active,
  body.has-draft #view-notes.active{padding-bottom:calc(var(--fab-space) + 62px)}
}
/* ==========================================================================
   移动端优先：一切都按「单手 + 拇指」来量，桌面端再各退一步
   —— 触控目标 ≥48px、输入字号 ≥16px（16 以下 iOS 会自动放大整页）、
      一屏只留一个主操作（底部常驻的「保存」）
   放在样式表最后：确保能盖住前面的桌面端基础尺寸
   ========================================================================== */
@media (max-width:959px){
  .field{margin-bottom:18px}
  .field>label{font-size:12.5px;margin-bottom:8px}
  .field-row.two{gap:14px}
  .mb-head{margin-bottom:16px}
  .mb-head h3{font-size:18px}
  .icon-btn.sm{width:38px;height:38px}

  /* 16px 起步，避免 iOS 聚焦时把整页放大 */
  .inp,.mb-panel .inp{font-size:16px;padding:13px 14px;min-height:50px;border-radius:14px}
  textarea.inp{min-height:88px;line-height:1.6}
  .mb-panel .inp::placeholder{font-size:14px}

  .mb-panel .btn,.mb-foot .btn{height:52px;font-size:15.5px;border-radius:16px}
  /* 内容不满一屏时也把主操作顶到底部，别让它吊在半空 */
  .mb-panel{display:flex;flex-direction:column}
  .mb-foot{
    flex:0 0 auto;position:sticky;bottom:0;z-index:3;
    margin:auto -18px 0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--surface);box-shadow:0 -12px 26px -16px rgba(16,20,30,.45);
  }
  .mb-foot .btn.danger{flex:0 0 auto;min-width:88px}

  .dt-dlabel{height:54px;font-size:16.5px;border-radius:15px;padding:0 15px}
  .dt-cal{width:54px;height:54px;border-radius:15px}
  .dt-time .dt-step{flex:0 0 30px;height:50px;font-size:19px}
  .dt-time{gap:4px;padding:0 5px}
  .dt-tval{font-size:16px;letter-spacing:.2px}
  .dt-time.is-off{opacity:.45;pointer-events:none}

  .row-sw{min-height:50px;font-size:14.5px}
  .sw{width:50px;height:29px}
  .sw::after{width:23px;height:23px;top:3px;left:3px}
  .sw.on::after{transform:translateX(21px)}
  .chips button{min-height:42px;padding:0 15px;font-size:13.5px}
  .seg button{min-height:48px;font-size:13px}
  .more-box>summary{padding:15px 14px;font-size:13.5px}
  .more-inner{padding:2px 14px 16px}
  .mb-panel .hint{font-size:11.5px;line-height:1.6}
}

/* ==========================================================================
   99. 移动端统一设计语言（≤959px）：卡片化 · 留白 · 触控尺寸 · 三页一致
   —— 仅作用于移动端，桌面端（≥960px）保持原样，避免任何回归。
   ========================================================================== */
@media (max-width:959px){
  /* ---- 底部弹层：抓手 + 头部 + 卡片分组（脚栏/输入框字号由下方既有规则处理，勿重复覆盖） ---- */
  .mb-panel{ background:var(--bg) }
  .mb-grip{ width:40px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 14px;flex:0 0 auto }
  .mb-head{ gap:12px;margin-bottom:16px }
  .mb-head h3{ font-size:18px;font-weight:780;letter-spacing:-.3px }
  .mb-head-ph{ width:40px;flex:0 0 40px }
  .icon-btn.round{ width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink2) }
  .icon-btn.round svg{ width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round }
  .icon-btn.round:active{ transform:scale(.92);background:var(--line2) }

  /* 卡片分组：白卡浮在浅灰弹层上，告别“老旧表单”观感 */
  .fcard{ background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 15px 3px;margin-bottom:13px;
          box-shadow:0 1px 2px rgba(16,20,30,.03),0 10px 26px -18px rgba(16,20,30,.22) }
  .fcard .field:last-child{ margin-bottom:15px }
  .fcard-accent{ background:linear-gradient(180deg,rgba(76,111,255,.08),rgba(124,92,255,.05));border-color:rgba(76,111,255,.22) }

  /* 字段间距微调（输入框字号沿用下方既有的 16px，避免 iOS 聚焦时整页放大） */
  .field{ margin-bottom:14px }
  .field>label{ font-size:12px;font-weight:600;letter-spacing:.1px;margin-bottom:8px }
  .field-row.two{ gap:12px }

  /* 更多选项：改成与上方卡片一致的白色抽屉卡，消除“割裂” */
  .more-box{ background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0 0 13px }
  .more-box>summary{ background:transparent;border:0;padding:15px 15px;font-size:13.5px;font-weight:650;color:var(--ink2) }
  .more-box[open]>summary{ border-bottom:1px solid var(--line);border-radius:0 }
  .more-inner{ background:transparent;border:0;padding:4px 15px 16px }
  .more-inner .field:first-child{ margin-top:8px }

  /* 智能识别卡内的粘贴框顺手规整 */
  .fcard-accent .paste-box{ background:transparent;border:0 }
  .fcard-accent .paste-box>summary{ background:rgba(76,111,255,.10);border:1px solid rgba(76,111,255,.22);border-radius:13px;color:var(--accent);padding:13px 14px }

  /* ---- 表格页：轻提示 + 表头“+” + 事件卡现代化 ---- */
  .grid-hint{ display:flex;align-items:center;gap:8px;margin:2px 2px 12px;padding:10px 13px;border-radius:13px;
              background:rgba(76,111,255,.09);color:var(--accent);font-size:12.5px;font-weight:600;line-height:1.4 }
  .grid-hint svg{ width:16px;height:16px;flex:0 0 auto;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round }
  .gh-day{ position:relative;gap:3px }
  .gh-add{ position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:7px;display:grid;place-items:center;
           font-size:15px;line-height:1;font-weight:700;color:var(--accent);background:rgba(76,111,255,.12) }
  .gh-day:active .gh-add{ background:rgba(76,111,255,.28) }
  /* 事件卡样式沿用既有移动端微调，避免窄列下标题被挤得更厉害 */

  /* ---- 记事页：日历卡 + 编辑器抽屉 ---- */
  .cal-card{ border-radius:20px;padding:14px 12px 16px }
  .cal-cell{ border-radius:13px;border:1px solid var(--line);background:var(--surface) }
  .cal-cell.is-sel{ border-color:transparent;box-shadow:0 0 0 2px var(--accent);background:rgba(76,111,255,.08) }
  .cal-cell.is-marked{ border-color:transparent;box-shadow:inset 0 0 0 2px rgba(76,111,255,.35) }
  .cal-cell.is-today .cc-num{ color:var(--accent);font-weight:800 }
  .cal-wd{ font-size:11px;color:var(--muted);margin-bottom:6px }
  .ne-grip{ width:40px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 12px;flex:0 0 auto }
  .ne-head{ margin-bottom:14px;gap:10px }
  .ne-title{ font-size:18px;padding:10px 2px 12px }
  .ne-body{ min-height:150px;font-size:15px;line-height:1.7 }
  .ne-tagbox{ padding-top:14px;gap:11px }
  .ne-swatches{ gap:10px }
  .ne-swatches button{ width:30px;height:30px }
  .ne-tagrow .lbl{ flex-basis:56px;width:56px }
  /* 长内容滚动时，完成按钮始终贴在抽屉底部 */
  .ne-foot{
    position:sticky;bottom:0;z-index:2;
    background:var(--surface);
    margin-top:4px;padding:10px 0 4px;
  }
  .btn.ne-done{height:44px;padding:0 26px;border-radius:13px;font-size:14.5px;font-weight:700}
  .ne-empty{ padding:56px 16px;font-size:13.5px }

  /* 搜索框关闭按钮：手机上显示「取消」，字号/热区更大更易点 */
  .search-esc{ font-size:12px;padding:5px 11px }

  /* ---- 性能：移动端禁用毛玻璃。backdrop-filter 在 WebView 上很耗性能，
       滚动时背后内容每帧变化都要重算 blur，是卡顿主因 ---- */
  .tabbar{ -webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface) }
  .grid-head{ -webkit-backdrop-filter:none;backdrop-filter:none }
  .icon-btn{ -webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface) }
}

/* 桌面端不显示移动端专属的提示条与表头“+” */
@media (min-width:960px){
  .grid-hint{ display:none }
  .gh-add{ display:none }
  .mb-grip,.ne-grip{ display:none }
}

/* ==========================================================================
   100. 表格卡片补充信息 + 日程详情弹窗
   ========================================================================== */

/* 卡片：标题最多两行，下面补一行地点；更矮的卡片优先保标题+地点，不显示时间 */
.ev-t{ -webkit-line-clamp:2 }
.ev.is-mini .ev-t{ -webkit-line-clamp:1 }
.ev-loc{
  margin-top:3px;font-size:10px;line-height:1.25;opacity:.74;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:4px;
}
.ev-loc::before{
  content:"";flex:0 0 auto;width:4px;height:4px;border-radius:50%;
  background:currentColor;opacity:.55;
}
.ev.is-mini .ev-loc{ display:none }
.ev.is-short .ev-hm{ display:none }
@media (max-width:959px){
  .ev-loc{font-size:9.5px;margin-top:2px}
}

/* 居中详情卡：不跟随底部 sheet，手机上也是中间一块 */
.mb-panel.ev-detail{
  top:50%;left:50%;right:auto;bottom:auto;
  transform:translate(-50%,-50%);
  width:min(430px, calc(100vw - 30px));
  height:auto;max-height:min(84vh, 620px);
  padding:0;border-radius:22px;overflow:hidden;
  animation:evdIn .2s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 26px 70px -24px rgba(10,14,24,.65);
}
@media (max-width:959px){
  .mb-panel.ev-detail{
    top:50%;height:auto;max-height:82vh;border-radius:22px;padding:0;
  }
}
@keyframes evdIn{
  from{opacity:0;transform:translate(-50%,-48%) scale(.97)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.evd-top{
  position:relative;flex:0 0 auto;padding:18px 20px 16px;
  background:
    radial-gradient(120% 120% at 100% 0%, hsl(var(--h) 88% 90% / .9), transparent 60%),
    linear-gradient(135deg, hsl(var(--h) 92% 96.5%), var(--surface) 72%);
  border-bottom:1px solid var(--line);
}
html.dark .evd-top{
  background:
    radial-gradient(120% 120% at 100% 0%, hsl(var(--h) 52% 28% / .65), transparent 62%),
    linear-gradient(135deg, hsl(var(--h) 35% 16%), var(--surface) 78%);
}
.evd-date{font-size:11.5px;letter-spacing:.4px;color:var(--muted);font-weight:600;padding-right:38px}
.evd-close{position:absolute;top:14px;right:14px}
.evd-title{
  margin:7px 0 0;font-size:21px;line-height:1.3;font-weight:780;letter-spacing:-.35px;
  color:var(--ink);word-break:break-word;padding-right:4px;
}
.evd-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.evd-chip{
  display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:8px;
  font-size:10.5px;font-weight:650;color:var(--ink2);
  background:var(--surface-soft);border:1px solid var(--line2);
  font-variant-numeric:tabular-nums;
}
.evd-chip.time{color:hsl(var(--h) 50% 30%);background:hsl(var(--h) 80% 93%);border-color:hsl(var(--h) 60% 85%)}
html.dark .evd-chip.time{color:hsl(var(--h) 70% 80%);background:hsl(var(--h) 35% 22%);border-color:hsl(var(--h) 40% 30%)}
.evd-chip.imp{color:#9A5B00;background:#FFF4D6;border-color:#F5DE9B}
html.dark .evd-chip.imp{color:#F3C56A;background:#2C2414;border-color:#4A3A18}
.evd-body{
  flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 20px 6px;
  -webkit-overflow-scrolling:touch;
}
.evd-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line2);align-items:flex-start}
.evd-row:last-child{border-bottom:0}
.evd-row .k{flex:0 0 42px;font-size:10.5px;color:var(--muted);letter-spacing:.4px;padding-top:2px}
.evd-row .v{flex:1;min-width:0;font-size:13px;line-height:1.55;color:var(--ink);word-break:break-word}
.evd-row .v.soft{color:var(--ink2)}
.evd-note{
  margin:4px 0 10px;padding:11px 13px;border-radius:12px;
  background:var(--surface-soft);border:1px solid var(--line2);
  font-size:12.5px;line-height:1.65;color:var(--ink2);white-space:pre-wrap;word-break:break-word;
}
.evd-empty{font-size:12px;color:var(--muted);padding:8px 0}
.evd-foot{
  flex:0 0 auto;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;gap:10px;
}
.evd-del{
  border:0;background:transparent;color:#D23A48;font:inherit;font-size:11.5px;
  padding:7px 4px;cursor:pointer;border-radius:8px;
}
.evd-del.armed{color:#fff;background:#D23A48;padding:7px 10px;font-weight:700}
.evd-del-group{color:var(--muted);font-size:11px}
.evd-foot .spacer{flex:1}
.evd-foot .btn{height:40px;min-width:82px;border-radius:11px;font-size:12.5px;flex:0 0 auto}
.evd-foot .btn.primary{min-width:104px}
@media (max-width:959px){
  .evd-top{padding:16px 18px 14px}
  .evd-title{font-size:19px}
  .evd-body{padding:14px 18px 4px}
  .evd-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
}

/* 重复组整组编辑：默认整组，可切换只改一条 */
.grp-edit{flex-wrap:wrap;align-items:flex-start}
.grp-edit .tx{flex:1 1 150px}
.grp-hint{color:var(--muted);font-size:10.5px}
.grp-row .mini-btn{
  color:var(--ink2);background:var(--surface);border:1px solid var(--line);
  font-weight:600;height:30px;
}
.grp-row .mini-btn.on{
  color:#fff;background:var(--accent);border-color:transparent;
  box-shadow:0 4px 12px -6px rgba(76,111,255,.8);
}
.dt-date button:disabled,.dt-time button:disabled{opacity:.45;cursor:not-allowed}


/* OCR 结果独立浮层：盖在新建日程之上，关掉就回到原表单 */
.ocr-root{z-index:96}
.ocr-raw{margin:0 0 10px;font-size:11px;color:var(--muted)}
.ocr-raw summary{cursor:pointer;padding:6px 0;user-select:none}
.ocr-raw pre{
  margin:6px 0 0;padding:10px 12px;max-height:110px;overflow:auto;
  white-space:pre-wrap;word-break:break-word;line-height:1.55;
  background:var(--surface-soft);border:1px solid var(--line2);border-radius:10px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:var(--ink2);
}

/* 自定义文字颜色：连同表格卡片、主页主卡一起生效 */
#view-grid.type-custom-ink .ev{color:var(--type-custom-ink)}
#view-home.type-custom-ink .hero:not(.is-faint){color:var(--type-custom-ink)}
#view-home.type-custom-ink .hero:not(.is-faint) .hero-eyebrow{color:var(--type-custom-ink)}
#view-home.type-custom-ink .hero:not(.is-faint) .hero-over{color:var(--type-custom-ink)}
#view-home.type-custom-ink .quote-card.has-bg .q-text{color:var(--type-custom-ink);text-shadow:0 1px 6px rgba(0,0,0,.35)}
#view-home.type-custom-ink .quote-card.has-bg .q-src{color:var(--type-custom-ink)}

/* 文字外观 / 字体库 */
.type-list{display:flex;flex-direction:column;gap:10px;margin:2px 0 4px}
.type-row{
  padding:12px 14px;border-radius:14px;
  background:var(--surface-soft);border:1px solid var(--line2);
}
.type-boot{margin-top:10px}
.type-head{display:flex;align-items:center;gap:9px;min-height:26px}
.type-head b{font-size:13px;font-weight:700;letter-spacing:-.1px}
.type-sub{margin-left:auto;font-size:10.5px;color:var(--muted)}
.type-auto{
  margin-left:auto;height:26px;padding:0 9px;border-radius:8px;
  font-size:10.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line2);
}
.type-auto.on{color:var(--accent);border-color:rgba(76,111,255,.35);background:rgba(76,111,255,.08)}
.type-color{
  width:28px;height:28px;padding:0;border:1px solid var(--line2);border-radius:9px;
  background:var(--c,var(--surface));cursor:pointer;-webkit-appearance:none;appearance:none;
}
.type-color-btn{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.type-color::-webkit-color-swatch-wrapper{padding:3px}
.type-color::-webkit-color-swatch{border:0;border-radius:6px}
.type-line{display:flex;align-items:center;gap:10px;margin-top:8px}
.type-line>span{flex:0 0 30px;font-size:11px;color:var(--muted)}
.type-line .chips{flex:1;min-width:0}
.type-size button,.type-sizes button{flex:0 0 auto;padding:0 10px;height:28px;font-size:11px}
.type-font{flex:1;min-width:0;height:36px;font-size:12px;padding:0 30px 0 10px}
.type-lib-empty{font-size:11.5px;color:var(--muted);line-height:1.6;padding:8px 2px}
.type-lib-list{display:flex;flex-direction:column;gap:7px;margin-bottom:9px}
.type-lib-item{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;
  background:var(--surface-soft);border:1px solid var(--line2);
}
.tl-name{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-tag{font-size:9.5px;color:var(--muted);flex:0 0 auto}
.tl-tag.bad{color:var(--absent)}
.tl-del{
  flex:0 0 auto;height:26px;padding:0 8px;border-radius:7px;
  font-size:10.5px;color:var(--absent);background:rgba(244,63,94,.08);
}
.type-font-add{margin-top:2px}
@media (max-width:959px){
  .type-row{padding:11px 12px}
  .type-line>span{flex-basis:28px}
  .type-size button,.type-sizes button{padding:0 8px;height:27px;font-size:10.5px}
}

/* 设置分类导航 + 普通/简洁模式 */
.set-modes{margin:-2px 0 10px}
.set-mode-desc{margin:7px 0 0;font-size:10.5px;line-height:1.55;color:var(--muted)}
.set-nav{
  position:sticky;top:0;z-index:7;display:flex;gap:7px;align-items:center;
  overflow-x:auto;white-space:nowrap;padding:9px 0 8px;margin:0 0 4px;
  background:var(--surface);border-bottom:1px solid var(--line);
  -ms-overflow-style:none;scrollbar-width:none;
}
.set-nav::-webkit-scrollbar{display:none}
.set-nav button{
  flex:0 0 auto;height:30px;padding:0 11px;border-radius:9px;
  font-size:11.5px;color:var(--muted);background:var(--surface-soft);border:1px solid var(--line2);
}
.set-nav button.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.set-anchor{display:block;height:1px;scroll-margin-top:58px}
.adv-section{display:block}
.mb-panel.set-simple .adv-section{display:none}
.mb-panel.set-simple .set-nav [data-simple-hide]{display:none}
@media (max-width:959px){
  .set-nav{margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}
  .set-anchor{scroll-margin-top:62px}
}
@media (min-width:960px){
  .set-nav{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
}

/* 纪念日：公历 / 农历 */
.anniv-cal-row{display:flex;align-items:center;gap:10px}
.anniv-cal-row>span{flex:0 0 52px;font-size:11px;color:var(--muted)}
.anniv-cal-row .chips{flex:1;min-width:0}
.anniv-lunar{display:none;flex-direction:column;gap:7px}
.anniv-lunar.on{display:flex}
.anniv-lunar-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.anniv-lunar select{
  flex:1;min-width:86px;height:36px;border-radius:10px;padding:0 8px;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-size:12px;
}
.anniv-leap{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
  font-size:11px;color:var(--ink2);cursor:pointer;
}
.anniv-leap input{width:16px;height:16px;accent-color:var(--accent)}

/* 文件选择控件只覆盖自己的标签，避免全屏隐形 input 抢走点击 */
.qb-add{position:relative;overflow:hidden}
.type-font-add{position:relative;overflow:hidden;display:block}

/* 文字外观：实时预览 + 模块切换 + 字号滑杆 + 三级文字颜色 */
.type-preview{
  padding:14px 15px;border-radius:15px;margin:2px 0 12px;
  background:var(--surface-soft);border:1px solid var(--line2);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;gap:4px;overflow:hidden;
}
.type-preview .tp-tag{
  align-self:flex-start;font-size:9.5px;padding:2px 7px;border-radius:6px;
  color:var(--accent);background:rgba(76,111,255,.1);margin-bottom:1px;
}
.type-preview b{font-size:calc(17px * var(--tp-scale,1));line-height:1.35;color:var(--tp-ink,var(--ink));letter-spacing:-.2px}
.type-preview .tp-meta{font-size:calc(11.5px * var(--tp-scale,1));color:var(--tp-ink2,var(--ink2))}
.type-preview .tp-body{margin:2px 0 0;font-size:calc(12.5px * var(--tp-scale,1));line-height:1.55;color:var(--tp-muted,var(--muted))}
.type-mod-seg{margin:0 0 10px}
.type-mod-seg button{flex:1;height:34px;font-size:12px;border-radius:10px}
.type-mod-panel{display:none}
.type-mod-panel.on{display:block}
.type-line .type-slider{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.type-slider input[type=range]{flex:1;min-width:0;width:auto}
.type-slider b{flex:0 0 44px;text-align:right;font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.type-colors{display:flex;flex-direction:column;gap:8px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line2)}
.type-color-row{display:flex;align-items:center;gap:9px}
.type-color-row>span{flex:0 0 58px;font-size:11px;color:var(--muted)}
.type-color-row .type-color{width:28px;height:28px;flex:0 0 auto}
.type-color-row .type-auto{margin-left:auto}
@media (max-width:959px){
  .type-color-row>span{flex-basis:56px}
}

/* 侧边栏样式：大小滑杆 + 文字/图标取色 + 实时预览 */
.nav-preview{display:flex;align-items:center;gap:14px;padding:12px;border-radius:15px;margin-top:8px;background:var(--surface-soft);border:1px solid var(--line2)}
.nav-prev-rail{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;flex:0 0 auto;padding:10px 7px;border-radius:14px;background:rgba(var(--card-rgb),.55);border:1px solid var(--line)}
.np-btn{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:6px 0;border-radius:10px;color:var(--muted);font-size:var(--np-text,10px);transition:.16s}
.np-btn svg{width:var(--np-icon,21px);height:var(--np-icon,21px);color:var(--np-icon-color,currentColor);stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.np-btn.on{color:var(--accent);background:rgba(76,111,255,.1)}
.nav-preview.nav-text-custom .np-btn,.nav-preview.nav-text-custom .np-btn.on{color:var(--np-ink)}
.nav-prev-tip{font-size:11px;color:var(--muted);line-height:1.65}

/* 背景清晰模式：去掉模糊铺底、柔光罩与页面内的毛玻璃 */
html.bg-clear #bgBlur, html.bg-clear #bgVeil{display:none!important}
html.bg-clear #bgImage{filter:none!important;opacity:1!important}
html.bg-clear #view-home *, html.bg-clear #view-grid *, html.bg-clear #view-notes *{
  -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
}
html.bg-clear .rail, html.bg-clear .tabbar{
  -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
}
.bg-preview.is-clear .bg-prev-veil{display:none}
.bg-preview.is-clear .bg-prev-img{opacity:1!important;filter:none!important}
/* 记事模块透明度 */
#view-notes .cal-card{background:rgba(var(--card-rgb),var(--notes-cal-a,.78))}
#view-notes .note-editor{background:rgba(var(--card-rgb),var(--notes-editor-a,.92))}
/* 表格顶栏隐藏 + 悬浮周导航 */
#view-grid{position:relative}
#view-grid.grid-chrome-hide .gv-head,
#view-grid.grid-chrome-hide .grid-head,
#view-grid.grid-chrome-hide .grid-hint{display:none}
.grid-mini{
  display:none;position:absolute;top:8px;right:12px;z-index:35;
  align-items:center;gap:5px;padding:5px 7px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:0 8px 22px -12px rgba(10,14,24,.45);
}
#view-grid.grid-chrome-hide .grid-mini{display:flex}
.grid-mini button{
  height:28px;min-width:28px;padding:0 7px;border-radius:8px;
  font-size:11px;color:var(--ink2);background:var(--surface-soft);
}
.grid-mini button:active{transform:scale(.95)}
.grid-mini button svg{width:14px;height:14px;display:block;margin:auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.grid-mini span{font-size:11px;color:var(--ink2);padding:0 3px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:959px){ .grid-mini{top:6px;right:8px} }

/* 设置首页 / 分类卡片 / 子页面 */
.mb-panel.settings-panel{overflow-y:auto}
@media (min-width:960px){ .mb-panel.settings-panel{width:680px;max-height:88vh} }
.set-head{gap:10px;align-items:flex-start;margin-bottom:12px}
.set-head-tx{flex:1;min-width:0;padding-top:1px}
.set-head-tx h3{font-size:17px;font-weight:750;letter-spacing:-.2px}
.set-head-tx span{display:block;margin-top:3px;font-size:10.5px;line-height:1.45;color:var(--muted)}
.set-back{display:none;flex:0 0 auto}
.settings-panel.pane-open .set-back{display:grid}
.set-home{display:flex;flex-direction:column;gap:14px}
.settings-panel.pane-open .set-home{display:none}
.set-hero{display:flex;align-items:center;gap:12px;padding:2px 0}
.set-hero-mark{
  width:42px;height:42px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 10px 24px -12px rgba(76,111,255,.8);
}
.set-hero-mark svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.set-hero b{display:block;font-size:16px;font-weight:750;letter-spacing:-.2px}
.set-hero small{display:block;margin-top:2px;font-size:10.5px;color:var(--muted)}
.set-mode-card{padding:13px 14px;border-radius:16px;border:1px solid var(--line2);background:var(--surface-soft)}
.set-mode-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.set-mode-top b{font-size:12.5px;font-weight:700}
.set-mode-top span{font-size:10.5px;color:var(--muted);line-height:1.5}
#setModeSeg{width:100%}
#setModeSeg button{flex:1;height:36px;font-size:12px;border-radius:10px}
.set-cats{display:flex;flex-direction:column;gap:8px}
.set-cat{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:12px;border-radius:15px;border:1px solid var(--line2);
  background:var(--surface-soft);transition:background .15s,border-color .15s,transform .15s;
}
.set-cat:hover{background:var(--surface);border-color:rgba(76,111,255,.28)}
.set-cat:active{transform:scale(.995)}
.set-cat-ico{
  width:38px;height:38px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;
  color:#fff;background:var(--c,var(--accent));box-shadow:0 8px 18px -10px var(--c,var(--accent));
}
.set-cat-ico svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.set-cat-tx{flex:1;min-width:0}
.set-cat-tx b{display:block;font-size:13px;font-weight:700;letter-spacing:-.1px}
.set-cat-tx small{display:block;margin-top:2px;font-size:10.5px;line-height:1.45;color:var(--muted)}
.set-cat-arrow{flex:0 0 auto;color:var(--muted);font-size:18px;line-height:1}
.set-simple-note{display:none;margin:2px 2px 0;font-size:10.5px;line-height:1.55;color:var(--muted)}
.mb-panel.set-simple .set-simple-note{display:block}
.mb-panel.set-simple .set-cat[data-simple-hide]{display:none}
.set-panes{display:block}
.set-pane{display:none}
.set-pane.on{display:block}
@media (min-width:960px){
  .set-cats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .set-cat{padding:13px}
}

/* 应用内取色器 */
.cp-root{position:fixed;top:0;right:0;bottom:0;left:0;z-index:97;display:none}
.cp-root.open{display:block}
.cp-scrim{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--overlay);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.cp-panel{
  position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;
  background:var(--surface);border-radius:22px 22px 0 0;
  padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -20px 60px -20px rgba(10,14,24,.5);
  animation:sheetUp .26s cubic-bezier(.22,.9,.3,1);
}
.cp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cp-head h3{font-size:16px;font-weight:750}
.cp-preview{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cp-swatch{
  width:58px;height:58px;flex:0 0 auto;border-radius:15px;display:grid;place-items:center;
  border:1px solid var(--line2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}
.cp-swatch b{font-size:18px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.cp-hexwrap{
  flex:1;display:flex;align-items:center;gap:4px;height:42px;padding:0 12px;
  border-radius:12px;border:1px solid var(--line2);background:var(--surface-soft);
  font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;
}
.cp-hexwrap input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:15px;color:var(--ink);letter-spacing:.5px}
.cp-slider{display:flex;align-items:center;gap:9px;margin-top:11px}
.cp-slider label{flex:0 0 46px;font-size:11px;color:var(--muted)}
.cp-slider input[type=range]{flex:1;min-width:0;width:auto;height:26px}
.cp-slider b{flex:0 0 42px;text-align:right;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.cp-presets{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:15px 0 8px}
.cp-presets button{aspect-ratio:1;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line2);background:var(--c)}
.cp-presets button:active{transform:scale(.92)}
.cp-hint{font-size:10.5px;line-height:1.55;color:var(--muted);margin:0 0 12px}
.cp-foot{display:flex;gap:10px}
.cp-foot .btn{flex:1;height:42px;border-radius:12px}
@media (min-width:960px){
  .cp-panel{
    left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);
    width:380px;border-radius:20px;animation:pop .2s ease;
    padding:18px 20px 16px;max-height:84vh;
  }
}

/* 星期栏背景设置 */
.gh-row{display:flex;align-items:center;gap:9px;margin:8px 0}
.gh-row>span{flex:0 0 40px;font-size:11px;color:var(--muted)}
.gh-row b{font-size:11px;color:var(--ink2);letter-spacing:.4px}
.gh-preview{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
  padding:7px 5px;margin:4px 0 8px;border-radius:11px;overflow:hidden;
  border:1px solid var(--line2);background:var(--surface);
  background-size:cover;background-position:50% 50%;
}
.gh-preview span{text-align:center;font-size:10px;color:var(--muted);padding:4px 0}

/* 模块透明度实时预览 */
.alpha-preview{
  position:relative;height:118px;border-radius:13px;overflow:hidden;
  border:1px solid var(--line2);margin:2px 0 6px;
  background:linear-gradient(135deg,#4C6FFF,#8A5CFF);
}
.alpha-preview .ap-bg{
  position:absolute;top:0;right:0;bottom:0;left:0;
  background-size:cover;background-position:50% 50%;
}
.alpha-preview .ap-tag{
  position:absolute;left:9px;top:8px;z-index:2;font-size:9px;padding:2px 6px;border-radius:5px;
  background:rgba(10,14,24,.45);color:#fff;
}
.ap-card{
  position:absolute;z-index:1;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;
  padding:9px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.18);
  background:rgba(var(--card-rgb),var(--ap-a,.78));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 8px 18px -12px rgba(0,0,0,.5);
}
.ap-card b{font-size:11.5px;font-weight:700;color:var(--ink)}
.ap-card small{font-size:9.5px;color:var(--ink2)}
.alpha-preview .ap-cal{top:34px;--ap-a:var(--ap-cal,.78)}
.alpha-preview .ap-ed{top:68px;--ap-a:var(--ap-ed,.92);left:34px}
.alpha-preview.is-clear .ap-card{-webkit-backdrop-filter:none;backdrop-filter:none}

/* 设置子页：按 sec-line 聚成卡片，减少长表单的杂乱感 */
.set-group{
  background:var(--surface-soft);border:1px solid var(--line);border-radius:16px;
  padding:0 14px 10px;margin-bottom:12px;
}
.set-group>.sec-line{margin:12px 0 8px}
.set-group>.sec-line:first-child{margin-top:12px}
.set-group .field{padding:7px 0}
.set-group .field:first-of-type{padding-top:2px}
.set-group .hint{margin:0 0 6px}
.set-group .alpha-preview,.set-group .type-preview,.set-group .gh-preview{margin-top:8px}
.set-group .about{margin-top:8px}

/* 关于卡片 */
.about-card{
  position:relative;overflow:hidden;border-radius:18px;padding:16px;
  border:1px solid var(--line);background:var(--surface-soft);
}
.about-card::before{
  content:"";position:absolute;right:-40px;top:-60px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(76,111,255,.18),transparent 68%);pointer-events:none;
}
.ab-head{display:flex;align-items:center;gap:11px;position:relative}
.ab-logo{
  width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 10px 22px -12px rgba(76,111,255,.8);
}
.ab-logo svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ab-brand{flex:1;min-width:0}
.ab-brand b{display:block;font-size:15px;font-weight:750;letter-spacing:-.2px;color:var(--ink)}
.ab-brand small{display:block;margin-top:3px;font-size:10.5px;color:var(--muted)}
.ab-ver{
  flex:0 0 auto;font-size:10px;font-weight:700;color:var(--accent);
  padding:4px 8px;border-radius:7px;background:rgba(76,111,255,.1);
  border:1px solid rgba(76,111,255,.22);font-variant-numeric:tabular-nums;
}
.ab-rows{display:flex;flex-direction:column;gap:1px;margin:14px 0 10px;position:relative}
.ab-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line2)}
.ab-row:last-child{border-bottom:0}
.ab-row span{flex:0 0 38px;font-size:10.5px;color:var(--muted);padding-top:1px}
.ab-row b,.ab-row a{flex:1;min-width:0;font-size:11.5px;font-weight:600;color:var(--ink2);text-decoration:none;word-break:break-word}
.ab-row a{color:var(--accent)}
.ab-badges{display:flex;flex-wrap:wrap;gap:6px;position:relative}
.ab-badges span{
  font-size:9.5px;padding:3px 8px;border-radius:99px;
  color:var(--ink2);background:var(--surface);border:1px solid var(--line2);
}
.ab-note{margin:10px 0 0;font-size:10px;line-height:1.6;color:var(--muted);position:relative}

/* 语料库文字颜色 */
.quote-card .q-text{color:var(--quote-ink,var(--ink2))}
.quote-card .q-src{color:var(--quote-ink2,var(--muted))}
.quote-card .q-act{color:var(--quote-muted,var(--accent))}
.quote-card .q-mark{color:var(--quote-muted,rgba(76,111,255,.12))}
.quote-card.has-bg .q-text{color:var(--quote-ink,#fff)}
.quote-card.has-bg .q-src{color:var(--quote-ink2,rgba(255,255,255,.8))}
.quote-card.has-bg .q-act{color:var(--quote-muted,#fff)}


/* ---- 1.1.0 UI 修正：移动端设置按钮不挤成多行 ---- */
@media (max-width:700px){
  .set-group .data-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .set-group .data-pick>*{width:100%;min-width:0}
  .set-group .data-pick .btn,.set-group .data-pick label.btn{
    padding:0 10px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:inline-flex;align-items:center;justify-content:center;
  }
}
/* 桌面专属设置（手机端没有侧边栏） */
@media (max-width:959px){ .desk-only{display:none!important} }

/* 字体导入卡片 */
.font-import{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:14px;background:var(--surface-soft);border:1px dashed var(--line2);margin-top:8px}
.font-import .fi-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.font-import .fi-tx b{font-size:12.5px;color:var(--ink)}
.font-import .fi-tx span{font-size:10.5px;color:var(--muted);line-height:1.55}
.font-import .fi-btn{position:relative;overflow:hidden;flex:0 0 auto;height:36px;padding:0 12px;font-size:12px}
@media (max-width:700px){
  .font-import{flex-direction:column;align-items:stretch;gap:10px}
  .font-import .fi-btn{width:100%;justify-content:center}
}

/* 局域网同步信息卡 */
.lan-info{margin-top:10px;padding:11px 12px;border-radius:12px;background:var(--surface-soft);border:1px solid var(--line);font-size:12px;line-height:1.8}
.lan-info .lan-off{color:var(--muted);font-size:11.5px}
.lan-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lan-line b{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--accent);word-break:break-all}
.lan-line .k{flex:0 0 56px;color:var(--muted);font-size:11px}
.lan-copy{font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--ink2)}
.evd-sysalarm{height:40px;padding:0 10px;border-radius:11px;font-size:11.5px;color:var(--accent);background:rgba(76,111,255,.1);flex:0 0 auto}

/* 未来 7 天：独立字体/字号/颜色 */
.next7{--n7-scale:1}
.next7 .sec-head h2{font-size:calc(14px * var(--n7-scale,1));color:var(--n7-title,var(--n7-ink,var(--ink2)))}
.next7 .sec-stat{color:var(--n7-day,var(--n7-ink-2,var(--muted)))}
.next7 .n7-day{font-size:calc(11.5px * var(--n7-scale,1));color:var(--n7-day,var(--n7-ink-2,var(--muted)))}
.next7 .n7-t{font-size:calc(13px * var(--n7-scale,1));color:var(--n7-event,var(--n7-ink,var(--ink)))}
.next7 .n7-meta{font-size:calc(10.5px * var(--n7-scale,1));color:var(--n7-event,var(--n7-ink-2,var(--muted)));opacity:.72}
.next7 .n7-day{opacity:.78}
.n7-style{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line2)}
.n7-style .type-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.n7-style .type-head b{font-size:12.5px;color:var(--ink)}
.n7-style .type-sub{font-size:10.5px;color:var(--muted)}
.n7-preview{margin-top:9px;padding:10px 11px;border-radius:12px;background:var(--surface-soft);border:1px solid var(--line);font-family:var(--n7p-font,system-ui);overflow:hidden}
.n7-preview .n7p-row{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line)}
.n7-preview .n7p-row:last-child{border-bottom:0}
.n7-preview .n7p-title{font-size:calc(12px * var(--n7p-scale,1));font-weight:700;color:var(--n7p-title,var(--n7p-ink,var(--ink)));margin-bottom:2px}
.n7-preview .n7p-day{flex:0 0 50px;font-size:calc(10px * var(--n7p-scale,1));color:var(--n7p-day,var(--n7p-ink,var(--muted)));opacity:.78;line-height:1.5}
.n7-preview .n7p-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.n7-preview .n7p-main b{font-size:calc(12px * var(--n7p-scale,1));color:var(--n7p-event,var(--n7p-ink,var(--ink)));font-weight:600}
.n7-preview .n7p-main i{font-style:normal;font-size:calc(10px * var(--n7p-scale,1));color:var(--n7p-event,var(--n7p-ink,var(--muted)));opacity:.72}
.n7-preview .n7p-main em{font-style:normal;font-size:calc(9px * var(--n7p-scale,1));color:var(--n7p-event,var(--n7p-ink,var(--muted)));opacity:.6}

/* 设置子页视觉层级（v2） */
.settings-panel{--cat:var(--accent)}
.set-head{position:relative;z-index:1;padding:14px 18px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
html.dark .set-head{background:var(--bg)}
@media (max-width:959px){
  .settings-panel{padding-top:0}
  .settings-panel .set-head{padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--bg)}
}
.set-head-tx h3{display:flex;align-items:center;gap:8px}
.set-head-ico{width:26px;height:26px;border-radius:9px;display:none;place-items:center;flex:0 0 auto;color:#fff;background:linear-gradient(135deg,var(--cat),var(--accent2))}
.set-head-ico svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pane-open .set-head-ico{display:grid}
.set-group{background:linear-gradient(180deg,rgba(var(--card-rgb),.55),rgba(var(--card-rgb),.36));border:1px solid var(--line);border-radius:18px;padding:4px 16px 14px;box-shadow:0 8px 24px -22px rgba(16,20,30,.5)}
.set-group>.sec-line{font-size:12.5px;color:var(--ink);border-bottom:1px dashed var(--line2)}
.set-group>.sec-line::before{background:linear-gradient(180deg,var(--cat),var(--accent2));height:14px;width:3px}
.set-group .field>label{font-size:11.5px;color:var(--muted);letter-spacing:.1px}
.set-group .hint{font-size:10.8px;color:var(--muted);line-height:1.72;padding-left:8px;border-left:2px solid var(--line2);margin-top:7px}
.set-group .field>.hint{background:transparent}
.set-group .chips button,.set-group .btn.ghost{background:var(--surface-soft)}
.set-group .chips button.on{background:var(--cat);border-color:transparent}
.set-cat[data-setpane="appearance"] .set-cat-ico{color:#4C6FFF}
.set-cat:hover{border-color:rgba(76,111,255,.35)}
@media (max-width:700px){
  .set-head{padding:12px 14px 10px}
  .set-group{padding:2px 13px 12px;border-radius:16px}
  .set-group>.sec-line{margin:13px 0 3px}
}

/* 外观与文字：分页，降低单页密度 */
.app-tabs{display:flex;gap:6px;padding:4px 0 10px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--surface)}
html.dark .app-tabs{background:var(--bg)}
@media (max-width:959px){.app-tabs{background:var(--bg)}}
.app-tabs button{flex:1 1 0;min-width:0;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface-soft);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.app-tabs button.on{background:var(--cat,var(--accent));border-color:transparent;color:#fff;font-weight:600}
.app-tab-panel{display:none;flex-direction:column;gap:12px}
.app-tab-panel.on{display:flex}
.desk-only-group{display:block}
@media (max-width:959px){ .desk-only-group{display:none!important} }

/* 设置面板：头部/底部固定，中间独立滚动，滚动时不会在顶部漏出内容 */
.settings-panel{overflow:hidden;padding:0}
.settings-panel .set-head{margin-bottom:0}
.settings-panel .set-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 12px}
.settings-panel .mb-foot{position:relative;margin:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);box-shadow:0 -12px 26px -16px rgba(16,20,30,.45);z-index:2}
@media (max-width:959px){
  .settings-panel .set-scroll{padding:0 18px 10px}
  .settings-panel .mb-foot{padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)}
}
/* hidden 必须能盖过 display:grid，否则锁屏/确认框会一直浮在最上层 */
.dl-lock[hidden],.dl-ask[hidden],.dl-viewer[hidden],.ctx-menu[hidden],#monthRoot[hidden]{display:none!important}
/* 应用内右键菜单（桌面端替代浏览器菜单） */
.ctx-menu{position:fixed;z-index:960;min-width:178px;padding:6px;border-radius:13px;background:var(--card);border:1px solid var(--line2);box-shadow:0 18px 50px -18px rgba(16,20,30,.5);animation:dlIn .1s ease;transform-origin:top left;overflow:hidden}
.ctx-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:9px;font-size:12.5px;color:var(--ink2);text-align:left}
.ctx-menu button:hover{background:rgba(76,111,255,.09);color:var(--ink)}
.ctx-menu button.danger{color:var(--absent)}
.ctx-menu button.danger:hover{background:rgba(244,63,94,.1)}
.ctx-menu .k{margin-left:auto;font-size:10px;color:var(--muted)}
.ctx-menu .sep{height:1px;margin:5px 4px;background:var(--line2)}
.ctx-menu .hd{padding:6px 10px 4px;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
/* 更新日志 */
.dl-changelog{padding:12px 14px;overflow-y:auto;font-size:12.5px;color:var(--ink2)}
.cl-ver{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--surface-soft)}
.cl-ver.latest{border-color:rgba(76,111,255,.38);box-shadow:0 0 0 3px rgba(76,111,255,.08)}
.cl-head{display:flex;align-items:center;gap:8px}
.cl-head b{font-size:14px;color:var(--ink);letter-spacing:-.2px}
.cl-head .d{font-size:11px;color:var(--muted)}
.cl-head .now{margin-left:auto;font-size:10px;padding:2px 8px;border-radius:99px;background:var(--accent);color:#fff}
.cl-sec{margin-top:10px}
.cl-sec>span{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:99px;margin-bottom:6px}
.cl-sec.add>span{background:rgba(22,163,74,.14);color:#16A34A}
.cl-sec.opt>span{background:rgba(76,111,255,.14);color:var(--accent)}
.cl-sec.fix>span{background:rgba(244,63,94,.14);color:#F43F5E}
.cl-sec ul{margin:0;padding-left:18px}
.cl-sec li{margin:4px 0;line-height:1.7}
.cl-more{font-size:11px;color:var(--muted);margin-top:8px}
/* 设置子页：更整齐的分组卡片 */
.set-pane.on{display:flex;flex-direction:column;gap:12px;padding:0 2px 6px}
.set-group{background:var(--surface-soft);border:1px solid var(--line);border-radius:18px;padding:4px 16px 14px;margin-bottom:0;box-shadow:0 1px 0 rgba(16,20,30,.02)}
.set-group>.sec-line{display:flex;align-items:center;gap:8px;margin:14px 0 4px;padding-bottom:9px;border-bottom:1px dashed var(--line2);font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:.3px}
.set-group>.sec-line::before{content:"";width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent2));flex:0 0 auto}
.set-group>.sec-line:first-child{margin-top:12px}
.set-group .field{padding:8px 0;border-bottom:1px solid rgba(127,138,160,.08)}
.set-group .field:last-child{border-bottom:0}
.set-group .field>.row-sw>span:first-child{font-size:12.5px;color:var(--ink2)}
.set-group .hint{margin-top:6px;line-height:1.7}
.set-group .data-pick{gap:8px;flex-wrap:wrap}
.set-group .chips{margin-top:2px}
.set-pane .field-row.two{gap:10px}
@media (max-width:959px){.set-pane{padding:10px 0 4px}.set-group{padding:2px 13px 12px}}

/* ==========================================================================
   9. 1.1.0 新组件：快速录入 / 月视图 / 导入 / 复盘 / 锁屏 / 附件
   ========================================================================== */
.dl-sheet-sm{max-height:min(40vh,320px)}
.dl-sheet{max-height:min(78vh,720px)}
.dl-quick-preview{padding:12px 14px;font-size:12.5px;color:var(--ink2);line-height:1.8;min-height:64px}
.dl-quick-preview b{color:var(--ink)}
.dl-quick-preview .k{color:var(--muted);font-size:11px;margin-right:6px}
.dl-quick-foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);justify-content:flex-end}
.dl-quick-foot .btn{height:34px}
.dl-quick-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dl-quick-chips button{font-size:11px;padding:4px 9px;border-radius:8px;border:1px solid var(--line2);color:var(--ink2);background:var(--surface-soft)}
.dl-quick-chips button.on{background:var(--accent);border-color:transparent;color:#fff}
.dl-month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:12px}
.dl-month .dm-wd{text-align:center;font-size:10.5px;color:var(--muted);padding:2px 0}
.dl-month .dm-cell{position:relative;min-height:58px;border-radius:11px;padding:5px 5px 4px;text-align:left;border:1px solid transparent;background:rgba(17,20,28,.03);overflow:hidden}
html.dark .dl-month .dm-cell{background:rgba(255,255,255,.04)}
.dl-month .dm-cell.is-out{opacity:.38}
.dl-month .dm-cell.is-today{border-color:rgba(76,111,255,.5);box-shadow:0 0 0 2px rgba(76,111,255,.12)}
.dl-month .dm-num{font-size:12px;font-weight:700;color:var(--ink2)}
.dl-month .dm-hd{position:absolute;right:4px;top:4px;font-size:9px;padding:0 3px;border-radius:5px;background:rgba(244,63,94,.14);color:#F43F5E}
.dl-month .dm-hd.work{background:rgba(22,163,74,.14);color:#16A34A}
.dl-month .dm-ev{margin-top:3px;font-size:9.5px;line-height:1.3;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dl-month .dm-dots{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.dl-month .dm-dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dl-import{padding:12px 14px;overflow-y:auto;font-size:12.5px;color:var(--ink2)}
.dl-import .im-row{display:flex;align-items:center;gap:8px;margin:8px 0}
.dl-import .im-row>span{flex:0 0 92px;font-size:11.5px;color:var(--muted)}
.dl-import table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.dl-import th,.dl-import td{border:1px solid var(--line2);padding:4px 6px;text-align:left;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.dl-import .im-note{font-size:11px;color:var(--muted);line-height:1.7;margin-top:8px}
.dl-import .im-bad{color:#F43F5E}
.dl-review{padding:14px 16px;overflow-y:auto}
.dl-review .rv-line{display:flex;align-items:flex-end;gap:8px;height:96px;margin:10px 0 4px}
.dl-review .rv-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.dl-review .rv-bar i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:3px}
.dl-review .rv-bar span{font-size:9.5px;color:var(--muted)}
.dl-review .rv-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.dl-review .rv-kpi{padding:10px;border-radius:12px;background:var(--surface-soft);border:1px solid var(--line)}
.dl-review .rv-kpi b{display:block;font-size:19px;color:var(--ink)}
.dl-review .rv-kpi span{font-size:10.5px;color:var(--muted)}
.dl-review h4{font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.dl-review .rv-top{display:flex;flex-direction:column;gap:5px}
.dl-review .rv-top .t{display:flex;align-items:center;gap:8px;font-size:12px}
.dl-review .rv-top .t i{height:7px;border-radius:99px;background:var(--accent);display:block}
.dl-lock{position:fixed;top:0;right:0;bottom:0;left:0;z-index:900;display:grid;place-items:center;background:var(--bg)}
.dl-lock-inner{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 22px;width:min(340px,90vw)}
.dl-lock-leaf{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.dl-lock-leaf svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round}
.dl-lock-inner b{font-size:15px;color:var(--ink)}
.dl-lock-dots{display:flex;gap:10px;margin:6px 0 2px;min-height:12px}
.dl-lock-dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line2)}
.dl-lock-dots i.on{background:var(--accent);border-color:var(--accent)}
.dl-lock-tip{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.6}
.dl-lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;width:100%}
.dl-lock-pad button{height:54px;border-radius:16px;background:var(--surface-soft);border:1px solid var(--line);font-size:19px;font-weight:600;color:var(--ink);transition:.12s}
.dl-lock-pad button:active{transform:scale(.95);background:var(--surface-2)}
.dl-lock-pad button.fn{font-size:13px;color:var(--muted)}
.dl-ask{position:fixed;top:0;right:0;bottom:0;left:0;z-index:880;display:grid;place-items:center}
.dl-ask-scrim{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--overlay)}
.dl-ask-panel{position:relative;width:min(400px,92vw);border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 30px 80px -28px rgba(16,20,30,.55);padding:18px 18px 14px;animation:dlFade .16s ease}
.dl-ask-panel b{font-size:15px;color:var(--ink)}
.dl-ask-panel p{margin:8px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.75;white-space:pre-line}
.dl-ask-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dl-ask-btns .btn{height:34px;padding:0 14px}
